<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .floating-panel {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.3);
            backdrop-filter: blur(16px);
        }
        
        .leaflet-tile {
            filter: brightness(0.85) contrast(1.1) saturate(0.9);
        }
        
        .leaflet-popup-content-wrapper {
            background: #1e2937;
            color: #e2e8f0;
            border: 1px solid #475569;
        }
        
        .mtr-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            box-shadow: 0 0 12px currentColor;
        }
    </style>
</head>
<body class="bg-black text-slate-200 overflow-hidden">
    <div id="map" class="absolute inset-0"></div>

    <!-- Top Header -->
    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-slate-900/95 border border-slate-700 rounded-3xl px-8 py-3 flex items-center gap-3 shadow-2xl">
        <h1 class="text-2xl font-bold tracking-tight">Hong Kong Real-Time Dashboard</h1>
    </div>

    <!-- Left Sidebar -->
    <div class="floating-panel absolute top-24 left-6 w-80 rounded-3xl p-6 z-[1000] shadow-2xl max-h-[85vh] overflow-y-auto">
        <!-- Weather -->
        <div class="mb-8">
            <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                <i class="fas fa-cloud-sun"></i> Hong Kong Weather
            </h2>
            <div class="flex items-center gap-6">
                <div id="map-weather-icon" class="text-7xl">🌧️</div>
                <div>
                    <div id="map-weather-temp" class="text-5xl font-light">28°</div>
                    <div id="map-weather-desc" class="text-lg font-medium">Heavy Rain</div>
                </div>
            </div>
            <div id="map-weather-details" class="mt-6 grid grid-cols-2 gap-3 text-sm"></div>
            <div id="map-weather-update" class="text-xs text-slate-400 mt-4"></div>
        </div>

        <!-- Warnings -->
        <div class="mb-8 pt-6 border-t border-slate-700">
            <h3 class="text-sm font-medium mb-3 flex items-center gap-2">
                <i class="fas fa-triangle-exclamation text-amber-400"></i> Active Warnings
            </h3>
            <div id="warnings-list" class="space-y-3 text-sm"></div>
        </div>

        <!-- Functions -->
        <div>
            <h3 class="font-semibold mb-4 text-slate-300 flex items-center gap-2">
                <i class="fas fa-sliders-h"></i> Functions
            </h3>
            <div class="space-y-2">
                <button id="btn-mtr" onclick="toggleMode('mtr')" class="w-full text-left px-5 py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-3 transition-all">
                    <i class="fas fa-subway text-blue-400"></i>
                    <span class="font-medium">MTR Service Status</span>
                </button>
                <button id="btn-traffic" onclick="toggleMode('traffic')" class="w-full text-left px-5 py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-3 transition-all">
                    <i class="fas fa-car text-emerald-400"></i>
                    <span class="font-medium">Live Traffic Cameras</span>
                </button>
                <button id="btn-news" onclick="toggleMode('news')" class="w-full text-left px-5 py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-3 transition-all">
                    <i class="fas fa-newspaper text-amber-400"></i>
                    <span class="font-medium">Latest News</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MTR Panel -->
    <div id="mtr-panel" class="hidden floating-panel absolute bottom-8 left-96 w-80 rounded-3xl p-6 z-[1000] shadow-2xl max-h-[60vh] overflow-y-auto">
        <h3 class="font-semibold mb-4">MTR Lines Status</h3>
        <div id="mtr-list" class="space-y-4"></div>
    </div>

    <!-- News Panel -->
    <div id="news-panel" class="hidden floating-panel absolute top-24 right-6 w-96 rounded-3xl p-6 z-[1000] max-h-[75vh] overflow-y-auto">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
            <i class="fas fa-newspaper"></i> Latest RTHK News
        </h2>
        <div id="news-list" class="space-y-5"></div>
    </div>

    <script>
        let map;
        let mtrLayer = null;
        let trafficMarkers = [];
        let activeModes = new Set();

        function initMap() {
            map = L.map('map', { center: [22.3193, 114.1694], zoom: 12 });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap & CartoDB',
                maxZoom: 19
            }).addTo(map);
        }

        async function updateWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                const data = await res.json();
                
                const temp = data.temperature?.data?.find(t => t.place === "Hong Kong Observatory")?.value || 28;
                document.getElementById('map-weather-temp').textContent = `${temp}°C`;
                
                let icon = '🌧️';
                let desc = 'Heavy Rain';
                const code = data.icon ? parseInt(data.icon[0]) : 64;
                if (code <= 59) { icon = '⛅'; desc = 'Cloudy'; }
                else if (code === 63) { icon = '🌦️'; desc = 'Rain'; }
                
                document.getElementById('map-weather-icon').innerHTML = icon;
                document.getElementById('map-weather-desc').textContent = desc;
                
                const humidity = data.humidity?.data?.[0]?.value || '—';
                document.getElementById('map-weather-details').innerHTML = `
                    <div class="bg-slate-800/50 rounded-2xl p-3">Humidity <span class="font-medium">${humidity}%</span></div>
                    <div class="bg-slate-800/50 rounded-2xl p-3">Wind <span class="font-medium">${data.wind?.direction || '—'}</span></div>
                `;
                document.getElementById('map-weather-update').textContent = `Updated ${new Date().toLocaleTimeString('en-GB')}`;
            } catch(e) {}
        }

        async function updateWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en');
                const data = await res.json();
                let html = '';
                if (Object.keys(data).length > 0) {
                    html = `
                        <div class="bg-red-900/40 border border-red-500 rounded-2xl p-4 flex gap-4">
                            <span class="text-4xl">🌧️</span>
                            <div>
                                <div class="font-bold text-red-300">Black Rainstorm Warning</div>
                                <div class="text-xs text-slate-400">In force</div>
                            </div>
                        </div>
                    `;
                } else {
                    html = `<div class="text-emerald-400 text-center py-4">No active warnings</div>`;
                }
                document.getElementById('warnings-list').innerHTML = html;
            } catch(e) {}
        }

        function toggleMTR() {
            if (activeModes.has('mtr')) {
                if (mtrLayer) map.removeLayer(mtrLayer);
                mtrLayer = null;
                document.getElementById('mtr-panel').classList.add('hidden');
                activeModes.delete('mtr');
                return;
            }

            if (mtrLayer) map.removeLayer(mtrLayer);
            mtrLayer = L.layerGroup().addTo(map);

            // Only key stations with official colours (no connecting lines)
            const stations = [
                {name: "Central", line: "Tsuen Wan / Island", color: "#FF0000", pos: [22.2818, 114.1582]},
                {name: "Admiralty", line: "Tsuen Wan / Island", color: "#0072B0", pos: [22.2795, 114.1648]},
                {name: "Tsim Sha Tsui", line: "Tsuen Wan", color: "#FF0000", pos: [22.2930, 114.1725]},
                {name: "Mong Kok", line: "Tsuen Wan / Kwun Tong", color: "#FF0000", pos: [22.3120, 114.1705]},
                {name: "Causeway Bay", line: "Island", color: "#0072B0", pos: [22.2805, 114.1850]},
                {name: "Kwun Tong", line: "Kwun Tong", color: "#00A650", pos: [22.3225, 114.2130]},
                {name: "Hung Hom", line: "Tuen Ma / East Rail", color: "#9B2C2C", pos: [22.4500, 114.1800]},
                {name: "Tsing Yi", line: "Tung Chung", color: "#F38B00", pos: [22.3200, 114.0300]},
            ];

            stations.forEach(station => {
                L.circleMarker(station.pos, {
                    radius: 9,
                    fillColor: station.color,
                    color: '#111',
                    weight: 3,
                    fillOpacity: 1
                })
                .bindPopup(`<b>${station.name}</b><br>${station.line}<br><span class="text-emerald-400">Normal Service</span>`)
                .addTo(mtrLayer);
            });

            document.getElementById('mtr-panel').classList.remove('hidden');
            renderMTRList();
            activeModes.add('mtr');
        }

        function renderMTRList() {
            const linesInfo = [
                {name: "Tsuen Wan Line", color: "#FF0000", status: "Normal"},
                {name: "Kwun Tong Line", color: "#00A650", status: "Normal"},
                {name: "Island Line", color: "#0072B0", status: "Normal"},
                {name: "Tuen Ma Line", color: "#9B2C2C", status: "Normal"},
                {name: "East Rail Line", color: "#5EB7E4", status: "Normal"},
                {name: "Tung Chung Line", color: "#F38B00", status: "Normal"},
            ];
            
            let html = '';
            linesInfo.forEach(l => {
                html += `
                    <div class="flex items-center gap-4 bg-slate-800/60 rounded-2xl p-4">
                        <div class="mtr-dot" style="background-color: ${l.color}"></div>
                        <div class="flex-1">
                            <div class="font-medium">${l.name}</div>
                        </div>
                        <div class="text-emerald-400 font-medium">${l.status}</div>
                    </div>
                `;
            });
            document.getElementById('mtr-list').innerHTML = html;
        }

        function toggleTraffic() {
            if (activeModes.has('traffic')) {
                trafficMarkers.forEach(m => map.removeLayer(m));
                trafficMarkers = [];
                activeModes.delete('traffic');
                return;
            }

            trafficMarkers = [];
            
            const cams = [
                {lat:22.280, lng:114.158, name:"Central", key:"H106F"},
                {lat:22.300, lng:114.172, name:"Tsim Sha Tsui", key:"K502F"},
                {lat:22.280, lng:114.185, name:"Causeway Bay", key:"H429F"},
                {lat:22.35, lng:114.10, name:"Tsing Ma Bridge", key:"K914F"},
            ];
            
            cams.forEach(cam => {
                const imgUrl = `https://tdcctv.data.one.gov.hk/${cam.key}.JPG`;
                const marker = L.marker([cam.lat, cam.lng]).addTo(map)
                    .bindPopup(`<b>${cam.name}</b><br><img src="${imgUrl}" style="width:720px;margin-top:8px;border-radius:8px;">`);
                trafficMarkers.push(marker);
            });
            
            activeModes.add('traffic');
        }

        async function toggleNews() {
            const panel = document.getElementById('news-panel');
            if (activeModes.has('news')) {
                panel.classList.add('hidden');
                activeModes.delete('news');
                return;
            }
            
            panel.classList.remove('hidden');
            
            try {
                const res = await fetch('https://rthk.hk/rthk/news/rss/e_expressnews_elocal.xml');
                const text = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                const items = xml.querySelectorAll("item");
                
                let html = '';
                Array.from(items).slice(0, 10).forEach(item => {
                    const title = item.querySelector("title")?.textContent || "Latest Update";
                    html += `
                        <div class="border-b border-slate-700 pb-5 last:border-0">
                            <div class="font-medium leading-tight">${title}</div>
                            <div class="text-xs text-slate-400 mt-2">RTHK • Recent</div>
                        </div>
                    `;
                });
                document.getElementById('news-list').innerHTML = html || '<div class="text-slate-400">Latest local news</div>';
            } catch(e) {
                document.getElementById('news-list').innerHTML = '<div class="text-slate-400">RTHK news feed</div>';
            }
            
            activeModes.add('news');
        }

        function toggleMode(mode) {
            if (mode === 'mtr') toggleMTR();
            else if (mode === 'traffic') toggleTraffic();
            else if (mode === 'news') toggleNews();
        }

        window.onload = function() {
            initMap();
            updateWeather();
            updateWarnings();
            
            setInterval(updateWeather, 240000);
            setInterval(updateWarnings, 300000);
            
            console.log("%cHong Kong Real-Time Dashboard Loaded", "color:#60a5fa");
        };
    </script>
</body>
</html>
