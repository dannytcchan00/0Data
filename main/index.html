<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .floating-panel {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.3);
            backdrop-filter: blur(16px);
        }
        
        .w-85 {
            width: 21.25rem; /* 340px */
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.98) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
            border-radius: 1.5rem !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.98) !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
        }

        /* 警告與提示的閃爍動畫效果 */
        @keyframes warning-flash {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.99); }
        }
        .flash-active {
            animation: warning-flash 1.5s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="bg-black text-slate-200 overflow-hidden">
    <div id="map" class="absolute inset-0"></div>

    <div id="top-header" class="absolute top-4 left-6 w-85 z-[1000] bg-slate-900/95 border border-slate-700 rounded-3xl px-6 py-3 flex items-center gap-3 shadow-2xl pointer-events-auto">
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            <i class="fas fa-city text-blue-500"></i> 香港實時數據儀表板
        </h1>
    </div>

    <!-- 左側面板：主容器 -->
    <div id="sidebar" class="floating-panel absolute top-28 left-6 w-85 rounded-3xl p-6 z-[1000] shadow-2xl max-h-[82vh] overflow-y-auto transition-all duration-300 flex flex-col gap-4">
        
        <!-- 標題與收起按鈕 -->
        <div class="flex items-center justify-between">
            <h2 class="text-xl font-semibold flex items-center gap-2 text-white">
                <i class="fas fa-cloud-sun text-amber-400"></i> 天文台實時天氣
            </h2>
            <button onclick="toggleSidebarSize()" class="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-xl">
                <i id="size-icon" class="fas fa-chevron-up transition-transform"></i>
            </button>
        </div>

        <!-- 即時溫度與天氣狀況 (最小化時保持顯示) -->
        <div class="flex items-center gap-6 py-2">
            <div id="main-weather-icon" class="text-5xl">⏳</div>
            <div>
                <div id="main-weather-temp" class="text-4xl font-light text-white">--°C</div>
                <div id="main-weather-desc" class="text-sm font-medium text-slate-400">正在加載天氣...</div>
            </div>
        </div>

        <!-- 細節數據區塊 (最小化時隱藏) -->
        <div id="detail-weather-section" class="space-y-4">
            <div id="main-weather-details" class="grid grid-cols-2 gap-3 text-xs bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4">
                <div>相對濕度: <span id="humidity-val" class="font-bold text-white">--</span></div>
                <div>紫外線指數: <span id="uv-val" class="font-bold text-white">--</span></div>
                <div class="border-t border-slate-700/40 pt-2">當日最高: <span id="temp-max" class="font-bold text-rose-400">--</span></div>
                <div class="border-t border-slate-700/40 pt-2">當日最低: <span id="temp-min" class="font-bold text-blue-400">--</span></div>
                <div class="border-t border-slate-700/40 pt-2 col-span-2">
                    實時風向: <span id="wind-dir" class="font-bold text-amber-200">--</span> 
                    (<span id="wind-speed" class="font-bold text-amber-200">--</span>)
                </div>
            </div>
            <div id="main-weather-update" class="text-xs text-slate-500 font-mono"></div>
        </div>

        <!-- 當前天氣警告 -->
        <div id="warning-section" class="pt-2 border-t border-slate-800">
            <h3 class="text-sm font-semibold mb-2 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                <i class="fas fa-triangle-exclamation text-amber-500"></i> 當前天氣警告
            </h3>
            <div id="warnings-list" class="space-y-2"></div>
        </div>

        <!-- 特別天氣提示 -->
        <div id="tip-section" class="pt-2 border-t border-slate-800">
            <h3 class="text-sm font-semibold mb-2 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                <i class="fas fa-circle-info text-sky-400"></i> 特別天氣提示
            </h3>
            <div id="tips-list" class="space-y-2"></div>
        </div>

        <!-- 數據圖層切換 (最小化時隱藏) -->
        <div id="layer-section" class="pt-2 border-t border-slate-800 space-y-2">
            <h3 class="text-sm font-semibold mb-2 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                <i class="fas fa-layer-group text-blue-500"></i> 數據圖層切換
            </h3>
            <div class="space-y-2">
                <button id="btn-hospital" onclick="toggleMode('hospital')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                    <span class="flex items-center gap-3"><i class="fas fa-hospital-user text-rose-500"></i> <span class="font-medium text-slate-200">公立醫院急症室等候時間</span></span>
                    <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                </button>
                <button id="btn-mtr" onclick="toggleMode('mtr')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                    <span class="flex items-center gap-3"><i class="fas fa-subway text-pink-500"></i> <span class="font-medium text-slate-200">港鐵全綫網絡與營運狀態</span></span>
                    <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                </button>
                <button id="btn-immigration" onclick="toggleMode('immigration')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                    <span class="flex items-center gap-3"><i class="fas fa-passport text-indigo-400"></i> <span class="font-medium text-slate-200">出入境管制站旅客流量</span></span>
                    <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                </button>
                <button id="btn-weather-stations" onclick="toggleMode('weather-stations')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                    <span class="flex items-center gap-3"><i class="fas fa-temperature-half text-orange-400"></i> <span class="font-medium text-slate-200">分區實時天氣觀測</span></span>
                    <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 右側面板容器 -->
    <div id="right-sidebar-container" class="absolute top-4 right-6 w-85 z-[1000] flex flex-col gap-3 pointer-events-none">
        <div id="mtr-panel" class="hidden floating-panel w-full rounded-3xl p-5 shadow-2xl max-h-[42vh] overflow-y-auto pointer-events-auto">
            <h3 class="font-bold text-lg mb-4 text-white border-b border-slate-800 pb-2 flex items-center gap-2">
                <i class="fas fa-subway text-pink-500"></i> 港鐵各綫營運狀態
            </h3>
            <div id="mtr-list" class="space-y-2"></div>
        </div>

        <div id="immigration-panel" class="hidden floating-panel w-full rounded-3xl p-5 shadow-2xl max-h-[48vh] overflow-y-auto border border-slate-700/50 pointer-events-auto">
            <div class="border-b border-slate-800 pb-3 mb-4">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-passport text-indigo-400"></i> 出入境管制站旅客流量
                </h3>
                <div id="imm-date-display" class="text-[10px] text-indigo-400 font-mono mt-1.5">Loading date options...</div>
                <div id="imm-summary" class="grid grid-cols-2 gap-2 mt-3 bg-slate-900/60 border border-slate-800 p-2.5 rounded-xl text-xs">
                    <div>
                        <div class="text-[10px] text-slate-400">Total Arrivals<br>總入境人數</div>
                        <div id="imm-total-arrival" class="text-base font-bold text-indigo-400 font-mono mt-0.5">--</div>
                    </div>
                    <div class="border-l border-slate-800 pl-2">

                        <div id="imm-total-flow" class="text-base font-bold text-emerald-400 font-mono mt-0.5">--</div>
                    </div>
                </div>
            </div>
            <div id="immigration-list" class="space-y-3"></div>
        </div>
    </div>

        function smoothPoints(points, iterations = 2) {
            if (points.length < 3) return points;
            let current = points;
            for (let i = 0; i < iterations; i++) {
                let next = [];
                next.push(current[0]); 
                for (let j = 0; j < current.length - 1; j++) {
                    let p0 = current[j]; let p1 = current[j+1];
                    let Q = [0.75 * p0[0] + 0.25 * p1[0], 0.75 * p0[1] + 0.25 * p1[1]];
                    let R = [0.25 * p0[0] + 0.75 * p1[0], 0.25 * p0[1] + 0.75 * p1[1]];
                    next.push(Q); next.push(R);
                }
                next.push(current[current.length - 1]); current = next;
            }
            return current;
        }

        function translateWindDirection(dir) {
            if (!dir) return '微風';
            const d = dir.toUpperCase().trim();
            if (d === 'VARIABLE' || d === 'LIGHT' || d === 'CALM') return '微風';
            return d
                .replace('NORTH-EAST', '東北風').replace('NORTH-WEST', '西北風')
                .replace('SOUTH-EAST', '東南風').replace('SOUTH-WEST', '西南風')
                .replace('EAST-NORTHEAST', '東北偏東風').replace('EAST-SOUTHEAST', '東南偏東風')
                .replace('WEST-NORTHEAST', '東北偏西風').replace('WEST-SOUTHEAST', '東南偏西風')
                .replace('NORTH-NORTHEAST', '東北偏北風').replace('NORTH-NORTHWEST', '西北偏北風')
                .replace('SOUTH-SOUTHEAST', '東南偏南風').replace('SOUTH-SOUTHWEST', '西南偏南風')
                .replace('NORTH', '北風').replace('SOUTH', '南風')
                .replace('EAST', '東風').replace('WEST', '西風');
        }

        async function updateMainWeather() {
    try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
        rawWeatherData = await res.json();
        
        // 1. Get the current temperature at the Observatory
        const obsTempData = rawWeatherData.temperature?.data?.find(t => t.place === "Hong Kong Observatory");
        const temp = obsTempData ? obsTempData.value : '--';
        document.getElementById('main-weather-temp').textContent = `${temp}°C`;
        
        const humidity = rawWeatherData.humidity?.data?.[0]?.value || '--';
        document.getElementById('humidity-val').textContent = `${humidity}%`;
        
        const uvData = rawWeatherData.uvindex?.data?.[0]?.value || '0';
        document.getElementById('uv-val').textContent = uvData;

        // 2. Fix: Specifically extract Max and Min from the official Observatory data 
        // if provided by the API, or calculate from the list if necessary.
        let maxT = '--', minT = '--';
        
        if (rawWeatherData.temperature?.data) {
            // Filter out empty or invalid values
            const temps = rawWeatherData.temperature.data
                .map(d => parseFloat(d.value))
                .filter(v => !isNaN(v));
            
            if (temps.length > 0) {
                maxT = Math.max(...temps);
                minT = Math.min(...temps);
            }
        }
        
        document.getElementById('temp-max').textContent = `${maxT}°C`;
        document.getElementById('temp-min').textContent = `${minT}°C`;

        // ... keep the rest of your wind and icon logic below ...
        const mainWind = rawWeatherData.wind || {};
        document.getElementById('wind-dir').textContent = translateWindDirection(mainWind.direction);
        document.getElementById('wind-speed').textContent = mainWind.speed ? `${mainWind.speed} ${mainWind.unit || 'km/h'}` : '-- km/h';

        let icon = '☀️'; let desc = 'Fine';
        if(rawWeatherData.icon && rawWeatherData.icon.length > 0){
            const code = parseInt(rawWeatherData.icon[0]);
            if (code >= 51 && code <= 54) { icon = '⛅'; desc = '多雲 / Cloudy'; }
            else if ((code >= 62 && code <= 65) || code === 50) { icon = '🌧️'; desc = '有雨 / Showers'; }
            else if (code >= 70 && code <= 77) { icon = '⛈️'; desc = '雷暴 / Thunderstorms'; }
            else if (code >= 60 && code <= 61) { icon = '☁️'; desc = '密雲 / Overcast'; }
        }
        document.getElementById('main-weather-icon').innerHTML = icon;
        document.getElementById('main-weather-desc').textContent = desc;
        document.getElementById('main-weather-update').textContent = `更新時間: ${new Date().toLocaleTimeString('en-GB')}`;

        if (activeModes.has('weather-stations')) renderWeatherStations();
    } catch(e) {
        console.error("天氣更新失敗: ", e);
    }
}

        function getWarningEmoji(code, name) {
            const c = (code || '').toUpperCase().trim(); const n = name || '';
            if (c.includes("TC10") || n.includes("十號")) return "🌀🔟🔴";
            if (c.includes("TC9") || n.includes("九號")) return "🌀9️⃣";
            if (c.includes("TC8NE") || n.includes("東北")) return "🌀8️⃣↗️";
            if (c.includes("TC8NW") || n.includes("西北")) return "🌀8️⃣↖️";
            if (c.includes("TC8SE") || n.includes("東南")) return "🌀8️⃣↘️";
            if (c.includes("TC8SW") || n.includes("西南")) return "🌀8️⃣↙️";
            if (c.includes("TC3") || n.includes("三號強風")) return "🌀3️⃣";
            if (c.includes("TC1") || n.includes("一號戒備")) return "🌀1️⃣";
            if (c.includes("WRAINA") || n.includes("黃色暴雨")) return "🟡⛈️"; 
            if (c.includes("WRAINR") || n.includes("紅色暴雨")) return "🔴⛈️"; 
            if (c.includes("WRAINB") || n.includes("黑色暴雨")) return "⬛⛈️"; 
            if (c.includes("WHOT") || c.includes("WTW") || n.includes("酷熱")) return "☀️🥵";
            if (c.includes("WCOLD") || n.includes("寒冷")) return "💙🥶";
            const mapping = [
                { keys: ["WFIREY", "黃色火災"], emoji: "🟡🔥" }, { keys: ["WFIRER", "紅色火災"], emoji: "🔴🔥" },
                { keys: ["WFROST", "霜凍"], emoji: "❄️" }, { keys: ["WMSON", "強烈季候風"], emoji: "🍃💨" },
                { keys: ["WSMFL", "新界北部水浸"], emoji: "🌊⚠️" }, { keys: ["WLANDO", "山泥傾瀉"], emoji: "⛰️🚨" },
                { keys: ["WTHCK", "雷暴"], emoji: "⚡⛈️" }, { keys: ["WTSU", "海嘯"], emoji: "🌊🚨" }
            ];
            for (let item of mapping) { if (item.keys.some(k => c.includes(k) || n.includes(k))) return item.emoji; }
            return "⚠️";
        }

        async function updateWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const data = await res.json();
                let html = ''; let activeWarningCount = 0;
                
                if (data && Object.keys(data).length > 0) {
                    Object.keys(data).forEach(key => {
                        const w = data[key];
                        if (w.actionCode === 'CANCEL') return; 
                        activeWarningCount++;
                        const name = w.name || '';
                        const emojiRepresentation = getWarningEmoji(w.code || key, name);
                        
                        html += `
                            <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-center gap-3">
                                <div class="text-2xl min-w-[3.5rem] w-auto h-12 px-2 flex items-center justify-center bg-slate-900/60 border border-slate-700/50 rounded-xl flex-shrink-0 tracking-wide">
                                    ${emojiRepresentation}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-amber-200 text-xs leading-tight truncate">${name}</div>
                                    <div class="text-[10px] text-slate-400 mt-1 font-medium">現正生效中</div>
                                </div>
                            </div>`;
                    });
                }
                
                const warningSection = document.getElementById('warning-section');
                if (activeWarningCount === 0) {
                    html = `
                        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-2xl py-3 px-4 flex items-center gap-3">
                            <div class="w-7 h-7 bg-emerald-500/20 rounded-full flex items-center justify-center border border-emerald-500/40 text-emerald-400 flex-shrink-0">
                                <i class="fas fa-shield-halved text-sm"></i>
                            </div>
                            <span>當前無任何惡劣天氣警告。</span>
                        </div>`;
                    warningSection.classList.remove('flash-active');
                } else {
                    warningSection.classList.add('flash-active');
                }
                document.getElementById('warnings-list').innerHTML = html;
            } catch(e) {
                document.getElementById('warnings-list').innerHTML = `<div class="text-slate-500 text-xs">暫時無法取得警告資訊</div>`;
            }
        }

        function parseCSV(text) {
            let p = '', c = '', r = []; let q = false; let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i]; let next = text[i+1];
                if (c === '"') { if (q && next === '"') { row[row.length - 1] += '"'; i++; } else { q = !q; } }
                else if (c === ',' && !q) { row.push(''); }
                else if ((c === '\r' || c === '\n') && !q) { if (c === '\r' && next === '\n') i++; r.push(row); row = ['']; }
                else { row[row.length - 1] += c; }
            }
            if (row.length > 1 || row[0] !== '') r.push(row); if (r.length === 0) return [];
            const headers = r[0].map(h => h.trim()); const results = [];
            for (let i = 1; i < r.length; i++) { if (r[i].length === headers.length) { const obj = {}; headers.forEach((header, index) => { obj[header] = r[i][index].trim(); }); results.push(obj); } }
            return results;
        }

                    weatherStationMarkers.push(m);
                }
            });
        }

        function toggleMode(mode) {
            if (mode === 'hospital') toggleHospital();
            else if (mode === 'mtr') toggleMTR();
            else if (mode === 'immigration') toggleImmigration();
            else if (mode === 'weather-stations') toggleWeatherStations();
        }

        window.onload = function() {
            initMap(); 
            updateMainWeather(); 
            updateWarnings();
            updateSpecialWeatherTips();
            
            setInterval(updateMainWeather, 180000); 
            setInterval(updateWarnings, 120000);
            setInterval(updateSpecialWeatherTips, 120000);
        };
    </script>
</body>
</html>
