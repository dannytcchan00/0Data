<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .floating-panel {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.3);
            backdrop-filter: blur(16px);
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.98) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
            border-radius: 1.5rem !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.98) !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
        }
    </style>
</head>
<body class="bg-black text-slate-200 overflow-hidden">
    <div id="map" class="absolute inset-0"></div>

    <div id="top-header" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-slate-900/95 border border-slate-700 rounded-3xl px-8 py-3 flex items-center gap-3 shadow-2xl pointer-events-auto">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            <i class="fas fa-city text-blue-500"></i> 香港實時數據儀表板
        </h1>
    </div>

    <div id="sidebar" class="floating-panel absolute top-24 left-6 w-85 rounded-3xl p-6 z-[1000] shadow-2xl max-h-[85vh] overflow-y-auto transition-all duration-300">
        
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold flex items-center gap-2 text-white">
                <i class="fas fa-cloud-sun text-amber-400"></i> 天文台實時天氣
            </h2>
            <button onclick="toggleSidebarSize()" class="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-xl">
                <i id="size-icon" class="fas fa-chevron-down transition-transform"></i>
            </button>
        </div>

        <div class="flex items-center gap-6 mb-6">
            <div id="main-weather-icon" class="text-6xl">⏳</div>
            <div>
                <div id="main-weather-temp" class="text-5xl font-light text-white">--°C</div>
                <div id="main-weather-desc" class="text-base font-medium text-slate-400">正在加載天氣...</div>
            </div>
        </div>

        <div id="main-weather-details" class="grid grid-cols-2 gap-3 text-xs bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 mb-4">
            <div>相對濕度: <span id="humidity-val" class="font-bold text-white">--</span></div>
            <div>紫外線指數: <span id="uv-val" class="font-bold text-white">--</span></div>
            <div class="border-t border-slate-700/40 pt-2">當日最高: <span id="temp-max" class="font-bold text-rose-400">--</span></div>
            <div class="border-t border-slate-700/40 pt-2">當日最低: <span id="temp-min" class="font-bold text-blue-400">--</span></div>
            <div class="border-t border-slate-700/40 pt-2 col-span-2">
                實時風向: <span id="wind-dir" class="font-bold text-amber-200">--</span> 
                (<span id="wind-speed" class="font-bold text-amber-200">--</span>)
            </div>
        </div>
        <div id="main-weather-update" class="text-xs text-slate-500 mb-6 font-mono"></div>

        <div id="expanded-content" class="space-y-6">
            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-semibold mb-3 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                    <i class="fas fa-triangle-exclamation text-amber-500"></i> 當前天氣警告
                </h3>
                <div id="warnings-list" class="space-y-2"></div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-semibold mb-3 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                    <i class="fas fa-layer-group text-blue-500"></i> 數據圖層切換
                </h3>
                <div class="space-y-2">
                    <button id="btn-hospital" onclick="toggleMode('hospital')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-hospital-user text-rose-500"></i> <span class="font-medium text-slate-200">公立醫院急症室等候時間</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-mtr" onclick="toggleMode('mtr')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-subway text-pink-500"></i> <span class="font-medium text-slate-200">港鐵行車狀態</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-weather-stations" onclick="toggleMode('weather-stations')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-temperature-half text-orange-400"></i> <span class="font-medium text-slate-200">分區實時天氣觀測</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="mtr-panel" class="hidden floating-panel absolute bottom-8 left-[24rem] w-80 rounded-3xl p-5 z-[1000] shadow-2xl max-h-[50vh] overflow-y-auto">
        <h3 class="font-bold text-lg mb-4 text-white border-b border-slate-800 pb-2 flex items-center gap-2">
            <i class="fas fa-subway text-pink-500"></i> 港鐵各綫營運狀態
        </h3>
        <div id="mtr-list" class="space-y-2"></div>
    </div>

    <script>
        let map;
        let weatherStationMarkers = [];
        let hospitalMarkers = [];
        let activeModes = new Set();
        let sidebarExpanded = true;
        let rawWeatherData = null;

        const hospitalRegistry = {
            "Alice Ho Miu Ling Nethersole Hospital": { zhName: "雅麗氏何妙齡那打素醫院", gps: [22.4583, 114.1747], addr: "大埔全安路 11 號" },
            "Caritas Medical Centre": { zhName: "明愛醫院", gps: [22.3418, 114.1531], addr: "深水埗永康街 111 號" },
            "Kwong Wah Hospital": { zhName: "廣華醫院", gps: [22.3153, 114.1725], addr: "油麻地窩大老道 25 號" },
            "North District Hospital": { zhName: "北區醫院", gps: [22.4971, 114.1247], addr: "上水保健路 9 號" },
            "North Lantau Hospital": { zhName: "北大嶼山醫院", gps: [22.2961, 113.9389], addr: "東涌松仁路 8 號" },
            "Pamela Youde Nethersole Eastern Hospital": { zhName: "東區尤德夫人那打素醫院", gps: [22.2692, 114.2361], addr: "柴灣樂民道 3 號" },
            "Pok Oi Hospital": { zhName: "博愛醫院", gps: [22.4444, 114.0414], addr: "元朗坳頭" },
            "Prince of Wales Hospital": { zhName: "威爾斯親王醫院", gps: [22.3811, 114.2025], addr: "沙田銀城街 30-32 號" },
            "Princess Margaret Hospital": { zhName: "瑪嘉烈醫院", gps: [22.3414, 114.1344], addr: "荔枝角瑪嘉烈醫院道 2-10 號" },
            "Queen Elizabeth Hospital": { zhName: "伊利沙伯醫院", gps: [22.3094, 114.1761], addr: "油麻地加士居道 30 號" },
            "Queen Mary Hospital": { zhName: "瑪麗醫院", gps: [22.2706, 114.1313], addr: "薄扶林道 102 號" },
            "Ruttonjee Hospital": { zhName: "律敦治醫院", gps: [22.2758, 114.1753], addr: "灣仔皇后大道東 266 號" },
            "St. John Hospital": { zhName: "長洲醫院", gps: [22.2078, 114.0306], addr: "長洲醫院路" },
            "Tseung Kwan O Hospital": { zhName: "將軍澳醫院", gps: [22.3164, 114.2703], addr: "將軍澳坑口寶寧里 2 號" },
            "Tuen Mun Hospital": { zhName: "屯門醫院", gps: [22.4081, 113.9753], addr: "屯門青賢街 11 號" },
            "Tin Shui Wai Hospital": { zhName: "天水圍醫院", gps: [22.4589, 113.9961], addr: "天水圍天壇街 11 號" },
            "United Christian Hospital": { zhName: "基督教聯合醫院", gps: [22.3222, 114.2347], addr: "觀塘協和街 130 號" },
            "Yan Chai Hospital": { zhName: "仁濟醫院", gps: [22.3703, 114.1192], addr: "荃灣仁濟街 7-11 號" }
        };

        function initMap() {
            map = L.map('map', { center: [22.3193, 114.1694], zoom: 11, zoomControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap & CartoDB',
                maxZoom: 19
            }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        function translateWindDirection(dir) {
            if (!dir) return '微風';
            const d = dir.toUpperCase().trim();
            if (d === 'VARIABLE' || d === 'LIGHT' || d === 'CALM') return '微風';
            
            return d
                .replace('NORTH-EAST', '東北風').replace('NORTH-WEST', '西北風')
                .replace('SOUTH-EAST', '東南風').replace('SOUTH-WEST', '西南風')
                .replace('EAST-NORTHEAST', '東北偏東風').replace('EAST-SOUTHEAST', '東南偏東風')
                .replace('WEST-NORTHEAST', '東北偏西風').replace('WEST-SOUTHEAST', '東南偏西風')
                .replace('NORTH-NORTHEAST', '東北偏北風').replace('NORTH-NORTHWEST', '西北偏北風')
                .replace('SOUTH-SOUTHEAST', '東南偏南風').replace('SOUTH-SOUTHWEST', '西南偏南風')
                .replace('NORTH', '北風').replace('SOUTH', '南風')
                .replace('EAST', '東風').replace('WEST', '西風');
        }

        async function updateMainWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                rawWeatherData = await res.json();
                
                const temp = rawWeatherData.temperature?.data?.find(t => t.place === "Hong Kong Observatory")?.value || '--';
                document.getElementById('main-weather-temp').textContent = `${temp}°C`;
                
                const humidity = rawWeatherData.humidity?.data?.[0]?.value || '--';
                document.getElementById('humidity-val').textContent = `${humidity}%`;
                
                const uvData = rawWeatherData.uvindex?.data?.[0]?.value || '0';
                document.getElementById('uv-val').textContent = uvData;

                let maxT = '--', minT = '--';
                if(rawWeatherData.temperature?.data) {
                    const temps = rawWeatherData.temperature.data.map(d => d.value).filter(v => !isNaN(v));
                    maxT = Math.max(...temps);
                    minT = Math.min(...temps);
                }
                document.getElementById('temp-max').textContent = `${maxT}°C`;
                document.getElementById('temp-min').textContent = `${minT}°C`;

                const mainWind = rawWeatherData.wind || {};
                document.getElementById('wind-dir').textContent = translateWindDirection(mainWind.direction);
                document.getElementById('wind-speed').textContent = mainWind.speed ? `${mainWind.speed} ${mainWind.unit || 'km/h'}` : '-- km/h';

                let icon = '☀️';
                let desc = 'Fine';
                if(rawWeatherData.icon && rawWeatherData.icon.length > 0){
                    const code = parseInt(rawWeatherData.icon[0]);
                    if (code >= 51 && code <= 54) { icon = '⛅'; desc = '多雲 / Cloudy'; }
                    else if ((code >= 62 && code <= 65) || code === 50) { icon = '🌧️'; desc = '有雨 / Showers'; }
                    else if (code >= 70 && code <= 77) { icon = '⛈️'; desc = '雷暴 / Thunderstorms'; }
                    else if (code >= 60 && code <= 61) { icon = '☁️'; desc = '密雲 / Overcast'; }
                }
                document.getElementById('main-weather-icon').innerHTML = icon;
                document.getElementById('main-weather-desc').textContent = desc;
                
                document.getElementById('main-weather-update').textContent = `更新時間: ${new Date().toLocaleTimeString('en-GB')}`;

                if (activeModes.has('weather-stations')) renderWeatherStations();

            } catch(e) {
                console.error("天氣更新失敗: ", e);
            }
        }

        function getWarningEmoji(code, name) {
            const c = (code || '').toUpperCase().trim();
            const n = name || '';
            
            if (c.includes("TC10") || n.includes("十號")) return "🌀🔟🔴";
            if (c.includes("TC9") || n.includes("九號")) return "🌀9️⃣";
            if (c.includes("TC8NE") || n.includes("東北")) return "🌀8️⃣↗️";
            if (c.includes("TC8NW") || n.includes("西北")) return "🌀8️⃣↖️";
            if (c.includes("TC8SE") || n.includes("東南")) return "🌀8️⃣↘️";
            if (c.includes("TC8SW") || n.includes("西南")) return "🌀8️⃣↙️";
            if (c.includes("TC3") || n.includes("三號強風")) return "🌀3️⃣";
            if (c.includes("TC1") || n.includes("一號戒備")) return "🌀1️⃣";
            
            if (c.includes("WRAINA") || n.includes("黃色暴雨")) return "🟡⛈️"; 
            if (c.includes("WRAINR") || n.includes("紅色暴雨")) return "🔴⛈️"; 
            if (c.includes("WRAINB") || n.includes("黑色暴雨")) return "⬛⛈️"; 
            if (c.includes("WHOT") || c.includes("WTW") || n.includes("酷熱")) return "☀️🥵";
            if (c.includes("WCOLD") || n.includes("寒冷")) return "💙🥶";

            const mapping = [
                { keys: ["WFIREY", "黃色火災"], emoji: "🟡🔥" },
                { keys: ["WFIRER", "紅色火災"], emoji: "🔴🔥" },
                { keys: ["WFROST", "霜凍"], emoji: "❄️" },
                { keys: ["WMSON", "強烈季候風"], emoji: "🍃💨" },
                { keys: ["WSMFL", "新界北部水浸"], emoji: "🌊⚠️" },
                { keys: ["WLANDO", "山泥傾瀉"], emoji: "⛰️🚨" },
                { keys: ["WTHCK", "雷暴"], emoji: "⚡⛈️" },
                { keys: ["WTSU", "海嘯"], emoji: "🌊🚨" }
            ];
            
            for (let item of mapping) {
                if (item.keys.some(k => c.includes(k) || n.includes(k))) {
                    return item.emoji;
                }
            }
            return "⚠️";
        }

        async function updateWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const data = await res.json();
                let html = '';
                let activeWarningCount = 0;
                
                if (data && Object.keys(data).length > 0) {
                    Object.keys(data).forEach(key => {
                        const w = data[key];
                        if (w.actionCode === 'CANCEL') return; 
                        
                        activeWarningCount++;
                        const code = w.code || key;
                        const name = w.name || '';
                        const emojiRepresentation = getWarningEmoji(code, name);
                        
                        html += `
                            <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-center gap-3">
                                <div class="text-2xl min-w-[3.5rem] w-auto h-12 px-2 flex items-center justify-center bg-slate-900/60 border border-slate-700/50 rounded-xl flex-shrink-0 select-none tracking-wide whitespace-nowrap transition-all duration-300">
                                    ${emojiRepresentation}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-amber-200 text-xs leading-tight truncate">${name || '天氣警告'}</div>
                                    <div class="text-[10px] text-slate-400 mt-1 font-medium">現正生效中</div>
                                </div>
                            </div>
                        `;
                    });
                }
                
                if (activeWarningCount === 0) {
                    html = `
                        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-2xl py-3 px-4 flex items-center gap-3">
                            <div class="w-7 h-7 bg-emerald-500/20 rounded-full flex items-center justify-center border border-emerald-500/40 text-emerald-400 flex-shrink-0">
                                <i class="fas fa-shield-halved text-sm"></i>
                            </div>
                            <span>當前無任何惡劣天氣警告。</span>
                        </div>`;
                }
                document.getElementById('warnings-list').innerHTML = html;
            } catch(e) {
                document.getElementById('warnings-list').innerHTML = `<div class="text-slate-500 text-xs">暫時無法取得警告資訊</div>`;
            }
        }

        function toggleSidebarSize() {
            sidebarExpanded = !sidebarExpanded;
            const expandedContent = document.getElementById('expanded-content');
            const icon = document.getElementById('size-icon');
            if (sidebarExpanded) {
                expandedContent.style.display = 'block';
                icon.style.transform = 'rotate(0deg)';
            } else {
                expandedContent.style.display = 'none';
                icon.style.transform = 'rotate(180deg)';
            }
        }

        async function toggleHospital() {
            const btn = document.getElementById('btn-hospital').querySelector('.status-dot');
            if (activeModes.has('hospital')) {
                hospitalMarkers.forEach(m => map.removeLayer(m));
                hospitalMarkers = [];
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('hospital');
                return;
            }

            try {
                const res = await fetch('https://www.ha.org.hk/opendata/aed/aedwtdata2-en.json');
                const rawJson = await res.json();
                const hData = rawJson.waitTime || [];

                hospitalMarkers.forEach(m => map.removeLayer(m));
                hospitalMarkers = [];

                hData.forEach(h => {
                    const meta = hospitalRegistry[h.hospName];
                    if (meta) {
                        const t45MaxStr = h.t45p95 || '';
                        let colorEmoji = '🟢';
                        const hourMatch = t45MaxStr.match(/(\d+)\s*hour/i);
                        
                        if (hourMatch) {
                            const hours = parseInt(hourMatch[1]);
                            if (hours > 5) colorEmoji = '🔴';
                            else if (hours > 3) colorEmoji = '🟠';
                            else if (hours >= 1) colorEmoji = '🟡';
                        } else if (t45MaxStr.includes('Over 5') || t45MaxStr.includes('超過 5')) {
                            colorEmoji = '🔴';
                        }

                        const icon = L.divIcon({
                            html: `<div class="bg-slate-900/90 border border-slate-700/60 w-9 h-9 rounded-full shadow-2xl flex items-center justify-center text-xl transition-transform duration-200 hover:scale-125 select-none cursor-pointer">${colorEmoji}</div>`,
                            className: '',
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        });

                        const m = L.marker(meta.gps, { icon: icon }).addTo(map);
                        
                        m.bindPopup(`
                            <div class="w-72 font-sans p-1 text-slate-200">
                                <div class="border-b border-slate-700/60 pb-2.5 mb-3">
                                    <h3 class="text-sm font-bold text-white tracking-wide">${meta.zhName}</h3>
                                    <div class="text-[10px] text-slate-400 mt-0.5 font-sans">${h.hospName}</div>
                                    <div class="text-[10px] text-slate-400 mt-1.5 flex items-center gap-1">
                                        <i class="fas fa-map-marker-alt text-rose-500"></i> ${meta.addr}
                                    </div>
                                </div>
                                <div class="space-y-2.5 text-xs">
                                    <div class="bg-slate-800/60 border border-slate-700/40 rounded-xl p-3">
                                        <div class="text-[10px] text-slate-400 font-medium mb-1">次緊急及非緊急最長輪候時間 (t45p95)</div>
                                        <div class="text-base font-bold text-amber-300 flex items-center gap-1.5 font-mono">
                                            <span>${colorEmoji}</span> <span>${t45MaxStr || 'N/A'}</span>
                                        </div>
                                    </div>

                                    <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-2.5 space-y-2 text-[11px]">
                                        <div class="text-[10px] font-bold text-slate-400 border-b border-slate-800 pb-1 uppercase tracking-wider">各分流級別指標 (A&E Wait Time)</div>
                                        
                                        <div class="flex justify-between items-center">
                                            <span class="text-rose-400 font-medium">類別 I (危急)</span>
                                            <span class="font-mono text-white bg-rose-950/40 px-1.5 py-0.5 border border-rose-500/20 rounded-md text-[10px]">${h.t1wt || 'Immediate'}</span>
                                        </div>
                                        <div class="flex justify-between items-center">
                                            <span class="text-orange-400 font-medium">類別 II (緊急)</span>
                                            <span class="font-mono text-white bg-orange-950/40 px-1.5 py-0.5 border border-orange-500/20 rounded-md text-[10px]">${h.t2wt || 'N/A'}</span>
                                        </div>
                                        <div class="flex justify-between items-center border-t border-slate-800/60 pt-1.5">
                                            <span class="text-amber-400 font-medium">類別 III (次緊急 - 中位數)</span>
                                            <span class="font-mono text-slate-300">${h.t3p50 || 'N/A'}</span>
                                        </div>
                                        <div class="flex justify-between items-center">
                                            <span class="text-amber-200 font-medium">類別 III (次緊急 - 大多數)</span>
                                            <span class="font-mono text-slate-300">${h.t3p95 || 'N/A'}</span>
                                        </div>
                                        <div class="flex justify-between items-center border-t border-slate-800/60 pt-1.5">
                                            <span class="text-emerald-400 font-medium">類別 IV & V (非緊急 - 中位數)</span>
                                            <span class="font-mono text-slate-300">${h.t45p50 || 'N/A'}</span>
                                        </div>
                                    </div>
                                    <div class="text-[9px] text-slate-500 italic mt-1 leading-tight">數據來源：香港醫院管理局 (HA Open Data)。每 15 分鐘自動刷新。</div>
                                </div>
                            </div>
                        `, { className: 'custom-popup' });

                        hospitalMarkers.push(m);
                    }
                });

                btn.className = "fas fa-circle text-xs text-rose-500 status-dot";
                activeModes.add('hospital');

            } catch(e) {
                console.error("醫管局 API 連線異常: ", e);
                alert("無法即時連線至醫管局開放數據中心，請確認網路或稍後再試。");
            }
        }

        function toggleMTR() {
            const el = document.getElementById('mtr-panel');
            const btn = document.getElementById('btn-mtr').querySelector('.status-dot');
            if (activeModes.has('mtr')) {
                el.classList.add('hidden');
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('mtr');
                return;
            }
            
            const lines = [
                { name: '港島綫 (Island Line)', status: '正常 / Normal', color: 'bg-blue-600' },
                { name: '荃灣綫 (Tsuen Wan Line)', status: '正常 / Normal', color: 'bg-red-600' },
                { name: '觀塘綫 (Kwun Tong Line)', status: '正常 / Normal', color: 'bg-green-600' },
                { name: '東鐵綫 (East Rail Line)', status: '正常 / Normal', color: 'bg-cyan-500' },
                { name: '東涌綫 (Tung Chung Line)', status: '正常 / Normal', color: 'bg-orange-500' },
                { name: '屯馬綫 (Tuen Ma Line)', status: '正常 / Normal', color: 'bg-amber-700' },
                { name: '南港島綫 (South Island Line)', status: '正常 / Normal', color: 'bg-lime-500' },
                { name: '機場快綫 (Airport Express)', status: '正常 / Normal', color: 'bg-teal-600' }
            ];

            let html = '';
            lines.forEach(l => {
                html += `
                    <div class="bg-slate-800/40 border border-slate-700/30 rounded-xl p-3 flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2.5 h-2.5 rounded-full ${l.color}"></span>
                            <span class="text-sm font-medium text-slate-300">${l.name}</span>
                        </div>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-emerald-950 text-emerald-400 border border-emerald-500/20">${l.status}</span>
                    </div>`;
            });
            
            document.getElementById('mtr-list').innerHTML = html;
            el.classList.remove('hidden');
            btn.className = "fas fa-circle text-xs text-pink-500 status-dot";
            activeModes.add('mtr');
        }

        function getWeatherEmojiByTemp(temp) {
            const t = parseFloat(temp);
            if (isNaN(t)) return "🌡️";
            if (t >= 33) return "🥵"; 
            if (t >= 28) return "☀️"; 
            if (t >= 22) return "😊"; 
            if (t >= 15) return "🍃"; 
            return "🥶";            
        }

        function toggleWeatherStations() {
            const btn = document.getElementById('btn-weather-stations').querySelector('.status-dot');
            
            if (activeModes.has('weather-stations')) {
                weatherStationMarkers.forEach(m => map.removeLayer(m));
                weatherStationMarkers = [];
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('weather-stations');
                return;
            }

            renderWeatherStations();
            btn.className = "fas fa-circle text-xs text-orange-400 status-dot";
            activeModes.add('weather-stations');
        }

        function renderWeatherStations() {
            if (!rawWeatherData || !rawWeatherData.temperature?.data) return;
            
            const coords = {
                "Hong Kong Observatory": { gps: [22.3022, 114.1742] },
                "King's Park": { gps: [22.3119, 114.1728] },
                "Wong Chuk Hang": { gps: [22.2478, 114.1667] },
                "Ta Kwu Ling": { gps: [22.5286, 114.1567] },
                "Lau Fau Shan": { gps: [22.4689, 113.9836] },
                "Tai Po": { gps: [22.4461, 114.1789] },
                "Sha Tin": { gps: [22.4025, 114.2100] },
                "Tuen Mun": { gps: [22.3916, 113.9767] },
                "Tseung Kwan O": { gps: [22.3156, 114.2614] },
                "Sai Kung": { gps: [22.3836, 114.2708] },
                "Chek Lap Kok": { gps: [22.3094, 113.9219] },
                "Tsing Yi": { gps: [22.3453, 114.1044] },
                "Tsuen Wan Shing Mun Valley": { gps: [22.3756, 114.1256] },
                "Hong Kong Park": { gps: [22.2778, 114.1622] },
                "Shau Kei Wan": { gps: [22.2756, 114.2256] },
                "Kowloon City": { gps: [22.3278, 114.1900] }
            };

            weatherStationMarkers.forEach(m => map.removeLayer(m));
            weatherStationMarkers = [];

            const globalHumidity = rawWeatherData.humidity?.data?.[0]?.value ? `${rawWeatherData.humidity.data[0].value}%` : '--%';
            const globalWind = rawWeatherData.wind || { direction: "VARIABLE", speed: 4, unit: "km/h" };
            const wDirection = translateWindDirection(globalWind.direction);
            const wSpeed = globalWind.speed ? `${globalWind.speed} ${globalWind.unit || 'km/h'}` : '-- km/h';

            let maxT = '--°C', minT = '--°C';
            if(rawWeatherData.temperature?.data) {
                const temps = rawWeatherData.temperature.data.map(d => d.value).filter(v => !isNaN(v));
                maxT = `${Math.max(...temps)}°C`;
                minT = `${Math.min(...temps)}°C`;
            }

            rawWeatherData.temperature.data.forEach(item => {
                const stationMeta = coords[item.place] || null;

                if (stationMeta) {
                    const dynamicEmoji = getWeatherEmojiByTemp(item.value);

                    const icon = L.divIcon({
                        html: `<div class="bg-slate-900/90 border border-slate-700/60 w-8 h-8 rounded-full shadow-xl flex items-center justify-center text-xl transition-transform duration-200 hover:scale-125 select-none">${dynamicEmoji}</div>`,
                        className: '',
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });
                    
                    const m = L.marker(stationMeta.gps, { icon: icon }).addTo(map);
                    
                    m.bindPopup(`
                        <div class="w-64 font-sans p-1 text-slate-200">
                            <div class="border-b border-slate-700/60 pb-2 mb-3">
                                <h3 class="text-sm font-bold text-white tracking-wide">${item.place}</h3>
                                <div class="text-[10px] text-slate-400 font-mono mt-0.5">Real-Time Weather Station<br>即時氣象觀測站</div>
                            </div>
                            <div class="space-y-3 text-xs">
                                <div class="bg-slate-800/50 rounded-xl px-3 py-2 border border-slate-700/30">
                                    <div class="text-[10px] text-slate-400 font-medium">Real-Time Temperature<br>即時溫度</div>
                                    <div class="text-xl font-bold text-orange-400 font-mono mt-0.5">${item.value}°C</div>
                                </div>
                                <div class="bg-slate-800/50 rounded-xl px-3 py-2 border border-slate-700/30">
                                    <div class="text-[10px] text-slate-400 font-medium">Relative Humidity<br>相對濕度</div>
                                    <div class="text-base font-bold text-white font-mono mt-0.5">${globalHumidity}</div>
                                </div>
                                <div class="grid grid-cols-2 gap-2 bg-slate-900/40 border border-slate-800 rounded-xl p-2.5">
                                    <div>
                                        <div class="text-[10px] text-slate-400">Daily Maximum<br>當日最高氣溫</div>
                                        <div class="font-bold text-rose-400 font-mono mt-0.5">${maxT}</div>
                                    </div>
                                    <div class="border-l border-slate-800 pl-2">
                                        <div class="text-[10px] text-slate-400">Daily Minimum<br>當日最低氣溫</div>
                                        <div class="font-bold text-blue-400 font-mono mt-0.5">${minT}</div>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2 bg-slate-900/40 border border-slate-800 rounded-xl p-2.5">
                                    <div>
                                        <div class="text-[10px] text-slate-400">Wind Direction<br>風向</div>
                                        <div class="font-medium text-amber-200 mt-0.5">${wDirection}</div>
                                    </div>
                                    <div class="border-l border-slate-800 pl-2">
                                        <div class="text-[10px] text-slate-400">Wind Speed<br>風速</div>
                                        <div class="font-medium text-amber-200 font-mono mt-0.5">${wSpeed}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `, { className: 'custom-popup' });
                    
                    weatherStationMarkers.push(m);
                }
            });
        }

        function toggleMode(mode) {
            if (mode === 'hospital') toggleHospital();
            else if (mode === 'mtr') toggleMTR();
            else if (mode === 'weather-stations') toggleWeatherStations();
        }

        window.onload = function() {
            initMap();
            updateMainWeather();
            updateWarnings();
            
            setInterval(updateMainWeather, 180000);
            setInterval(updateWarnings, 120000);
        };
    </script>
</body>
</html>
