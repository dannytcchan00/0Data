<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        .dashboard-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f172a 100%);
        }
        
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
        
        .weather-icon {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 20px currentColor);
        }
        
        .live-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .news-item {
            transition: all 0.3s ease;
        }
        
        .news-item:hover {
            background-color: rgba(30, 41, 59, 0.9);
            transform: translateY(-4px);
        }
        
        .map-container {
            height: 460px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body class="dashboard-bg text-slate-200 min-h-screen pb-12">
    <div class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Weather Column -->
            <div class="lg:col-span-5 space-y-6">
                <!-- Current Weather -->
                <div class="card rounded-3xl p-8">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-3xl font-semibold flex items-center gap-3">
                                <i class="fas fa-cloud-sun"></i>
                                Hong Kong Weather
                            </h2>
                            <div class="text-slate-400 mt-1">Hong Kong Observatory • Live</div>
                        </div>
                        <div id="weather-temp" class="text-7xl font-light tabular-nums text-white">26°</div>
                    </div>
                    
                    <div class="flex items-center gap-8">
                        <div id="weather-icon" class="weather-icon text-amber-400">⛅</div>
                        <div class="flex-1">
                            <div id="weather-desc" class="text-2xl font-medium">Cloudy</div>
                            <div id="weather-details" class="grid grid-cols-2 gap-y-4 mt-6 text-sm">
                            </div>
                        </div>
                    </div>
                    <div id="last-update" class="text-xs text-slate-500 mt-6 text-right"></div>
                </div>

                <!-- Weather Warnings -->
                <div class="card rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-triangle-exclamation text-amber-400"></i>
                        Active Weather Warnings
                    </h2>
                    <div id="warnings" class="space-y-4 min-h-[180px]">
                    </div>
                </div>
            </div>

            <!-- Traffic Column -->
            <div class="lg:col-span-7 space-y-6">
                <!-- Live Traffic Cameras -->
                <div class="card rounded-3xl p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-semibold flex items-center gap-3">
                            <i class="fas fa-car"></i>
                            Live Traffic Cameras
                        </h2>
                        <a href="https://www.hkemobility.gov.hk/en/traffic-information/live/cctv" 
                           target="_blank"
                           class="text-blue-400 hover:text-blue-300 flex items-center gap-2 text-sm">
                            View All <i class="fas fa-external-link-alt"></i>
                        </a>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4" id="traffic-cams">
                        <!-- JS populated -->
                    </div>
                </div>

                <!-- Traffic Map -->
                <div class="card rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-map-marked-alt"></i>
                        Real-Time Road Traffic Conditions
                    </h2>
                    <div class="map-container">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387191.058046!2d114.0!3d22.3!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3404005b5b5b5b5b%3A0x5b5b5b5b5b5b5b5b!2sHong+Kong!5e0!3m2!1sen!2shk!4v1720000000000"
                            width="100%" 
                            height="100%" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                    <div class="mt-4 flex gap-6 text-xs text-slate-400">
                        <div><span class="text-green-400">●</span> Clear</div>
                        <div><span class="text-yellow-400">●</span> Moderate</div>
                        <div><span class="text-red-400">●</span> Heavy Congestion</div>
                    </div>
                </div>
            </div>

            <!-- News Section -->
            <div class="lg:col-span-12">
                <div class="card rounded-3xl p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-semibold flex items-center gap-3">
                            <i class="fas fa-newspaper"></i>
                            Latest Hong Kong News
                        </h2>
                        <a href="https://www.scmp.com/" target="_blank" 
                           class="text-blue-400 hover:text-blue-300 text-sm flex items-center gap-1">
                            SCMP / RTHK <i class="fas fa-external-link-alt"></i>
                        </a>
                    </div>
                    
                    <div id="news-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- JS populated -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh interval (in ms)
        const REFRESH_INTERVAL = 180000; // 3 minutes

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                const data = await res.json();
                
                const temp = data.temperature?.data?.find(t => t.place === "Hong Kong Observatory")?.value || 26;
                document.getElementById('weather-temp').textContent = `${temp}°C`;
                
                const desc = data.warningMessage ? data.warningMessage[0] : "Cloudy";
                document.getElementById('weather-desc').textContent = desc.replace(/Warning Signal.*/i, '').trim();
                
                const humidity = data.humidity?.data?.[0]?.value || '—';
                const detailsHTML = `
                    <div>Humidity: <span class="font-medium">${humidity}%</span></div>
                    <div>Updated: <span class="font-medium">${new Date(data.updateTime).toLocaleTimeString('en-GB')}</span></div>
                `;
                document.getElementById('weather-details').innerHTML = detailsHTML;
                document.getElementById('last-update').textContent = `Last updated: ${new Date().toLocaleTimeString('en-GB')}`;
            } catch(e) {
                console.error("Weather fetch failed", e);
            }
        }

        async function fetchWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en');
                const data = await res.json();
                
                let html = '';
                if (data && Object.keys(data).length > 0) {
                    Object.values(data).forEach(warning => {
                        html += `
                            <div class="bg-red-950/60 border border-red-400/50 rounded-2xl p-5">
                                <div class="font-bold text-red-300 flex items-center gap-2">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    ${warning.name || warning.code}
                                </div>
                                <div class="text-sm mt-2 text-slate-300">${warning.type ? warning.type + ' ' : ''}Signal</div>
                                <div class="text-xs text-slate-400 mt-1">Issued: ${new Date(warning.issueTime).toLocaleString('en-GB')}</div>
                            </div>
                        `;
                    });
                } else {
                    html = `<div class="text-emerald-400 py-12 text-center font-medium">No active warnings at the moment</div>`;
                }
                document.getElementById('warnings').innerHTML = html;
            } catch(e) {
                console.error("Warnings fetch failed", e);
                document.getElementById('warnings').innerHTML = `
                    <div class="text-amber-400 p-4">⚠️ Unable to fetch warnings. Please check connection.</div>
                `;
            }
        }

        function loadTrafficCams() {
            const cams = [
                {loc: "Central", img: "https://picsum.photos/id/1015/640/360", desc: "Central District"},
                {loc: "Tsim Sha Tsui", img: "https://picsum.photos/id/133/640/360", desc: "Harbour View"},
                {loc: "Causeway Bay", img: "https://picsum.photos/id/201/640/360", desc: "Causeway Bay"},
                {loc: "Tsing Ma Bridge", img: "https://picsum.photos/id/251/640/360", desc: "Tsing Ma Bridge"},
            ];
            
            let html = '';
            cams.forEach(cam => {
                html += `
                    <div class="aspect-video bg-slate-900 rounded-2xl overflow-hidden relative group">
                        <img src="${cam.img}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-500" alt="${cam.loc}">
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 p-4">
                            <div class="font-medium">${cam.loc}</div>
                            <div class="text-green-400 text-xs flex items-center gap-1.5">
                                <span class="w-2 h-2 bg-green-400 rounded-full live-dot inline-block"></span>
                                LIVE • Updated every 2 min
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('traffic-cams').innerHTML = html;
        }

        function loadNews() {
            // Demo news (in real production, parse RSS feeds)
            const newsItems = [
                {
                    title: "Amber Rainstorm Warning Issued as Heavy Showers Continue",
                    time: "Just now",
                    source: "Hong Kong Observatory",
                    img: "https://picsum.photos/id/1016/600/340"
                },
                {
                    title: "Multiple roads flooded in New Territories after heavy rain",
                    time: "18 min ago",
                    source: "SCMP",
                    img: "https://picsum.photos/id/133/600/340"
                },
                {
                    title: "Thunderstorm Warning extended until 6 PM",
                    time: "35 min ago",
                    source: "RTHK",
                    img: "https://picsum.photos/id/201/600/340"
                },
                {
                    title: "Public transport services affected by inclement weather",
                    time: "52 min ago",
                    source: "HKeMobility",
                    img: "https://picsum.photos/id/251/600/340"
                }
            ];
            
            let html = '';
            newsItems.forEach(item => {
                html += `
                    <div class="news-item bg-slate-900/70 border border-slate-700 rounded-3xl overflow-hidden cursor-pointer">
                        <img src="${item.img}" class="w-full h-44 object-cover">
                        <div class="p-5">
                            <div class="line-clamp-3 font-medium leading-tight">${item.title}</div>
                            <div class="text-xs text-slate-400 mt-4 flex justify-between">
                                <span>${item.source}</span>
                                <span>${item.time}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('news-feed').innerHTML = html;
        }

        function refreshAll() {
            fetchWeather();
            fetchWarnings();
            // Traffic cams and news are static for demo but refreshed visually
            console.log("%cDashboard refreshed", "color: #60a5fa");
        }

        // Initialize everything
        window.onload = function() {
            fetchWeather();
            fetchWarnings();
            loadTrafficCams();
            loadNews();
            
            // Auto refresh everything
            setInterval(() => {
                refreshAll();
            }, REFRESH_INTERVAL);
            
            // Refresh warnings more frequently
            setInterval(fetchWarnings, 120000); // every 2 minutes
        };
    </script>
</body>
</html>
