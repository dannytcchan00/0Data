<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .floating-panel {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.3);
            backdrop-filter: blur(16px);
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.98) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
            border-radius: 1.5rem !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.98) !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
        }
    </style>
</head>

    <div id="map" class="absolute inset-0"></div>

    <div id="top-header" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-slate-900/95 border border-slate-700 rounded-3xl px-8 py-3 flex items-center gap-3 shadow-2xl pointer-events-auto">

            <i class="fas fa-city text-blue-500"></i> 香港實時數據儀表板
        </h1>
    </div>

            </button>
        </div>

        <div class="flex items-center gap-6 mb-6">
            <div id="main-weather-icon" class="text-6xl">⏳</div>
            <div>

                <div id="main-weather-desc" class="text-base font-medium text-slate-400">正在加載天氣...</div>
            </div>
        </div>

        <div id="main-weather-details" class="grid grid-cols-2 gap-3 text-xs bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 mb-4">
            <div>相對濕度: <span id="humidity-val" class="font-bold text-white">--</span></div>
            <div>紫外線指數: <span id="uv-val" class="font-bold text-white">--</span></div>
            <div class="border-t border-slate-700/40 pt-2">當日最高: <span id="temp-max" class="font-bold text-rose-400">--</span></div>
            <div class="border-t border-slate-700/40 pt-2">當日最低: <span id="temp-min" class="font-bold text-blue-400">--</span></div>
            <div class="border-t border-slate-700/40 pt-2 col-span-2">
                實時風向: <span id="wind-dir" class="font-bold text-amber-200">--</span> 
                (<span id="wind-speed" class="font-bold text-amber-200">--</span>)
            </div>
        </div>
        <div id="main-weather-update" class="text-xs text-slate-500 mb-6 font-mono"></div>

        <div id="expanded-content" class="space-y-6">
            <div class="pt-4 border-t border-slate-800">

                </h3>

            </div>

            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-semibold mb-3 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                    <i class="fas fa-layer-group text-blue-500"></i> 數據圖層切換
                </h3>
                <div class="space-y-2">
                    <button id="btn-hospital" onclick="toggleMode('hospital')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-hospital-user text-rose-500"></i> <span class="font-medium text-slate-200">公立醫院急症室等候時間</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-mtr" onclick="toggleMode('mtr')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">

                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-immigration" onclick="toggleMode('immigration')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">

                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-weather-stations" onclick="toggleMode('weather-stations')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">

                    </button>

        function translateWindDirection(dir) {
            if (!dir) return '微風';
            const d = dir.toUpperCase().trim();
            if (d === 'VARIABLE' || d === 'LIGHT' || d === 'CALM') return '微風';
            
            return d
                .replace('NORTH-EAST', '東北風').replace('NORTH-WEST', '西北風')
                .replace('SOUTH-EAST', '東南風').replace('SOUTH-WEST', '西南風')
                .replace('EAST-NORTHEAST', '東北偏東風').replace('EAST-SOUTHEAST', '東南偏東風')
                .replace('WEST-NORTHEAST', '東北偏西風').replace('WEST-SOUTHEAST', '東南偏西風')
                .replace('NORTH-NORTHEAST', '東北偏北風').replace('NORTH-NORTHWEST', '西北偏北風')
                .replace('SOUTH-SOUTHEAST', '東南偏南風').replace('SOUTH-SOUTHWEST', '西南偏南風')
                .replace('NORTH', '北風').replace('SOUTH', '南風')
                .replace('EAST', '東風').replace('WEST', '西風');
        }

        async function updateMainWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                rawWeatherData = await res.json();
                
                const temp = rawWeatherData.temperature?.data?.find(t => t.place === "Hong Kong Observatory")?.value || '--';
                document.getElementById('main-weather-temp').textContent = `${temp}°C`;
                
                const humidity = rawWeatherData.humidity?.data?.[0]?.value || '--';
                document.getElementById('humidity-val').textContent = `${humidity}%`;
                
                const uvData = rawWeatherData.uvindex?.data?.[0]?.value || '0';
                document.getElementById('uv-val').textContent = uvData;

                let maxT = '--', minT = '--';
                if(rawWeatherData.temperature?.data) {
                    const temps = rawWeatherData.temperature.data.map(d => d.value).filter(v => !isNaN(v));
                    maxT = Math.max(...temps);
                    minT = Math.min(...temps);
                }
                document.getElementById('temp-max').textContent = `${maxT}°C`;
                document.getElementById('temp-min').textContent = `${minT}°C`;

                const mainWind = rawWeatherData.wind || {};
                document.getElementById('wind-dir').textContent = translateWindDirection(mainWind.direction);
                document.getElementById('wind-speed').textContent = mainWind.speed ? `${mainWind.speed} ${mainWind.unit || 'km/h'}` : '-- km/h';

                let icon = '☀️';
                let desc = 'Fine';
                if(rawWeatherData.icon && rawWeatherData.icon.length > 0){
                    const code = parseInt(rawWeatherData.icon[0]);
                    if (code >= 51 && code <= 54) { icon = '⛅'; desc = '多雲 / Cloudy'; }
                    else if ((code >= 62 && code <= 65) || code === 50) { icon = '🌧️'; desc = '有雨 / Showers'; }
                    else if (code >= 70 && code <= 77) { icon = '⛈️'; desc = '雷暴 / Thunderstorms'; }
                    else if (code >= 60 && code <= 61) { icon = '☁️'; desc = '密雲 / Overcast'; }
                }
                document.getElementById('main-weather-icon').innerHTML = icon;
                document.getElementById('main-weather-desc').textContent = desc;
                
                document.getElementById('main-weather-update').textContent = `更新時間: ${new Date().toLocaleTimeString('en-GB')}`;

                if (activeModes.has('weather-stations')) renderWeatherStations();

            } catch(e) {
                console.error("天氣更新失敗: ", e);
            }
        }

        function getWarningEmoji(code, name) {
            const c = (code || '').toUpperCase().trim();
            const n = name || '';
            
            if (c.includes("TC10") || n.includes("十號")) return "🌀🔟🔴";
            if (c.includes("TC9") || n.includes("九號")) return "🌀9️⃣";
            if (c.includes("TC8NE") || n.includes("東北")) return "🌀8️⃣↗️";
            if (c.includes("TC8NW") || n.includes("西北")) return "🌀8️⃣↖️";
            if (c.includes("TC8SE") || n.includes("東南")) return "🌀8️⃣↘️";
            if (c.includes("TC8SW") || n.includes("西南")) return "🌀8️⃣↙️";
            if (c.includes("TC3") || n.includes("三號強風")) return "🌀3️⃣";
            if (c.includes("TC1") || n.includes("一號戒備")) return "🌀1️⃣";
            
            if (c.includes("WRAINA") || n.includes("黃色暴雨")) return "🟡⛈️"; 
            if (c.includes("WRAINR") || n.includes("紅色暴雨")) return "🔴⛈️"; 
            if (c.includes("WRAINB") || n.includes("黑色暴雨")) return "⬛⛈️"; 
            if (c.includes("WHOT") || c.includes("WTW") || n.includes("酷熱")) return "☀️🥵";
            if (c.includes("WCOLD") || n.includes("寒冷")) return "💙🥶";

            const mapping = [
                { keys: ["WFIREY", "黃色火災"], emoji: "🟡🔥" },
                { keys: ["WFIRER", "紅色火災"], emoji: "🔴🔥" },
                { keys: ["WFROST", "霜凍"], emoji: "❄️" },
                { keys: ["WMSON", "強烈季候風"], emoji: "🍃💨" },
                { keys: ["WSMFL", "新界北部水浸"], emoji: "🌊⚠️" },
                { keys: ["WLANDO", "山泥傾瀉"], emoji: "⛰️🚨" },
                { keys: ["WTHCK", "雷暴"], emoji: "⚡⛈️" },
                { keys: ["WTSU", "海嘯"], emoji: "🌊🚨" }
            ];
            
            for (let item of mapping) {
                if (item.keys.some(k => c.includes(k) || n.includes(k))) {
                    return item.emoji;
                }
            }
            return "⚠️";
        }

        async function updateWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const data = await res.json();
                let html = '';
                let activeWarningCount = 0;
                
                if (data && Object.keys(data).length > 0) {
                    Object.keys(data).forEach(key => {
                        const w = data[key];
                        if (w.actionCode === 'CANCEL') return; 
                        
                        activeWarningCount++;
                        const code = w.code || key;
                        const name = w.name || '';
                        const emojiRepresentation = getWarningEmoji(code, name);
                        
                        html += `
                            <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-center gap-3">
                                <div class="text-2xl min-w-[3.5rem] w-auto h-12 px-2 flex items-center justify-center bg-slate-900/60 border border-slate-700/50 rounded-xl flex-shrink-0 select-none tracking-wide whitespace-nowrap transition-all duration-300">
                                    ${emojiRepresentation}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-amber-200 text-xs leading-tight truncate">${name || '天氣警告'}</div>
                                    <div class="text-[10px] text-slate-400 mt-1 font-medium">現正生效中</div>
                                </div>
                            </div>
                        `;
                    });
                }
                
                if (activeWarningCount === 0) {
                    html = `
                        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-2xl py-3 px-4 flex items-center gap-3">
                            <div class="w-7 h-7 bg-emerald-500/20 rounded-full flex items-center justify-center border border-emerald-500/40 text-emerald-400 flex-shrink-0">
                                <i class="fas fa-shield-halved text-sm"></i>
                            </div>
                            <span>當前無任何惡劣天氣警告。</span>

                }
                document.getElementById('warnings-list').innerHTML = html;
            } catch(e) {
                document.getElementById('warnings-list').innerHTML = `<div class="text-slate-500 text-xs">暫時無法取得警告資訊</div>`;
            }
        }

        // 核心改動：合併轉車站圓點，繪製完整軌道網
        function toggleMTR() {
            const el = document.getElementById('mtr-panel');
            const btn = document.getElementById('btn-mtr').querySelector('.status-dot');
            
            if (activeModes.has('mtr')) {
                el.classList.add('hidden');
                mtrNetworkLayers.forEach(layer => map.removeLayer(layer));
                mtrNetworkLayers = [];
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('mtr');
                return;
            }

            // 1. 先把所有路線的線條畫好
            mtrLinesData.forEach(line => {
                const latlngs = line.stationKeys
                    .map(key => mtrStationsRegistry[key] ? mtrStationsRegistry[key].gps : null)
                    .filter(gps => gps !== null);
                
                // 黑色發光軌道底
                const bgPolyline = L.polyline(latlngs, {
                    color: '#000000',
                    weight: 7,
                    opacity: 0.6
                }).addTo(map);
                mtrNetworkLayers.push(bgPolyline);

                // 官方彩色路線線段
                const polyline = L.polyline(latlngs, {
                    color: line.color,
                    weight: 4,
                    opacity: 0.9
                }).addTo(map);
                mtrNetworkLayers.push(polyline);
            });

            // 2. 遍歷整個統一車站 Registry，每個車站保證只畫一個標記點
            Object.keys(mtrStationsRegistry).forEach(stationKey => {
                const station = mtrStationsRegistry[stationKey];
                
                // 找出這個車站隸屬於哪些路線
                const belongsToLines = mtrLinesData.filter(line => line.stationKeys.includes(stationKey));
                
                let markerHtml = '';
                // 如果是交匯站（擁有2條或以上路線），採用特殊的雙色/多色環狀或漸變效果，或者主體白底拼湊色圈

                    // 交匯站：稍微放大外圈，內部用精緻的白底黑芯或黑底多色環表示
                    markerHtml = `<div class="w-4.5 h-4.5 bg-white border-2 border-slate-400 rounded-full shadow-lg flex items-center justify-center transition-all duration-150 hover:scale-150 cursor-pointer">
                        <div class="w-2 h-2 bg-slate-900 rounded-full"></div>
                    </div>`;

                    // 單一線路普通站：直接使用該線路的官方顏色邊框

                    markerHtml = `<div class="w-3.5 h-3.5 bg-white border-2 rounded-full shadow-md flex items-center justify-center transition-all duration-150 hover:scale-150 cursor-pointer" style="border-color: ${lineColor};"></div>`;

            document.getElementById('mtr-list').innerHTML = html;
            el.classList.remove('hidden');
            btn.className = "fas fa-circle text-xs text-pink-500 status-dot";
            activeModes.add('mtr');
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return [];
            
            const headers = lines[0].split(',').map(h => h.replace(/^["']|["']$/g, '').trim());
            const results = [];
            
            for (let i = 1; i < lines.length; i++) {
                const currentLine = lines[i].split(',');
                if (currentLine.length === headers.length) {
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = currentLine[index].replace(/^["']|["']$/g, '').trim();
                    });
                    results.push(obj);
                }
            }
            return results;
        }

        async function toggleImmigration() {
            const el = document.getElementById('immigration-panel');
            const btn = document.getElementById('btn-immigration').querySelector('.status-dot');
            
            if (activeModes.has('immigration')) {
                el.classList.add('hidden');
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('immigration');
                return;
            }

            try {
                const csvUrl = 'https://dannytcchan00.github.io/0Data/data/immi/immi_daily/data.csv';
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                
                const data = parseCSV(csvText);
                if (!data || data.length === 0) throw new Error("無可用數據");
                
                const latestDate = data[data.length - 1].Date;
                const latestRecords = data.filter(r => r.Date === latestDate);

                document.getElementById('imm-date-display').textContent = `Data Date 數據日期: ${latestDate}`;

                let totalArrival = 0;
                let totalDeparture = 0;
                let checkpointData = {};

                latestRecords.forEach(r => {
                    const cpEn = r["Control Point"];
                    if (!checkpointData[cpEn]) {
                        checkpointData[cpEn] = { arrival: 0, departure: 0 };
                    }
                    
                    const arrivalCount = parseInt(r["Arrival / Departure - Arrival"]) || 0;
                    const departureCount = parseInt(r["Arrival / Departure - Departure"]) || 0;
                    
                    checkpointData[cpEn].arrival += arrivalCount;
                    checkpointData[cpEn].departure += departureCount;
                    
                    totalArrival += arrivalCount;
                    totalDeparture += departureCount;
                });

                document.getElementById('imm-total-arrival').textContent = totalArrival.toLocaleString();
                document.getElementById('imm-total-flow').textContent = (totalArrival + totalDeparture).toLocaleString();

                let html = '';
                Object.keys(checkpointData).forEach(cpEn => {
                    const cpZh = checkpointRegistry[cpEn] || cpEn;
                    const item = checkpointData[cpEn];
                    
                    html += `
                        <div class="bg-slate-800/40 border border-slate-700/30 rounded-xl p-3 space-y-2">
                            <div class="border-b border-slate-800 pb-1.5">
                                <div class="text-xs font-bold text-white tracking-wide">${cpEn}</div>
                                <div class="text-[10px] text-slate-400 font-medium">${cpZh}</div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[11px] font-mono">
                                <div class="flex justify-between bg-slate-900/40 px-2 py-1 rounded border border-slate-800/60">
                                    <span class="text-slate-400">ARR 入境:</span>
                                    <span class="text-indigo-300 font-bold">${item.arrival.toLocaleString()}</span>
                                </div>
                                <div class="flex justify-between bg-slate-900/40 px-2 py-1 rounded border border-slate-800/60">
                                    <span class="text-slate-400">DEP 出境:</span>
                                    <span class="text-amber-200 font-bold">${item.departure.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>`;
                });

                document.getElementById('immigration-list').innerHTML = html;
                el.classList.remove('hidden');
                btn.className = "fas fa-circle text-xs text-indigo-400 status-dot";
                activeModes.add('immigration');

            } catch(e) {
                console.error("入境處 CSV 連線解析異常: ", e);
                document.getElementById('immigration-list').innerHTML = `<div class="text-slate-500 text-xs py-4 text-center">暫時無法取得出入境旅客流量數據<br><span class="text-[10px] text-slate-600">請確認網路或 GitHub Pages 託管狀態</span></div>`;
                el.classList.remove('hidden');
            }
        }

        function getWeatherEmojiByTemp(temp) {
            const t = parseFloat(temp);
            if (isNaN(t)) return "🌡️";
            if (t >= 33) return "🥵"; 
            if (t >= 28) return "☀️"; 
            if (t >= 22) return "😊"; 
            if (t >= 15) return "🍃"; 
            return "🥶";            
        }

        function toggleWeatherStations() {
            const btn = document.getElementById('btn-weather-stations').querySelector('.status-dot');
            
            if (activeModes.has('weather-stations')) {
                weatherStationMarkers.forEach(m => map.removeLayer(m));
                weatherStationMarkers = [];
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('weather-stations');
                return;
            }

            renderWeatherStations();
            btn.className = "fas fa-circle text-xs text-orange-400 status-dot";
            activeModes.add('weather-stations');
        }

        function renderWeatherStations() {
            if (!rawWeatherData || !rawWeatherData.temperature?.data) return;
            
            const coords = {
                "Hong Kong Observatory": { gps: [22.3022, 114.1742] },
                "King's Park": { gps: [22.3119, 114.1728] },
                "Wong Chuk Hang": { gps: [22.2478, 114.1667] },
                "Ta Kwu Ling": { gps: [22.5286, 114.1567] },
                "Lau Fau Shan": { gps: [22.4689, 113.9836] },
                "Tai Po": { gps: [22.4461, 114.1789] },
                "Sha Tin": { gps: [22.4025, 114.2100] },
                "Tuen Mun": { gps: [22.3916, 113.9767] },
                "Tseung Kwan O": { gps: [22.3156, 114.2614] },
                "Sai Kung": { gps: [22.3836, 114.2708] },
                "Chek Lap Kok": { gps: [22.3094, 113.9219] },
                "Tsing Yi": { gps: [22.3453, 114.1044] },
                "Tsuen Wan Shing Mun Valley": { gps: [22.3756, 114.1256] },
                "Hong Kong Park": { gps: [22.2778, 114.1622] },
                "Shau Kei Wan": { gps: [22.2756, 114.2256] },
                "Kowloon City": { gps: [22.3278, 114.1900] }
            };

            weatherStationMarkers.forEach(m => map.removeLayer(m));
            weatherStationMarkers = [];

            const globalHumidity = rawWeatherData.humidity?.data?.[0]?.value ? `${rawWeatherData.humidity.data[0].value}%` : '--%';
            const globalWind = rawWeatherData.wind || { direction: "VARIABLE", speed: 4, unit: "km/h" };
            const wDirection = translateWindDirection(globalWind.direction);
            const wSpeed = globalWind.speed ? `${globalWind.speed} ${globalWind.unit || 'km/h'}` : '-- km/h';

            let maxT = '--°C', minT = '--°C';
            if(rawWeatherData.temperature?.data) {
                const temps = rawWeatherData.temperature.data.map(d => d.value).filter(v => !isNaN(v));
                maxT = `${Math.max(...temps)}°C`;
                minT = `${Math.min(...temps)}°C`;
            }

            rawWeatherData.temperature.data.forEach(item => {
                const stationMeta = coords[item.place] || null;

                if (stationMeta) {
                    const dynamicEmoji = getWeatherEmojiByTemp(item.value);

                    const icon = L.divIcon({
                        html: `<div class="bg-slate-900/90 border border-slate-700/60 w-8 h-8 rounded-full shadow-xl flex items-center justify-center text-xl transition-transform duration-200 hover:scale-125 select-none">${dynamicEmoji}</div>`,
                        className: '',
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });
                    
                    const m = L.marker(stationMeta.gps, { icon: icon }).addTo(map);
                    
                    m.bindPopup(`
                        <div class="w-56 font-sans p-1 text-slate-200">
                            <div class="border-b border-slate-700/60 pb-2 mb-3">
                                <h3 class="text-sm font-bold text-white tracking-wide">${item.place}</h3>
                                <div class="text-[10px] text-slate-400 font-mono mt-0.5">即時氣象觀測站</div>
                            </div>
                            <div class="space-y-2.5 text-xs">
                                <div class="flex justify-between items-center bg-slate-800/50 rounded-xl px-2.5 py-1.5 border border-slate-700/30">
                                    <span class="text-slate-400 font-medium">即時溫度</span>
                                    <span class="text-orange-400 font-bold text-sm font-mono">${item.value}°C</span>
                                </div>
                                <div class="flex justify-between items-center px-1">
                                    <span class="text-slate-400">相對濕度</span>
                                    <span class="font-semibold text-white font-mono">${globalHumidity}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2 border-t border-b border-slate-800/80 py-2 my-1">
                                    <div>
                                        <div class="text-[10px] text-slate-500">當日最高</div>
                                        <div class="font-bold text-rose-400 font-mono mt-0.5">${maxT}</div>
                                    </div>
                                    <div class="border-l border-slate-800 pl-2">
                                        <div class="text-[10px] text-slate-500">當日最低</div>
                                        <div class="font-bold text-blue-400 font-mono mt-0.5">${minT}</div>
                                    </div>
                                </div>
                                <div class="space-y-1 px-1">
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">實時風向</span>
                                        <span class="font-medium text-amber-200">${wDirection}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">實時風速</span>
                                        <span class="font-medium text-amber-200 font-mono">${wSpeed}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `, { className: 'custom-popup' });
                    
                    weatherStationMarkers.push(m);
                }
            });
        }

        function toggleMode(mode) {
            if (mode === 'hospital') toggleHospital();
            else if (mode === 'mtr') toggleMTR();
            else if (mode === 'immigration') toggleImmigration();
            else if (mode === 'weather-stations') toggleWeatherStations();
        }

        window.onload = function() {
            initMap();
            updateMainWeather();
            updateWarnings();
            
            setInterval(updateMainWeather, 180000);
            setInterval(updateWarnings, 120000);
        };
    </script>
</body>
