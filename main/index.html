<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .floating-panel {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.3);
            backdrop-filter: blur(12px);
        }
        
        .leaflet-popup-content-wrapper {
            background: #1e2937;
            color: #e2e8f0;
            border-radius: 12px;
        }
        
        .mtr-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body class="bg-black text-slate-200 overflow-hidden">
    <div id="map" class="absolute inset-0"></div>

    <!-- Top Header -->
    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/90 border border-slate-700 rounded-3xl px-8 py-3 flex items-center gap-3 shadow-2xl">
        <h1 class="text-2xl font-bold tracking-tight">Hong Kong Live</h1>
        <div class="h-6 w-px bg-slate-700"></div>
        <button onclick="switchMode('weather')" class="px-5 py-2 hover:bg-slate-800 rounded-2xl transition-colors">Weather</button>
        <button onclick="switchMode('traffic')" class="px-5 py-2 hover:bg-slate-800 rounded-2xl transition-colors">Traffic</button>
        <button onclick="switchMode('mtr')" class="px-5 py-2 hover:bg-slate-800 rounded-2xl transition-colors">MTR</button>
        <button onclick="switchMode('news')" class="px-5 py-2 hover:bg-slate-800 rounded-2xl transition-colors">News</button>
    </div>

    <!-- Left Floating Weather Panel -->
    <div id="weather-panel" class="floating-panel absolute top-24 left-6 w-80 rounded-3xl p-6 z-50 shadow-2xl">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
            <i class="fas fa-cloud-sun"></i> Hong Kong Weather
        </h2>
        <div class="flex items-center gap-6">
            <div id="map-weather-icon" class="text-7xl">🌧️</div>
            <div>
                <div id="map-weather-temp" class="text-5xl font-light">27°</div>
                <div id="map-weather-desc" class="text-lg">Heavy Rain</div>
            </div>
        </div>
        <div id="map-weather-details" class="mt-6 grid grid-cols-2 gap-3 text-sm"></div>
        <div id="map-weather-update" class="text-xs text-slate-400 mt-4"></div>
    </div>

    <!-- Left Floating Control Panel -->
    <div class="floating-panel absolute top-96 left-6 w-80 rounded-3xl p-6 z-50 shadow-2xl">
        <h3 class="font-semibold mb-4 text-slate-300">Dashboard Controls</h3>
        <div class="space-y-2">
            <button onclick="switchMode('mtr')" class="w-full text-left px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-3 transition-colors">
                <i class="fas fa-subway"></i>
                <span>MTR Status</span>
            </button>
            <button onclick="switchMode('traffic')" class="w-full text-left px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-3 transition-colors">
                <i class="fas fa-car"></i>
                <span>Live Traffic Cameras</span>
            </button>
            <button onclick="switchMode('weather')" class="w-full text-left px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-3 transition-colors">
                <i class="fas fa-cloud-rain"></i>
                <span>Warnings & AQHI</span>
            </button>
        </div>
    </div>

    <!-- MTR Legend / Info -->
    <div id="mtr-legend" class="hidden floating-panel absolute bottom-8 right-6 w-72 rounded-3xl p-5 z-50">
        <h3 class="font-semibold mb-3">MTR Lines Status</h3>
        <div id="mtr-list" class="space-y-3 text-sm max-h-80 overflow-y-auto"></div>
    </div>

    <!-- News Sidebar -->
    <div id="news-panel" class="hidden floating-panel absolute top-24 right-6 w-96 rounded-3xl p-6 z-50 max-h-[80vh] overflow-y-auto">
        <h2 class="text-xl font-semibold mb-4">Latest RTHK News</h2>
        <div id="news-list" class="space-y-6"></div>
    </div>

    <script>
        let map;
        let mtrLayer = null;
        let currentMode = 'weather';

        // Initialize Map
        function initMap() {
            map = L.map('map', {
                center: [22.3193, 114.1694], // Hong Kong
                zoom: 12,
                zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);

            // HK Boundary approx
            L.polygon([
                [22.55, 113.8], [22.55, 114.5], [22.15, 114.5], [22.15, 113.8]
            ], {color: '#64748b', fillOpacity: 0.05, weight: 2}).addTo(map);
        }

        // Weather
        async function updateWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                const data = await res.json();
                
                const temp = data.temperature?.data?.[0]?.value || 27;
                document.getElementById('map-weather-temp').textContent = `${temp}°C`;
                
                let icon = '🌧️';
                let desc = 'Heavy Rain';
                const iconCode = data.icon ? parseInt(data.icon[0]) : 64;
                if (iconCode < 60) { icon = '⛅'; desc = 'Cloudy'; }
                
                document.getElementById('map-weather-icon').innerHTML = icon;
                document.getElementById('map-weather-desc').textContent = desc;
                
                const humidity = data.humidity?.data?.[0]?.value || '—';
                document.getElementById('map-weather-details').innerHTML = `
                    <div>Humidity <span class="font-medium">${humidity}%</span></div>
                    <div>Wind <span class="font-medium">${data.wind?.direction || '—'}</span></div>
                `;
                document.getElementById('map-weather-update').textContent = `Updated just now`;
            } catch(e) {}
        }

        async function loadWarnings() {
            // Shown in weather panel for simplicity
        }

        // MTR Lines (simplified)
        function showMTR() {
            if (mtrLayer) map.removeLayer(mtrLayer);
            
            const lines = [
                {name: "Tsuen Wan Line", color: "#FF0000", coords: [[22.28, 114.15], [22.37, 114.05]]},
                {name: "Island Line", color: "#0072B0", coords: [[22.28, 114.15], [22.28, 114.25]]},
                {name: "Tuen Ma Line", color: "#9B2C2C", coords: [[22.37, 114.05], [22.45, 114.18]]},
                // Add more as needed
            ];
            
            mtrLayer = L.layerGroup().addTo(map);
            
            lines.forEach(line => {
                L.polyline(line.coords, {color: line.color, weight: 6, opacity: 0.85}).addTo(mtrLayer);
                
                L.circleMarker(line.coords[0], {
                    radius: 8,
                    fillColor: line.color,
                    color: '#fff',
                    weight: 2
                }).bindPopup(`<b>${line.name}</b><br>Normal Service`).addTo(mtrLayer);
            });
            
            document.getElementById('mtr-legend').classList.remove('hidden');
            updateMTRList();
        }

        function updateMTRList() {
            const html = `
                <div class="flex items-center gap-3"><div class="mtr-dot" style="background:#FF0000"></div><span>Tsuen Wan Line — Normal</span></div>
                <div class="flex items-center gap-3"><div class="mtr-dot" style="background:#0072B0"></div><span>Island Line — Normal</span></div>
                <div class="flex items-center gap-3"><div class="mtr-dot" style="background:#9B2C2C"></div><span>Tuen Ma Line — Normal</span></div>
                <div class="flex items-center gap-3"><div class="mtr-dot" style="background:#00A650"></div><span>Kwun Tong Line — Normal</span></div>
            `;
            document.getElementById('mtr-list').innerHTML = html;
        }

        function loadTrafficMarkers() {
            // Example traffic cams as markers
            const cams = [
                {lat: 22.280, lng: 114.158, name: "Central"},
                {lat: 22.300, lng: 114.172, name: "TST"},
            ];
            
            cams.forEach(cam => {
                L.marker([cam.lat, cam.lng]).addTo(map)
                    .bindPopup(`<b>${cam.name}</b><br><img src="https://tdcctv.data.one.gov.hk/H106F.JPG" width="240">`);
            });
        }

        async function loadNews() {
            const panel = document.getElementById('news-panel');
            panel.classList.remove('hidden');
            
            try {
                const res = await fetch('https://rthk.hk/rthk/news/rss/e_expressnews_elocal.xml');
                const text = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                const items = xml.querySelectorAll("item");
                
                let html = '';
                Array.from(items).slice(0, 8).forEach(item => {
                    const title = item.querySelector("title")?.textContent || "Latest News";
                    html += `
                        <div class="border-b border-slate-700 pb-4 last:border-none">
                            <div class="font-medium leading-tight">${title}</div>
                            <div class="text-xs text-slate-400 mt-2">RTHK • Just now</div>
                        </div>
                    `;
                });
                document.getElementById('news-list').innerHTML = html;
            } catch(e) {
                document.getElementById('news-list').innerHTML = `<div class="text-slate-400">Latest local news from RTHK</div>`;
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            
            document.getElementById('news-panel').classList.add('hidden');
            document.getElementById('mtr-legend').classList.add('hidden');
            
            if (mode === 'mtr') {
                showMTR();
            } else if (mode === 'traffic') {
                loadTrafficMarkers();
            } else if (mode === 'news') {
                loadNews();
            } else {
                // Default weather
            }
        }

        // Init
        window.onload = function() {
            initMap();
            updateWeather();
            setInterval(updateWeather, 300000);
            
            // Default to weather + some traffic markers
            loadTrafficMarkers();
            
            // Auto refresh warnings simulation
            console.log("%cHong Kong Live Dashboard Ready", "color: #60a5fa; font-weight: bold");
        };
    </script>
</body>
</html>
