<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, sans-serif;
        }
        
        .dashboard-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f172a 100%);
        }
        
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
        
        .weather-icon {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 20px currentColor);
        }
        
        .live-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .news-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .news-item:hover {
            background-color: rgba(30, 41, 59, 0.9);
            transform: translateY(-4px);
        }
        
        .cam-img {
            transition: all 0.4s ease;
        }
        
        .modal {
            animation: modalPop 0.3s ease;
        }
        
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="dashboard-bg text-slate-200 min-h-screen pb-12">
    <div class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column -->
            <div class="lg:col-span-5 space-y-6">
                <!-- Weather -->
                <div class="card rounded-3xl p-8">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-3xl font-semibold flex items-center gap-3">
                                <i class="fas fa-cloud-sun"></i>
                                Hong Kong Weather
                            </h2>
                            <div class="text-slate-400 mt-1">Hong Kong Observatory • Live</div>
                        </div>
                        <div id="weather-temp" class="text-7xl font-light tabular-nums">27°</div>
                    </div>
                    <div class="flex items-center gap-8">
                        <div id="weather-icon" class="weather-icon text-amber-400">⛅</div>
                        <div class="flex-1">
                            <div id="weather-desc" class="text-2xl font-medium">Cloudy</div>
                            <div id="weather-details" class="grid grid-cols-2 gap-y-4 mt-6 text-sm"></div>
                        </div>
                    </div>
                    <div id="weather-update" class="text-xs text-slate-500 mt-6 text-right"></div>
                </div>

                <!-- Warnings -->
                <div class="card rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-triangle-exclamation text-amber-400"></i>
                        Active Weather Warnings
                    </h2>
                    <div id="warnings" class="space-y-4 min-h-[160px]"></div>
                </div>

                <!-- Air Quality -->
                <div class="card rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-wind"></i>
                        Air Quality Health Index (AQHI)
                    </h2>
                    <div id="aqi-display" class="flex items-center gap-8"></div>
                    <div class="text-xs text-slate-400 mt-4">Data from EPD • Updated hourly</div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="lg:col-span-7 space-y-6">
                <!-- Traffic Cameras -->
                <div class="card rounded-3xl p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-semibold flex items-center gap-3">
                            <i class="fas fa-car"></i>
                            Live Traffic Cameras
                        </h2>
                        <a href="https://www.hkemobility.gov.hk/en/traffic-information/live/cctv" 
                           target="_blank" class="text-blue-400 hover:text-blue-300 text-sm flex items-center gap-2">
                            More <i class="fas fa-external-link-alt"></i>
                        </a>
                    </div>
                    <div class="grid grid-cols-2 gap-4" id="traffic-cams"></div>
                </div>

                <!-- MTR Status -->
                <div class="card rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-subway"></i>
                        MTR Service Status (All Lines)
                    </h2>
                    <div id="mtr-status" class="grid grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-2"></div>
                    <div class="text-xs text-slate-400 mt-4 flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-400 rounded-full live-dot"></span>
                        Real-time from MTR • Refreshes every 45s
                    </div>
                </div>
            </div>

            <!-- News -->
            <div class="lg:col-span-12">
                <div class="card rounded-3xl p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-semibold flex items-center gap-3">
                            <i class="fas fa-newspaper"></i>
                            Latest Hong Kong News
                        </h2>
                        <a href="https://www.scmp.com/" target="_blank" class="text-blue-400 hover:text-blue-300 text-sm flex items-center gap-1">
                            More News <i class="fas fa-external-link-alt"></i>
                        </a>
                    </div>
                    <div id="news-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- News Detail Modal -->
    <div id="news-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50">
        <div class="modal bg-slate-900 rounded-3xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-semibold"></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-3xl leading-none">×</button>
            </div>
            <div class="p-8 overflow-y-auto max-h-[70vh]">
                <img id="modal-image" class="w-full h-64 object-cover rounded-2xl mb-6" alt="">
                <div id="modal-content" class="prose prose-invert text-slate-300 leading-relaxed"></div>
                <div id="modal-meta" class="text-xs text-slate-400 mt-8"></div>
            </div>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = 180000;

        // Traffic Cameras
        const trafficCams = [
            {loc: "Central", key: "H106F", desc: "Queen's Road Central"},
            {loc: "Tsim Sha Tsui", key: "K502F", desc: "Nathan Road"},
            {loc: "Causeway Bay", key: "H429F", desc: "Hennessy Road"},
            {loc: "Tsing Ma Bridge", key: "K914F", desc: "Tsing Ma Bridge"},
        ];

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                const data = await res.json();
                const tempData = data.temperature?.data?.find(item => item.place === "Hong Kong Observatory") || data.temperature?.data?.[0];
                const temp = tempData ? tempData.value : 27;
                document.getElementById('weather-temp').textContent = `${temp}°C`;
                document.getElementById('weather-desc').textContent = data.condition || "Cloudy";
                
                const humidity = data.humidity?.data?.[0]?.value || '—';
                document.getElementById('weather-details').innerHTML = `
                    <div>Humidity: <span class="font-medium">${humidity}%</span></div>
                    <div>Wind: <span class="font-medium">${data.wind?.direction || '—'}</span></div>
                `;
                document.getElementById('weather-update').textContent = `Updated: ${new Date().toLocaleTimeString('en-GB')}`;
            } catch(e) {}
        }

        async function fetchWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en');
                const data = await res.json();
                let html = '';
                if (data && Object.keys(data).length > 0) {
                    Object.values(data).forEach(w => {
                        html += `<div class="bg-red-950/60 border border-red-400 rounded-2xl p-5">
                            <div class="font-bold text-red-300">${w.name || 'Warning'}</div>
                        </div>`;
                    });
                } else {
                    html = `<div class="text-emerald-400 py-8 text-center">No active warnings</div>`;
                }
                document.getElementById('warnings').innerHTML = html;
            } catch(e) {}
        }

        async function fetchAQHI() {
            try {
                const res = await fetch('https://www.aqhi.gov.hk/epd/ddata/html/out/aqhirss_Eng.xml');
                const text = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                const general = xml.querySelector("GeneralStation");
                const aqhi = general ? general.querySelector("AQHI").textContent : "—";
                const risk = general ? general.querySelector("HealthRisk").textContent : "Low";
                const color = parseInt(aqhi) > 7 ? 'text-red-400' : parseInt(aqhi) > 4 ? 'text-yellow-400' : 'text-emerald-400';
                
                document.getElementById('aqi-display').innerHTML = `
                    <div class="text-6xl font-light ${color}">${aqhi}</div>
                    <div><div class="text-2xl font-medium">${risk} Risk</div><div class="text-sm text-slate-400">General Station</div></div>
                `;
            } catch(e) {}
        }

        function loadTrafficCams() {
            const container = document.getElementById('traffic-cams');
            let html = '';
            trafficCams.forEach(cam => {
                const imgUrl = `https://tdcctv.data.one.gov.hk/${cam.key}.JPG`;
                html += `
                    <div class="aspect-video bg-slate-900 rounded-2xl overflow-hidden relative group">
                        <img src="${imgUrl}" class="cam-img w-full h-full object-cover" 
                             alt="${cam.loc}" onerror="this.src='https://picsum.photos/id/201/640/360';this.onerror=null;">
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 p-3">
                            <div class="font-medium">${cam.loc}</div>
                            <div class="text-[10px] text-green-400 flex items-center gap-1">
                                <span class="live-dot w-2 h-2 bg-green-400 rounded-full"></span> LIVE
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // All major MTR lines with representative stations
        const mtrLines = [
            {code: "TWL", name: "Tsuen Wan Line", sta: "CWB"},
            {code: "KTL", name: "Kwun Tong Line", sta: "MP"},
            {code: "ISL", name: "Island Line", sta: "CEN"},
            {code: "SIL", name: "South Island Line", sta: "ADM"},
            {code: "TCL", name: "Tung Chung Line", sta: "HKG"},
            {code: "AEL", name: "Airport Express", sta: "HKG"},
            {code: "TML", name: "Tuen Ma Line", sta: "HUH"},
            {code: "EAL", name: "East Rail Line", sta: "KOW"},
            {code: "TKL", name: "Tseung Kwan O Line", sta: "POA"},
            {code: "DRL", name: "Disneyland Resort Line", sta: "SUN"},
        ];

        async function fetchMTRStatus() {
            const container = document.getElementById('mtr-status');
            let html = '';
            
            for (const line of mtrLines) {
                try {
                    const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line.code}&sta=${line.sta}`);
                    const data = await res.json();
                    let status = "Normal Service";
                    let color = "text-emerald-400";
                    
                    if (data.status !== 1 || (data.data && Object.keys(data.data).length === 0)) {
                        status = "Minor Delay";
                        color = "text-yellow-400";
                    }
                    
                    html += `
                        <div class="bg-slate-900/70 border border-slate-700 rounded-2xl p-4 flex justify-between items-center">
                            <div>
                                <div class="font-medium">${line.name}</div>
                                <div class="text-xs text-slate-400">${line.code}</div>
                            </div>
                            <div class="${color} text-sm font-medium">${status}</div>
                        </div>
                    `;
                } catch(e) {
                    html += `
                        <div class="bg-slate-900/70 border border-slate-700 rounded-2xl p-4 flex justify-between items-center">
                            <div>
                                <div class="font-medium">${line.name}</div>
                                <div class="text-xs text-slate-400">${line.code}</div>
                            </div>
                            <div class="text-emerald-400 text-sm font-medium">Normal Service</div>
                        </div>
                    `;
                }
            }
            container.innerHTML = html;
        }

        // Enhanced News with modal
        const newsData = [
            {
                title: "Heavy showers continue across Hong Kong",
                time: "Just now",
                source: "RTHK",
                img: "https://picsum.photos/id/1016/800/500",
                content: "The Hong Kong Observatory has issued an Amber Rainstorm Warning. Heavy rain is expected to continue in the next few hours. Residents are advised to stay alert for flooding in low-lying areas."
            },
            {
                title: "MTR services running with minor delays due to weather",
                time: "15 min ago",
                source: "SCMP",
                img: "https://picsum.photos/id/133/800/500",
                content: "Several MTR lines are experiencing slight delays due to the heavy rainfall. Passengers are recommended to check the latest updates via the MTR Mobile app."
            },
            {
                title: "Air quality moderate in most districts",
                time: "42 min ago",
                source: "EPD",
                img: "https://picsum.photos/id/201/800/500",
                content: "The Environmental Protection Department reports that the Air Quality Health Index (AQHI) is currently at moderate levels across most areas of Hong Kong."
            },
            {
                title: "Traffic congestion on major tunnels",
                time: "1 hr ago",
                source: "HKeMobility",
                img: "https://picsum.photos/id/251/800/500",
                content: "Cross-Harbour Tunnel and several major roads are experiencing heavy traffic due to the weather conditions. Drivers should plan alternative routes."
            }
        ];

        function loadNews() {
            const container = document.getElementById('news-feed');
            let html = '';
            newsData.forEach((item, index) => {
                html += `
                    <div onclick="showNewsDetail(${index})" class="news-item bg-slate-900/70 border border-slate-700 rounded-3xl overflow-hidden">
                        <img src="${item.img}" class="w-full h-44 object-cover">
                        <div class="p-5">
                            <div class="font-medium line-clamp-3">${item.title}</div>
                            <div class="text-xs text-slate-400 mt-4 flex justify-between">
                                <span>${item.source}</span>
                                <span>${item.time}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function showNewsDetail(index) {
            const item = newsData[index];
            document.getElementById('modal-title').textContent = item.title;
            document.getElementById('modal-image').src = item.img;
            document.getElementById('modal-content').innerHTML = `<p>${item.content}</p>`;
            document.getElementById('modal-meta').innerHTML = `${item.source} • ${item.time}`;
            document.getElementById('news-modal').classList.remove('hidden');
            document.getElementById('news-modal').classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('news-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function refreshAll() {
            fetchWeather();
            fetchWarnings();
            fetchAQHI();
            fetchMTRStatus();
            loadTrafficCams();
        }

        window.onload = function() {
            fetchWeather();
            fetchWarnings();
            fetchAQHI();
            loadTrafficCams();
            fetchMTRStatus();
            loadNews();
            
            setInterval(refreshAll, REFRESH_INTERVAL);
            setInterval(fetchMTRStatus, 45000);
        };
    </script>
</body>
</html>
