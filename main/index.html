<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        
        body { font-family: 'Noto Sans HK', system-ui, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .floating-panel {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.3);
            backdrop-filter: blur(16px);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.98) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
            border-radius: 1.5rem !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        }
        .custom-popup .leaflet-popup-tip { background: rgba(15, 23, 42, 0.98) !important; }
    </style>
</head>
<body class="bg-black text-slate-200 overflow-hidden">
    <div id="map" class="absolute inset-0"></div>

    <div id="top-header" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-slate-900/95 border border-slate-700 rounded-3xl px-8 py-3 flex items-center gap-3 shadow-2xl pointer-events-auto">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            <i class="fas fa-city text-blue-500"></i> 香港實時數據儀表板
        </h1>
    </div>

    <div id="sidebar" class="floating-panel absolute top-24 left-6 w-85 rounded-3xl p-6 z-[1000] shadow-2xl max-h-[85vh] overflow-y-auto transition-all duration-300">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold flex items-center gap-2 text-white">
                <i class="fas fa-cloud-sun text-amber-400"></i> 天文台實時天氣
            </h2>
            <button onclick="toggleSidebarSize()" class="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-xl">
                <i id="size-icon" class="fas fa-chevron-down transition-transform"></i>
            </button>
        </div>

        <div class="flex items-center gap-6 mb-6">
            <div id="main-weather-icon" class="text-6xl">⏳</div>
            <div>
                <div id="main-weather-temp" class="text-5xl font-light text-white">--°C</div>
                <div id="main-weather-desc" class="text-base font-medium text-slate-400">正在加載天氣...</div>
            </div>
        </div>

        <div id="main-weather-details" class="grid grid-cols-2 gap-3 text-xs bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 mb-4">
            <div>相對濕度: <span id="humidity-val" class="font-bold text-white">--</span></div>
            <div>紫外線指數: <span id="uv-val" class="font-bold text-white">--</span></div>
            <div class="border-t border-slate-700/40 pt-2">當日最高: <span id="temp-max" class="font-bold text-rose-400">--</span></div>
            <div class="border-t border-slate-700/40 pt-2">當日最低: <span id="temp-min" class="font-bold text-blue-400">--</span></div>
            <div class="border-t border-slate-700/40 pt-2 col-span-2">
                實時風向: <span id="wind-dir" class="font-bold text-amber-200">--</span> 
                (<span id="wind-speed" class="font-bold text-amber-200">--</span>)
            </div>
        </div>
        <div id="main-weather-update" class="text-xs text-slate-500 mb-6 font-mono"></div>

        <div id="expanded-content" class="space-y-6">
            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-semibold mb-3 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                    <i class="fas fa-triangle-exclamation text-amber-500"></i> 當前天氣警告
                </h3>
                <div id="warnings-list" class="space-y-2"></div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <h3 class="text-sm font-semibold mb-3 tracking-wider uppercase text-slate-400 flex items-center gap-2">
                    <i class="fas fa-layer-group text-blue-500"></i> 數據圖層切換
                </h3>
                <div class="space-y-2">
                    <button id="btn-hospital" onclick="toggleMode('hospital')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-hospital-user text-rose-500"></i> <span class="font-medium text-slate-200">公立醫院急症室等候時間</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-mtr" onclick="toggleMode('mtr')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-subway text-pink-500"></i> <span class="font-medium text-slate-200">港鐵行車狀態</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-traffic" onclick="toggleMode('traffic')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-camera text-emerald-400"></i> <span class="font-medium text-slate-200">實時交通鏡頭 (Live)</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                    <button id="btn-weather-stations" onclick="toggleMode('weather-stations')" class="w-full text-left px-4 py-3 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/40 rounded-2xl flex items-center justify-between transition-all active:scale-[0.98]">
                        <span class="flex items-center gap-3"><i class="fas fa-temperature-half text-orange-400"></i> <span class="font-medium text-slate-200">分區實時天氣觀測</span></span>
                        <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="mtr-panel" class="hidden floating-panel absolute bottom-8 left-[24rem] w-80 rounded-3xl p-5 z-[1000] shadow-2xl max-h-[50vh] overflow-y-auto">
        <h3 class="font-bold text-lg mb-4 text-white border-b border-slate-800 pb-2 flex items-center gap-2">
            <i class="fas fa-subway text-pink-500"></i> 港鐵各綫營運狀態
        </h3>
        <div id="mtr-list" class="space-y-2"></div>
    </div>

    <script>
        let map;
        let trafficMarkers = [];
        let weatherStationMarkers = [];
        let hospitalMarkers = [];
        let activeModes = new Set();
        let sidebarExpanded = true;
        let rawWeatherData = null;

        const hospitalRegistry = { /* 保持不變 */ 
            "東區尤德夫人那打素醫院": { gps: [22.2692, 114.2361], addr: "柴灣樂民道 3 號" },
            "瑪麗醫院": { gps: [22.2706, 114.1313], addr: "薄扶林道 102 號" },
            "律敦治醫院": { gps: [22.2758, 114.1753], addr: "灣仔皇后大道東 266 號" },
            "明愛醫院": { gps: [22.3418, 114.1531], addr: "深水埗永康街 111 號" },
            "廣華醫院": { gps: [22.3153, 114.1725], addr: "油麻地窩打老道 25 號" },
            "伊利沙伯醫院": { gps: [22.3094, 114.1761], addr: "油麻地加士居道 30 號" },
            "基督教聯合醫院": { gps: [22.3222, 114.2347], addr: "觀塘協和街 130 號" },
            "雅麗氏何妙齡那打素醫院": { gps: [22.4583, 114.1747], addr: "大埔全安路 11 號" },
            "北區醫院": { gps: [22.4971, 114.1247], addr: "上水保健路 9 號" },
            "北大嶼山醫院": { gps: [22.2961, 113.9389], addr: "東涌松仁路 8 號" },
            "博愛醫院": { gps: [22.4444, 114.0414], addr: "元朗坳頭" },
            "威爾斯親王醫院": { gps: [22.3811, 114.2025], addr: "沙田銀城街 30-32 號" },
            "瑪嘉烈醫院": { gps: [22.3414, 114.1344], addr: "荔枝角瑪嘉烈醫院道 2-10 號" },
            "天水圍醫院": { gps: [22.4589, 113.9961], addr: "天水圍天壇街 11 號" },
            "將軍澳醫院": { gps: [22.3164, 114.2703], addr: "將軍澳坑口寶寧里 2 號" },
            "屯門醫院": { gps: [22.4081, 113.9753], addr: "屯門青賢街 11 號" },
            "仁濟醫院": { gps: [22.3703, 114.1192], addr: "荃灣仁濟街 7-11 號" },
            "長洲醫院": { gps: [22.2078, 114.0306], addr: "長洲醫院路" }
        };

        function initMap() {
            map = L.map('map', { center: [22.3193, 114.1694], zoom: 11, zoomControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap & CartoDB', maxZoom: 19
            }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        function translateWindDirection(dir) { /* 保持原樣 */ 
            if (!dir) return '微風';
            const d = dir.toUpperCase().trim();
            if (d === 'VARIABLE' || d === 'LIGHT' || d === 'CALM') return '微風';
            return d.replace('NORTH-EAST','東北風').replace('NORTH-WEST','西北風')
                     .replace('SOUTH-EAST','東南風').replace('SOUTH-WEST','西南風')
                     .replace('NORTH','北風').replace('SOUTH','南風')
                     .replace('EAST','東風').replace('WEST','西風');
        }

        async function updateMainWeather() { /* 保持原樣 */ 
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
                rawWeatherData = await res.json();
                // ... (原 updateMainWeather 內容全部保留) ...
                const temp = rawWeatherData.temperature?.data?.find(t => t.place === "Hong Kong Observatory")?.value || '--';
                document.getElementById('main-weather-temp').textContent = `${temp}°C`;
                // 省略完整內容（同你原版一樣），你直接用你原本的 updateMainWeather 即可
                console.log("天氣更新成功");
            } catch(e) { console.error(e); }
        }

        async function updateWarnings() { /* 保持原樣 */ 
            // 同上，直接用你原本的 updateWarnings
        }

        function toggleSidebarSize() { /* 保持原樣 */ }

        // ==================== 修正後醫院急症室 (最重要) ====================
        async function toggleHospital() {
            const btn = document.getElementById('btn-hospital').querySelector('.status-dot');
            if (activeModes.has('hospital')) {
                hospitalMarkers.forEach(m => map.removeLayer(m));
                hospitalMarkers = [];
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('hospital');
                return;
            }

            try {
                const res = await fetch('https://www.ha.org.hk/opendata/aed/aedwtdata2-en.json');
                const data = await res.json();
                
                hospitalMarkers.forEach(m => map.removeLayer(m));
                hospitalMarkers = [];

                data.waitTime.forEach(h => {
                    let matchedName = Object.keys(hospitalRegistry).find(k => 
                        h.hospName.toLowerCase().includes(k.replace('醫院','').toLowerCase()) || 
                        k.toLowerCase().includes(h.hospName.toLowerCase())
                    );

                    if (!matchedName) {
                        const mapEn = {
                            "Pamela Youde": "東區尤德夫人那打素醫院",
                            "Queen Mary": "瑪麗醫院",
                            "Ruttonjee": "律敦治醫院",
                            "Caritas": "明愛醫院",
                            "Kwong Wah": "廣華醫院",
                            "Queen Elizabeth": "伊利沙伯醫院",
                            "United Christian": "基督教聯合醫院",
                            "Alice Ho": "雅麗氏何妙齡那打素醫院",
                            "North District": "北區醫院",
                            "North Lantau": "北大嶼山醫院",
                            "Pok Oi": "博愛醫院",
                            "Prince of Wales": "威爾斯親王醫院",
                            "Princess Margaret": "瑪嘉烈醫院",
                            "Tin Shui Wai": "天水圍醫院",
                            "Tseung Kwan O": "將軍澳醫院",
                            "Tuen Mun": "屯門醫院",
                            "Yan Chai": "仁濟醫院",
                            "St John": "長洲醫院"
                        };
                        for (let [en, cn] of Object.entries(mapEn)) {
                            if (h.hospName.includes(en)) { matchedName = cn; break; }
                        }
                    }

                    const meta = hospitalRegistry[matchedName];
                    if (!meta) return;

                    const waitTime = h.t45p50 || '少於 1 小時';
                    let colorEmoji = '🟢';
                    if (/Over 5|5\s*小時|[6-9]/.test(waitTime)) colorEmoji = '🔴';
                    else if (/4|3\.5|3/.test(waitTime)) colorEmoji = '🟠';
                    else if (/2|1\.5/.test(waitTime)) colorEmoji = '🟡';

                    const icon = L.divIcon({
                        html: `<div class="bg-slate-900/90 border border-slate-700/60 w-9 h-9 rounded-full shadow-2xl flex items-center justify-center text-2xl transition-transform hover:scale-125">${colorEmoji}</div>`,
                        iconSize: [36, 36], iconAnchor: [18, 18]
                    });

                    const m = L.marker(meta.gps, { icon }).addTo(map);
                    m.bindPopup(`
                        <div class="w-72 p-3 text-slate-200">
                            <h3 class="font-bold text-lg">${matchedName}</h3>
                            <div class="text-xs text-slate-400">${meta.addr}</div>
                            <div class="mt-4 bg-slate-800/70 p-4 rounded-2xl">
                                <div class="text-xs text-slate-400">最長等候 (IV & V)</div>
                                <div class="flex items-center gap-3 mt-1">
                                    <span class="text-3xl">${colorEmoji}</span>
                                    <span class="text-2xl font-bold text-amber-300">${waitTime}</span>
                                </div>
                            </div>
                            <div class="text-[10px] text-slate-500 mt-3">更新: ${data.updateTime || '最新'}</div>
                        </div>
                    `, { className: 'custom-popup' });

                    hospitalMarkers.push(m);
                });

                btn.className = "fas fa-circle text-xs text-rose-500 status-dot";
                activeModes.add('hospital');
            } catch (e) {
                console.error(e);
                alert("無法取得急症室數據");
            }
        }

        // ==================== 其他功能 (完整保留) ====================
        function toggleMTR() { /* 你原本的 toggleMTR 完整代碼 */ 
            const el = document.getElementById('mtr-panel');
            const btn = document.getElementById('btn-mtr').querySelector('.status-dot');
            if (activeModes.has('mtr')) {
                el.classList.add('hidden');
                btn.className = "fas fa-circle text-xs text-slate-600 status-dot";
                activeModes.delete('mtr');
                return;
            }
            // ... 你的 MTR lines array 同 html 生成 ...
            // (直接貼返你原本 toggleMTR 內容)
            el.classList.remove('hidden');
            btn.className = "fas fa-circle text-xs text-pink-500 status-dot";
            activeModes.add('mtr');
        }

        async function toggleTraffic() { /* 你原本完整 toggleTraffic */ }
        function toggleWeatherStations() { /* 你原本完整 toggleWeatherStations */ }
        function renderWeatherStations() { /* 你原本完整 renderWeatherStations */ }

        function toggleMode(mode) {
            if (mode === 'hospital') toggleHospital();
            else if (mode === 'mtr') toggleMTR();
            else if (mode === 'traffic') toggleTraffic();
            else if (mode === 'weather-stations') toggleWeatherStations();
        }

        window.onload = function() {
            initMap();
            updateMainWeather();
            updateWarnings();
            setInterval(updateMainWeather, 180000);
            setInterval(updateWarnings, 120000);
        };
    </script>
</body>
</html>
