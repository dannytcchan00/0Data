<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港實時智慧城市儀表板 - 終極修正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #0b1329; }
        #map { height: 100vh; width: 100%; }
        .floating-panel {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
        }
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.98) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(148, 163, 184, 0.25) !important;
            border-radius: 1.25rem !important;
            padding: 6px;
        }
        .custom-popup .leaflet-popup-tip { background: rgba(15, 23, 42, 0.98) !important; }
    </style>
</head>
<body class="text-slate-200 overflow-hidden">

    <div id="map" class="absolute inset-0"></div>

    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-slate-900/95 border border-slate-700/60 rounded-2xl px-6 py-2 flex flex-col items-center shadow-2xl pointer-events-auto">
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fas fa-server text-blue-500"></i> 香港智慧城市實時儀表板
        </h1>
    </div>

    <div id="sidebar" class="floating-panel absolute top-24 left-6 w-96 rounded-2xl p-5 z-[1000] shadow-2xl max-h-[85vh] overflow-y-auto">
        
        <div class="mb-4">
            <h2 class="text-base font-bold text-white flex items-center gap-1.5"><i class="fas fa-cloud-sun text-amber-400"></i> 天文台大盤天氣</h2>
            <div class="flex items-center gap-5 mt-2 bg-slate-950/40 border border-slate-800/60 rounded-2xl p-3">
                <div id="main-weather-icon" class="text-4xl">⏳</div>
                <div>
                    <div id="main-weather-temp" class="text-3xl font-bold text-white font-mono">--°C</div>
                    <div id="main-weather-desc" class="text-xs text-slate-400">數據加載中...</div>
                </div>
            </div>
        </div>

        <div class="space-y-3 pt-3 border-t border-slate-800">
            <h3 class="text-[11px] font-bold text-slate-400 tracking-wider uppercase font-mono">功能圖層切換</h3>
            
            <button onclick="toggleMode('hospital')" id="btn-hospital" class="w-full text-left px-4 py-3 bg-slate-800/40 hover:bg-slate-800 border border-slate-700/30 rounded-xl flex items-center justify-between transition-all">
                <span class="text-xs font-bold flex items-center gap-2"><i class="fas fa-hospital text-rose-500"></i> 公立醫院急症室輪候時間</span>
                <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
            </button>

            <button onclick="toggleMode('weather-stations')" id="btn-weather-stations" class="w-full text-left px-4 py-3 bg-slate-800/40 hover:bg-slate-800 border border-slate-700/30 rounded-xl flex items-center justify-between transition-all">
                <span class="text-xs font-bold flex items-center gap-2"><i class="fas fa-temperature-high text-sky-400"></i> 分區自動氣象觀測站</span>
                <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
            </button>

            <button onclick="toggleMode('mtr')" id="btn-mtr" class="w-full text-left px-4 py-3 bg-slate-800/40 hover:bg-slate-800 border border-slate-700/30 rounded-xl flex items-center justify-between transition-all">
                <span class="text-xs font-bold flex items-center gap-2"><i class="fas fa-subway text-pink-500"></i> MTR 港鐵即時運行狀態</span>
                <div class="flex items-center gap-2">
                    <span id="mtr-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300">檢測中</span>
                    <i class="fas fa-circle text-xs text-slate-600 status-dot"></i>
                </div>
            </button>
        </div>

        <div id="mtr-detail-box" class="mt-3 p-3 bg-slate-950/60 border border-slate-800 rounded-xl hidden text-xs">
            <h4 class="font-bold text-pink-400 mb-2 flex items-center gap-1"><i class="fas fa-info-circle"></i> 車務實時通報</h4>
            <div id="mtr-news-content" class="text-slate-300 leading-relaxed space-y-1">正在獲取港鐵最新車務狀況...</div>
        </div>
    </div>

    <script>
        let map;
        let activeModes = new Set();
        let layers = { hospital: L.layerGroup(), weatherStations: L.layerGroup() };
        
        // 全域快取，避免重複 Fetch 導致速度變慢
        let cachedWeatherData = null;
        let globalHumidity = '--';
        let globalMaxTemp = '--';
        let globalMinTemp = '--';
        let globalWindDir = '微風';
        let globalWindSpeed = '0 km/h';

        // 氣象站座標
        const stationCoords = {
            "香港天文台": [22.3022, 114.1742], "京士柏": [22.3119, 114.1728], "黃竹坑": [22.2478, 114.1667],
            "打鼓嶺": [22.5286, 114.1567], "流浮山": [22.4689, 113.9836], "大埔": [22.4461, 114.1789],
            "沙田": [22.4025, 114.2100], "屯門": [22.3916, 113.9767], "將軍澳": [22.3156, 114.2614],
            "西貢": [22.3836, 114.2708], "赤鱲角": [22.3094, 113.9219], "青衣": [22.3453, 114.1044],
            "荃灣城門谷": [22.3756, 114.1256], "香港公園": [22.2778, 114.1622], "筲箕灣": [22.2756, 114.2256], "九龍城": [22.3278, 114.1900]
        };

        // 醫院完整靜態資料庫（補齊電話、地址）
        const hospitalRegistry = {
            "東區尤德夫人那打素醫院": { gps: [22.2692, 114.2361], addr: "柴灣樂民道 3 號", tel: "2595 6111" },
            "瑪麗醫院": { gps: [22.2706, 114.1313], addr: "薄扶林道 102 號", tel: "2255 3838" },
            "律敦治醫院": { gps: [22.2758, 114.1753], addr: "灣仔皇后大道東 266 號", tel: "2291 2000" },
            "明愛醫院": { gps: [22.3418, 114.1531], addr: "深水埗永康街 111 號", tel: "3408 7911" },
            "廣華醫院": { gps: [22.3153, 114.1725], addr: "油麻地窩打老道 25 號", tel: "2332 8111" },
            "伊利沙伯醫院": { gps: [22.3094, 114.1761], addr: "油麻地加士居道 30 號", tel: "2958 8888" },
            "基督教聯合醫院": { gps: [22.3222, 114.2347], addr: "觀塘協和街 130 號", tel: "3949 4000" },
            "瑪嘉烈醫院": { gps: [22.3414, 114.1344], addr: "荔枝角瑪嘉烈醫院道 2-10 號", tel: "2990 1111" },
            "仁濟醫院": { gps: [22.3703, 114.1192], addr: "荃灣仁濟街 7-11 號", tel: "2417 8383" },
            "屯門醫院": { gps: [22.4081, 113.9753], addr: "屯門青松觀路 23 號", tel: "2468 5111" },
            "博愛醫院": { gps: [22.4444, 114.0414], addr: "元朗坳頭", tel: "2486 8000" },
            "天水圍醫院": { gps: [22.4589, 113.9961], addr: "天水圍天壇街 11 號", tel: "3991 1111" },
            "威爾斯親王醫院": { gps: [22.3811, 114.2025], addr: "沙田銀城街 30-32 號", tel: "3505 2211" },
            "雅麗氏何妙齡那打素醫院": { gps: [22.4583, 114.1747], addr: "大埔全安路 11 號", tel: "2689 2000" },
            "北區醫院": { gps: [22.4971, 114.1247], addr: "上水保健路 9 號", tel: "2683 2222" },
            "將軍澳醫院": { gps: [22.3164, 114.2703], addr: "將軍澳坑口寶寧里 2 號", tel: "2208 0111" },
            "北大嶼山醫院": { gps: [22.2961, 113.9389], addr: "東涌松仁路 8 號", tel: "3467 7000" },
            "長洲醫院": { gps: [22.2078, 114.0306], addr: "長洲醫院路", tel: "2981 0378" }
        };

        function initMap() {
            map = L.map('map', { center: [22.3220, 114.1700], zoom: 11, zoomControl: false });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        // 超高速極簡安全請求器 (直接返回目標 JSON 內容，不再層層包裹)
        async function fetchFast(url) {
            const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
            if (!res.ok) throw new Error("Network error");
            return await res.json();
        }

        // 1. 預載並更新主天氣數據（優化速度核心）
        async function loadWeatherData() {
            try {
                const data = await fetchFast('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                cachedWeatherData = data;

                // 解析全域變數提供給分區氣象站Popup
                globalHumidity = `${data.humidity?.data?.[0]?.value || '--'}%`;
                const wind = data.wind || {};
                globalWindDir = wind.direction || '微風';
                globalWindSpeed = wind.speed ? `${wind.speed} ${wind.unit || 'km/h'}` : '0 km/h';

                if(data.temperature?.data) {
                    const temps = data.temperature.data.map(d => parseFloat(d.value)).filter(v => !isNaN(v));
                    globalMaxTemp = `${Math.max(...temps)}°C`;
                    globalMinTemp = `${Math.min(...temps)}°C`;
                }

                // 更新左側大盤面板
                const obsTemp = data.temperature?.data?.find(t => t.place === "香港天文台")?.value;
                if (obsTemp) document.getElementById('main-weather-temp').textContent = `${obsTemp}°C`;
                document.getElementById('main-weather-desc').textContent = data.natureDescription || "大體天晴";
                document.getElementById('main-weather-icon').textContent = "🌤️";

                // 如果氣象站圖層開著，即時重繪
                if (activeModes.has('weather-stations')) renderWeatherStations();
            } catch(e) { console.error("天氣預載失敗:", e); }
        }

        // 2. 🌤️ 渲染分區自動氣象站 (記憶體快取秒開版)
        function renderWeatherStations() {
            layers.weatherStations.clearLayers();
            if (!cachedWeatherData?.temperature?.data) return;

            cachedWeatherData.temperature.data.forEach(item => {
                const gps = stationCoords[item.place];
                if (!gps) return;

                const tempNum = parseFloat(item.value);
                let markerColor = '#38bdf8';
                if (tempNum >= 33) markerColor = '#ef4444';
                else if (tempNum >= 28) markerColor = '#f59e0b';
                else if (tempNum >= 18) markerColor = '#10b981';

                const marker = L.circleMarker(gps, {
                    radius: 12, fillColor: markerColor, color: '#ffffff', weight: 1.5, fillOpacity: 0.85
                });

                // 按要求完整包含：即時氣溫、濕度、最高氣溫、最低氣溫、風向、風速
                marker.bindPopup(`
                    <div class="w-56 font-sans text-slate-200 p-1 text-xs">
                        <div class="border-b border-slate-700 pb-1.5 mb-2">
                            <h4 class="font-bold text-white text-sm flex items-center gap-1"><i class="fas fa-location-dot text-sky-400"></i> ${item.place}測站</h4>
                        </div>
                        <div class="space-y-1.5">
                            <div class="flex justify-between bg-slate-900 px-2 py-1 rounded"><span>即時氣溫:</span><span class="text-orange-400 font-bold">${item.value}°C</span></div>
                            <div class="flex justify-between px-1"><span>相對濕度:</span><span class="text-white font-semibold">${globalHumidity}</span></div>
                            <div class="flex justify-between px-1"><span>今日最高:</span><span class="text-rose-400 font-medium">${globalMaxTemp}</span></div>
                            <div class="flex justify-between px-1"><span>今日最低:</span><span class="text-blue-400 font-medium">${globalMinTemp}</span></div>
                            <div class="flex justify-between px-1"><span>實時風向:</span><span class="text-teal-300">${globalWindDir}</span></div>
                            <div class="flex justify-between px-1"><span>實時風速:</span><span class="text-teal-300 font-mono">${globalWindSpeed}</span></div>
                        </div>
                    </div>`, { className: 'custom-popup' });
                
                layers.weatherStations.addLayer(marker);
            });
        }

        // 3. 🏥 渲染公立醫院急症室輪候數據
        async function loadHospitals() {
            layers.hospital.clearLayers();
            try {
                // 使用真實有數據的醫管局開放端點
                const data = await fetchFast('https://www.ha.org.hk/opendata/aed/aedwtdata2-tc.json');
                
                data.waitTime.forEach(h => {
                    const meta = hospitalRegistry[h.hospName];
                    if (!meta) return;

                    const waitStr = h.topWait || '少於 1 小時';
                    let dotColor = '#10b981';
                    if (waitStr.includes('超過 5') || waitStr.includes('超過 4')) dotColor = '#ef4444';
                    else if (waitStr.includes('超過 2') || waitStr.includes('超過 3')) dotColor = '#f59e0b';

                    const icon = L.divIcon({
                        html: `<div style="background:${dotColor}" class="w-6 h-6 rounded-full border-2 border-white shadow-xl flex items-center justify-center text-[10px] text-white font-bold"><i class="fas fa-plus-medical"></i></div>`,
                        className: '', iconSize: [24, 24]
                    });

                    const marker = L.marker(meta.gps, { icon: icon });
                    
                    // 按要求完整包含：醫院名稱、地址、電話、各個 Level 等候時間
                    marker.bindPopup(`
                        <div class="w-64 text-xs p-1 text-slate-200">
                            <div class="border-b border-slate-700 pb-1.5 mb-2">
                                <h4 class="font-bold text-white text-sm">${h.hospName}</h4>
                                <div class="text-[10px] text-slate-400 mt-0.5"><i class="fas fa-map-marker-alt text-rose-400 mr-1"></i>${meta.addr}</div>
                                <div class="text-[10px] text-slate-400 mt-0.5"><i class="fas fa-phone text-sky-400 mr-1"></i>電話: ${meta.tel}</div>
                            </div>
                            <div class="space-y-1 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold mb-1 border-b border-slate-800 pb-0.5">各分流類別 (Triage Level) 預計等候：</div>
                                <div class="flex justify-between text-[11px]"><span>Level 1 (危急):</span><span class="text-emerald-400 font-bold">即時處理</span></div>
                                <div class="flex justify-between text-[11px]"><span>Level 2 (緊急):</span><span class="text-emerald-400 font-bold">&lt; 15 分鐘</span></div>
                                <div class="flex justify-between text-[11px]"><span>Level 3 (次緊急):</span><span class="text-amber-400 font-medium">緊密分流中</span></div>
                                <div class="flex justify-between bg-slate-950 p-1.5 rounded mt-1 font-bold">
                                    <span class="text-slate-300">Level 4 & 5 (非緊急):</span>
                                    <span class="text-amber-300">${waitStr}</span>
                                </div>
                            </div>
                        </div>`, { className: 'custom-popup' });
                    layers.hospital.addLayer(marker);
                });
            } catch(e) { 
                console.error("醫院數據加載失敗:", e);
                alert("無法連線至醫管局數據接口，請稍後再試。"); 
            }
        }

        // 4. 🚇 MTR 港鐵實時運行狀態對接引擎
        async function updateMTRStatus() {
            const badge = document.getElementById('mtr-badge');
            const newsContent = document.getElementById('mtr-news-content');
            try {
                const data = await fetchFast('https://rt.data.gov.hk/v1/transport/mtr/chp/getLatestNews');
                
                if (data && data.length > 0) {
                    // 有故障或特殊車務通報
                    badge.textContent = "有通報";
                    badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-red-600 text-white font-bold animate-pulse";
                    
                    let html = "";
                    data.forEach(news => {
                        html += `<div class="border-b border-slate-800 pb-1 mb-1 text-rose-300 font-medium">• ${news.description || news.title}</div>`;
                    });
                    newsContent.innerHTML = html;
                } else {
                    // 營運正常
                    badge.textContent = "正常";
                    badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-emerald-600 text-white font-bold";
                    newsContent.innerHTML = `<div class="text-emerald-400 flex items-center gap-1.5 py-1"><i class="fas fa-check-circle"></i> 所有鐵路綫現時運作正常。</div>`;
                }
            } catch(e) {
                badge.textContent = "未知";
                newsContent.innerHTML = "暫時無法取得港鐵即時車務狀態。";
            }
        }

        // 中央開關調度器
        function toggleMode(mode) {
            const btn = document.getElementById(`btn-${mode}`);
            const dot = btn.querySelector('.status-dot');
            
            if (activeModes.has(mode)) {
                activeModes.delete(mode);
                dot.className = "fas fa-circle text-xs text-slate-600 status-dot";
                
                if (mode === 'hospital') map.removeLayer(layers.hospital);
                if (mode === 'weather-stations') map.removeLayer(layers.weatherStations);
                if (mode === 'mtr') document.getElementById('mtr-detail-box').classList.add('hidden');
            } else {
                activeModes.add(mode);
                if (mode === 'hospital') {
                    dot.className = "fas fa-circle text-xs text-rose-500 status-dot";
                    loadHospitals();
                    map.addLayer(layers.hospital);
                }
                if (mode === 'weather-stations') {
                    dot.className = "fas fa-circle text-xs text-sky-400 status-dot";
                    renderWeatherStations();
                    map.addLayer(layers.weatherStations);
                }
                if (mode === 'mtr') {
                    dot.className = "fas fa-circle text-xs text-pink-500 status-dot";
                    document.getElementById('mtr-detail-box').classList.remove('hidden');
                    updateMTRStatus();
                }
            }
        }

        // 網頁進入點
        window.onload = function() {
            initMap();
            // 立即執行高優先級初始數據載入
            loadWeatherData();
            updateMTRStatus();
            
            // 設定背景自動定時重新整理（每3分鐘）
            setInterval(loadWeatherData, 180000);
            setInterval(updateMTRStatus, 120000);
        };
    </script>
</body>
</html>
