<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱帶氣旋預測路徑</title>
    <style>
        body {
            margin: 0;
            padding: 0px;
            background-color: #333; /* 暗色背景，令張圖更突出 */
            display: flex;
            justify-content: center;
        }
        .map-container img {
            max-width: 100%; /* 確保張圖唔會超出螢幕闊度 */
            width: 1300px;    /* 你可以自由修改呢度，例如改做 600px 縮得更細 */
            height: auto;
            border-radius: 8px; /* 加少少圓角靚啲 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="map-container">
        <!-- 呢度放返你原本張圖嘅 Link -->
        <img src="https://www.smca.fun/assets/image/TC_Forecast/TRACK_COLLECTION/track_collection.png" alt="熱帶氣旋路徑圖">
    </div>
</body>
</html>
