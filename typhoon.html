<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱帶氣旋預測路徑</title>
    <style>
        /* 清除網頁預設嘅白邊 */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000; /* 黑色背景，如果螢幕比例唔同，留黑邊會好睇啲 */
            height: 100%;
            overflow: hidden; /* 隱藏捲動條，做到完全 App 嘅效果 */
        }

        .map-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-container img {
            width: 100%;
            height: 100%;
            /* 
               object-fit: contain; -> 張圖會盡量放大，但保證睇得齊全幅圖（可能會留黑邊）
               如果你想張圖完全填滿個芒，連黑邊都唔要（但可能會切走部分地圖），可以改做 object-fit: cover;
            */
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <div class="map-container">
        <img src="https://www.smca.fun/assets/image/TC_Forecast/TRACK_COLLECTION/track_collection.png" alt="熱帶氣旋路徑圖">
    </div>
</body>
</html>
