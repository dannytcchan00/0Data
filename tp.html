<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天文台實時颱風地圖 (終極暗黑版)</title>
    <!-- Leaflet 地圖庫 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* 地圖容器：永遠顯示在底層 */
        #map {
            width: 100%; 
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* 冇颱風時嘅置中浮動框 */
        #no-typhoon-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.85);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #444;
            z-index: 2000;
            width: 80%;
            max-width: 350px;
            backdrop-filter: blur(5px);
            display: none; 
        }
        #no-typhoon-center h1 { color: #2ecc71; margin: 0 0 10px 0; font-size: 24px; }
        #no-typhoon-center p { color: #bbb; font-size: 15px; margin: 0; }

        /* 載入中提示 */
        #loading {
            position: absolute; 
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px; 
            z-index: 3000;
            color: #fff;
        }

        /* 地圖 Popup 彈出框暗黑化 */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #555;
        }
        .typhoon-info { font-size: 14px; line-height: 1.6; min-width: 220px; }
        .typhoon-info h3 { 
            color: #ff5252; 
            margin: 0 0 10px 0; 
            font-size: 18px; 
            border-bottom: 1px solid #555; 
            padding-bottom: 8px;
        }
        .typhoon-info strong { color: #9bbbdc; }
    </style>
</head>
<body>

    <!-- 載入中 -->
    <div id="loading">📡 正在連接香港天文台...</div>

    <!-- 地圖永遠做底板 -->
    <div id="map"></div>

    <!-- 冇颱風時嘅浮動框 -->
    <div id="no-typhoon-center">
        <h1>🍃 天氣平靜</h1>
        <p>目前香港天文台並無活躍熱帶氣旋數據。</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 初始化暗黑地圖
        const map = L.map('map').setView([22.3193, 114.1694], 5);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const typhoonLayer = L.layerGroup().addTo(map);

        // 天文台即時熱帶氣旋 API (如無颱風，此檔案通常會被天文台隱藏)
        const hkoTrackApi = 'https://data.weather.gov.hk/weatherAPI/tc/tc.json';

        // 簡化顯示「無風」框嘅動作
        function showNoTyphoon() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('no-typhoon-center').style.display = 'block';
            document.getElementById('no-typhoon-center').innerHTML = `
                <h1>🍃 天氣平靜</h1>
                <p>目前香港天文台並無活躍熱帶氣旋數據。</p>
            `;
        }

        // 2. 獲取並處理數據
        async function fetchHKOTyphoon() {
            try {
                const response = await fetch(hkoTrackApi);
                
                // 如果 API 回傳 404 搵唔到檔案，直接當作無颱風處理
                if (!response.ok) {
                    showNoTyphoon();
                    return;
                }

                const data = await response.json();
                typhoonLayer.clearLayers();
                document.getElementById('loading').style.display = 'none';

                // 如果 JSON 內無熱帶氣旋資料，亦當作無颱風
                if (!data || !data.tc_data || data.tc_data.length === 0) {
                    showNoTyphoon();
                    return;
                }

                // 成功獲取颱風數據：隱藏無風提示框
                document.getElementById('no-typhoon-center').style.display = 'none';

                // 畫出路徑同埋資訊點
                data.tc_data.forEach(typhoon => {
                    const nameTc = typhoon.name_tc || "未命名";
                    const trackPoints = typhoon.track || [];
                    if (trackPoints.length === 0) return;

                    let lineCoords = [];

                    trackPoints.forEach((point, index) => {
                        const lat = point.lat;
                        const lon = point.lon;
                        lineCoords.push([lat, lon]);

                        const isCurrent = index === trackPoints.length - 1;
                        
                        const marker = L.circleMarker([lat, lon], {
                            radius: isCurrent ? 8 : 4,
                            fillColor: isCurrent ? "#ff5252" : (point.is_forecast === "true" ? "#f1c40f" : "#e67e22"),
                            color: "#fff",
                            weight: isCurrent ? 2 : 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });

                        const timeStr = point.time || "未知時間";
                        const classTc = point.class_tc || "熱帶氣旋";
                        const maxWind = point.max_wind ? point.max_wind + " km/h" : "未提供";
                        const pressure = point.min_pressure ? point.min_pressure + " hPa" : "未提供";
                        
                        let statusText = point.is_forecast === "true" ? "【預測位置】" : "【實際位置】";
                        if (isCurrent) statusText = "【當前最新位置】";

                        const popupHtml = `
                            <div class="typhoon-info">
                                <h3>🌀 ${nameTc}</h3>
                                <p style="color:#e67e22; font-weight:bold; margin:5px 0;">${statusText}</p>
                                <p><strong>級別：</strong> ${classTc}</p>
                                <p><strong>中心風力：</strong> ${maxWind}</p>
                                <p><strong>中心氣壓：</strong> ${pressure}</p>
                                <p><strong>時間：</strong> ${timeStr}</p>
                            </div>
                        `;
                        marker.bindPopup(popupHtml);
                        marker.addTo(typhoonLayer);
                    });

                    // 畫線
                    if (lineCoords.length > 1) {
                        L.polyline(lineCoords, {
                            color: '#f39c12',
                            weight: 2,
                            opacity: 0.6,
                            dashArray: '5, 5'
                        }).addTo(typhoonLayer);
                    }
                });

            } catch (error) {
                // 【核心改動】：發生任何錯誤 (包括 CORS 阻截、斷網、檔案下架)，
                // 一律將錯就錯，判定為「目前無颱風」，只顯示置中框。
                console.log("天文台數據不存在或無法連線，判定為無颱風狀態。");
                showNoTyphoon();
            }
        }

        // 啟動程式
        fetchHKOTyphoon();
        // 每 5 分鐘自動刷新
        setInterval(fetchHKOTyphoon, 300000);

    </script>
</body>
</html>
