<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天文台實時颱風地圖 (暗黑修正版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow: hidden;
        }

        #map {
            width: 100%; 
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        #no-typhoon-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.85);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #444;
            z-index: 2000;
            width: 80%;
            max-width: 350px;
            backdrop-filter: blur(5px);
            display: none; 
        }
        #no-typhoon-center h1 { color: #2ecc71; margin: 0 0 10px 0; font-size: 24px; }
        #no-typhoon-center p { color: #bbb; font-size: 15px; margin: 0; }

        #loading {
            position: absolute; 
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px; 
            z-index: 3000;
            color: #fff;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #555;
        }
        .typhoon-info { font-size: 14px; line-height: 1.6; min-width: 220px; }
        .typhoon-info h3 { 
            color: #ff5252; 
            margin: 0 0 10px 0; 
            font-size: 18px; 
            border-bottom: 1px solid #555; 
            padding-bottom: 8px;
        }
        .typhoon-info strong { color: #9bbbdc; }
    </style>
</head>
<body>

    <div id="loading">📡 正在連接香港天文台...</div>
    <div id="map"></div>

    <div id="no-typhoon-center">
        <h1>🍃 天氣平靜</h1>
        <p>目前香港天文台並無活躍熱帶氣旋數據。</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([22.3193, 114.1694], 5);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const typhoonLayer = L.layerGroup().addTo(map);
        
        // 採用最穩定嘅香港天文台 Open Data 軌跡 API
        const hkoTrackApi = 'https://data.weather.gov.hk/weatherAPI/opendata/opendata.php?dataType=tc&lang=tc';

        async function fetchHKOTyphoon() {
            try {
                const response = await fetch(hkoTrackApi);
                
                // 【核心修正】唔好直接 parse JSON，先攞純文字出嚟檢查
                const textData = await response.text();
                
                typhoonLayer.clearLayers();
                document.getElementById('loading').style.display = 'none';

                // 如果天文台回傳空值，或者回傳 HTML 錯誤頁，即代表無颱風數據
                if (!textData || textData.trim() === "" || textData.startsWith("<")) {
                    showNoTyphoon();
                    return;
                }

                let data;
                try {
                    // 嘗試安全地將純文字轉化為 JSON 格式
                    data = JSON.parse(textData);
                } catch (e) {
                    // 如果轉換失敗 (例如天文台俾咗句 plain text 話無風)，直接顯示無颱風框
                    showNoTyphoon();
                    return;
                }

                if (!data || !data.tc_data || data.tc_data.length === 0) {
                    showNoTyphoon();
                    return;
                }

                // 隱藏無風提示框
                document.getElementById('no-typhoon-center').style.display = 'none';

                // 畫出所有颱風
                data.tc_data.forEach(typhoon => {
                    const nameTc = typhoon.name_tc || "未命名氣旋";
                    const trackPoints = typhoon.track || [];
                    if (trackPoints.length === 0) return;

                    let lineCoords = [];

                    trackPoints.forEach((point, index) => {
                        const lat = point.lat;
                        const lon = point.lon;
                        lineCoords.push([lat, lon]);

                        const isCurrent = index === trackPoints.length - 1;
                        
                        const marker = L.circleMarker([lat, lon], {
                            radius: isCurrent ? 8 : 4,
                            fillColor: isCurrent ? "#ff5252" : (point.is_forecast === "true" ? "#f1c40f" : "#e67e22"),
                            color: "#fff",
                            weight: isCurrent ? 2 : 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });

                        const timeStr = point.time || "未知時間";
                        const classTc = point.class_tc || "熱帶氣旋";
                        const maxWind = point.max_wind ? point.max_wind + " km/h" : "未提供";
                        const pressure = point.min_pressure ? point.min_pressure + " hPa" : "未提供";
                        
                        let statusText = point.is_forecast === "true" ? "【預測位置】" : "【實際位置】";
                        if (isCurrent) statusText = "【當前最新位置】";

                        const popupHtml = `
                            <div class="typhoon-info">
                                <h3>🌀 ${nameTc}</h3>
                                <p style="color:#e67e22; font-weight:bold; margin:5px 0;">${statusText}</p>
                                <p><strong>級別：</strong> ${classTc}</p>
                                <p><strong>中心風力：</strong> ${maxWind}</p>
                                <p><strong>中心氣壓：</strong> ${pressure}</p>
                                <p><strong>時間：</strong> ${timeStr}</p>
                            </div>
                        `;
                        marker.bindPopup(popupHtml);
                        marker.addTo(typhoonLayer);
                    });

                    if (lineCoords.length > 1) {
                        L.polyline(lineCoords, {
                            color: '#f39c12',
                            weight: 2,
                            opacity: 0.6,
                            dashArray: '5, 5'
                        }).addTo(typhoonLayer);
                    }
                });

            } catch (error) {
                console.error("無法連線:", error);
                document.getElementById('loading').style.display = 'none';
                // 就算真係斷網，都溫和地顯示置中框
                showNoTyphoon();
                document.getElementById('no-typhoon-center').innerHTML = `
                    <h1 style="color:#e74c3c;">連線中斷</h1>
                    <p>暫時無法連接香港天文台，系統稍後將自動重試。</p>
                `;
            }
        }

        // 簡化顯示「無風」框嘅動作
        function showNoTyphoon() {
            document.getElementById('no-typhoon-center').style.display = 'block';
            document.getElementById('no-typhoon-center').innerHTML = `
                <h1>🍃 天氣平靜</h1>
                <p>目前香港天文台並無活躍熱帶氣旋數據。</p>
            `;
        }

        fetchHKOTyphoon();
        setInterval(fetchHKOTyphoon, 300000);

    </script>
</body>
</html>
