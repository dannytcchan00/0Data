<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時颱風追蹤系統 (自建 API 版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #121212; 
            font-family: 'PingFang HK', 'Heiti TC', sans-serif; 
            color: #e0e0e0;
        }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        #dashboard { 
            position: absolute; top: 20px; right: 20px; width: 340px; 
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); 
            padding: 20px; border-radius: 12px; z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #333; 
        }
        h1 { font-size: 18px; margin-top: 0; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        .status-container { margin-bottom: 15px; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 8px;}
        .online { background-color: #00e676; box-shadow: 0 0 8px #00e676; }
        .offline { background-color: #ff1744; box-shadow: 0 0 8px #ff1744; }
        .waiting { background-color: #ff9100; box-shadow: 0 0 8px #ff9100; }
        
        #typhoon-list { font-size: 14px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
        .typhoon-item { background: #2a2a2a; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #ff9800; }
        .typhoon-name { font-weight: bold; color: #ffb74d; }
        
        .note { font-size: 12px; color: #888; line-height: 1.5; margin-top: 15px; }
        
        .typhoon-icon { font-size: 24px; text-align: center; animation: spin 2s linear infinite; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="map"></div>

<div id="dashboard">
    <h1>🌀 實時颱風追蹤 (JMA)</h1>
    <div class="status-container">
        <span class="indicator waiting" id="api-status"></span>
        <span id="status-text">連線中...</span>
    </div>
    
    <div id="typhoon-list">
        正在讀取數據...
    </div>

    <p class="note">
        圖例說明：<br>
        🌀 當前位置 (紅圈為強風半徑)<br>
        📍 預測點 (每12/24小時)<br>
        --- 預測移動路徑
    </p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([15.0, 130.0], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    let typhoonLayerGroup = L.layerGroup().addTo(map);

    const typhoonIcon = L.divIcon({
        className: 'typhoon-icon',
        html: '🌀',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
    });

    function parseJMACoord(coordStr) {
        if (!coordStr) return null;
        const parts = coordStr.split(/[+-]/).filter(p => p !== "" && p !== "/");
        if (parts.length >= 2) {
            let latStr = (coordStr.startsWith('-') ? '-' : '') + parts[0];
            let lonStr = (coordStr.includes('+', 1) ? '' : '-') + parts[1];
            return [parseFloat(latStr), parseFloat(lonStr)];
        }
        return null;
    }

    async function fetchJMATyphoons() {
        const statusIcon = document.getElementById('api-status');
        const statusText = document.getElementById('status-text');
        const listContainer = document.getElementById('typhoon-list');
        
        try {
            statusIcon.className = 'indicator waiting';
            statusText.innerText = '讀取數據中...';
            
            // 【關鍵修改】改為讀取你自己 Server 提供嘅 API
            // 如果你 Server 放喺其他 Domain，請將 localhost 換成你嘅 Domain
            const myApiUrl = 'http://localhost:3000/api/jma/tc'; 
            
            const dirResponse = await fetch(myApiUrl);
            if (!dirResponse.ok) throw new Error("無法讀取自建 API");
            const activeTyphoons = await dirResponse.json();

            typhoonLayerGroup.clearLayers();
            listContainer.innerHTML = '';

            if (activeTyphoons.length === 0) {
                statusIcon.className = 'indicator online';
                statusText.innerText = '系統正常 (無活躍颱風)';
                listContainer.innerHTML = '<div style="color:#aaa;">當前西太平洋未有活躍熱帶氣旋</div>';
                return;
            }

            statusText.innerText = `發現 ${activeTyphoons.length} 個系統，載入詳情...`;
            statusIcon.className = 'indicator online';

            for (const ty of activeTyphoons) {
                try {
                    let currentCoord = parseJMACoord(ty.center ? ty.center.coordinate : null);
                    let tyName = ty.name ? ty.name.text : (ty.typhoonNo ? `颱風 ${ty.typhoonNo}` : "熱帶氣旋");
                    let hpa = ty.center ? ty.center.pressure : "未知";
                    
                    if (currentCoord) {
                        listContainer.innerHTML += `
                            <div class="typhoon-item">
                                <span class="typhoon-name">${tyName}</span><br>
                                中心氣壓: ${hpa} hPa<br>
                                位置: ${currentCoord[0].toFixed(1)}°N, ${currentCoord[1].toFixed(1)}°E
                            </div>
                        `;

                        L.marker(currentCoord, {icon: typhoonIcon})
                            .bindPopup(`<b>${tyName}</b><br>中心氣壓: ${hpa} hPa`)
                            .addTo(typhoonLayerGroup);

                        L.circle(currentCoord, {
                            color: '#ff1744', fillColor: '#ff1744', fillOpacity: 0.2, radius: 150000 
                        }).addTo(typhoonLayerGroup);
                    }
                } catch (e) {
                    console.log(`無法載入 ${ty.id} 座標數據`, e);
                }
            }

            statusText.innerText = '數據同步完成';

        } catch (error) {
            console.error('數據抓取失敗:', error);
            statusIcon.className = 'indicator offline';
            statusText.innerText = '連線失敗，請檢查 Server 是否運作中';
        }
    }

    fetchJMATyphoons();
    setInterval(fetchJMATyphoons, 300000); 

</script>
</body>
</html>
