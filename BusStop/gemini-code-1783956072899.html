<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HK Dashboard - Ultimate Tracker</title>
    <style>
        :root {
            --bg-color: #000000; --panel-bg: #0c0c0c; --panel-border: #1a1a1a;
            --text-main: #ffffff; --text-muted: #666666; --warning-red: #ff4d4d;
            --normal-bg: rgba(255, 255, 255, 0.02);
            --kmb-bg: #140202; --kmb-border: #991414;
            --ctb-bg: #141100; --ctb-border: #a38200;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .main-content { display: grid; grid-template-columns: 350px 1fr; gap: 15px; padding: 15px; flex: 1; overflow: hidden; }
        .panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; }

        /* --- 左側天氣面板 --- */
        .left-col { display: flex; flex-direction: column; gap: 15px; height: 100%; }
        .integrated-weather-panel { flex: 1; overflow-y: hidden; display: flex; flex-direction: column; gap: 10px; }
        .top-info-bar { display: flex; justify-content: flex-start; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
        .date-container { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .holiday-badge { font-size: 0.8rem; font-weight: 600; color: var(--warning-red); background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); padding: 2px 6px; border-radius: 6px; letter-spacing: 0.5px; }
        
        .weather-time-main { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); border-radius: 12px 12px 0 0; border: 1px solid rgba(255,255,255,0.05); border-bottom: none; gap: 10px; }
        .time-block { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .time-display { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .utc-display { font-size: 1rem; font-weight: 500; color: #888; font-variant-numeric: tabular-nums; }

        .weather-block { display: flex; align-items: center; gap: 12px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 12px; }
        
        /* ✅ 鎖死天氣圖案大小 */
        .weather-status-icon { width: 70px; height: 70px; min-width: 70px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        
        .weather-current-stats { display: flex; flex-direction: column; align-items: flex-end; }
        .current-temp { font-size: 2.2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: -1px; }
        .current-hum { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }
        .current-hum span { color: #4da6ff; font-weight: 700; font-size: 1rem; }
        
        .weather-grid-inline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-top: none; border-radius: 0 0 12px 12px; padding: 8px; }
        .w-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .w-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap;}
        .w-val { font-size: 0.95rem; font-weight: 700; color: #ddd; }

        .alert-box { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; text-align: left; display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        .alert-active { background: rgba(255, 77, 77, 0.08); border: 1px solid rgba(255, 77, 77, 0.4); animation: alertBlink 2s infinite ease-in-out; }
        .alert-none { background: var(--normal-bg); border: 1px solid var(--panel-border); color: var(--text-muted); font-weight: normal; text-align: center; }
        .swt-box { border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600; line-height: 1.4; text-align: left; background: rgba(255, 215, 0, 0.08); border: 1px solid rgba(255, 215, 0, 0.4); color: #ffd700; animation: swtBlink 2s infinite ease-in-out; margin-top: 5px; }

        .forecast-container { display: flex; gap: 6px; margin-top: 8px; margin-bottom: 5px; }
        .forecast-item { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 3px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .fc-date { font-size: 0.72rem; color: #ccc; font-weight: bold; }
        .fc-icon { width: 35px; height: 35px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));}
        .fc-temp { font-size: 0.8rem; font-weight: 700; color: #fff; letter-spacing: -0.5px;}
        .fc-psr { font-size: 0.68rem; font-weight: 600; padding: 1px 4px; border-radius: 4px; background: rgba(0,0,0,0.3);}
        .psr-high { color: #ff4d4d; } .psr-mid { color: #ffcc00; } .psr-low { color: #4da6ff; }

        @keyframes alertBlink { 0% { opacity: 0.4; box-shadow: 0 0 4px rgba(255, 77, 77, 0.2); } 50% { opacity: 1; box-shadow: 0 0 15px rgba(255, 77, 77, 0.6); background: rgba(255, 77, 77, 0.15); } 100% { opacity: 0.4; box-shadow: 0 0 4px rgba(255, 77, 77, 0.2); } }
        @keyframes swtBlink { 0% { opacity: 0.5; box-shadow: 0 0 4px rgba(255, 215, 0, 0.2); } 50% { opacity: 1; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); background: rgba(255, 215, 0, 0.15); } 100% { opacity: 0.5; box-shadow: 0 0 4px rgba(255, 215, 0, 0.2); } }

        /* --- 右側面板 --- */
        .right-col { display: flex; flex-direction: column; gap: 15px; height: 100%; overflow: hidden; }
        h2 { margin: 0 0 12px 0; font-size: 1.05rem; color: var(--text-muted); border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .settings-btn { cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; }
        .settings-btn:hover { transform: scale(1.1); }
        .refresh-indicator { font-size: 0.75rem; color: #00ff66; font-weight: normal; margin-right: 10px;}

        /* 港鐵 */
        .mtr-section { flex: 0 0 auto; }
        .mtr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .station-card { border-radius: 12px; padding: 12px; background: #111; border: 1px solid #333; position: relative; overflow: hidden; }
        .station-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; color: #fff; display: flex; justify-content: space-between; align-items: center; z-index: 2; position: relative; }
        .line-badge { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; font-weight: bold; letter-spacing: 0.5px; z-index: 2; position: relative; }
        .mtr-data-container { position: relative; z-index: 2; }
        .mtr-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; overflow: hidden; }
        .mtr-item:last-child { border-bottom: none; }
        .mtr-dest { white-space: nowrap; flex: 0 0 85px; }
        .mtr-eta-container { flex: 1; text-align: right; overflow: hidden; display: flex; justify-content: flex-end; }
        .mtr-eta { font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .mtr-marquee { width: 100%; color: var(--warning-red); font-size: 0.85rem; font-weight: bold; display: block; }

        /* 巴士 */
        .bus-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .bus-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 5px; overflow-y: auto; align-content: flex-start; padding-right: 5px; }
        .bus-grid::-webkit-scrollbar { width: 4px; }
        .bus-grid::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        .bus-card { aspect-ratio: 1 / 1; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; }
        .bus-card.kmb { background: var(--kmb-bg); border: 1px solid var(--kmb-border); }
        .bus-card.ctb { background: var(--ctb-bg); border: 1px solid var(--ctb-border); }
        .bus-no { font-size: 1.15rem; font-weight: 900; line-height: 1; }
        .bus-dest { font-size: 0.65rem; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .bus-eta { font-size: 0.75rem; font-weight: bold; text-align: right; font-variant-numeric: tabular-nums; width: 100%; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 2px; }
        .bus-card.kmb .bus-eta { color: #ff5252; }
        .bus-card.ctb .bus-eta { color: #ffcc00; }
        
        @keyframes textBlink { 0% { opacity: 0.4; color: #ff3b30; } 50% { opacity: 1; color: #ff3b30; } 100% { opacity: 0.4; color: #ff3b30; } }
        @keyframes kmbPulse { 0% { background-color: #140202; border-color: #991414; } 50% { background-color: #3b0a0a; border-color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4); } 100% { background-color: #140202; border-color: #991414; } }
        @keyframes ctbPulse { 0% { background-color: #141100; border-color: #a38200; } 50% { background-color: #382d00; border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.4); } 100% { background-color: #141100; border-color: #a38200; } }
        .arriving-pulse.kmb { animation: kmbPulse 1.6s infinite ease-in-out; }
        .arriving-pulse.ctb { animation: ctbPulse 1.6s infinite ease-in-out; }
        .arriving-text { color: #ff3b30 !important; animation: textBlink 1.2s infinite ease-in-out; font-weight: 900; }
        .no-service { grid-column: 1 / -1; text-align: center; color: #555; padding: 40px; font-size: 0.95rem; line-height: 1.6;}

        .traffic-news-bar { flex: 0 0 auto; background: rgba(255, 77, 77, 0.15); border-top: 1px solid #ff4d4d; color: #ffcc00; padding: 8px 15px; font-size: 1rem; font-weight: bold; display: none; align-items: center; }

        /* --- Modal 浮動框 --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--panel-bg); border: 1px solid #333; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;}
        .modal-header { padding: 15px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; background: #111;}
        .modal-header h3 { margin: 0; font-size: 1.2rem; color: #fff; }
        .modal-count { font-size: 0.9rem; color: #aaa; background: #222; padding: 3px 8px; border-radius: 12px; }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 15px; border-top: 1px solid var(--panel-border); display: flex; justify-content: flex-end; gap: 10px; background: #111;}
        
        .modal-btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s;}
        .btn-cancel { background: #333; color: #fff; }
        .btn-save { background: #0071CE; color: #fff; }
        .btn-save:hover { background: #005ea8; }
        .btn-back { background: #444; color: #fff; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px;}

        /* MTR Modal */
        .line-group { margin-bottom: 15px; }
        .line-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; padding-left: 5px; display: flex; align-items: center; gap: 6px; }
        .line-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .station-pills { display: flex; flex-wrap: wrap; gap: 8px; }
        .station-pill { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; user-select: none; }
        .station-pill.selected { color: #fff; border-color: currentColor; box-shadow: 0 0 8px currentColor; }
        .station-pill.disabled { opacity: 0.4; cursor: not-allowed; }

        /* Bus Modal UI */
        .bus-manager-list { display:flex; flex-direction:column; gap:8px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;}
        .bus-manager-item { display:flex; justify-content:space-between; align-items:center; background: #1a1a1a; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;}
        .bus-manager-info { display:flex; flex-direction:column; gap: 2px;}
        .bm-route { font-weight:bold; font-size: 1.05rem;}
        .bm-stop { font-size: 0.85rem; color:#aaa;}
        .bm-delete { background:#ff4d4d20; color:#ff4d4d; border:1px solid #ff4d4d50; border-radius:6px; padding:6px 10px; cursor:pointer;}
        
        .search-engine-box { background: #151515; padding: 12px; border-radius: 10px; border: 1px solid #333; margin-bottom: 10px; }
        .search-engine-box h4 { margin: 0 0 10px 0; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;}
        .search-flex-bar { display:flex; gap: 8px; }
        .search-flex-bar input { flex:1; padding: 8px 12px; border-radius: 6px; border:1px solid #444; background: #000; color:#fff; font-size:1rem;}
        .search-flex-bar button { padding: 8px 15px; background:#444; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition: background 0.2s;}
        .search-flex-bar button:hover { background: #555; }
        
        .bus-dir-btn { width: 100%; padding: 12px; margin-bottom: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-size:0.95rem; display:flex; justify-content:space-between; align-items:center;}
        .bus-dir-btn.kmb { border-left: 5px solid var(--warning-red); }
        .bus-dir-btn.ctb { border-left: 5px solid #ffcc00; }
        .bus-dir-btn:hover { background: #333; }
        
        /* 多選 Checkbox UI */
        .bus-stop-list { max-height: 280px; overflow-y: auto; background: #0a0a0a; border-radius: 6px; border: 1px solid #222; padding: 5px;}
        .bus-stop-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.95rem; color:#ddd; transition: 0.2s; display:flex; align-items:center; gap:12px; margin:0;}
        .bus-stop-item:hover { background: #1a1a1a; color:#fff;}
        .bus-stop-item input[type="checkbox"] { transform: scale(1.4); cursor: pointer; accent-color: #0071CE;}
        
        /* 統一底部多選加入按鈕 */
        .multi-add-bar { position: sticky; bottom: -15px; background: #111; padding: 15px 10px; border-top: 1px solid #333; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;}
        
        @media screen and (max-width: 768px) {
            body { height: 100vh; }
            .main-content { grid-template-columns: 1fr; overflow-y: auto; padding: 10px; gap: 15px; }
            .left-col, .right-col { height: auto; overflow: visible; gap: 15px; }
            .panel { margin-bottom: 0; padding: 15px; }
            .bus-section { min-height: 400px; }
            .bus-grid { overflow-y: visible; }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- 左側面板 -->
        <div class="left-col">
            <div class="panel integrated-weather-panel">
                <div class="top-info-bar">
                    <div class="date-container">
                        <div class="date-display" id="current-date">📅 --年--月--日</div>
                        <div class="holiday-badge" id="holiday-badge" style="display: none;"></div>
                    </div>
                </div>
                <div>
                    <div class="weather-time-main">
                        <div class="time-block">
                            <div class="time-display" id="hk-time">--:--</div>
                            <div class="utc-display" id="utc-time">--:-- UTC</div>
                        </div>
                        <div class="weather-block">
                            <div class="weather-current-stats">
                                <div class="current-temp" id="hk-temp">--°C</div>
                                <div class="current-hum">相對濕度 <span id="hk-hum">--%</span></div>
                            </div>
                            <!-- ✅ 完美挑空線條版圖示 HKOWxIconOutline -->
                            <img class="weather-status-icon" id="weather-icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Weather Icon">
                        </div>
                    </div>
                    <div class="weather-grid-inline">
                        <div class="w-item"><div class="w-label">UV指數</div><div class="w-val" id="hk-uv">--</div></div>
                        <div class="w-item"><div class="w-label">降雨概率</div><div class="w-val" id="hk-psr">--</div></div>
                        <div class="w-item"><div class="w-label">今日最高</div><div class="w-val" id="hk-max">--°C</div></div>
                        <div class="w-item"><div class="w-label">今日最低</div><div class="w-val" id="hk-min">--°C</div></div>
                    </div>
                </div>
                <div id="forecast-container" class="forecast-container"></div>
                <div id="warning-box" class="alert-box alert-none">🟢 現時沒有天氣警告信號</div>
                <div id="swt-box" class="swt-box" style="display: none;"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="panel mtr-section">
                <h2>
                    <span>🚇 即時地鐵班次</span>
                    <div class="header-actions">
                        <span class="settings-btn" onclick="openMtrModal()" title="設定車站">⚙️</span>
                    </div>
                </h2>
                <div class="mtr-grid" id="mtr-dynamic-grid">
                    <div style="text-align:center; color:#666; width:100%; padding: 20px;">載入中...</div>
                </div>
            </div>

            <div class="panel bus-section">
                <h2>
                    <span>🚌 自訂巴士追蹤</span>
                    <div class="header-actions">
                        <span class="refresh-indicator" id="refresh-status">🔄 系統啟動中...</span>
                        <span class="settings-btn" onclick="openBusModal()" title="設定巴士站">⚙️</span>
                    </div>
                </h2>
                <div class="bus-grid" id="bus-data"></div>
            </div>
        </div>
    </div>

    <div id="traffic-news-bar" class="traffic-news-bar">
        <marquee id="traffic-marquee" scrollamount="6"></marquee>
    </div>

    <!-- MTR Modal (9條綫完全支援) -->
    <div id="mtr-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>選擇地鐵站</h3>
                <div class="modal-count"><span id="mtr-select-count">0</span> / 4</div>
            </div>
            <div class="modal-body" id="mtr-modal-body"></div>
            <div class="modal-footer">
                <button class="modal-btn btn-cancel" onclick="closeMtrModal()">取消</button>
                <button class="modal-btn btn-save" onclick="saveMtrSelection()">儲存</button>
            </div>
        </div>
    </div>

    <!-- Bus Modal (極簡版，刪除車站搜尋，專注路線搜尋) -->
    <div id="bus-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>設定巴士追蹤</h3>
                <div class="modal-count"><span id="bus-select-count">0</span> / 10</div>
            </div>
            <div class="modal-body" style="padding-top: 10px; position:relative;">
                
                <div id="bus-manager-area" class="bus-manager-list"></div>
                
                <div id="bus-search-interface">
                    <!-- 專注做好路線搜尋，永不死機 -->
                    <div class="search-engine-box">
                        <h4 style="color:#ff6b6b;">🔴 搜尋路線 (九巴)</h4>
                        <div class="search-flex-bar">
                            <input type="text" id="kmb-route-input" placeholder="例: 112" autocomplete="off">
                            <button onclick="searchRoute('kmb')">搜尋</button>
                        </div>
                    </div>

                    <div class="search-engine-box">
                        <h4 style="color:#ffd93d;">🟡 搜尋路線 (城巴)</h4>
                        <div class="search-flex-bar">
                            <input type="text" id="ctb-route-input" placeholder="例: 2A" autocomplete="off">
                            <button onclick="searchRoute('ctb')">搜尋</button>
                        </div>
                    </div>
                </div>

                <div id="bus-search-results" style="display: none; margin-top: 10px;"></div>
                
            </div>
            <div class="modal-footer">
                <button class="modal-btn btn-save" onclick="closeBusModal()">完成設定</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚇 港鐵數據庫
        // ==========================================
        const MTR_NETWORK = {
            "ISL": { name: "港島綫", color: "#0071CE", stations: { "KET": "堅尼地城", "HKU": "香港大學", "SYP": "西營盤", "SHW": "上環", "CEN": "中環", "ADM": "金鐘", "WAC": "灣仔", "CAB": "銅鑼灣", "TIN": "天后", "FOT": "炮台山", "NOP": "北角", "QUB": "鰂魚涌", "TAK": "太古", "SWH": "西灣河", "SKW": "筲箕灣", "HFC": "杏花邨", "CHW": "柴灣" } },

        function toggleMtrStation(lineCode, staCode) {
            const index = tempMtrSelections.findIndex(s => s.line === lineCode && s.sta === staCode);
            if (index > -1) tempMtrSelections.splice(index, 1);
            else { if (tempMtrSelections.length >= 4) return; tempMtrSelections.push({ line: lineCode, sta: staCode }); }
            renderMtrModalBody();

        function renderMtrModalBody() {
            const body = document.getElementById('mtr-modal-body');

                for (let staCode in line.stations) {
                    const isSel = tempMtrSelections.some(s => s.line === lineCode && s.sta === staCode);
                    const isDis = (!isSel && tempMtrSelections.length >= 4);
                    html += `<div class="station-pill ${isSel ? 'selected' : ''} ${isDis ? 'disabled' : ''}"

        // --- ✅ 路線搜尋 (原生存取，保證不塞車) ---
        async function searchRoute(co) {
            let inputId = co === 'kmb' ? 'kmb-route-input' : 'ctb-route-input';
            let route = document.getElementById(inputId).value.trim().toUpperCase();
            if (!route) return;

            document.getElementById('bus-search-interface').style.display = 'none';
            let resDiv = document.getElementById('bus-search-results');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<div style="text-align:center; color:#888; padding: 20px;">🔍 搜尋緊路線資料...</div>`;

            let html = `<button class="btn-back" onclick="resetBusSearchUI()">🔙 返回搜尋頁</button>`;
            let found = false;

            try {
                if (co === 'kmb') {
                    // 【重點修復】：如果九巴目錄未載入，即時補飛下載全目錄
                    if (kmbRoutesList.length === 0) {
                        let res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
                        let d = await res.json();
                        if (d && d.data) kmbRoutesList = d.data;
                    }
                    
                    let matchedRoutes = kmbRoutesList.filter(r => String(r.route) === route);
                    
                    if (matchedRoutes.length > 0) {
                        found = true;
                        html += `<h4 style="color:#ff6b6b; margin:10px 0;">選擇行車方向：</h4>`;
                        matchedRoutes.forEach(dir => {
                            let boundParams = dir.bound === 'O' ? 'outbound' : 'inbound';
                            html += `<button class="bus-dir-btn kmb" onclick="loadRouteStops('kmb', '${route}', '${boundParams}', '${dir.service_type}', '${dir.dest_tc}')">
                                        <div><span style="font-weight:900; font-size:1.1rem;">九巴 ${route}</span> <span style="color:#aaa; font-size:0.9rem;">往 ${dir.dest_tc}</span></div>
                                        <div style="font-size:0.8rem; color:#888;">選擇車站 👉</div>
                                      </button>`;
                        });
                    }
                } else {
                    // 城巴同樣用官方原生 API
                    let r = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/CTB/${route}`);
                    let d = await r.json();
                    if (d && d.data) {
                        found = true;
                        html += `<h4 style="color:#ffd93d; margin:10px 0;">選擇行車方向：</h4>`;
                        html += `<button class="bus-dir-btn ctb" onclick="loadRouteStops('ctb', '${route}', 'outbound', '1', '${d.data.dest_tc}')">
                                    <div><span style="font-weight:900; font-size:1.1rem;">城巴 ${route}</span> <span style="color:#aaa; font-size:0.9rem;">往 ${d.data.dest_tc}</span></div>
                                    <div style="font-size:0.8rem; color:#888;">選擇車站 👉</div>
                                  </button>`;
                        html += `<button class="bus-dir-btn ctb" onclick="loadRouteStops('ctb', '${route}', 'inbound', '1', '${d.data.orig_tc}')">
                                    <div><span style="font-weight:900; font-size:1.1rem;">城巴 ${route}</span> <span style="color:#aaa; font-size:0.9rem;">往 ${d.data.orig_tc}</span></div>
                                    <div style="font-size:0.8rem; color:#888;">選擇車站 👉</div>
                                  </button>`;
                    }
                }
            } catch(e) {}

            if (!found) html += `<div style="text-align:center; color:#ff4d4d; padding: 20px;">搵唔到路線「${route}」</div>`;
            resDiv.innerHTML = html;
        }

        // --- 顯示指定路線沿途車站 (支援多選打剔，保證全中文) ---
        async function loadRouteStops(co, route, bound, service_type, destName) {
            let resDiv = document.getElementById('bus-search-results');
            resDiv.innerHTML = `<div style="text-align:center; color:#888; padding: 20px;">⏳ 讀取緊沿途車站中文名...</div>`;
            
            try {
                let stops = [];
                if (co === 'kmb') {
                    let r = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${bound}/${service_type}`);
                    let d = await r.json();
                    if (d && d.data) {
                        stops = d.data.map(s => {
                            let match = kmbStopsList.find(x => String(x.stop) === String(s.stop));
                            return { id: s.stop, name: match ? match.name_tc : `車站 ${s.stop}` };
                        });
                    }
                } else {
                    let r = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/CTB/${route}/${bound}`);
                    let d = await r.json();
                    if (d && d.data) {
                        let stopPromises = d.data.map(async s => {
                            let match = ctbStopsList.find(x => String(x.stop) === String(s.stop));
                            if (match && match.name_tc) return { id: s.stop, name: match.name_tc };
                            try {
                                let stRes = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${s.stop}`);
                                let stJson = await stRes.json();
                                return { id: s.stop, name: stJson.data.name_tc || `車站 ${s.stop}` };
                            } catch(e) { return { id: s.stop, name: `車站 ${s.stop}` }; }
                        });
                        stops = await Promise.all(stopPromises);
                    }
                }
                
                let html = `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:10px;">
                        <span style="color:#aaa; font-size:0.9rem;">往 ${destName} <span style="color:#00ff66;">(可打剔多選)</span></span>
                        <button class="btn-back" onclick="resetBusSearchUI()" style="margin:0;">🔙 取消</button>
                    </div>
                    <div class="bus-stop-list">`;
                
                stops.forEach(s => {
                    let val = encodeURIComponent(JSON.stringify({ co, route, stop: s.id, name: s.name, dest: destName }));
                    html += `
                        <label class="bus-stop-item">
                            <input type="checkbox" class="stop-cb" value="${val}" onchange="updateSelectedCount()">
                            <span>🚏 ${s.name}</span>
                        </label>`;
                });
                
                html += `</div>
                         <div class="multi-add-bar">
                             <span id="selected-count" style="font-weight:bold; color:#aaa;">已選擇 0 項</span>
                             <button class="modal-btn btn-save" onclick="addSelectedItems()">✅ 加入追蹤</button>
                         </div>`;
                
                resDiv.innerHTML = html;
            } catch (e) {
                resDiv.innerHTML = `<div style="color:red; text-align:center;">載入失敗</div><button class="btn-back" onclick="resetBusSearchUI()" style="width:100%; margin-top:10px; padding:10px;">返回重試</button>`;
            }
        }

        // --- 多選Checkbox 更新與加入 ---
        function updateSelectedCount() {
            let checkboxes = document.querySelectorAll('.stop-cb');

            checkboxes.forEach(cb => { if(cb.checked) count++; });
            document.getElementById('selected-count').innerText = `已選擇 ${count} 項`;

        function addSelectedItems() {
            let checkboxes = document.querySelectorAll('.stop-cb');
            let toAdd = [];
            checkboxes.forEach(cb => {
                if(cb.checked) toAdd.push(JSON.parse(decodeURIComponent(cb.value)));
            });

            if (toAdd.length === 0) { alert("請最少打剔選擇一項！"); return; }
            if (myBuses.length + toAdd.length > 10) { alert(`最多只能追蹤 10 條路線組合！你已經有 ${myBuses.length} 項。`); return; }

            toAdd.forEach(item => {
                let exists = myBuses.some(b => b.co === item.co && b.route === item.route && b.stop === item.stop);
                if (!exists) {
                    myBuses.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        co: item.co,
                        route: item.route,
                        stop: item.stop,
                        name: item.name,
                        dest: item.dest
                    });
                }
            });

            localStorage.setItem('my_buses_v20', JSON.stringify(myBuses));
            renderBusManagerList();
            
            document.getElementById('bus-search-results').innerHTML = `
                <div style="text-align:center; color:#00ff66; padding:30px 10px;">
                    ✅ 成功一次過加入 ${toAdd.length} 條路線！<br><br>
                    <button class="modal-btn btn-save" onclick="resetBusSearchUI()">繼續設定</button>
                </div>`;
            fetchRealBusData();
        }

        async function fetchHolidays() {
            try {
                let res = await fetch('https://www.1823.gov.hk/common/ical/gc/tc.json');
                let d = await res.json();
                if (d?.vcalendar?.[0]?.vevent) {
                    d.vcalendar[0].vevent.forEach(event => {
                        if (event.dtstart?.[0]) hkHolidaysMap[event.dtstart[0]] = event.summary;

        function updateTick() {
            const now = new Date();
            const daysOfWeek = ['禮拜日', '禮拜一', '禮拜二', '禮拜三', '禮拜四', '禮拜五', '禮拜六'];
            const yyyy = now.getFullYear(); const mm = String(now.getMonth() + 1).padStart(2, '0'); const dd = String(now.getDate()).padStart(2, '0');
            
            document.getElementById('current-date').innerText = `📅 ${yyyy}年${now.getMonth() + 1}月${now.getDate()}日 ${daysOfWeek[now.getDay()]}`;
            document.getElementById('hk-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
            document.getElementById('utc-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'UTC', hour12: false, hour: '2-digit', minute: '2-digit' }) + ' UTC';
            
            const dateKey = `${yyyy}${mm}${dd}`;
            const holidayBadge = document.getElementById('holiday-badge');
            if (hkHolidaysMap[dateKey]) { holidayBadge.innerText = `🎈 ${hkHolidaysMap[dateKey]}`; holidayBadge.style.display = 'inline-block'; } 
            else { holidayBadge.style.display = 'none'; }
            renderUI();
        }

        function parseRemaining(targetDateStr) {
            if (!targetDateStr) return { text: "沒有資料", isArriving: false, isEnd: true };
            const diffSec = Math.floor((new Date(targetDateStr) - new Date()) / 1000);
            if (diffSec <= 0) return { text: "正在開出", isArriving: true, isEnd: false };
            if (diffSec <= 60) return { text: "即將到達", isArriving: true, isEnd: false };
            const m = Math.floor(diffSec / 60); const s = diffSec % 60;
            return { text: `${m}分${s.toString().padStart(2, '0')}秒`, isArriving: false, isEnd: false };
        }

        function renderUI() {
            let mtrHtml = '';
            transportTimestamps.mtr.forEach(stationData => {
                const lineInfo = MTR_NETWORK[stationData.line];
                if(!lineInfo) return;
                const cardStyle = `background: ${lineInfo.color}15; border: 1px solid ${lineInfo.color}80; box-shadow: inset 0 0 10px ${lineInfo.color}30;`;
                mtrHtml += `<div class="station-card" style="${cardStyle}">
                    <div class="station-name">${lineInfo.stations[stationData.sta]} <span class="line-badge" style="background: ${lineInfo.color};">${stationData.line}</span></div>
                    <div class="mtr-data-container">`;
                if (stationData.data.length === 0) {
                    mtrHtml += `<div class="mtr-item" style="display: block; text-align: center; padding: 6px 0;"><marquee class="mtr-marquee" scrollamount="4">今日的列車服務經已終止或未有資料</marquee></div>`;
                } else {
                    stationData.data.forEach(t => {
                        const etaInfo = parseRemaining(t.time);
                        if (!etaInfo.isEnd) mtrHtml += `<div class="mtr-item"><div class="mtr-dest">往 ${t.dest}</div><div class="mtr-eta-container"><span class="mtr-eta ${etaInfo.isArriving ? 'arriving-text' : ''}">${etaInfo.text}</span></div></div>`;
                    });
                }
                mtrHtml += `</div></div>`;
            });
            document.getElementById('mtr-dynamic-grid').innerHTML = mtrHtml;

            let busHtml = '';
            if (transportTimestamps.bus.length === 0) {
                const statusText = document.getElementById('refresh-status').innerText;
                if (myBuses.length === 0) busHtml = `<div class="no-service">📭 尚未設定任何巴士追蹤<br><span style="font-size:0.8rem; color:#666;">點擊右上方 ⚙️ 開始加入</span></div>`;
                else if (statusText.includes('🔄')) busHtml = `<div class="no-service">⏳ 系統正擷取數據...</div>`;
                else busHtml = `<div class="no-service">💤 指定路線目前無即時班次</div>`;
            } else {
                transportTimestamps.bus.forEach(b => {
                    const etaInfo = parseRemaining(b.time);
                    const pulseClass = etaInfo.isArriving ? `arriving-pulse ${b.co}` : '';
                    busHtml += `
                        <div class="bus-card ${b.co} ${pulseClass}">
                            <div><div class="bus-no">${b.no}</div><div class="bus-dest">${b.dest}</div></div>
                            <div class="bus-eta ${etaInfo.isArriving ? 'arriving-text' : ''}">${etaInfo.text}</div>
                        </div>`;
                });
            }
            document.getElementById('bus-data').innerHTML = busHtml;
        }

        async function fetchMTR() {
            const fetchSafe = async (line, sta) => {
                try {
                    let res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}`);
                    let data = await res.json();
                    let trains = [];
                    const key = `${line}-${sta}`;
                    if (data?.data?.[key]) {
                        ['UP', 'DOWN'].forEach(dir => {
                            const d = data.data[key][dir];
                            if (d && d.length > 0) trains.push({ dest: MTR_DEST_MAP[d[0].dest] || d[0].dest, time: d[0].time.replace(' ', 'T') + '+08:00' });
                        });
                    }
                    return trains;
                } catch(e) { return []; }
            };
            const promises = myMtrStations.map(s => fetchSafe(s.line, s.sta));
            const results = await Promise.all(promises);
            transportTimestamps.mtr = results.map((trains, index) => ({ line: myMtrStations[index].line, sta: myMtrStations[index].sta, data: trains }));
        }

        async function fetchRealBusData() {
            if (!isBusDataReady || myBuses.length === 0) {
                transportTimestamps.bus = [];
                if(myBuses.length === 0 && isBusDataReady) document.getElementById('refresh-status').innerText = '🟢 已準備';
                renderUI();
                return;
            }
            
            document.getElementById('refresh-status').innerText = '🔄 讀取班次...';
            let rawBusData = [];
            const now = new Date();
            
            let promises = myBuses.map(b => {
                let url = b.co === 'kmb' 
                    ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${b.stop}/${b.route}/1`
                    : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/${b.stop}/${b.route}`;
                
                return fetch(url).then(r=>r.json()).then(json => {
                    if (json && json.data) {
                        json.data.forEach(d => {
                            if (d.eta && new Date(d.eta) > now && String(d.route).toUpperCase() === String(b.route).toUpperCase()) {
                                rawBusData.push({ no: d.route, dest: b.dest, time: d.eta, co: b.co, uid: `${b.co}_${b.route}_${d.eta}` });
                            }
                        });
                    }
                }).catch(()=>{});
            });

            await Promise.allSettled(promises);

            let uniqueBuses = {};
            rawBusData.forEach(b => { if (!uniqueBuses[b.uid]) uniqueBuses[b.uid] = b; });
            
            transportTimestamps.bus = Object.values(uniqueBuses).sort((a, b) => new Date(a.time) - new Date(b.time));
            document.getElementById('refresh-status').className = 'refresh-indicator';
            document.getElementById('refresh-status').innerText = `🟢 60秒更新`;
            renderUI();
        }

        async function fetchWeather() {
            try {
                let res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                let data = await res.json();
                
                // ✅ 官方天文台 HKOWxIconOutline 挑空圖示
                if (data && data.icon?.length > 0) {
                    let iconImg = document.getElementById('weather-icon');
                    let iconId = data.icon[0];
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
                    iconImg.onerror = function() {
                        this.onerror = null;
                        this.src = `https://www.hko.gov.hk/images/wxicon/pic${iconId}.png`;
                    };
                }
                
                if (data) {
                    const tstTemp = data.temperature.data.find(d => d.place === '香港天文台');
                    document.getElementById('hk-temp').innerText = tstTemp ? `${tstTemp.value}°C` : '--°C';
                    const tstHum = data.humidity.data.find(d => d.place === '香港天文台');
                    document.getElementById('hk-hum').innerText = tstHum ? `${tstHum.value}%` : '--%';
                    
                    let uvHtml = '--';
                    if (data.uvindex?.data?.length > 0) {
                        const uvVal = data.uvindex.data[0].value;
                        uvHtml = parseFloat(uvVal) >= 11 ? `<span class="arriving-text">${uvVal} 🕶️</span>` : uvVal;
                    }
                    document.getElementById('hk-uv').innerHTML = uvHtml;
                }

                // ✅ 官方天氣警告資訊同步
                let warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                let warnData = await warnRes.json();
                const warnBox = document.getElementById('warning-box');
                let warningHtml = '';
                
                const WMAP = {
                    'WFIREY': '🟡🔥 ', 'WFIRER': '🔴🔥 ', 'WRAINY': '🟡🌧️ ', 'WRAINR': '🔴🌧️ ', 'WRAINB': '⚫️🌧️ ',
                    'WTS': '🌩️ ', 'WCOLD': '🥶 ', 'WHOT': '🥵 ', 'WFNW': '🌊 ', 'WL': '⛰️⚠️ ',
                    'WMSGNL': '💨 ', 'WFROST': '❄️ ', 'TC1': '🌀1️⃣ ', 'TC3': '🌀3️⃣ ', 'TC8NE': '🌀8️⃣↗️ ',
                    'TC8NW': '🌀8️⃣↖️ ', 'TC8SE': '🌀8️⃣↘️ ', 'TC8SW': '🌀8️⃣↙️ ', 'TC9': '🌀9️⃣ ', 'TC10': '🌀🔟⚠️ '
                };
                
                if (warnData) {
                    for (const key in warnData) {
                        const warning = warnData[key];
                        if (warning.actionCode === "ISSUE" || warning.actionCode === "REISSUE") {
                            const emoji = WMAP[warning.code] || '⚠️ ';
                            warningHtml += `<span style="display:inline-block; margin: 2px 8px 2px 0;">${emoji}${warning.name}</span>`;
                        }
                    }
                }
                
                if (warningHtml !== '') {
                    warnBox.className = 'alert-box alert-active';
                    warnBox.innerHTML = warningHtml;
                } else {
                    warnBox.className = 'alert-box alert-none';
                    warnBox.innerHTML = '🟢 現時沒有天氣警告信號';
                }

                let swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                let swtData = await swtRes.json();
                const swtBox = document.getElementById('swt-box');
                if (swtData?.swt?.length > 0) {
                    swtBox.innerHTML = '💡 <b>特別天氣提示：</b><br>' + swtData.swt.map(tip => `<span style="display:block; margin-top:4px;">• ${tip.desc}</span>`).join('');
                    swtBox.style.display = 'block'; 
                } else swtBox.style.display = 'none';

                let fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                let fndData = await fndRes.json();
                const todayStr = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).reduce((acc, p) => acc + (p.type !== 'literal' ? p.value : ''), '');
                
                if (fndData && fndData.weatherForecast) {
                    const todayForecast = fndData.weatherForecast.find(fc => fc.forecastDate === todayStr) || fndData.weatherForecast[0];
                    if (todayForecast) {
                        document.getElementById('hk-max').innerText = `${todayForecast.forecastMaxtemp.value}°C`;
                        document.getElementById('hk-min').innerText = `${todayForecast.forecastMintemp.value}°C`;
                        document.getElementById('hk-psr').innerHTML = todayForecast.PSR.includes('高') ? `<span class="arriving-text">${todayForecast.PSR} ☔</span>` : todayForecast.PSR;
                    }

                    let forecastHtml = '';
                    fndData.weatherForecast.filter(fc => fc.forecastDate !== todayStr).slice(0, 3).forEach(fc => {
                        const dateStr = fc.forecastDate.substring(4,6) + '/' + fc.forecastDate.substring(6,8); 
                        let psrClass = "psr-low"; let psrIcon = "☀️";
                        if(fc.PSR.includes('高')) { psrClass = "psr-high"; psrIcon = "🌧️"; } else if(fc.PSR.includes('中')) { psrClass = "psr-mid"; psrIcon = "☁️"; }
                        // ✅ 3日預報挑空圖案 HKOWxIconOutline
                        forecastHtml += `<div class="forecast-item"><div class="fc-date">${dateStr} ${fc.week}</div><img class="fc-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${fc.ForecastIcon}.png" onerror="this.onerror=null; this.src='https://www.hko.gov.hk/images/wxicon/pic${fc.ForecastIcon}.png';"><div class="fc-temp">${fc.forecastMintemp.value}° - ${fc.forecastMaxtemp.value}°</div><div class="fc-psr ${psrClass}">${psrIcon} ${fc.PSR}</div></div>`;
                    });
                    document.getElementById('forecast-container').innerHTML = forecastHtml;
                }
            } catch (e) {}
        }

        async function fetchTrafficNews() {
            try {
                let res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.td.gov.hk/tc/special_news/trafficnews.xml')}`);
                let d = await res.json();
                if (d && d.contents) {
                    let newsArr = [];
                    new DOMParser().parseFromString(d.contents, "text/xml").querySelectorAll("item").forEach(item => {
                        let contentToUse = (item.querySelector("description")?.textContent.replace(/(<([^>]+)>)/gi, "").trim() || item.querySelector("title")?.textContent.replace(/(<([^>]+)>)/gi, "").trim());
                        if (contentToUse && !contentToUse.includes('現時沒有特別') && !contentToUse.includes('交通回復正常')) newsArr.push(`⚠️ ${contentToUse}`);
                    });
                    const bar = document.getElementById('traffic-news-bar');
                    if (newsArr.length > 0) { document.getElementById('traffic-marquee').innerText = newsArr.join('  ｜  '); bar.style.display = 'flex'; } 
                    else bar.style.display = 'none'; 
                }
            } catch (e) {}
        }

        async function boot() {
            fetchHolidays(); setInterval(updateTick, 1000); 
            fetchWeather(); fetchMTR(); fetchTrafficNews(); 
            initBusMasterData(); 
                      
            setInterval(fetchMTR, 15000); 
            setInterval(fetchRealBusData, 60000); 
            setInterval(fetchWeather, 60000); 
            setInterval(fetchTrafficNews, 300000); 
            setInterval(() => { window.location.reload(); }, 24 * 60 * 60 * 1000); 
        }

        boot();
    </script>
