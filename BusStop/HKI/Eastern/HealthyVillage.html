<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康邨西行 - 巴士實時到站預報</title>
    <style>
        :root {
            --kmb-color: #E3002B;
            --ctb-color: #F1C40F;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sec: #777777;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: var(--text-sec);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e1e8ed;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        #refresh-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
        }
        #refresh-btn:hover { background: #005bb5; }
        #refresh-btn.loading { opacity: 0.6; pointer-events: none; }
        
        .eta-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .route-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-top: 4px solid #007aff;
        }
        .route-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .route-badge {
            background: #007aff;
            color: white;
            font-weight: 900;
            font-size: 1.3rem;
            padding: 5px 12px;
            border-radius: 6px;
            margin-right: 12px;
            min-width: 45px;
            text-align: center;
        }
        .route-dest {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .eta-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .eta-item:last-child {
            border-bottom: none;
        }
        .eta-time {
            font-size: 1.25rem;
            font-weight: bold;
            color: #27ae60;
        }
        .eta-time.imminent {
            color: #e74c3c;
        }
        .eta-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-size: 0.85rem;
        }
        .co-tag {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .co-kmb { background: var(--kmb-color); color: white; }
        .co-ctb { background: var(--ctb-color); color: black; }
        .remark { color: #888; font-size: 0.8rem; }
        
        .loading-screen {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sec);
            grid-column: 1 / -1;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 122, 255, 0.2);
            border-radius: 50%;
            border-top-color: #007aff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>健康邨 (英皇道) 往西行</h1>
    <div class="subtitle">自動獲取並過濾 九巴 KMB 及 城巴 CTB 數據</div>
    
    <div id="status-bar">
        <span id="status-text">系統初始化中...</span>
        <button id="refresh-btn" onclick="fetchETAs()">手動更新</button>
    </div>

    <div id="eta-container" class="eta-container">
        <div class="loading-screen" id="loading-indicator">
            <div class="spinner"></div>
            <div id="loading-text">正在全網掃描「健康邨」真正車站 ID... (此過程只需執行一次)</div>
        </div>
    </div>

    <script>
        // 目標路線清單
        const TARGET_ROUTES = ['102', '106', '112', '116', '601', '619', '671', '680', '690', '608', '613', 'A12'];
        
        let kmbTargetStopId = null;
        let ctbTargetStopId = null;

        function updateStatus(msg) {
            document.getElementById("status-text").textContent = msg;
            const loadingText = document.getElementById("loading-text");
            if(loadingText) loadingText.textContent = msg;
        }

        // --- 核心：自動獲取精準的車站 Stop ID ---
        async function initStops() {
            try {
                updateStatus("🔍 正在尋找 九巴「健康邨」車站 Stop ID...");
                
                // 1. 獲取九巴全港車站
                const kmbStopRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
                const kmbStopData = await kmbStopRes.json();
                const kmbHealthyStops = kmbStopData.data.filter(s => s.name_tc.includes('健康村') || s.name_tc.includes('健康邨'));
                
                // 2. 判斷 102 線往九龍的 Bound (確保取得西行車站)
                let kmbDirToKowloon = 'outbound';
                for (let dir of ['outbound', 'inbound']) {
                    const routeRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/102/${dir}/1`);
                    const routeData = await routeRes.json();
                    if (routeData.data && (routeData.data.dest_tc.includes('美孚') || routeData.data.dest_tc.includes('九龍'))) {
                        kmbDirToKowloon = dir;
                        break;
                    }
                }
                
                // 3. 獲取 102 往九龍所有停站，與健康村進行比對提取 Stop ID
                const kmbRouteStopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/102/${kmbDirToKowloon}/1`);
                const kmbRouteStopData = await kmbRouteStopRes.json();
                
                for (let stop of kmbHealthyStops) {
                    if (kmbRouteStopData.data.find(rs => rs.stop === stop.stop)) {
                        kmbTargetStopId = stop.stop; // 成功獲取九巴 Stop ID！
                        console.log("✅ 成功獲取九巴 Stop ID:", kmbTargetStopId);
                        break;
                    }
                }

                updateStatus("🔍 正在尋找 城巴「健康邨」車站 Stop ID...");
                
                // 4. 城巴 Stop ID 尋找邏輯
                let ctbDirToKowloon = 'outbound';
                const ctbRouteRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB/102');
                const ctbRouteData = await ctbRouteRes.json();
                if (ctbRouteData.data && !ctbRouteData.data.dest_tc.includes('美孚')) {
                    ctbDirToKowloon = 'inbound';
                }
                
                const ctbRouteStopRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/102/${ctbDirToKowloon}`);
                const ctbRouteStopData = await ctbRouteStopRes.json();
                
                // 平行發送請求以加速搜索
                const fetchPromises = ctbRouteStopData.data.map(rs => 
                    fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${rs.stop}`).then(res => res.json())
                );
                const allCtbStops = await Promise.all(fetchPromises);
                const targetCtbStopData = allCtbStops.find(sd => 
                    sd.data && (sd.data.name_tc.includes('健康邨') || sd.data.name_tc.includes('健康村'))
                );
                
                if (targetCtbStopData) {
                    ctbTargetStopId = targetCtbStopData.data.stop;
                    console.log("✅ 成功獲取城巴 Stop ID:", ctbTargetStopId);
                }

                if (kmbTargetStopId || ctbTargetStopId) {
                    updateStatus("車站定位完成，正在載入班次...");
                    fetchETAs();
                    // 設定每 30 秒自動更新
                    setInterval(fetchETAs, 30000);
                } else {
                    updateStatus("無法自動定位車站，請檢查網絡或重新整理。");
                }

            } catch (error) {
                console.error("Initialization error:", error);
                updateStatus("初始化失敗，請重新整理頁面。");
            }
        }

        // --- 獲取九巴到站時間 (使用指定 stop-eta API) ---
        async function fetchKmbETAs() {
            if (!kmbTargetStopId) return [];
            try {
                // 直接使用 stop-eta 端點，一次過拉取所有經過該站的路線！
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${kmbTargetStopId}`);
                const data = await res.json();
                if (!data || !data.data) return [];
                
                const validEtas = data.data.filter(eta => 
                    eta.eta !== null && 
                    eta.eta !== "" &&
                    TARGET_ROUTES.includes(eta.route) &&
                    (!eta.rmk_tc || !eta.rmk_tc.includes("沒有提供")) // 忽略九巴API中的城巴時段假資料
                );
                
                return validEtas.map(eta => ({
                    company: 'KMB',
                    route: eta.route,
                    dest: eta.dest_tc,
                    etaTime: eta.eta,
                    remark: eta.rmk_tc || ''
                }));
            } catch (e) {
                console.error("KMB ETA Error:", e);
                return [];
            }
        }

        // --- 獲取城巴到站時間 ---
        async function fetchCtbETAs() {
            if (!ctbTargetStopId) return [];
            try {
                const fetchPromises = TARGET_ROUTES.map(route => 
                    fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${ctbTargetStopId}/${route}`)
                    .then(res => res.json())
                    .catch(e => ({ data: [] }))
                );
                
                const results = await Promise.all(fetchPromises);
                let ctbEtas = [];
                
                results.forEach(res => {
                    if (res.data && Array.isArray(res.data)) {
                        const valid = res.data.filter(eta => eta.eta !== "");
                        valid.forEach(eta => {
                            ctbEtas.push({
                                company: 'CTB',
                                route: eta.route,
                                dest: eta.dest_tc,
                                etaTime: eta.eta,
                                remark: eta.rmk_tc || ''
                            });
                        });
                    }
                });
                return ctbEtas;
            } catch (e) {
                console.error("CTB ETA Error:", e);
                return [];
            }
        }

        // --- 整合及渲染介面 ---
        async function fetchETAs() {
            document.getElementById("refresh-btn").classList.add("loading");
            document.getElementById("refresh-btn").textContent = "更新中...";
            
            const [kmbData, ctbData] = await Promise.all([ fetchKmbETAs(), fetchCtbETAs() ]);
            let allEtas = [...kmbData, ...ctbData];
            
            // 按時間先後排序
            allEtas.sort((a, b) => new Date(a.etaTime) - new Date(b.etaTime));
            
            renderETAs(allEtas);
            
            const now = new Date();
            updateStatus(`最後更新: ${now.toLocaleTimeString('zh-HK')}`);
            document.getElementById("refresh-btn").classList.remove("loading");
            document.getElementById("refresh-btn").textContent = "手動更新";
        }

        function renderETAs(etas) {
            const container = document.getElementById("eta-container");
            container.innerHTML = "";
            
            if (etas.length === 0) {
                container.innerHTML = '<div class="loading-screen">暫時沒有巴士班次資料，請稍後再試。</div>';
                return;
            }

            // 按路線分組並進行防重複過濾 (處理聯營線問題)
            const grouped = {};
            TARGET_ROUTES.forEach(r => grouped[r] = []);
            
            etas.forEach(eta => {
                const currentEtaTime = new Date(eta.etaTime).getTime();
                // 如果兩間巴士公司的 API 返回時間少於 60 秒誤差，視作同一班車 (防重疊)
                const isDuplicate = grouped[eta.route].some(existing => {
                    return Math.abs(new Date(existing.etaTime).getTime() - currentEtaTime) < 60000;
                });
                
                if (!isDuplicate) {
                    grouped[eta.route].push(eta);
                }
            });

            // 繪製卡片
            TARGET_ROUTES.forEach(route => {
                const routeEtas = grouped[route];
                if (routeEtas && routeEtas.length > 0) {
                    const nextBuses = routeEtas.slice(0, 3); // 顯示最近 3 班車
                    
                    const card = document.createElement("div");
                    card.className = "route-card";
                    
                    const header = document.createElement("div");
                    header.className = "route-header";
                    header.innerHTML = `
                        <div class="route-badge">${route}</div>
                        <div class="route-dest">往 ${nextBuses[0].dest}</div>
                    `;
                    card.appendChild(header);
                    
                    const etaList = document.createElement("div");
                    nextBuses.forEach(eta => {
                        const etaItem = document.createElement("div");
                        etaItem.className = "eta-item";
                        
                        const timeDiffMs = new Date(eta.etaTime) - new Date();
                        const minutes = Math.floor(timeDiffMs / 60000);
                        
                        let timeStr = minutes <= 1 ? "即將到達" : `${minutes} 分鐘`;
                        let imminentClass = minutes <= 1 ? "imminent" : "";
                        let remarkStr = eta.remark ? `<span class="remark">${eta.remark}</span>` : '';

                        etaItem.innerHTML = `
                            <div class="eta-time ${imminentClass}">${timeStr}</div>
                            <div class="eta-meta">
                                <span class="co-tag co-${eta.company.toLowerCase()}">${eta.company}</span>
                                ${remarkStr}
                            </div>
                        `;
                        etaList.appendChild(etaItem);
                    });
                    
                    card.appendChild(etaList);
                    container.appendChild(card);
                }
            });
        }

        // 啟動程序
        window.onload = initStops;
    </script>
</body>
</html>
