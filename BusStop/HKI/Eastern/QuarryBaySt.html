<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HK Dashboard - Quarry Bay Street Westbound V13</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #0c0c0c;
            --panel-border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #666666;
            --warning-red: #ff4d4d;
            --warning-bg: rgba(255, 77, 77, 0.08);
            --normal-bg: rgba(255, 255, 255, 0.02);
            
            --kmb-bg: #140202;
            --kmb-border: #991414;
            --ctb-bg: #141100;
            --ctb-border: #a38200;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* --- 左側佈局 --- */
        .left-col { display: flex; flex-direction: column; gap: 20px; height: 100%; }
        
        .datetime-section { flex: 0 0 auto; }
        .date-display { font-size: 1.3rem; font-weight: 600; color: #fff; margin-bottom: 15px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .time-container { margin-bottom: 12px; }
        .time-container:last-child { margin-bottom: 0; }
        .location-label { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        .time-display { font-size: 2.8rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

        .weather-section { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .weather-display-group { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px 0; }
        .weather-status-emoji { font-size: 3.5rem; line-height: 1; margin-bottom: 6px; }
        .weather-status-text { font-size: 1.1rem; font-weight: 600; color: #dddddd; letter-spacing: 1px; }
        
        .alert-box { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; line-height: 1.4; text-align: center; }
        .warning-active { background: var(--warning-bg); border: 1px solid rgba(255, 77, 77, 0.2); color: var(--warning-red); }
        .alert-none { background: var(--normal-bg); border: 1px solid var(--panel-border); color: var(--text-muted); font-weight: normal; }

        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .w-item { background: #121212; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .w-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
        .w-val { font-size: 1.5rem; font-weight: 700; }
        .w-val.small { font-size: 1.2rem; color: #aaa; }

        /* --- 右側佈局 --- */
        .right-col { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; }
        
        h2 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--text-muted); border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .refresh-indicator { font-size: 0.75rem; color: #00ff66; font-weight: normal; }
        .refresh-indicator.loading { color: #ffcc00; }

        /* 港鐵 */
        .mtr-section { flex: 0 0 auto; }
        .mtr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .station-card { border-radius: 12px; padding: 15px; }
        .qub-isl-style { background: #001f11; border: 1px solid #006432; box-shadow: inset 0 0 5px rgba(0, 100, 50, 0.3); }
        .qub-tkl-style { background: #1f0b2a; border: 1px solid #7935ab; box-shadow: inset 0 0 5px rgba(121, 53, 171, 0.3); }
        .tak-isl-style { background: #1f0507; border: 1px solid #b6121a; box-shadow: inset 0 0 5px rgba(182, 18, 26, 0.3); }
        
        .station-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .line-badge { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; font-weight: bold; letter-spacing: 0.5px; }
        .badge-isl { background: #0071CE; color: #fff; } 
        .badge-tkl { background: #A3238E; color: #fff; } 

        .mtr-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; }
        .mtr-item:last-child { border-bottom: none; }
        .mtr-eta { font-weight: bold; font-variant-numeric: tabular-nums; }

        /* 巴士正方格 */
        .bus-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .bus-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 4px; overflow-y: auto; align-content: flex-start; padding-right: 5px; }
        .bus-grid::-webkit-scrollbar { width: 4px; }
        .bus-grid::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

        .bus-card {
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .bus-card.kmb { background: var(--kmb-bg); border: 1px solid var(--kmb-border); }
        .bus-card.ctb { background: var(--ctb-bg); border: 1px solid var(--ctb-border); }
        
        .bus-no { font-size: 1.5rem; font-weight: 900; line-height: 1; }
        .bus-dest { font-size: 0.75rem; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
        .bus-eta { font-size: 0.95rem; font-weight: bold; text-align: right; font-variant-numeric: tabular-nums; width: 100%; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px; }
        .bus-card.kmb .bus-eta { color: #ff5252; }
        .bus-card.ctb .bus-eta { color: #ffcc00; }

        @keyframes kmbPulse { 0% { background-color: #140202; border-color: #991414; } 50% { background-color: #3b0a0a; border-color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4); } 100% { background-color: #140202; border-color: #991414; } }
        @keyframes ctbPulse { 0% { background-color: #141100; border-color: #a38200; } 50% { background-color: #382d00; border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.4); } 100% { background-color: #141100; border-color: #a38200; } }
        @keyframes textBlink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        
        .arriving-pulse.kmb { animation: kmbPulse 1.6s infinite ease-in-out; }
        .arriving-pulse.ctb { animation: ctbPulse 1.6s infinite ease-in-out; }
        .arriving-text { color: #ff3b30 !important; animation: textBlink 1.2s infinite ease-in-out; font-weight: 900; }
        
        .no-service { grid-column: 1 / -1; text-align: center; color: #555; padding: 40px; font-size: 0.95rem; line-height: 1.6;}
    </style>
</head>
<body>

    <div class="left-col">
        <div class="panel datetime-section">
            <div class="date-display" id="current-date">📅 --年--月--日</div>
            <div class="time-container">
                <div class="location-label">Hong Kong 香港</div>
                <div class="time-display" id="hk-time">--:--</div>
            </div>
            <div class="time-container">
                <div class="location-label">London 倫敦</div>
                <div class="time-display" id="uk-time">--:--</div>
            </div>
        </div>

        <div class="panel weather-section">
            <h2 style="border:none; margin:0 0 10px 0; padding:0; color:#fff; font-size:1.1rem;">香港實時天氣</h2>
            <div class="weather-display-group">
                <div class="weather-status-emoji" id="weather-emoji">☁️</div>
                <div class="weather-status-text" id="weather-text">取得中...</div>
            </div>
            <div id="warning-box" class="alert-box"></div>
            <div class="weather-grid">
                <div class="w-item"><div class="w-label">現時氣溫</div><div class="w-val" id="hk-temp">--°C</div></div>
                <div class="w-item"><div class="w-label">現時濕度</div><div class="w-val" id="hk-hum">--%</div></div>
                <div class="w-item"><div class="w-label">今日最高</div><div class="w-val small" id="hk-max">--°C</div></div>
                <div class="w-item"><div class="w-label">今日最低</div><div class="w-val small" id="hk-min">--°C</div></div>
            </div>
        </div>
    </div>

    <div class="right-col">
        <div class="panel mtr-section">
            <h2>港鐵 MTR 實時班次 🚆</h2>
            <div class="mtr-grid">
                <div class="station-card qub-isl-style">
                    <div class="station-name">鰂魚涌 <span class="line-badge badge-isl">港島綫 ISL</span></div>
                    <div id="mtr-qub-isl-data"></div>
                </div>
                <div class="station-card qub-tkl-style">
                    <div class="station-name">鰂魚涌 <span class="line-badge badge-tkl">將軍澳綫 TKL</span></div>
                    <div id="mtr-qub-tkl-data"></div>
                </div>
                <div class="station-card tak-isl-style">
                    <div class="station-name">太古站 <span class="line-badge badge-isl">港島綫 ISL</span></div>
                    <div id="mtr-tak-isl-data"></div>
                </div>
            </div>
        </div>

        <div class="panel bus-section">
            <h2>
                <span>鰂魚涌街實時本地站 (西行) 🚌</span>
                <span class="refresh-indicator" id="refresh-status">🔄 系統啟動中...</span>
            </h2>
            <div class="bus-grid" id="bus-data">
                <!-- 數據依到時排序 -->
            </div>
        </div>
    </div>

    <script>
        let transportTimestamps = { mtr_qub_isl: [], mtr_qub_tkl: [], mtr_tak_isl: [], bus: [] };
        
        // 限定路線
        const ALLOWED_ROUTES = ['2', '2A', '8H', '18X', '19P', '33X', '77', '77A', '81', '81A', '82', '85', '85A', '99', '302A', '307P', '678', '722', 'A12', 'N8X', 'NA12'];
        
        // 全面轉用 v1 API (citybus-nwfb)
        const CTB_API_BASE = 'https://rt.data.gov.hk/v1/transport/citybus-nwfb';
        
        let ctbTargetStops = [];
        let kmbTargetStops = [];

        function updateTick() {
            const now = new Date();
            const options = { timeZone: 'Asia/Hong_Kong', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            document.getElementById('current-date').innerText = '📅 ' + now.toLocaleDateString('zh-HK', options).replace('日', '日 ');

            document.getElementById('hk-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
            document.getElementById('uk-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'Europe/London', hour12: false, hour: '2-digit', minute: '2-digit' });
            
            renderUI();
        }

        function parseRemaining(targetDateStr) {
            const diffSec = Math.floor((new Date(targetDateStr) - new Date()) / 1000);
            if (diffSec <= 0) return { text: "正在開出", isArriving: true };
            if (diffSec <= 60) return { text: "即將到達", isArriving: true };
            const m = Math.floor(diffSec / 60);
            const s = diffSec % 60;
            return { text: `${m}分${s.toString().padStart(2, '0')}秒`, isArriving: false };
        }

        function renderUI() {
            ['mtr_qub_isl', 'mtr_qub_tkl', 'mtr_tak_isl'].forEach(id => {
                let html = '';
                const dataArray = transportTimestamps[id];
                if (!dataArray || dataArray.length === 0) {
                    html = '<div style="color: #888; text-align: center; padding: 10px 0; font-size: 0.9rem;">🛑 尾班車經已開出</div>';
                } else {
                    dataArray.forEach(t => {
                        const etaInfo = parseRemaining(t.time);
                        const etaClass = etaInfo.isArriving ? 'class="mtr-eta arriving-text"' : 'class="mtr-eta"';
                        html += `<div class="mtr-item"><div>往 ${t.dest}</div><div ${etaClass}>${etaInfo.text}</div></div>`;
                    });
                }
                const targetDiv = document.getElementById(id.replace(/_/g, '-') + '-data');
                if (targetDiv) targetDiv.innerHTML = html;
            });

            let busHtml = '';
            if (transportTimestamps.bus.length === 0) {
                const statusText = document.getElementById('refresh-status').innerText;
                if (statusText.includes('🔄') || statusText.includes('安全擷取')) {
                    // 顯示防封鎖 Loading 狀態
                    busHtml = `<div class="no-service">⏳ 擷取數據中和 (請稍等)...<br><span style="font-size:0.8rem; color:#666;">預計需時 3-5 秒，請耐心等候</span></div>`;
                } else {
                    busHtml = `<div class="no-service">💤 指定路線目前無即時班次<br><br><span style="font-size:0.8rem; color:#444;">[系統連線 九巴:${kmbTargetStops[0]||'無'} | 城巴:${ctbTargetStops[0]||'無'}]</span></div>`;
                }
            } else {
                transportTimestamps.bus.forEach(b => {
                    const etaInfo = parseRemaining(b.time);
                    const pulseClass = etaInfo.isArriving ? `arriving-pulse ${b.co}` : '';
                    const textClass = etaInfo.isArriving ? 'arriving-text' : '';

                    busHtml += `
                        <div class="bus-card ${b.co} ${pulseClass}">
                            <div>
                                <div class="bus-no">${b.no}</div>
                                <div class="bus-dest">${b.dest}</div>
                            </div>
                            <div class="bus-eta ${textClass}">${etaInfo.text}</div>
                        </div>`;
                });
            }
            document.getElementById('bus-data').innerHTML = busHtml;
        }

        // --- 防 Rate Limit 順序搜索機制 ---
        async function discoverExactStops() {
            localStorage.removeItem('qb_westbound_stop_v12'); // 清除舊版毒藥快取
            const cached = JSON.parse(localStorage.getItem('qb_westbound_stop_v13') || '{}');
            if (cached.ctb && cached.kmb && cached.ctb.length > 0) {
                ctbTargetStops = cached.ctb;
                kmbTargetStops = cached.kmb;
                return;
            }

            document.getElementById('refresh-status').className = 'refresh-indicator loading';

            // 1. 搵九巴站 (九巴數據庫較細，可以直接攞)
            document.getElementById('refresh-status').innerText = '🔄 [1/2] 正在鎖定九巴站 (鰂魚涌街)...';
            renderUI();
            try {
                const kmbRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
                const kmbJson = await kmbRes.json();
                if (kmbJson && kmbJson.data) {
                    const matched = kmbJson.data.filter(s => s.name_tc === '鰂魚涌街');
                    kmbTargetStops = matched.map(s => s.stop);
                }
            } catch (e) { console.error("KMB error", e); }

            // 2. 搵城巴站 (極度小心：逐個站問，避免 429 封鎖)
            document.getElementById('refresh-status').innerText = '🔄 [2/2] 正在鎖定城巴站 (鰂魚涌街, 英皇道)... 防封鎖模式';
            renderUI();
            try {
                // 抽查 2號西行線沿途站點
                const ctbRes = await fetch(`${CTB_API_BASE}/route-stop/CTB/2/outbound`);
                const ctbJson = await ctbRes.json();
                if (ctbJson && ctbJson.data) {
                    for (let i = 0; i < ctbJson.data.length; i++) {
                        const stopId = ctbJson.data[i].stop;
                        const stopRes = await fetch(`${CTB_API_BASE}/stop/${stopId}`);
                        const stopData = await stopRes.json();
                        
                        // 精準匹配你提供嘅兩個特徵
                        if (stopData && stopData.data && stopData.data.name_tc) {
                            if (stopData.data.name_tc.includes('鰂魚涌街') && stopData.data.name_tc.includes('英皇道')) {
                                ctbTargetStops = [stopId];
                                break; // 搵到即刻停！極大減低系統負荷
                            }
                        }
                    }
                }
            } catch (e) { console.error("CTB error", e); }

            // 硬核後備方案：如果政府網依然拒絕連線，直接塞死最常見嘅西行 ID
            if (ctbTargetStops.length === 0) ctbTargetStops = ['001256'];

            localStorage.setItem('qb_westbound_stop_v13', JSON.stringify({ ctb: ctbTargetStops, kmb: kmbTargetStops }));
        }

        async function fetchRealBusData() {
            if (ctbTargetStops.length === 0 || kmbTargetStops.length === 0) await discoverExactStops();

            document.getElementById('refresh-status').innerText = '🔄 讀取最新班次中...';
            
            let rawBusData = [];
            const now = new Date();
            let promises = [];

            // 1. 城巴 (使用你提供嘅 v1 API)
            ctbTargetStops.forEach(stop => {
                ALLOWED_ROUTES.forEach(route => {
                    promises.push(
                        fetch(`${CTB_API_BASE}/eta/CTB/${stop}/${route}`)
                        .then(r => r.json())
                        .then(json => {
                            if (json && json.data && Array.isArray(json.data)) {
                                json.data.forEach(d => {
                                    // 加入防撞空字串機制
                                    if (d.eta && d.eta !== '' && new Date(d.eta) > now) {
                                        rawBusData.push({ no: d.route, dest: d.dest_tc, time: d.eta, co: 'ctb' });
                                    }
                                });
                            }
                        }).catch(() => {})
                    );
                });
            });

            // 2. 九巴
            kmbTargetStops.forEach(stop => {
                promises.push(
                    fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop}`)
                    .then(r => r.json())
                    .then(json => {
                        if (json && json.data && Array.isArray(json.data)) {
                            json.data.forEach(d => {
                                if (d.eta && d.eta !== '' && new Date(d.eta) > now && ALLOWED_ROUTES.includes(d.route)) {
                                    rawBusData.push({ no: d.route, dest: d.dest_tc, time: d.eta, co: 'kmb' });
                                }
                            });
                        }
                    }).catch(() => {})
                );
            });

            await Promise.allSettled(promises);

            let uniqueBuses = {};
            rawBusData.forEach(b => {
                if (!uniqueBuses[b.no] || new Date(b.time) < new Date(uniqueBuses[b.no].time)) {
                    uniqueBuses[b.no] = b;
                }
            });

            let finalBusData = Object.values(uniqueBuses);
            finalBusData.sort((a, b) => new Date(a.time) - new Date(b.time)); 
            
            transportTimestamps.bus = finalBusData;
            
            const ctbID = ctbTargetStops[0] || '無';
            const kmbID = kmbTargetStops.length > 0 ? kmbTargetStops[0] : '無';
            
            document.getElementById('refresh-status').className = 'refresh-indicator';
            document.getElementById('refresh-status').innerText = `🟢 15秒更新 | 已連線: 城巴(${ctbID}) 九巴(${kmbID})`;
            
            renderUI(); // 強制刷新畫面
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                const iconMap = { 50:"☀️", 51:"🌙", 52:"🌤️", 53:"⛅", 54:"⛅", 60:"☁️", 61:"陰", 62:"🌧️", 63:"🌧️", 64:"🌧️", 65:"🌧️", 70:"⛈️", 71:"⛈️", 72:"⛈️", 73:"⛈️", 74:"⛈️", 75:"⛈️", 76:"⛈️", 77:"⛈️", 78:"🌃", 80:"💨", 81:"💨", 82:"💨", 83:"💨", 84:"💨", 85:"💨" };
                document.getElementById('weather-emoji').innerText = iconMap[data.icon[0]] || "☁️";
                document.getElementById('weather-text').innerText = data.flwStatus || "天晴";

                const warnBox = document.getElementById('warning-box');
                if (data.warningMessage && data.warningMessage.length > 0) {
                    warnBox.className = 'alert-box warning-active';
                    warnBox.innerHTML = '⚠️ ' + data.warningMessage.join('<br>⚠️ ');
                } else {
                    warnBox.className = 'alert-box alert-none';
                    warnBox.innerHTML = '🟢 現時沒有天氣警告信號';
                }

                document.getElementById('hk-temp').innerText = `${data.temperature.data.find(d => d.place === '香港天文台').value}°C`;
                document.getElementById('hk-hum').innerText = `${data.humidity.data[0].value}%`;

                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                document.getElementById('hk-max').innerText = `${fndData.weatherForecast[0].forecastMaxtemp.value}°C`;
                document.getElementById('hk-min').innerText = `${fndData.weatherForecast[0].forecastMintemp.value}°C`;
            } catch (e) {}
        }

        async function fetchMTR_QUB_ISL() {
            try {
                let trains = [];
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=ISL&sta=QUB`);
                const data = await res.json();
                if(data.data && data.data['ISL-QUB']) {
                    if(data.data['ISL-QUB'].UP && data.data['ISL-QUB'].UP[0]) trains.push({ dest: '柴灣', time: data.data['ISL-QUB'].UP[0].time.replace(' ', 'T') + '+08:00' });
                    if(data.data['ISL-QUB'].DOWN && data.data['ISL-QUB'].DOWN[0]) trains.push({ dest: '堅尼地城', time: data.data['ISL-QUB'].DOWN[0].time.replace(' ', 'T') + '+08:00' });
                }
                transportTimestamps.mtr_qub_isl = trains;
            } catch (e) {}
        }

        async function fetchMTR_QUB_TKL() {
            try {
                let trains = [];
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=QUB`);
                const data = await res.json();
                if(data.data && data.data['TKL-QUB']) {
                    if(data.data['TKL-QUB'].UP && data.data['TKL-QUB'].UP[0]) {
                        const code = data.data['TKL-QUB'].UP[0].dest;
                        trains.push({ dest: code === 'POA' ? '寶琳' : (code === 'LHP' ? '康城' : code), time: data.data['TKL-QUB'].UP[0].time.replace(' ', 'T') + '+08:00' });
                    }
                    if(data.data['TKL-QUB'].DOWN && data.data['TKL-QUB'].DOWN[0]) {
                        trains.push({ dest: '北角', time: data.data['TKL-QUB'].DOWN[0].time.replace(' ', 'T') + '+08:00' });
                    }
                }
                transportTimestamps.mtr_qub_tkl = trains;
            } catch (e) {}
        }

        async function fetchMTR_TAK_ISL() {
            try {
                let trains = [];
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=ISL&sta=TAK`);
                const data = await res.json();
                if(data.data && data.data['ISL-TAK']) {
                    if(data.data['ISL-TAK'].UP && data.data['ISL-TAK'].UP[0]) trains.push({ dest: '柴灣', time: data.data['ISL-TAK'].UP[0].time.replace(' ', 'T') + '+08:00' });
                    if(data.data['ISL-TAK'].DOWN && data.data['ISL-TAK'].DOWN[0]) trains.push({ dest: '堅尼地城', time: data.data['ISL-TAK'].DOWN[0].time.replace(' ', 'T') + '+08:00' });
                }
                transportTimestamps.mtr_tak_isl = trains;
            } catch (e) {}
        }

        async function runCycle() {
            await fetchWeather();
            await fetchMTR_QUB_ISL();
            await fetchMTR_QUB_TKL();
            await fetchMTR_TAK_ISL();
            await fetchRealBusData();
        }

        async function boot() {
            // 一開波就 Call UI，等用家見到載入中嘅提示
            setInterval(updateTick, 1000); 
            await discoverExactStops(); 
            runCycle();           
            setInterval(runCycle, 15000);    
        }

        boot();
    </script>
</body>
</html>
