<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HK Dashboard - Quarry Bay Street Westbound V17</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #0c0c0c;
            --panel-border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #666666;
            --warning-red: #ff4d4d;
            --normal-bg: rgba(255, 255, 255, 0.02);
            
            --kmb-bg: #140202;
            --kmb-border: #991414;
            --ctb-bg: #141100;
            --ctb-border: #a38200;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* --- 左側佈局 --- */
        .left-col { display: flex; flex-direction: column; gap: 20px; height: 100%; }
        
        .datetime-section { flex: 0 0 auto; }
        .date-container { margin-bottom: 15px; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; }
        .date-display { font-size: 1.3rem; font-weight: 600; color: #fff; }
        .holiday-badge { font-size: 0.9rem; font-weight: 600; color: var(--warning-red); background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 8px; letter-spacing: 0.5px; }
        
        .time-container { margin-bottom: 5px; }
        .location-label { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        .time-display { font-size: 3.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

        .weather-section { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .weather-display-group { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0; }
        .weather-status-icon { height: 75px; width: auto; margin-bottom: 8px; }
        .weather-status-text { font-size: 1.1rem; font-weight: 600; color: #dddddd; letter-spacing: 1px; }
        
        /* 閃爍動畫定義 */
        @keyframes alertBlink {
            0% { opacity: 0.4; box-shadow: 0 0 4px rgba(255, 77, 77, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(255, 77, 77, 0.6); background: rgba(255, 77, 77, 0.15); }
            100% { opacity: 0.4; box-shadow: 0 0 4px rgba(255, 77, 77, 0.2); }
        }

        @keyframes swtBlink {
            0% { opacity: 0.5; box-shadow: 0 0 4px rgba(255, 215, 0, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); background: rgba(255, 215, 0, 0.15); }
            100% { opacity: 0.5; box-shadow: 0 0 4px rgba(255, 215, 0, 0.2); }
        }

        .alert-box { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .alert-box img { height: 45px; width: auto; object-fit: contain; } 
        .alert-active { background: rgba(255, 77, 77, 0.08); border: 1px solid rgba(255, 77, 77, 0.4); animation: alertBlink 2s infinite ease-in-out; }
        .alert-none { background: var(--normal-bg); border: 1px solid var(--panel-border); color: var(--text-muted); font-weight: normal; animation: none; }

        .swt-box { border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; font-weight: 600; line-height: 1.4; text-align: left; background: rgba(255, 215, 0, 0.08); border: 1px solid rgba(255, 215, 0, 0.4); color: #ffd700; animation: swtBlink 2s infinite ease-in-out; }

        .weather-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .w-item { background: #121212; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .w-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
        .w-val { font-size: 1.3rem; font-weight: 700; }
        .w-val.small { font-size: 1.1rem; color: #aaa; }

        /* --- 右側佈局 --- */
        .right-col { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; }
        
        h2 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--text-muted); border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .refresh-indicator { font-size: 0.75rem; color: #00ff66; font-weight: normal; }
        .refresh-indicator.loading { color: #ffcc00; }

        /* 港鐵 */
        .mtr-section { flex: 0 0 auto; }
        .mtr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .station-card { border-radius: 12px; padding: 15px; }
        .qub-isl-style { background: #001f11; border: 1px solid #006432; box-shadow: inset 0 0 5px rgba(0, 100, 50, 0.3); }
        .qub-tkl-style { background: #1f0b2a; border: 1px solid #7935ab; box-shadow: inset 0 0 5px rgba(121, 53, 171, 0.3); }
        .tak-isl-style { background: #1f0507; border: 1px solid #b6121a; box-shadow: inset 0 0 5px rgba(182, 18, 26, 0.3); }
        
        .station-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .line-badge { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; font-weight: bold; letter-spacing: 0.5px; }
        .badge-isl { background: #0071CE; color: #fff; } 
        .badge-tkl { background: #A3238E; color: #fff; } 

        .mtr-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; overflow: hidden; }
        .mtr-item:last-child { border-bottom: none; }
        .mtr-dest { white-space: nowrap; flex: 0 0 85px; }
        .mtr-eta-container { flex: 1; text-align: right; overflow: hidden; display: flex; justify-content: flex-end; }
        .mtr-eta { font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
        
        .mtr-marquee { width: 100%; color: var(--warning-red); font-size: 0.85rem; font-weight: bold; }

        /* 巴士正方格 */
        .bus-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .bus-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 4px; overflow-y: auto; align-content: flex-start; padding-right: 5px; }
        .bus-grid::-webkit-scrollbar { width: 4px; }
        .bus-grid::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

        .bus-card {
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .bus-card.kmb { background: var(--kmb-bg); border: 1px solid var(--kmb-border); }
        .bus-card.ctb { background: var(--ctb-bg); border: 1px solid var(--ctb-border); }
        
        .bus-no { font-size: 1.5rem; font-weight: 900; line-height: 1; }
        .bus-dest { font-size: 0.75rem; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
        .bus-eta { font-size: 0.95rem; font-weight: bold; text-align: right; font-variant-numeric: tabular-nums; width: 100%; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px; }
        .bus-card.kmb .bus-eta { color: #ff5252; }
        .bus-card.ctb .bus-eta { color: #ffcc00; }

        @keyframes kmbPulse { 0% { background-color: #140202; border-color: #991414; } 50% { background-color: #3b0a0a; border-color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4); } 100% { background-color: #140202; border-color: #991414; } }
        @keyframes ctbPulse { 0% { background-color: #141100; border-color: #a38200; } 50% { background-color: #382d00; border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.4); } 100% { background-color: #141100; border-color: #a38200; } }
        @keyframes textBlink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        
        .arriving-pulse.kmb { animation: kmbPulse 1.6s infinite ease-in-out; }
        .arriving-pulse.ctb { animation: ctbPulse 1.6s infinite ease-in-out; }
        .arriving-text { color: #ff3b30 !important; animation: textBlink 1.2s infinite ease-in-out; font-weight: 900; }
        
        .no-service { grid-column: 1 / -1; text-align: center; color: #555; padding: 40px; font-size: 0.95rem; line-height: 1.6;}
    </style>
</head>
<body>

    <div class="left-col">
        <div class="panel datetime-section">
            <div class="date-container">
                <div class="date-display" id="current-date">📅 --年--月--日</div>
                <div class="holiday-badge" id="holiday-badge" style="display: none;"></div>
            </div>
            <div class="time-container">
                <div class="location-label">Hong Kong 香港</div>
                <div class="time-display" id="hk-time">--:--</div>
            </div>
        </div>

        <div class="panel weather-section">
            <h2 style="border:none; margin:0 0 10px 0; padding:0; color:#fff; font-size:1.1rem;">香港實時天氣</h2>
            <div class="weather-display-group">
                <img class="weather-status-icon" id="weather-icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Weather Icon">
                <div class="weather-status-text" id="weather-text">取得中...</div>
            </div>
            
            <!-- 天氣警告 -->
            <div id="warning-box" class="alert-box alert-none">🟢 現時沒有天氣警告信號</div>
            
            <!-- 特別天氣提示 -->
            <div id="swt-box" class="swt-box" style="display: none;"></div>

            <!-- 天氣網格 -->
            <div class="weather-grid">
                <div class="w-item"><div class="w-label">氣溫(總部)</div><div class="w-val" id="hk-temp">--°C</div></div>
                <div class="w-item"><div class="w-label">濕度(總部)</div><div class="w-val" id="hk-hum">--%</div></div>
                <div class="w-item"><div class="w-label">紫外線指數</div><div class="w-val" id="hk-uv">--</div></div>
                <div class="w-item"><div class="w-label">今日最高</div><div class="w-val small" id="hk-max">--°C</div></div>
                <div class="w-item"><div class="w-label">今日最低</div><div class="w-val small" id="hk-min">--°C</div></div>
                <div class="w-item"><div class="w-label">降雨概率</div><div class="w-val small" id="hk-psr">--</div></div>
            </div>
        </div>
    </div>

    <div class="right-col">
        <div class="panel mtr-section">
            <h2>港鐵 MTR 實時班次 🚆</h2>
            <div class="mtr-grid">
                <div class="station-card qub-isl-style">
                    <div class="station-name">鰂魚涌 <span class="line-badge badge-isl">港島綫 ISL</span></div>
                    <div id="mtr-qub-isl-data"></div>
                </div>
                <div class="station-card qub-tkl-style">
                    <div class="station-name">鰂魚涌 <span class="line-badge badge-tkl">將軍澳綫 TKL</span></div>
                    <div id="mtr-qub-tkl-data"></div>
                </div>
                <div class="station-card tak-isl-style">
                    <div class="station-name">太古站 <span class="line-badge badge-isl">港島綫 ISL</span></div>
                    <div id="mtr-tak-isl-data"></div>
                </div>
            </div>
        </div>

        <div class="panel bus-section">
            <h2>
                <span>鰂魚涌街實時站 (西行) 🚌</span>
                <span class="refresh-indicator" id="refresh-status">🔄 系統啟動中...</span>
            </h2>
            <div class="bus-grid" id="bus-data">
                <!-- 數據依到時排序 -->
            </div>
        </div>
    </div>

    <script>
        let transportTimestamps = { mtr_qub_isl: [], mtr_qub_tkl: [], mtr_tak_isl: [], bus: [] };
        let hkHolidaysMap = {}; // 儲存公眾假期資料
        
        const ALLOWED_ROUTES = ['2', '2A', '8H', '18X', '19P', '33X', '77', '77A', '81', '81A', '82', '85', '85A', '99', '302A', '307P', '678', '722', 'A12', 'N8X', 'NA12'];
        const CTB_API_BASE = 'https://rt.data.gov.hk/v1/transport/citybus-nwfb';
        
        let ctbTargetStops = [];
        const KMB_TARGET_STOP = 'KI04W10800000';

        const MTR_DEST_MAP = {
            'KET': '堅尼地城',
            'CHW': '柴灣',
            'POA': '寶琳',
            'LHP': '康城',
            'NOP': '北角',
            'ADM': '金鐘',
            'WHA': '黃埔',
            'TIH': '太古'
        };

        // 讀取香港 1823 政府公眾假期
        async function fetchHolidays() {
            try {
                const res = await fetch('https://www.1823.gov.hk/common/ical/gc/tc.json');
                const data = await res.json();
                if (data && data.vcalendar && data.vcalendar[0] && data.vcalendar[0].vevent) {
                    data.vcalendar[0].vevent.forEach(event => {
                        if (event.dtstart && event.dtstart[0]) {
                            hkHolidaysMap[event.dtstart[0]] = event.summary;
                        }
                    });
                }
            } catch (e) { console.error("無法載入假期資料", e); }
        }

        function updateTick() {
            const now = new Date();
            
            // 處理「禮拜X」格式
            const daysOfWeek = ['禮拜日', '禮拜一', '禮拜二', '禮拜三', '禮拜四', '禮拜五', '禮拜六'];
            const dayStr = daysOfWeek[now.getDay()];
            
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            
            document.getElementById('current-date').innerText = `📅 ${yyyy}年${now.getMonth() + 1}月${now.getDate()}日 ${dayStr}`;
            document.getElementById('hk-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
            
            // 檢查今日係咪公眾假期
            const dateKey = `${yyyy}${mm}${dd}`;
            const holidayBadge = document.getElementById('holiday-badge');
            if (hkHolidaysMap[dateKey]) {
                holidayBadge.innerText = `🎈 ${hkHolidaysMap[dateKey]}`;
                holidayBadge.style.display = 'inline-block';
            } else {
                holidayBadge.style.display = 'none';
            }
            
            renderUI();
        }

        function parseRemaining(targetDateStr) {
            if (!targetDateStr) return { text: "今日的列車服務經已完結", isArriving: false, isEnd: true };
            const diffSec = Math.floor((new Date(targetDateStr) - new Date()) / 1000);
            if (diffSec <= 0) return { text: "正在開出", isArriving: true, isEnd: false };
            if (diffSec <= 60) return { text: "即將到達", isArriving: true, isEnd: false };
            const m = Math.floor(diffSec / 60);
            const s = diffSec % 60;
            return { text: `${m}分${s.toString().padStart(2, '0')}秒`, isArriving: false, isEnd: false };
        }

        function renderUI() {
            // MTR 渲染 
            ['mtr_qub_isl', 'mtr_qub_tkl', 'mtr_tak_isl'].forEach(id => {
                let html = '';
                const dataArray = transportTimestamps[id];
                
                dataArray.forEach(t => {
                    const etaInfo = parseRemaining(t.time);
                    let etaDisplayHtml = '';
                    
                    if (etaInfo.isEnd) {
                        etaDisplayHtml = `<marquee class="mtr-marquee" scrollamount="4">今日的列車服務經已完結</marquee>`;
                    } else {
                        const etaClass = etaInfo.isArriving ? 'class="mtr-eta arriving-text"' : 'class="mtr-eta"';
                        etaDisplayHtml = `<span ${etaClass}>${etaInfo.text}</span>`;
                    }
                    
                    html += `
                        <div class="mtr-item">
                            <div class="mtr-dest">往 ${t.dest}</div>
                            <div class="mtr-eta-container">${etaDisplayHtml}</div>
                        </div>`;
                });
                
                const targetDiv = document.getElementById(id.replace(/_/g, '-') + '-data');
                if (targetDiv) targetDiv.innerHTML = html;
            });

            // Bus 渲染
            let busHtml = '';
            if (transportTimestamps.bus.length === 0) {
                const statusText = document.getElementById('refresh-status').innerText;
                if (statusText.includes('🔄') || statusText.includes('安全擷取')) {
                    busHtml = `<div class="no-service">⏳ 系統正安全地擷取數據 (避免被政府伺服器封鎖)...<br><span style="font-size:0.8rem; color:#666;">預計需時幾秒，請耐心等候</span></div>`;
                } else {
                    busHtml = `<div class="no-service">💤 指定路線目前無即時班次<br><br><span style="font-size:0.8rem; color:#444;">[已連線 九巴:${KMB_TARGET_STOP} | 城巴:${ctbTargetStops[0]||'無'}]</span></div>`;
                }
            } else {
                transportTimestamps.bus.forEach(b => {
                    const etaInfo = parseRemaining(b.time);
                    const pulseClass = etaInfo.isArriving ? `arriving-pulse ${b.co}` : '';
                    const textClass = etaInfo.isArriving ? 'arriving-text' : '';

                    busHtml += `
                        <div class="bus-card ${b.co} ${pulseClass}">
                            <div>
                                <div class="bus-no">${b.no}</div>
                                <div class="bus-dest">${b.dest}</div>
                            </div>
                            <div class="bus-eta ${textClass}">${etaInfo.text}</div>
                        </div>`;
                });
            }
            document.getElementById('bus-data').innerHTML = busHtml;
        }

        async function discoverExactStops() {
            const cached = JSON.parse(localStorage.getItem('qb_westbound_stop_v17') || '{}');
            if (cached.ctb && cached.ctb.length > 0) {
                ctbTargetStops = cached.ctb;
                return;
            }

            document.getElementById('refresh-status').className = 'refresh-indicator loading';
            document.getElementById('refresh-status').innerText = '🔄 正在定位城巴站... 防封鎖安全掃描模式';
            renderUI();
            
            try {
                const ctbRes = await fetch(`${CTB_API_BASE}/route-stop/CTB/2/outbound`);
                const ctbJson = await ctbRes.json();
                if (ctbJson && ctbJson.data) {
                    for (let i = 0; i < ctbJson.data.length; i++) {
                        const stopId = ctbJson.data[i].stop;
                        const stopRes = await fetch(`${CTB_API_BASE}/stop/${stopId}`);
                        const stopData = await stopRes.json();
                        
                        if (stopData && stopData.data && stopData.data.name_tc) {
                            if (stopData.data.name_tc.includes('鰂魚涌街') && stopData.data.name_tc.includes('英皇道')) {
                                ctbTargetStops = [stopId];
                                break; 
                            }
                        }
                    }
                }
            } catch (e) { console.error("CTB discovery error", e); }

            if (ctbTargetStops.length === 0) ctbTargetStops = ['001256']; 

            localStorage.setItem('qb_westbound_stop_v17', JSON.stringify({ ctb: ctbTargetStops }));
        }

        async function fetchRealBusData() {
            if (ctbTargetStops.length === 0) await discoverExactStops();

            document.getElementById('refresh-status').innerText = '🔄 讀取最新班次中...';
            
            let rawBusData = [];
            const now = new Date();
            let promises = [];

            // 1. 城巴
            ctbTargetStops.forEach(stop => {
                ALLOWED_ROUTES.forEach(route => {
                    promises.push(
                        fetch(`${CTB_API_BASE}/eta/CTB/${stop}/${route}`)
                        .then(r => r.json())
                        .then(json => {
                            if (json && json.data && Array.isArray(json.data)) {
                                json.data.forEach(d => {
                                    if (d.eta && d.eta !== '' && new Date(d.eta) > now) {
                                        rawBusData.push({ no: d.route, dest: d.dest_tc, time: d.eta, co: 'ctb' });
                                    }
                                });
                            }
                        }).catch(() => {})
                    );
                });
            });

            // 2. 九巴
            promises.push(
                fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${KMB_TARGET_STOP}`)
                .then(r => r.json())
                .then(json => {
                    if (json && json.data && Array.isArray(json.data)) {
                        json.data.forEach(d => {
                            if (d.eta && d.eta !== '' && new Date(d.eta) > now && ALLOWED_ROUTES.includes(d.route)) {
                                rawBusData.push({ no: d.route, dest: d.dest_tc, time: d.eta, co: 'kmb' });
                            }
                        });
                    }
                }).catch(() => {})
            );

            await Promise.allSettled(promises);

            let uniqueBuses = {};
            rawBusData.forEach(b => {
                if (!uniqueBuses[b.no] || new Date(b.time) < new Date(uniqueBuses[b.no].time)) {
                    uniqueBuses[b.no] = b;
                }
            });

            let finalBusData = Object.values(uniqueBuses);
            finalBusData.sort((a, b) => new Date(a.time) - new Date(b.time)); 
            
            transportTimestamps.bus = finalBusData;
            
            document.getElementById('refresh-status').className = 'refresh-indicator';
            document.getElementById('refresh-status').innerText = `🟢 60秒更新 | 已連線: 城巴(${ctbTargetStops[0]}) 九巴(${KMB_TARGET_STOP})`;
            
            renderUI();
        }

        async function fetchWeather() {
            try {
                // 1. 基本天氣資料
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                if (data.icon && data.icon.length > 0) {
                    const iconCode = data.icon[0];
                    document.getElementById('weather-icon').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
                    
                    const iconDesc = { 50:"陽光充沛", 51:"天晴", 52:"短暫陽光", 53:"間有陽光", 54:"間有陽光", 60:"多雲", 61:"密雲", 62:"微雨", 63:"雨", 64:"大雨", 65:"狂風大雨", 70:"雷暴", 71:"雷暴", 72:"雷暴", 73:"雷暴", 74:"雷暴", 75:"雷暴", 76:"雷暴", 77:"雷暴", 78:"多雲", 80:"大風", 81:"大風", 82:"大風", 83:"霧", 84:"薄霧", 85:"煙霞" };
                    document.getElementById('weather-text').innerText = iconDesc[iconCode] || "天氣報告";
                }

                const tstTemp = data.temperature.data.find(d => d.place === '香港天文台');
                document.getElementById('hk-temp').innerText = tstTemp ? `${tstTemp.value}°C` : '--°C';

                const tstHum = data.humidity.data.find(d => d.place === '香港天文台');
                document.getElementById('hk-hum').innerText = tstHum ? `${tstHum.value}%` : '--%';

                let uv = '--';
                if (data.uvindex && data.uvindex.data && data.uvindex.data.length > 0) {
                    uv = data.uvindex.data[0].value;
                }
                document.getElementById('hk-uv').innerText = uv;

                // 2. 天氣警告 
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('warning-box');
                
                let warningImagesHtml = '';
                for (const key in warnData) {
                    const action = warnData[key].actionCode;
                    if (action === "ISSUE" || action === "REISSUE") {
                        const warnCode = warnData[key].code.toLowerCase();
                        warningImagesHtml += `<img src="https://www.hko.gov.hk/tc/wxinfo/warning/images/${warnCode}c.gif" onerror="this.onerror=null; this.src='https://www.hko.gov.hk/img/warn/${warnData[key].code}.png';" alt="${warnData[key].name}">`;
                    }
                }

                if (warningImagesHtml !== '') {
                    warnBox.className = 'alert-box alert-active';
                    warnBox.innerHTML = warningImagesHtml;
                } else {
                    warnBox.className = 'alert-box alert-none';
                    warnBox.innerHTML = '🟢 現時沒有天氣警告信號';
                }

                // 3. 特別天氣提示 (SWT) 
                const swtRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc');
                const swtData = await swtRes.json();
                const swtBox = document.getElementById('swt-box');
                
                if (swtData && swtData.swt && swtData.swt.length > 0) {
                    let swtHtml = '💡 <b>特別天氣提示：</b><br>';
                    swtData.swt.forEach(tip => {
                        swtHtml += `<span style="display:block; margin-top:4px;">• ${tip.desc}</span>`;
                    });
                    swtBox.innerHTML = swtHtml;
                    swtBox.style.display = 'block'; 
                } else {
                    swtBox.style.display = 'none';
                }

                // 4. 預測及降雨概率
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                const todayForecast = fndData.weatherForecast[0];
                document.getElementById('hk-max').innerText = `${todayForecast.forecastMaxtemp.value}°C`;
                document.getElementById('hk-min').innerText = `${todayForecast.forecastMintemp.value}°C`;
                document.getElementById('hk-psr').innerText = `${todayForecast.PSR}`;
            } catch (e) { console.error("Weather error", e); }
        }

        function setupMtrData(data, key, defaultDestinations) {
            let trains = [];
            if (data && data.data && data.data[key]) {
                const upData = data.data[key].UP;
                const downData = data.data[key].DOWN;
                
                if (upData && upData.length > 0) {
                    const code = upData[0].dest;
                    let destName = MTR_DEST_MAP[code] || code;
                    trains.push({ dest: destName, time: upData[0].time.replace(' ', 'T') + '+08:00' });
                } else { trains.push({ dest: defaultDestinations.up, time: null }); }

                if (downData && downData.length > 0) {
                    const code = downData[0].dest;
                    let destName = MTR_DEST_MAP[code] || code; 
                    trains.push({ dest: destName, time: downData[0].time.replace(' ', 'T') + '+08:00' });
                } else { trains.push({ dest: defaultDestinations.down, time: null }); }
            } else {
                trains = [
                    { dest: defaultDestinations.up, time: null },
                    { dest: defaultDestinations.down, time: null }
                ];
            }
            return trains;
        }

        async function fetchMTR_QUB_ISL() {
            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=ISL&sta=QUB`);
                const data = await res.json();
                transportTimestamps.mtr_qub_isl = setupMtrData(data, 'ISL-QUB', { up: '柴灣', down: '堅尼地城' });
            } catch (e) { }
        }

        async function fetchMTR_QUB_TKL() {
            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=QUB`);
                const data = await res.json();
                transportTimestamps.mtr_qub_tkl = setupMtrData(data, 'TKL-QUB', { up: '寶琳/康城', down: '北角' });
            } catch (e) { }
        }

        async function fetchMTR_TAK_ISL() {
            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=ISL&sta=TAK`);
                const data = await res.json();
                transportTimestamps.mtr_tak_isl = setupMtrData(data, 'ISL-TAK', { up: '柴灣', down: '堅尼地城' });
            } catch (e) { }
        }

        async function runFastCycle() {
            await fetchMTR_QUB_ISL();
            await fetchMTR_QUB_TKL();
            await fetchMTR_TAK_ISL();
        }

        async function runSlowCycle() {
            await fetchWeather();
            await fetchRealBusData();
        }

        async function boot() {
            await fetchHolidays(); // 首先載入假期資料
            setInterval(updateTick, 1000); 
            await discoverExactStops(); 
            
            // 初次載入數據
            await fetchWeather();
            await runFastCycle();
            await fetchRealBusData();
                      
            // 獨立定時器控制
            setInterval(runFastCycle, 15000); // 地鐵保持 15 秒
            setInterval(runSlowCycle, 60000); // 巴士及天氣改為精準 60 秒
            
            // 整個網站每 24 小時全面自動重新整理一次 (避免瀏覽器卡死)
            setInterval(() => {
                window.location.reload();
            }, 24 * 60 * 60 * 1000); 
        }

        boot();
    </script>
</body>
