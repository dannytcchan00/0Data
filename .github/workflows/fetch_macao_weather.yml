name: Fetch Macao Weather API

on:
  workflow_dispatch: 
  repository_dispatch:
    types: [fastcron_trigger] 

permissions:
  contents: write 

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repo
        uses: actions/checkout@v4

      - name: 2. Download XML
        run: |
          mkdir -p data
          curl -sL "https://xml.smg.gov.mo/c_actualweather.xml" -o data/macao_weather.xml

      - name: 3. Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/macao_weather.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Macao Weather data" && git push)
