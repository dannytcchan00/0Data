name: Update JMA Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 執行 Python 腳本
      run: python fetch_data.py

    - name: 提交及推送到 GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        git add -A
        
        if [ -z "$(git status --porcelain)" ]; then
          echo "無新數據，跳過 Commit。"
        else
          git commit -m "Auto-update JMA Data"
          
          # 直接使用預設嘅 git push，會自動對應當前分支
          git push
        fi
