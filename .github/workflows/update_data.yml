name: Update JMA Data

# 設定觸發條件
on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘執行一次 (GitHub Actions 可能會有少少延遲)
  workflow_dispatch: # 允許手動觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 設定權限，允許 Action 推送代碼
    permissions:
      contents: write

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: 執行 Python 腳本
      run: python fetch_data.py

    - name: 提交及推送到 GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json
        # 如果 data.json 有改變先會 commit，避免產生吉嘅 commit
        git diff --quiet && git diff --staged --quiet || git commit -m "自動更新 JMA 數據"
        git push
