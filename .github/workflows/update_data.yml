name: Update JMA Data

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘自動執行一次
  workflow_dispatch: # 允許手動撳掣觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 必須要有寫入權限
    permissions:
      contents: write

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 執行 Python 腳本
      run: python fetch_data.py

    - name: 提交及推送到 GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. 設定 git 機器人身份
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 2. 強制將所有變更（包括新產生嘅 data.json）加入暫存區
        git add -A
        
        # 3. 檢查係咪真係有嘢要 commit
        if [ -z "$(git status --porcelain)" ]; then
          echo "無新數據，跳過 Commit。"
        else
          # 有新檔案或內容有變，執行 Commit
          git commit -m "Auto-update JMA Data"
          
          # 4. 強制 Push (注意：預設分支為 main。如果你個 repo 預設係 master，請將尾段 HEAD:main 改為 HEAD:master)
          git push "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        fi
