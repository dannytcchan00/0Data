name: Update JMA Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 再次聲明寫入權限
    permissions:
      contents: write

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 執行 Python 腳本
      run: python fetch_data.py

    - name: 提交及推送到 GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 用 git add -A 代替指定檔名，就算 data.json 唔存在都唔會報錯 (解決 128 錯誤)
        git add -A
        
        if git diff --staged --quiet; then
          echo "數據無變更或未成功生成，跳過提交。"
        else
          git commit -m "Auto-update JMA Data"
          # 強制帶上 Token 執行 push，解決因為權限不足導致嘅 128 錯誤
          git push "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        fi
