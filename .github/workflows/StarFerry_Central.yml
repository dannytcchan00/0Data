name: Auto Download Star Ferry Central CSV

on:
  schedule:
    - cron: '0 1 * * *'  # 每日UTC 1點 (香港9點)
  workflow_dispatch:

permissions:
  contents: write  # 關鍵：授予寫入權限

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup directories and download CSV
        run: |
          mkdir -p data/travel/Star_Ferry/Central/
          curl -L -o data/travel/Star_Ferry/Central/data.csv \
            "https://www.starferry.com.hk/sites/default/files/ferry_sf_central_tsimshatsui_timetable_updatedon022018_eng.csv"
          
          echo "✅ CSV size: $(wc -c < data/travel/Star_Ferry/Central/data.csv) bytes"

      - name: Commit and push if changed
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/travel/Star_Ferry/Central/data.csv'
          message: '🤖 Auto Download Star Ferry Central CSV ({{ github.run_number }})'
          default_author: github_actions
