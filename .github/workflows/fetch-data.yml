name: Fetch Typhoon XML

on:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分鐘執行一次
  workflow_dispatch: # 允許手動觸發

jobs:
  fetch_xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 GitHub Action 寫入你的 Repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse XML
        run: |
          mkdir -p data
          
          # 1. 下載目錄清單 (加入 -L 防止天文台轉址)
          curl -sL "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml" -o data/tc_list.xml
          
          # 2. 暴力提取清單內的 .xml 檔名或網址 (排除掉 tc_list.xml 自身)
          RAW_PATH=$(grep -oE '[a-zA-Z0-9_:./-]+\.xml' data/tc_list.xml | grep -v 'tc_list.xml' | head -n 1 || echo "")
          
          if [ ! -z "$RAW_PATH" ]; then
            echo "成功提取到字串: $RAW_PATH"
            
            # 3. 使用 basename 取出最後乾淨的檔名 (例如 hko_tctrack_2617.xml)
            FILENAME=$(basename "$RAW_PATH")
            
            # 4. 判斷是否為完整網址，如果不是則補上天文台前綴
            if [[ "$RAW_PATH" == http* ]]; then
              DOWNLOAD_URL="$RAW_PATH"
            else
              DOWNLOAD_URL="https://www.weather.gov.hk/wxinfo/currwx/$RAW_PATH"
            fi
            
            echo "即將下載網址: $DOWNLOAD_URL"
            echo "將儲存為本地檔案: data/$FILENAME"
            
            # 5. 下載實質資料檔並儲存為乾淨的檔名
            curl -sL "$DOWNLOAD_URL" -o "data/$FILENAME"
          else
            echo "目前沒有發現活躍的颱風資料。"
          fi

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 將 data 資料夾加入追蹤
          git add data/
          
          # 檢查是否有檔案變動，有的話才進行 Commit 和 Push
          if ! git diff --staged --quiet; then
            git commit -m "Auto update typhoon data: $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ 數據已更新並推送到 GitHub！"
          else
            echo "⏸️ 數據與上次相同，無需更新。"
          fi
