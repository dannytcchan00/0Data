name: Fetch Typhoon XML and KML

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘執行一次
  workflow_dispatch: 

jobs:
  fetch_xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse Weather Data
        run: |
          mkdir -p data
          
          # 1. 處理香港天文台 (HKO) 資料
          curl -sL "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml" -o data/tc_list.xml
          RAW_PATH=$(grep -oE '[a-zA-Z0-9_:./-]+\.xml' data/tc_list.xml | grep -v 'tc_list.xml' | head -n 1 || echo "")
          
          if [ ! -z "$RAW_PATH" ]; then
            if [[ "$RAW_PATH" == http* ]]; then
              DOWNLOAD_URL="$RAW_PATH"
            else
              DOWNLOAD_URL="https://www.weather.gov.hk/wxinfo/currwx/$RAW_PATH"
            fi
            curl -sL "$DOWNLOAD_URL" -o "data/current_typhoon.xml"
            echo "✅ 已成功儲存 HKO 颱風數據"
          else
            echo "目前沒有發現 HKO 活躍的颱風資料。"
            rm -f data/current_typhoon.xml
          fi

          # 2. 【新增】處理台灣災害防救科技中心 (NCDR) KML 資料
          echo "⬇️ 正在下載台灣 NCDR KML..."
          curl -sL "https://dwfile.ncdr.nat.gov.tw/opendata/NSTC/TYRoute/TYRoute.kml" -o "data/ncdr_typhoon.kml"
          echo "✅ 已成功儲存 NCDR 颱風數據"

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add data/
          
          git commit --allow-empty -m "Auto update HKO & NCDR typhoon data: $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ 已強制推送到 GitHub，確保快取刷新！"
