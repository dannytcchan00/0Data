name: Fetch Typhoon XML

on:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分鐘執行一次
  workflow_dispatch: # 允許手動觸發

jobs:
  fetch_xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 GitHub Action 寫入你的 Repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse XML
        run: |
          mkdir -p data
          
          # 1. 下載目錄清單 (加入 -L 防止天文台轉址)
          curl -sL "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml" -o data/tc_list.xml
          
          # 2. 暴力提取清單內的 .xml 檔名或網址
          RAW_PATH=$(grep -oE '[a-zA-Z0-9_:./-]+\.xml' data/tc_list.xml | grep -v 'tc_list.xml' | head -n 1 || echo "")
          
          if [ ! -z "$RAW_PATH" ]; then
            echo "成功提取到路徑: $RAW_PATH"
            
            # 3. 判斷是否為完整網址，如果不是則補上天文台前綴
            if [[ "$RAW_PATH" == http* ]]; then
              DOWNLOAD_URL="$RAW_PATH"
            else
              DOWNLOAD_URL="https://www.weather.gov.hk/wxinfo/currwx/$RAW_PATH"
            fi
            
            echo "即將下載網址: $DOWNLOAD_URL"
            
            # 4. 【重點改動】強制儲存為統一檔名 current_typhoon.xml
            curl -sL "$DOWNLOAD_URL" -o "data/current_typhoon.xml"
            echo "✅ 已成功儲存為 data/current_typhoon.xml"
          else
            echo "目前沒有發現活躍的颱風資料。"
            # 如果沒有颱風，自動刪除舊檔案，以免網頁顯示過期資料
            rm -f data/current_typhoon.xml
          fi

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 將 data 資料夾加入追蹤，這包含新增或被刪除的檔案
          git add data/
          
          # 檢查是否有檔案變動，有的話才進行 Commit 和 Push
          if ! git diff --staged --quiet; then
            git commit -m "Auto update typhoon data: $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ 數據已更新並推送到 GitHub！"
          else
            echo "⏸️ 數據與上次相同，無需更新。"
          fi
