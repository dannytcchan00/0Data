name: Fetch Typhoon XML and KML

on:
  workflow_dispatch: 
  repository_dispatch:
    types: [cronjob_trigger] 

jobs:
  fetch_xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse Weather Data
        run: |
          mkdir -p data
          
          # 1. HKO Data (Hong Kong Observatory)
          curl -sL "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml" -o data/tc_list.xml
          
          # 搵出所有颱風嘅 xml 網址
          RAW_PATHS=$(grep -oE '[a-zA-Z0-9_:./-]+\.xml' data/tc_list.xml | grep -v 'tc_list.xml' || echo "")
          
          if [ ! -z "$RAW_PATHS" ]; then
            # 建立一個新嘅 current_typhoon.xml，加上自訂嘅根節點 <ActiveTyphoons> 確保 XML 格式正確
            echo '<?xml version="1.0" encoding="UTF-8"?>' > data/current_typhoon.xml
            echo '<ActiveTyphoons>' >> data/current_typhoon.xml
            
            # 用 for loop 逐個下載並合併
            for RAW_PATH in $RAW_PATHS; do
              if [[ "$RAW_PATH" == http* ]]; then
                DOWNLOAD_URL="$RAW_PATH"
              else
                DOWNLOAD_URL="https://www.weather.gov.hk/wxinfo/currwx/$RAW_PATH"
              fi
              
              echo "⬇️ Downloading $DOWNLOAD_URL..."
              curl -sL "$DOWNLOAD_URL" -o data/temp_typhoon.xml
              
              # 移除獨立 XML 檔案嘅 xml header，將內容合併入 current_typhoon.xml
              grep -v '<?xml' data/temp_typhoon.xml >> data/current_typhoon.xml
            done
            
            # 閂返個根節點
            echo '</ActiveTyphoons>' >> data/current_typhoon.xml
            rm -f data/temp_typhoon.xml
            echo "✅ Successfully merged all active HKO typhoon data into current_typhoon.xml."
          else
            echo "No active HKO typhoon data found."
            rm -f data/current_typhoon.xml
          fi

          # 2. 台灣 NCDR KML
          echo "⬇️ Downloading Taiwan NCDR KML..."
          curl -sL "https://satis.ncdr.nat.gov.tw/kml/multityroute.aspx" -o "data/ncdr_typhoon.kml"
          echo "✅ Successfully saved NCDR typhoon data."

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/
          git commit --allow-empty -m "Auto update Typhoon data: $(date +'%Y-%m-%d %H:%M')"
          
          # 智能重試機制：最多嘗試 5 次
          for i in {1..5}; do
            git pull --rebase origin main
            if git push; then
              echo "✅ Typhoon Push 成功！"
              exit 0
            fi
            echo "⚠️ 伺服器鎖定中，隨機等待後重試... (第 $i 次/共 5 次)"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          
          echo "❌ 嘗試咗 5 次都失敗，放棄本次更新。"
          exit 1
