name: Fetch Typhoon XML and KML

on:
  schedule:
    - cron: '*/10 * * * *' 
  workflow_dispatch: 

jobs:
  fetch_xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse Weather Data
        run: |
          mkdir -p data
          
          # 1. HKO Data (Hong Kong Observatory)
          curl -sL "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml" -o data/tc_list.xml
          RAW_PATH=$(grep -oE '[a-zA-Z0-9_:./-]+\.xml' data/tc_list.xml | grep -v 'tc_list.xml' | head -n 1 || echo "")
          
          if [ ! -z "$RAW_PATH" ]; then
            if [[ "$RAW_PATH" == http* ]]; then
              DOWNLOAD_URL="$RAW_PATH"
            else
              DOWNLOAD_URL="https://www.weather.gov.hk/wxinfo/currwx/$RAW_PATH"
            fi
            curl -sL "$DOWNLOAD_URL" -o "data/current_typhoon.xml"
            echo "✅ Successfully saved HKO typhoon data."
          else
            echo "No active HKO typhoon data found."
            rm -f data/current_typhoon.xml
          fi

          # 2. 【已修正】直接抓取圖片中的「各國預報路徑」真實連結
          echo "⬇️ Downloading Taiwan NCDR KML..."
          curl -sL "https://satis.ncdr.nat.gov.tw/kml/multityroute.aspx" -o "data/ncdr_typhoon.kml"
          echo "✅ Successfully saved NCDR typhoon data."

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add data/
          
          # Force commit even if unchanged
          git commit --allow-empty -m "Auto update HKO & NCDR typhoon data: $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ Force push to GitHub complete, cache refreshed."
