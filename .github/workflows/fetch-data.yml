- name: Fetch and Parse XML
        run: |
          mkdir -p data
          
          # 1. 下載目錄清單
          curl -s "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml" -o data/tc_list.xml
          
          # 2. 找出清單內的內容 (可能是純檔名，也可能是完整網址)
          RAW_PATH=$(grep -oP '>[^<]+\.xml<' data/tc_list.xml | tr -d '><' | head -n 1 || echo "")
          
          if [ ! -z "$RAW_PATH" ]; then
            echo "抓取到字串: $RAW_PATH"
            
            # 使用 basename 提取最後純淨的檔名 (例如 hko_tctrack_2617.xml)
            FILENAME=$(basename "$RAW_PATH")
            
            # 判斷是否為完整網址，如果是就直接用，如果不是就加上天文台前綴
            if [[ "$RAW_PATH" == http* ]]; then
              DOWNLOAD_URL="$RAW_PATH"
            else
              DOWNLOAD_URL="https://www.weather.gov.hk/wxinfo/currwx/$RAW_PATH"
            fi
            
            echo "即將下載網址: $DOWNLOAD_URL"
            echo "將儲存為本地檔案: data/$FILENAME"
            
            # 下載實質資料檔並儲存為乾淨的檔名
            curl -s "$DOWNLOAD_URL" -o "data/$FILENAME"
          else
            echo "目前沒有活躍的颱風資料 (可能無風球)。"
          fi
