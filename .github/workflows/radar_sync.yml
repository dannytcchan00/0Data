name: Fetch HKO Radar Image

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download Latest Radar
        run: python update_radar.py

      - name: Force commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 更新為新的圖片路徑
          git add radar/imag/latest_radar.png
          
          # 強制 commit，無論檔案內容是否改變
          git commit -m "Auto-update HKO radar image" --allow-empty
          git push
