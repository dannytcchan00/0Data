name: Fetch HKO Radar Image

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download Latest Radar
        run: python update_radar.py

      - name: Force commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 將成個資料夾內所有更新嘅圖片加入
          git add radar/imag/
          
          git commit -m "Auto-update HKO radar animation frames" --allow-empty
          
          git pull --rebase origin main
          git push
