name: Fetch HKO Radar Image

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘自動執行一次
  workflow_dispatch: # 允許手動觸發

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download Latest Radar
        run: python update_radar.py

      - name: Force commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add latest_radar.png
          
          # 強制 commit 與 push，無視檔案是否有實質變更
          git commit -m "Auto-update HKO radar image" --allow-empty
          git push
