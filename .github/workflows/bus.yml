name: Auto Update Bus Dictionary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

# 1. 強制賦予 GitHub Actions 寫入代碼庫嘅權限 (解決 403 錯誤)
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JS script to fetch bus data
        run: node update_bus.js

      - name: Check file existence and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bus_dict.json
          
          # 2. 如果有變動先 commit，冇變動就顯示信息
          git commit -m "Auto-update bus_dict.json [skip ci]" || echo "No changes to commit"
          
          # 3. 自動推送到當前分支，無須硬性規定 main 定 master
          git push
