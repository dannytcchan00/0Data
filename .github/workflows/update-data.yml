name: Fetch HKO Weather Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download Wind CSV
        run: curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind_uc.csv -o data/latest_10min_wind_uc.csv

      - name: Download Temperature CSV
        run: curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_temperature_uc.csv -o data/latest_1min_temperature_uc.csv

      - name: Download Max/Min Temp CSV
        run: curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_since_midnight_maxmin_uc.csv -o data/latest_since_midnight_maxmin_uc.csv

      # 新增的 3 個數據下載 (注意 URL 帶有 & 符號所以加上了雙引號)
      - name: Download Visibility CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/opendata/opendata.php?dataType=LTMV&lang=tc&rformat=csv" -o data/latest_visibility.csv

      - name: Download Pressure CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_pressure_uc.csv" -o data/latest_1min_pressure_uc.csv

      - name: Download Rainfall CSV (已轉為繁體中文)
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=tc" -o data/hourlyRainfall.csv

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 將所有 CSV 加入 Git
          git add data/*.csv
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 6 HKO weather datasets" && git push)
