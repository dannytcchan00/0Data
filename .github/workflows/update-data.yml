name: Fetch HKO Weather Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cronjob_trigger] 

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download Wind CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind_uc.csv" -o data/wind_data.csv

      - name: Download Temp CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_temperature_uc.csv" -o data/temp_data.csv

      - name: Download Max/Min Temp CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_since_midnight_maxmin_uc.csv" -o data/maxmin_data.csv

      - name: Download Visibility CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/opendata/opendata.php?dataType=LTMV&lang=tc&rformat=csv" -o data/visibility_data.csv

      - name: Download Pressure CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_pressure_uc.csv" -o data/pressure_data.csv

      - name: Download Rainfall CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=tc" -o data/rain_data.csv

      - name: Download Solar CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_solar_uc.csv" -o data/solar_data.csv

      - name: Download Tide CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/tide/ALL_tc.csv" -o data/tide_data.csv

      - name: Download latest 1min Humidity CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_humidity.csv" -o data/latest_1min_humidity.csv

      - name: Download TAF Json
        run: curl -sL "https://aviationweather.gov/api/data/taf?ids=VHHH&format=json" -o data/TAF_VHHH.csv


      - name: Force Update Marker
        run: date > data/last_run.txt

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/
          git commit --allow-empty -m "Auto update HKO datasets: $(date +'%Y-%m-%d %H:%M')"
          
          # 智能重試機制：最多嘗試 5 次
          for i in {1..5}; do
            git pull --rebase origin main
            if git push; then
              echo "✅ HKO Push 成功！"
              exit 0
            fi
            echo "⚠️ 伺服器鎖定中，隨機等待後重試... (第 $i 次/共 5 次)"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          
          echo "❌ 嘗試咗 5 次都失敗，放棄本次更新。"
          exit 1
