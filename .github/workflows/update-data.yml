name: Fetch HKO Weather Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download Wind CSV
        run: curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind_uc.csv -o data/latest_10min_wind_uc.csv

      - name: Download Temperature CSV
        run: curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_temperature_uc.csv -o data/latest_1min_temperature_uc.csv

      - name: Download Max/Min Temp CSV
        run: curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_since_midnight_maxmin_uc.csv -o data/latest_since_midnight_maxmin_uc.csv

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 將三份 CSV 都加入 Git
          git add data/latest_10min_wind_uc.csv
          git add data/latest_1min_temperature_uc.csv
          git add data/latest_since_midnight_maxmin_uc.csv
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update HKO weather data (Wind, Temp, MaxMin)" && git push)
