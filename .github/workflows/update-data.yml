name: Fetch HKO Weather Data (English)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download Wind CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind_en.csv" -o data/wind_en.csv

      - name: Download Temperature CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_temperature_en.csv" -o data/temp_en.csv

      - name: Download Max/Min Temp CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_since_midnight_maxmin_en.csv" -o data/maxmin_en.csv

      - name: Download Visibility CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/opendata/opendata.php?dataType=LTMV&lang=en&rformat=csv" -o data/visibility_en.csv

      - name: Download Pressure CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_pressure_en.csv" -o data/pressure_en.csv

      - name: Download Rainfall CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=en" -o data/rain_en.csv

      - name: Download Solar Radiation CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_solar_en.csv" -o data/solar_en.csv

      - name: Download Tide CSV
        run: curl -sL "https://data.weather.gov.hk/weatherAPI/hko_data/tide/ALL_en.csv" -o data/tide_en.csv

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/*.csv
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EN weather datasets including Solar & Tide" && git push)
