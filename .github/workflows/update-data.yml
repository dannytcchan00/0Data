name: Fetch HKO Weather Data

# 設定觸發條件
on:
  schedule:
    # 每 10 分鐘執行一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 容許手動執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download Wind CSV from HKO
        run: |
          curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind_uc.csv -o data/latest_10min_wind_uc.csv

      - name: Download Temperature CSV from HKO
        run: |
          curl -sL https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_temperature_uc.csv -o data/latest_1min_temperature_uc.csv

      - name: Commit and Push changes
        run: |
          # 設定 Git 使用者
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 將兩份 CSV 都加入 Git
          git add data/latest_10min_wind_uc.csv
          git add data/latest_1min_temperature_uc.csv
          
          # 如果數據有更新，就 Commit 同 Push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update HKO wind and temperature data" && git push)
