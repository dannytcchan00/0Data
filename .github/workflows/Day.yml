name: Auto Download D bay CSV

on:
  schedule:
    - cron: '0 1 * * *'  # 每日UTC 1點 (香港9點)
  workflow_dispatch:

permissions:
  contents: write  # 關鍵：授予寫入權限

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup directories and download CSV
        run: |
          mkdir -p data/travel/DBay/
          curl -L -o data/travel/DBay/data.csv \
            "https://www.td.gov.hk/datagovhk_td/ferry-tt-ft/resources/en/ferry_central_db_timetable_eng.csv"
          
          echo "✅ CSV size: $(wc -c < data/travel/DBay/data.csv) bytes"

      - name: Commit and push if changed
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/travel/DBay/data.csv'
          message: '🤖 Auto Download DBay CSV ({{ github.run_number }})'
          default_author: github_actions
