<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>綜合天氣預報 - HK Dashboard</title>
    
    <style>
        :root {
            --bg-color: #000000; 
            --panel-bg: #0c0c0c; 
            --panel-border: #1a1a1a;
            --text-main: #ffffff; 
            --text-muted: #666666; 
            --warning-red: #ff4d4d;
            --normal-bg: rgba(255, 255, 255, 0.02);
            --accent-blue: #4da6ff;
            --accent-yellow: #ffd700;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 15px;
            min-height: 100vh;
        }

        .panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border); 
            border-radius: 16px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            margin-bottom: 15px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 頂部：實時天氣與時間 */
        .top-info-bar { 
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
            border-bottom: 1px solid var(--panel-border); 
            padding-bottom: 8px; 
            margin-bottom: 12px;
        }
        .date-container { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1.1rem; font-weight: 600; color: #fff; }
        
        .weather-time-main { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 15px; 
            background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); 
            border-radius: 12px 12px 0 0; 
            border: 1px solid rgba(255,255,255,0.05); 
            border-bottom: none; 
            gap: 10px; 
        }
        .time-block { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .time-display { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .utc-display { font-size: 1rem; font-weight: 500; color: #888; font-variant-numeric: tabular-nums; }

        .weather-block { display: flex; align-items: center; gap: 12px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 12px; }
        .weather-status-icon { width: 70px; height: 70px; min-width: 70px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        
        .weather-current-stats { display: flex; flex-direction: column; align-items: flex-end; }
        .current-temp { font-size: 2.2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: -1px; }
        .current-hum { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }
        .current-hum span { color: var(--accent-blue); font-weight: 700; font-size: 1rem; }
        
        .weather-grid-inline { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 4px; 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-top: none; 
            border-radius: 0 0 12px 12px; 
            padding: 8px; 
            margin-bottom: 20px;
        }
        .w-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .w-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap;}
        .w-val { font-size: 0.95rem; font-weight: 700; color: #ddd; }

        /* 九天預報區塊 */
        h2 { 
            margin: 0 0 12px 0; 
            font-size: 1.05rem; 
            color: var(--text-muted); 
            border-bottom: 1px solid var(--panel-border); 
            padding-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .refresh-indicator { font-size: 0.75rem; color: #00ff66; font-weight: normal; }

        .situation-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ddd;
        }

        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
        
        .forecast-item { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 12px; 
            padding: 12px 8px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            transition: background 0.2s; 
        }
        
        .forecast-item:hover { background: rgba(255,255,255,0.1); }
        .fc-date { font-size: 0.85rem; color: #ccc; font-weight: bold; }
        .fc-icon { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); margin: 4px 0; }
        .fc-temp { font-size: 0.9rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        .fc-hum { font-size: 0.75rem; color: var(--accent-blue); font-weight: 600; }
        
        .fc-psr { 
            font-size: 0.75rem; 
            font-weight: 600; 
            padding: 2px 6px; 
            border-radius: 6px; 
            background: rgba(0,0,0,0.4);
            margin-top: 2px;
            color: #ddd;
        }
        .psr-high { color: var(--warning-red); }
        .psr-mid { color: var(--accent-yellow); }

        #loading-text { text-align: center; color: var(--accent-blue); padding: 20px; font-size: 0.95rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="top-info-bar">
            <div class="date-container">
                <div class="date-display" id="current-date">📅 --年--月--日</div>
            </div>
        </div>
        
        <div>
            <div class="weather-time-main">
                <div class="time-block">
                    <div class="time-display" id="hk-time">--:--</div>
                    <div class="utc-display" id="utc-time">--:-- UTC</div>
                </div>
                <div class="weather-block">
                    <div class="weather-current-stats">
                        <div class="current-temp" id="hk-temp">--°C</div>
                        <div class="current-hum">相對濕度 <span id="hk-hum">--%</span></div>
                    </div>
                    <img class="weather-status-icon" id="weather-icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Weather Icon">
                </div>
            </div>
            <div class="weather-grid-inline">
                <div class="w-item"><div class="w-label">UV指數</div><div class="w-val" id="hk-uv">--</div></div>
                <div class="w-item"><div class="w-label">降雨概率</div><div class="w-val" id="hk-psr">--</div></div>
                <div class="w-item"><div class="w-label">今日最高</div><div class="w-val" id="hk-max">--°C</div></div>
                <div class="w-item"><div class="w-label">今日最低</div><div class="w-val" id="hk-min">--°C</div></div>
            </div>
        </div>

        <h2>
            <span>🌈 九天天氣預報 Extended Forecast</span>
            <span class="refresh-indicator" id="refresh-status">🔄 更新中...</span>
        </h2>
        
        <div class="situation-box" id="general-situation">
            載入天氣概況中...
        </div>

        <div class="forecast-grid" id="forecast-container">
            <div id="loading-text" style="grid-column: 1/-1;">🔄 正在連接香港天文台數據庫...</div>
        </div>
    </div>

    <script>
        function updateTick() {
            const now = new Date();
            const daysZh = ['日','一','二','三','四','五','六'];
            let dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
            let dayText = `禮拜${daysZh[now.getDay()]}`;
            
            document.getElementById('current-date').innerText = `📅 ${dateStr} ( ${dayText} )`;
            document.getElementById('hk-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
            document.getElementById('utc-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'UTC', hour12: false, hour: '2-digit', minute: '2-digit' }) + ' UTC';
        }

        async function fetchAllWeather() {
            try {
                const statusEl = document.getElementById('refresh-status');
                const container = document.getElementById('forecast-container');
                const situationEl = document.getElementById('general-situation');
                
                statusEl.innerText = '🔄 更新中...';
                const ts = Date.now();
                
                const rtRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${ts}`, { cache: 'no-store' });
                const rtData = await rtRes.json();
                
                if (rtData.icon && rtData.icon[0]) {
                    document.getElementById('weather-icon').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rtData.icon[0]}.png`;
                }
                
                let hkoPlace = '香港天文台';
                let t = rtData.temperature.data.find(x => x.place === hkoPlace) || rtData.temperature.data[0]; 
                if(t) document.getElementById('hk-temp').innerText = `${t.value}°C`;
                
                let h = rtData.humidity.data.find(x => x.place === hkoPlace) || rtData.humidity.data[0]; 
                if(h) document.getElementById('hk-hum').innerText = `${h.value}%`;
                
                if(rtData.uvindex && rtData.uvindex.data && rtData.uvindex.data[0]) {
                    document.getElementById('hk-uv').innerHTML = rtData.uvindex.data[0].value;
                } else {
                    document.getElementById('hk-uv').innerHTML = '--';
                }

                const fndRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_=${ts}`, { cache: 'no-store' });
                const fnd = await fndRes.json();
                
                if (fnd.generalSituation) {
                    situationEl.innerText = fnd.generalSituation;
                }

                if (fnd.weatherForecast) {
                    document.getElementById('hk-max').innerText = `${fnd.weatherForecast[0].forecastMaxtemp.value}°C`;
                    document.getElementById('hk-min').innerText = `${fnd.weatherForecast[0].forecastMintemp.value}°C`;
                    document.getElementById('hk-psr').innerText = fnd.weatherForecast[0].PSR;

                    let html = '';
                    fnd.weatherForecast.forEach(fc => {
                        let m = parseInt(fc.forecastDate.substring(4,6), 10); 
                        let d = parseInt(fc.forecastDate.substring(6,8), 10);
                        
                        let psrClass = fc.PSR.includes('高') ? "psr-high" : (fc.PSR.includes('中') ? "psr-mid" : "");
                        let psrIcon = fc.PSR.includes('高') ? "🌧️" : (fc.PSR.includes('中') ? "☁️" : "☀️");
                        
                        html += `
                            <div class="forecast-item">
                                <div class="fc-date">${m}月${d}日<br><span style="font-size: 0.75rem; font-weight: normal;">${fc.week}</span></div>
                                <img class="fc-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${fc.ForecastIcon}.png" alt="Weather Icon">
                                <div class="fc-temp">${fc.forecastMintemp.value}° - ${fc.forecastMaxtemp.value}°</div>
                                <div class="fc-hum">💧 ${fc.forecastMinrh.value}% - ${fc.forecastMaxrh.value}%</div>
                                <div class="fc-psr ${psrClass}">${psrIcon} ${fc.PSR}</div>
                            </div>
                        `;
                    });
                    
                    container.innerHTML = html;
                    statusEl.innerText = '🟢 已更新';
                    statusEl.style.color = '#00ff66';
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('refresh-status').innerText = '🔴 連線失敗';
                document.getElementById('refresh-status').style.color = 'var(--warning-red)';
                document.getElementById('loading-text').innerHTML = '⚠️ 無法取得數據，請稍後再試。';
            }
        }

        updateTick();
        setInterval(updateTick, 1000);
        
        fetchAllWeather();
        setInterval(fetchAllWeather, 300000);
    </script>
</body>
</html>
