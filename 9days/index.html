<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Neo-brutalism Weather - HK Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4F4F0; 
            --border-color: #000000;
            --border-width: 4px;
            --shadow-offset: 6px;
            --text-main: #000000; 
            
            /* Neo-brutalism 特色鮮明色彩 */
            --accent-yellow: #FFD93D;
            --accent-pink: #FF6B6B;
            --accent-blue: #4D96FF;
            --accent-green: #6BCB77;
            --accent-purple: #9D4EDD;
            --card-bg: #FFFFFF;
        }
        
        * { box-sizing: border-box; }
        
        html, body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            margin: 0; 
            padding: 12px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-weight: 700;
        }

        /* 專為 iPad / iPhone / iframe 設計嘅全屏捲動容器 */
        .weather-scroll-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 5px 8px 15px 5px;
        }
        
        /* 隱藏捲動軸，保持粗野主義乾淨感 */
        .weather-scroll-container::-webkit-scrollbar { width: 0px; }

        /* Neo-brutalism 基礎卡片設計 */
        .neo-card { 
            background: var(--card-bg); 
            border: var(--border-width) solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .neo-card.clickable:active {
            transform: translate(var(--shadow-offset), var(--shadow-offset));
            box-shadow: 0px 0px 0px var(--border-color);
        }

        /* 頂部：實時天氣 */
        .top-info-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: var(--border-width) solid var(--border-color); 
            padding-bottom: 12px; margin-bottom: 15px;
        }
        .date-display { font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px; }
        .refresh-indicator { font-size: 0.85rem; background: var(--border-color); color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: 800;}

        .weather-time-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px;}
        .time-display { font-size: 3.5rem; font-weight: 900; line-height: 1; letter-spacing: -2px; }
        .utc-display { font-size: 1.1rem; color: #555; }

        .weather-block { display: flex; align-items: center; gap: 15px; }
        .weather-status-icon { width: 85px; height: 85px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.2)); }
        
        .weather-current-stats { display: flex; flex-direction: column; align-items: flex-end; }
        .current-temp { font-size: 2.8rem; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .current-hum { font-size: 1.1rem; background: var(--accent-blue); padding: 4px 10px; border: 2px solid #000; border-radius: 6px; box-shadow: 2px 2px 0px #000; white-space: nowrap;}

        /* 四格小數據 */
        .weather-grid-inline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .w-item { 
            border: var(--border-width) solid var(--border-color); 
            border-radius: 8px; padding: 10px; text-align: center;
            box-shadow: 4px 4px 0px var(--border-color);
        }
        .w-item:nth-child(1) { background-color: var(--accent-pink); }
        .w-item:nth-child(2) { background-color: var(--accent-blue); }
        .w-item:nth-child(3) { background-color: var(--accent-green); }
        .w-item:nth-child(4) { background-color: var(--accent-yellow); }
        .w-label { font-size: 0.85rem; font-weight: 900; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px; white-space: nowrap;}
        .w-val { font-size: 1.2rem; font-weight: 900; white-space: nowrap;}

        /* 標題與概況 */
        h2 { font-size: 1.5rem; font-weight: 900; margin: 10px 0; border-bottom: var(--border-width) solid var(--border-color); padding-bottom: 10px;}
        .situation-box { background: #fff; font-size: 1.05rem; line-height: 1.6; margin-bottom: 20px; font-weight: 700;}

        /* 九天預報 Grid */
        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 12px; }
        
        .forecast-item { 
            background: #fff; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px 10px;
        }
        
        .fc-date { font-size: 1.1rem; font-weight: 900; line-height: 1.2;}
        .fc-date span { font-size: 0.85rem; font-weight: 700; background: #000; color: #fff; padding: 2px 8px; border-radius: 10px; margin-top: 4px; display: inline-block;}
        .fc-icon { width: 55px; height: 55px; filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.2)); }
        .fc-temp { font-size: 1.05rem; font-weight: 900; background: var(--accent-yellow); border: 2px solid #000; padding: 4px; width: 100%; border-radius: 6px; white-space: nowrap;}
        .fc-psr { font-size: 0.85rem; font-weight: 900; padding: 4px 8px; border: 2px solid #000; border-radius: 6px; background: #fff; white-space: nowrap;}
        .psr-high { background: var(--accent-pink); }
        .psr-mid { background: var(--accent-yellow); }

        #loading-text { text-align: center; font-size: 1.2rem; padding: 30px; grid-column: 1/-1; background: var(--accent-yellow); border: var(--border-width) solid #000;}

        /* ===== Modal (彈出式詳細資料) ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s;
            padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--bg-color);
            width: 100%; max-width: 500px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 10px 10px 0px var(--border-color);
            border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
            transform: translateY(20px); transition: transform 0.2s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header {
            background: var(--accent-yellow);
            padding: 15px 20px; border-bottom: var(--border-width) solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 1.5rem; font-weight: 900; }
        
        .close-btn {
            background: var(--accent-pink); border: 3px solid #000; width: 40px; height: 40px;
            border-radius: 50%; font-size: 1.2rem; font-weight: 900; cursor: pointer;
            box-shadow: 3px 3px 0px #000; transition: 0.1s; display: flex; justify-content: center; align-items: center; padding: 0;
        }
        .close-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }

        .modal-body { padding: 20px; font-size: 1.1rem; line-height: 1.6; overflow-y: auto; max-height: 60vh; background: #fff;}
        
        .modal-data-row {
            display: flex; border: 3px solid #000; margin-bottom: 15px; border-radius: 8px; box-shadow: 4px 4px 0px #000; overflow: hidden;
        }
        .modal-data-label {
            background: var(--accent-blue); padding: 12px; width: 110px; border-right: 3px solid #000; font-weight: 900; display: flex; align-items: center; flex-shrink: 0;
        }
        .modal-data-value { padding: 12px; flex: 1; font-weight: 700; background: #fff;}
        
        .wth-desc-box {
            background: var(--accent-green); border: 3px solid #000; box-shadow: 4px 4px 0px #000; padding: 15px; border-radius: 8px; font-weight: 800; margin-top: 20px;
        }

        /* =========================================
           📱 手機版專屬優化 (iPhone 等窄螢幕)
           ========================================= */
        @media screen and (max-width: 600px) {
            .top-info-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .weather-time-main {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .weather-block {
                width: 100%;
                justify-content: space-between;
            }

            /* 字體自動縮細以防出界 */
            .time-display { font-size: 2.8rem; }
            .current-temp { font-size: 2.5rem; }
            .date-display { font-size: 1.1rem; }
            
            /* 四格小數據變成 2x2 */
            .weather-grid-inline {
                grid-template-columns: repeat(2, 1fr);
            }

            /* 手機版 Modal 排版修正 */
            .modal-data-row {
                flex-direction: column;
            }
            .modal-data-label {
                width: 100%;
                border-right: none;
                border-bottom: 3px solid #000;
                justify-content: center;
            }
            .modal-data-value {
                text-align: center;
            }
            .forecast-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="weather-scroll-container">
        <!-- 頂部：實時天氣與時間 -->
        <div class="neo-card" style="background: var(--accent-yellow);">
            <div class="top-info-bar">
                <div class="date-display" id="current-date">--年--月--日</div>
                <div class="refresh-indicator" id="refresh-status">更新中...</div>
            </div>
            
            <div class="weather-time-main">
                <div class="time-block">
                    <div class="time-display" id="hk-time">--:--</div>
                    <div class="utc-display" id="utc-time">--:-- UTC</div>
                </div>
                <div class="weather-block">
                    <div class="weather-current-stats">
                        <div class="current-temp" id="hk-temp">--°C</div>
                        <div class="current-hum">💧 <span id="hk-hum">--%</span></div>
                    </div>
                    <img class="weather-status-icon" id="weather-icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Weather Icon">
                </div>
            </div>
            
            <div class="weather-grid-inline">
                <div class="w-item"><div class="w-label">UV指數</div><div class="w-val" id="hk-uv">--</div></div>
                <div class="w-item"><div class="w-label">降雨概率</div><div class="w-val" id="hk-psr">--</div></div>
                <div class="w-item"><div class="w-label">今日最高</div><div class="w-val" id="hk-max">--°C</div></div>
                <div class="w-item"><div class="w-label">今日最低</div><div class="w-val" id="hk-min">--°C</div></div>
            </div>
        </div>

        <!-- 下方：九天天氣預報 -->
        <div class="neo-card" style="background: var(--accent-blue);">
            <h2>🌈 九天天氣預報</h2>
            <div class="neo-card situation-box" id="general-situation">載入天氣概況中...</div>
            <div class="forecast-grid" id="forecast-container">
                <div class="neo-card clickable" id="loading-text">🔄 正在連接香港天文台數據庫...</div>
            </div>
        </div>
    </div>

    <!-- 詳細天氣 Modal -->
    <div id="weather-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">--月--日</h3>
                <button class="close-btn" onclick="closeModal()">✖</button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <!-- 動態注入內容 -->
            </div>
        </div>
    </div>

    <script>
        // 儲存九天預報數據供 Modal 使用
        let globalForecastData = [];

        function updateTick() {
            const now = new Date();
            const daysZh = ['日','一','二','三','四','五','六'];
            document.getElementById('current-date').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (禮拜${daysZh[now.getDay()]})`;
            document.getElementById('hk-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
            document.getElementById('utc-time').innerText = now.toLocaleTimeString('en-US', { timeZone: 'UTC', hour12: false, hour: '2-digit', minute: '2-digit' }) + ' UTC';
        }

        async function fetchAllWeather() {
            try {
                const statusEl = document.getElementById('refresh-status');
                statusEl.innerText = '🔄 Syncing...';
                const ts = Date.now();
                
                // 1. 實時天氣
                const rtRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${ts}`, { cache: 'no-store' });
                const rtData = await rtRes.json();
                
                if (rtData.icon && rtData.icon[0]) document.getElementById('weather-icon').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rtData.icon[0]}.png`;
                
                let hkoPlace = '香港天文台';
                let t = rtData.temperature.data.find(x => x.place === hkoPlace) || rtData.temperature.data[0]; 
                if(t) document.getElementById('hk-temp').innerText = `${t.value}°C`;
                let h = rtData.humidity.data.find(x => x.place === hkoPlace) || rtData.humidity.data[0]; 
                if(h) document.getElementById('hk-hum').innerText = `${h.value}%`;
                document.getElementById('hk-uv').innerHTML = (rtData.uvindex && rtData.uvindex.data && rtData.uvindex.data[0]) ? rtData.uvindex.data[0].value : '--';

                // 2. 九天預報
                const fndRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_=${ts}`, { cache: 'no-store' });
                const fnd = await fndRes.json();
                
                if (fnd.generalSituation) document.getElementById('general-situation').innerText = fnd.generalSituation;

                if (fnd.weatherForecast) {
                    globalForecastData = fnd.weatherForecast; // 儲存入全域變數
                    
                    document.getElementById('hk-max').innerText = `${fnd.weatherForecast[0].forecastMaxtemp.value}°C`;
                    document.getElementById('hk-min').innerText = `${fnd.weatherForecast[0].forecastMintemp.value}°C`;
                    document.getElementById('hk-psr').innerText = fnd.weatherForecast[0].PSR;

                    let html = '';
                    fnd.weatherForecast.forEach((fc, index) => {
                        let m = parseInt(fc.forecastDate.substring(4,6), 10); 
                        let d = parseInt(fc.forecastDate.substring(6,8), 10);
                        let psrClass = fc.PSR.includes('高') ? "psr-high" : (fc.PSR.includes('中') ? "psr-mid" : "");
                        
                        // 加入 onclick 事件呼叫 Modal
                        html += `
                            <div class="neo-card clickable forecast-item" onclick="openModal(${index})">
                                <div class="fc-date">${m}/${d}<br><span>${fc.week}</span></div>
                                <img class="fc-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${fc.ForecastIcon}.png" alt="Icon">
                                <div class="fc-temp">${fc.forecastMintemp.value}°-${fc.forecastMaxtemp.value}°</div>
                                <div class="fc-psr ${psrClass}">💧 ${fc.PSR}</div>
                            </div>
                        `;
                    });
                    
                    document.getElementById('forecast-container').innerHTML = html;
                    statusEl.innerText = '🟢 UPDATED';
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('refresh-status').innerText = '🔴 ERROR';
                document.getElementById('loading-text').innerHTML = '⚠️ 無法取得數據';
            }
        }

        // ===== Modal 控制邏輯 =====
        function openModal(index) {
            const data = globalForecastData[index];
            if (!data) return;

            let m = parseInt(data.forecastDate.substring(4,6), 10); 
            let d = parseInt(data.forecastDate.substring(6,8), 10);
            
            document.getElementById('modal-title').innerText = `📅 ${m}月${d}日 (${data.week})`;

            document.getElementById('modal-body-content').innerHTML = `
                <div style="text-align:center; margin-bottom: 20px;">
                    <img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${data.ForecastIcon}.png" style="width: 100px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.2));">
                </div>
                
                <div class="modal-data-row">
                    <div class="modal-data-label" style="background: var(--accent-yellow);">🌡️ 氣溫</div>
                    <div class="modal-data-value">${data.forecastMintemp.value}°C - ${data.forecastMaxtemp.value}°C</div>
                </div>
                <div class="modal-data-row">
                    <div class="modal-data-label" style="background: var(--accent-pink);">💧 濕度</div>
                    <div class="modal-data-value">${data.forecastMinrh.value}% - ${data.forecastMaxrh.value}%</div>
                </div>
                <div class="modal-data-row">
                    <div class="modal-data-label" style="background: var(--accent-blue);">🌧️ 降雨概率</div>
                    <div class="modal-data-value">${data.PSR}</div>
                </div>
                <div class="modal-data-row">
                    <div class="modal-data-label" style="background: var(--accent-purple); color: #fff;">💨 風向風速</div>
                    <div class="modal-data-value">${data.forecastWind}</div>
                </div>

                <div class="wth-desc-box">
                    📝 預報概況：<br><span style="font-size: 1.15rem; font-weight: 900; display: block; margin-top: 8px;">${data.forecastWeather}</span>
                </div>
            `;

            document.getElementById('weather-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('weather-modal').classList.remove('active');
        }

        // 點擊背景關閉 Modal
        document.getElementById('weather-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // 啟動系統
        updateTick();
        setInterval(updateTick, 1000);
        
        fetchAllWeather();
        setInterval(fetchAllWeather, 300000); // 5分鐘自動更新
    </script>
</body>
</html>
