<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ferry Live Timetable</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
    .container{display:flex;min-height:100vh;max-width:1600px;margin:0 auto}
    .sidebar{width:360px;background:rgba(15,15,15,.95);border-right:1px solid #333;padding:26px 18px;overflow-y:auto}
    .main{flex:1;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:flex-start;align-items:stretch}

    .header{font-size:26px;font-weight:800;margin-bottom:18px;background:linear-gradient(135deg,#00d4ff,#0099cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
    .route-group{margin-bottom:18px}
    .route-group h3{font-size:12px;margin-bottom:10px;color:#aaa;font-weight:750;text-transform:uppercase;letter-spacing:1px}
    .route-btn{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-size:15px;margin-bottom:10px;text-align:left;transition:all .25s ease}
    .route-btn.active{background:linear-gradient(135deg,#00d4ff,#0099cc);border-color:#00d4ff;box-shadow:0 8px 32px rgba(0,212,255,.25)}
    .route-btn:disabled{opacity:.45;cursor:not-allowed}
    .hint{font-size:12px;color:#888;margin:-2px 0 12px 0;line-height:1.35}

    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px}
    .title{font-size:18px;font-weight:800;margin-bottom:8px}
    .meta{font-size:13px;color:#c7c7c7;line-height:1.5;white-space:pre-wrap}

    .route-row{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:stretch}

    /* Minimal fare table */
    .fare-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px}
    .fare-title{font-size:14px;font-weight:850;margin-bottom:4px}
    .fare-sub{font-size:12px;color:#aaa;margin-bottom:10px}
    table.fare-table{width:100%;border-collapse:collapse;font-size:13px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
    .fare-table th,.fare-table td{padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
    .fare-table th{text-align:left;font-weight:850;color:#ddd;background:rgba(255,255,255,.03)}
    .fare-table td.num{text-align:right;font-variant-numeric:tabular-nums}
    .fare-note{font-size:11px;color:#888;margin-top:8px;line-height:1.35}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

    .panel{background:rgba(20,20,20,.8);border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.08)}
    .panel.outbound{border-left:6px solid #2f81f7}
    .panel.inbound{border-left:6px solid #f97316}
    .panel h3{font-size:14px;font-weight:850;text-align:center;margin-bottom:10px}
    .panel.outbound h3{color:#b6d6ff}
    .panel.inbound h3{color:#ffd4b5}

    .countdown-wrap{display:flex;justify-content:center}
    .countdown{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:32px;font-weight:900;letter-spacing:.5px;
      padding:8px 12px;border-radius:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
    }
    .panel.outbound .countdown{border-color:rgba(47,129,247,.45)}
    .panel.inbound .countdown{border-color:rgba(249,115,22,.45)}

    .sub{font-size:12px;color:#aaa;text-align:center;margin:8px 0 10px}
    .nextbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;text-align:center;margin-bottom:10px}
    .status{display:inline-block;font-size:12px;font-weight:850;padding:6px 10px;border-radius:999px}
    .status.on{border:1px solid rgba(46,204,113,.35);background:rgba(46,204,113,.15);color:#2ecc71}
    .status.tom{border:1px solid rgba(52,152,219,.35);background:rgba(52,152,219,.15);color:#3498db}
    .timebig{font-size:18px;font-weight:900;margin-top:4px}

    .section-title{font-size:12px;color:#aaa;font-weight:850;letter-spacing:.8px;margin:10px 0 6px}
    ul{list-style:none;max-height:320px;overflow:auto;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:0 12px;background:rgba(255,255,255,.02)}
    li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;flex-wrap:wrap}
    li:last-child{border-bottom:none}
    .t{font-weight:850;min-width:64px}
    .tag{font-size:12px;font-weight:750;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#ddd}
    .panel.outbound .tag{color:#b6d6ff;border-color:rgba(47,129,247,.35);background:rgba(47,129,247,.12)}
    .panel.inbound .tag{color:#ffd4b5;border-color:rgba(249,115,22,.35);background:rgba(249,115,22,.12)}

    @media (max-width:1100px){.route-row{grid-template-columns:1fr}}
    @media (max-width:900px){
      .container{flex-direction:column}
      .sidebar{width:100%;border-right:none;border-bottom:1px solid #333}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="header">Ferry Live</div>

      <div class="route-group">
        <h3>HKKF</h3>
        <button class="route-btn active" data-route="central-sokkwuwan">Central ↔ Sok Kwu Wan</button>
        <button class="route-btn" data-route="central-yungshuewan">Central ↔ Yung Shue Wan</button>
        <button class="route-btn" data-route="central-pengchau">Central ↔ Peng Chau</button>
      </div>

      <div class="route-group">
        <h3>Sun Ferry</h3>
        <button class="route-btn" data-route="central-cheungchau">Central ↔ Cheung Chau</button>
        <button class="route-btn" data-route="central-muiwo">Central ↔ Mui Wo</button>
      </div>

      <div class="route-group">
        <h3>Discovery Bay</h3>
        <button class="route-btn" data-route="central-discoverybay">Central ↔ Discovery Bay</button>
        <div class="hint">Timetables are loaded from public CSV datasets. Fares are shown where provided.</div>
      </div>
    </div>

    <div class="main" id="main-content">
      <div class="card">
        <div class="title">Loading…</div>
        <div class="meta">Fetching timetable data</div>
      </div>
    </div>
  </div>

<script>
  const URLS = {
    HKKF: {
      CSKW: 'https://dannytcchan00.github.io/0Data/data/travel/HKKF/Central_Sok_Kwu_Wan/data.csv',
      SKWC: 'https://dannytcchan00.github.io/0Data/data/travel/HKKF/Sok_Kwu_Wan_Central/data.csv',
      CYSW: 'https://dannytcchan00.github.io/0Data/data/travel/HKKF/Central_Yung_Shue_Wan/data.csv',
      YSWC: 'https://dannytcchan00.github.io/0Data/data/travel/HKKF/Yung_Shue_Wan_Central/data.csv',
      CPC:  'https://dannytcchan00.github.io/0Data/data/travel/HKKF/Central_Peng_Chau/data.csv',
      PCC:  'https://dannytcchan00.github.io/0Data/data/travel/HKKF/Peng_Chau_Central/data.csv'
    },
    SUN: {
      CCC: 'https://dannytcchan00.github.io/0Data/data/travel/SunFerry/Central_Cheung_Chau/data.csv',
      CMW: 'https://dannytcchan00.github.io/0Data/data/travel/SunFerry/Central_Mui_Wo/data.csv'
    },
    DBAY: {
      MAIN: 'https://dannytcchan00.github.io/0Data/data/travel/DBay/data.csv'
    }
  };

  const FARES = {
    'central-cheungchau': {
      title: 'Cheung Chau fares (one-way)',
      weekdaySatLabel: 'Mondays–Saturdays (except public holidays)',
      holidayLabel: 'Sundays & public holidays',
      weekdaySat: { services:['Ordinary','Fast'], rows:[
        { label:'Adult', values:[14.8,29.2] },
        { label:'Elderly / Child / Disabled', values:[7.4,14.5] }
      ]},
      holiday: { services:['Ordinary','Fast'], rows:[
        { label:'Adult', values:[22.0,42.3] },
        { label:'Elderly / Child / Disabled', values:[11.0,21.1] }
      ]}
    },
    'central-muiwo': {
      title: 'Mui Wo fares (one-way)',
      weekdaySatLabel: 'Mondays–Saturdays (except public holidays)',
      holidayLabel: 'Sundays & public holidays',
      weekdaySat: { services:['Ordinary','Fast'], rows:[
        { label:'Adult', values:[28.6,34.1] },
        { label:'Elderly / Child / Disabled', values:[14.2,17.0] }
      ]},
      holiday: { services:['Ordinary','Fast'], rows:[
        { label:'Adult', values:[41.9,48.9] },
        { label:'Elderly / Child / Disabled', values:[20.9,24.5] }
      ]}
    },
    'central-pengchau': {
      title: 'Peng Chau fares (one-way)',
      weekdaySatLabel: 'Mondays–Saturdays (except public holidays)',
      holidayLabel: 'Sundays & public holidays',
      weekdaySat: { services:['Ordinary','Fast'], rows:[
        { label:'Adult', values:[19.8,36.9] },
        { label:'Elderly / Child / Disabled', values:[9.9,18.4] }
      ]},
      holiday: { services:['Ordinary','Fast'], rows:[
        { label:'Adult', values:[28.4,54.3] },
        { label:'Elderly / Child / Disabled', values:[14.2,27.1] }
      ]}
    },
    'central-yungshuewan': {
      title: 'Yung Shue Wan fares (one-way)',
      weekdaySatLabel: 'Mondays–Saturdays (except public holidays)',
      holidayLabel: 'Sundays & public holidays',
      weekdaySat: { services:['Fare'], rows:[
        { label:'Adult', values:[22.0] },
        { label:'Elderly / Child / Disabled', values:[11.0] }
      ]},
      holiday: { services:['Fare'], rows:[
        { label:'Adult', values:[30.8] },
        { label:'Elderly / Child / Disabled', values:[15.4] }
      ]}
    },
    'central-sokkwuwan': {
      title: 'Sok Kwu Wan fares (one-way)',
      weekdaySatLabel: 'Mondays–Saturdays (except public holidays)',
      holidayLabel: 'Sundays & public holidays',
      weekdaySat: { services:['Fare'], rows:[
        { label:'Adult', values:[27.5] },
        { label:'Elderly / Child / Disabled', values:[13.7] }
      ]},
      holiday: { services:['Fare'], rows:[
        { label:'Adult', values:[38.7] },
        { label:'Elderly / Child / Disabled', values:[19.3] }
      ]}
    },
    'central-discoverybay': {
      title: 'Discovery Bay fares (one-way)',
      weekdaySatLabel: 'All days (as provided)',
      holidayLabel: 'All days (as provided)',
      weekdaySat: { services:['Fare'], rows:[
        { label:'Non-resident – Adult', values:[55.8] },
        { label:'Non-resident – Concessionary', values:[27.9] },
        { label:'Resident – Adult', values:[38.2] },
        { label:'Resident – Concessionary', values:[19.1] }
      ]},
      holiday: { services:['Fare'], rows:[
        { label:'Non-resident – Adult', values:[55.8] },
        { label:'Non-resident – Concessionary', values:[27.9] },
        { label:'Resident – Adult', values:[38.2] },
        { label:'Resident – Concessionary', values:[19.1] }
      ]}
    }
  };

  const HEI_LING_CHAU_INFO_FOR_PENGCHAU = {
    fromHei: { '07:25': '07:10', '13:00': '12:45', '18:50': '18:35' },
    toHei:   { '09:15': '09:25', '15:15': '15:25', '19:30': '19:40' }
  };

  let routesData = {};
  let currentRoute = 'central-sokkwuwan';
  let hasInitialLoad = false;
  let dataReady = false;
  const nextDepartureMinutes = { outbound: null, inbound: null };

  function setMainStatus(title, msg){
    document.getElementById('main-content').innerHTML = `
      <div class="card">
        <div class="title">${title}</div>
        <div class="meta">${msg}</div>
      </div>
    `;
  }
  function setSidebarEnabled(enabled){
    document.querySelectorAll('.route-btn').forEach(b => b.disabled = !enabled);
  }

  function todayBucket(){
    const dow = new Date().getDay();
    if (dow === 0) return 'holiday';
    if (dow === 6) return 'saturday';
    return 'weekday';
  }
  function dayLabelForHeader(){
    const b = todayBucket();
    if (b === 'weekday') return 'Weekdays (except public holidays)';
    if (b === 'saturday') return 'Saturdays (except public holidays)';
    return 'Sundays & public holidays';
  }

  function normaliseTimeHHMM(t){
    const s = String(t||'').replace(/^[*@#^{\}]+/, '');
    const m = s.match(/(\d{2}:\d{2})/);
    return m ? m[1] : '00:00';
  }
  function timeToMinutesHHMM(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    return h*60 + m;
  }
  function getNextN(nowMin, times, n){
    return times.filter(x => timeToMinutesHHMM(normaliseTimeHHMM(x)) > nowMin).slice(0, n);
  }

  function ampmTo24(h){
    let s = String(h || '').trim().toLowerCase();
    if (!s) return null;
    if (s.includes('noon')) {
      const m = s.match(/(\d{1,2}):(\d{2})/);
      const mm = m ? m[2] : '00';
      return `12:${mm}`;
    }
    const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(a\.m\.|p\.m\.)$/);
    if (!m) return null;
    let hh = parseInt(m[1], 10);
    const mm = m[2];
    const suf = m[4];
    if (suf === 'a.m.') { if (hh === 12) hh = 0; } else { if (hh !== 12) hh += 12; }
    return `${String(hh).padStart(2,'0')}:${mm}`;
  }

  async function loadHkkfFromGithubCsv(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const text = await res.text();
    const weekdayMatch = text.match(/Monday to Saturday.*?(\[.*?\])/s);
    const holidayMatch = text.match(/Sunday and Public Holidays.*?(\[.*?\])/s);
    if (!weekdayMatch || !holidayMatch) throw new Error(`HKKF CSV format not recognised\n${url}`);
    return {
      weekday: JSON.parse(weekdayMatch[1].replace(/'/g,'"')),
      holiday: JSON.parse(holidayMatch[1].replace(/'/g,'"'))
    };
  }

  async function loadSunFerryBidirectionalFromGithubCsv(url, outboundLabel, inboundLabel){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const csv = await res.text();
    const lines = csv.split(/\r?\n/).filter(l => l.trim());

    const weekday = { outbound: [], inbound: [] };
    const holiday = { outbound: [], inbound: [] };

    for (let i=1;i<lines.length;i++){
      const row = lines[i].split(',');
      if (row.length < 3) continue;

      const direction = row[0].trim();
      const serviceDate = row[1].trim().toLowerCase();
      const serviceHour = row[2].trim();

      const hhmm = ampmTo24(serviceHour);
      if (!hhmm) continue;

      let dirKey = null;
      if (direction === outboundLabel) dirKey = 'outbound';
      else if (direction === inboundLabel) dirKey = 'inbound';
      else continue;

      const isHolidayRow = serviceDate.includes('sundays and public holidays');
      if (isHolidayRow) holiday[dirKey].push(hhmm);
      else weekday[dirKey].push(hhmm);
    }

    ['outbound','inbound'].forEach(k => {
      weekday[k] = Array.from(new Set(weekday[k])).sort();
      holiday[k] = Array.from(new Set(holiday[k])).sort();
    });

    return { weekday, holiday };
  }

  async function loadDbayFromGithubCsv(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const csv = await res.text();
    const lines = csv.split(/\r?\n/).filter(l => l.trim());

    const header = lines[0].replace(/^\uFEFF/, '');
    const headers = header.split(',').map(x => x.trim().toLowerCase());
    const idxDir = headers.indexOf('direction');
    const idxDate = headers.indexOf('service date');
    const idxHour = headers.indexOf('service hour');
    if (idxDir < 0 || idxDate < 0 || idxHour < 0) throw new Error(`Discovery Bay CSV header not recognised\n${url}`);

    const out = { outbound:{weekday:[],saturday:[],holiday:[]}, inbound:{weekday:[],saturday:[],holiday:[]} };

    const bucket = (s) => {
      const x = String(s||'').trim().toLowerCase();
      if (x.includes('mondays to fridays')) return 'weekday';
      if (x.includes('saturdays')) return 'saturday';
      if (x.includes('sundays and public holidays')) return 'holiday';
      return null;
    };

    for (let i=1;i<lines.length;i++){
      const row = lines[i].split(',');
      if (row.length <= Math.max(idxDir, idxDate, idxHour)) continue;

      const direction = row[idxDir].trim();
      const b = bucket(row[idxDate]);
      const hhmm = ampmTo24(row[idxHour]);
      if (!b || !hhmm) continue;

      if (direction === 'Central to Discovery Bay') out.outbound[b].push(hhmm);
      else if (direction === 'Discovery Bay to Central') out.inbound[b].push(hhmm);
    }

    ['outbound','inbound'].forEach(dir => {
      ['weekday','saturday','holiday'].forEach(b => {
        out[dir][b] = Array.from(new Set(out[dir][b])).sort();
      });
    });

    return out;
  }

  function fareHtml(routeId){
    const f = FARES[routeId];
    if (!f) {
      return `<div class="fare-card"><div class="fare-title">Fares</div><div class="fare-sub">No fare data available.</div></div>`;
    }

    const b = todayBucket();
    const pack = (b === 'holiday') ? f.holiday : f.weekdaySat;
    const dayTitle = (b === 'holiday') ? f.holidayLabel : f.weekdaySatLabel;

    const colHead = pack.services.map(s => `<th style="text-align:right">${s}</th>`).join('');
    const rows = pack.rows.map(r => {
      const cells = r.values.map(v => {
        const vv = Number(v);
        const txt = Number.isFinite(vv) ? `$${vv.toString()}` : String(v);
        return `<td class="num">${txt}</td>`;
      }).join('');
      return `<tr><td>${r.label}</td>${cells}</tr>`;
    }).join('');

    return `
      <div class="fare-card">
        <div class="fare-title">${f.title}</div>
        <div class="fare-sub">${dayTitle}</div>
        <table class="fare-table">
          <thead>
            <tr><th>Passenger</th>${colHead}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="fare-note">Note: Fares shown are provided values and may be subject to change.</div>
      </div>
    `;
  }

  async function loadAllRoutes(isFirst=false){
    dataReady = false;
    setSidebarEnabled(false);

    const step = async (label, fn) => {
      if (isFirst) setMainStatus('Loading…', `Fetching timetable data\n\n${label}…`);
      return await fn();
    };

    try {
      const sokOut  = await step('HKKF Central → Sok Kwu Wan', () => loadHkkfFromGithubCsv(URLS.HKKF.CSKW));
      const sokIn   = await step('HKKF Sok Kwu Wan → Central', () => loadHkkfFromGithubCsv(URLS.HKKF.SKWC));
      const yungOut = await step('HKKF Central → Yung Shue Wan', () => loadHkkfFromGithubCsv(URLS.HKKF.CYSW));
      const yungIn  = await step('HKKF Yung Shue Wan → Central', () => loadHkkfFromGithubCsv(URLS.HKKF.YSWC));
      const pengOut = await step('HKKF Central → Peng Chau', () => loadHkkfFromGithubCsv(URLS.HKKF.CPC));
      const pengIn  = await step('HKKF Peng Chau → Central', () => loadHkkfFromGithubCsv(URLS.HKKF.PCC));

      const ccData = await step('Sun Ferry Central ↔ Cheung Chau', () =>
        loadSunFerryBidirectionalFromGithubCsv(URLS.SUN.CCC, 'Central to Cheung Chau', 'Cheung Chau to Central')
      );
      const muiData = await step('Sun Ferry Central ↔ Mui Wo', () =>
        loadSunFerryBidirectionalFromGithubCsv(URLS.SUN.CMW, 'Central to Mui Wo', 'Mui Wo to Central')
      );

      const dbay = await step('Discovery Bay Central ↔ Discovery Bay', () =>
        loadDbayFromGithubCsv(URLS.DBAY.MAIN)
      );

      routesData = {
        'central-sokkwuwan': {
          name:'Central ↔ Sok Kwu Wan',
          operator:'Hong Kong & Kowloon Ferry',
          outbound:{ pier:'Central Pier 4 → Sok Kwu Wan', times:sokOut },
          inbound:{ pier:'Sok Kwu Wan → Central Pier 4', times:sokIn },
          mode:'hkkf'
        },
        'central-yungshuewan': {
          name:'Central ↔ Yung Shue Wan',
          operator:'Hong Kong & Kowloon Ferry',
          outbound:{ pier:'Central Pier 4 → Yung Shue Wan', times:yungOut },
          inbound:{ pier:'Yung Shue Wan → Central Pier 4', times:yungIn },
          mode:'hkkf'
        },
        'central-pengchau': {
          name:'Central ↔ Peng Chau (some sailings via Hei Ling Chau)',
          operator:'Hong Kong & Kowloon Ferry',
          outbound:{ pier:'Central Pier 6 → Peng Chau', times:pengOut },
          inbound:{ pier:'Peng Chau → Central Pier 6', times:pengIn },
          mode:'hkkf'
        },
        'central-cheungchau': {
          name:'Central ↔ Cheung Chau',
          operator:'Sun Ferry',
          outbound:{ pier:'Central → Cheung Chau', times:{ weekday:ccData.weekday.outbound, holiday:ccData.holiday.outbound } },
          inbound:{ pier:'Cheung Chau → Central', times:{ weekday:ccData.weekday.inbound, holiday:ccData.holiday.inbound } },
          mode:'sunferry'
        },
        'central-muiwo': {
          name:'Central ↔ Mui Wo',
          operator:'Sun Ferry',
          outbound:{ pier:'Central → Mui Wo', times:{ weekday:muiData.weekday.outbound, holiday:muiData.holiday.outbound } },
          inbound:{ pier:'Mui Wo → Central', times:{ weekday:muiData.weekday.inbound, holiday:muiData.holiday.inbound } },
          mode:'sunferry'
        },
        'central-discoverybay': {
          name:'Central ↔ Discovery Bay',
          operator:'Discovery Bay Transportation Services',
          outbound:{ pier:'Central → Discovery Bay', times: dbay.outbound },
          inbound:{ pier:'Discovery Bay → Central', times: dbay.inbound },
          mode:'dbay'
        }
      };

      dataReady = true;
      setSidebarEnabled(true);

      if (isFirst && !hasInitialLoad) { hasInitialLoad = true; selectRoute(currentRoute); }
      else loadRoute(currentRoute);

    } catch (e) {
      console.error(e);
      dataReady = false;
      setSidebarEnabled(true);
      if (isFirst) setMainStatus('Error loading data', String(e && e.message ? e.message : e));
    }
  }

  function selectRoute(routeId){
    if (!dataReady){
      setMainStatus('Loading…', 'Fetching timetable data. Please wait.');
      return;
    }
    currentRoute = routeId;
    document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`[data-route="${routeId}"]`);
    if (btn) btn.classList.add('active');
    loadRoute(routeId);
  }

  function renderNext(prefix, nextTimes, allTimes){
    const nextList = document.getElementById(`${prefix}-next-list`);
    const nextEl = document.getElementById(`${prefix}-next`);
    const status = document.getElementById(`${prefix}-status`);

    nextList.innerHTML = '';

    if (nextTimes.length){
      const hhmm0 = normaliseTimeHHMM(nextTimes[0]);
      nextEl.textContent = hhmm0;
      status.textContent = 'On time';
      status.className = 'status on';
      nextDepartureMinutes[prefix] = timeToMinutesHHMM(hhmm0);

      nextTimes.forEach(raw => {
        const hhmm = normaliseTimeHHMM(raw);
        let tag = 'Scheduled';
        if (String(raw).startsWith('^')) tag = 'Last sailing';
        else if (String(raw).startsWith('{')) tag = 'Saturdays only';
        else if (String(raw).startsWith('*')) tag = 'Limited freight';
        else if (String(raw).startsWith('#')) tag = 'Freight booking required';

        if (currentRoute === 'central-pengchau') {
          if (prefix === 'outbound') {
            const toHei = HEI_LING_CHAU_INFO_FOR_PENGCHAU.toHei[hhmm];
            if (toHei) tag = `Connects to Hei Ling Chau (${toHei})`;
          } else {
            const fromHei = HEI_LING_CHAU_INFO_FOR_PENGCHAU.fromHei[hhmm];
            if (fromHei) tag = `From Hei Ling Chau (${fromHei})`;
          }
        }

        const li = document.createElement('li');
        li.innerHTML = `<span class="t">${hhmm}</span><span class="tag">${tag}</span>`;
        nextList.appendChild(li);
      });

    } else {
      nextDepartureMinutes[prefix] = null;
      const first = allTimes && allTimes.length ? allTimes[0] : null;
      nextEl.textContent = first ? normaliseTimeHHMM(first) : '--:--';
      status.textContent = 'Tomorrow';
      status.className = 'status tom';

      const li = document.createElement('li');
      li.innerHTML = `<span class="t">${first ? normaliseTimeHHMM(first) : '--:--'}</span><span class="tag">First sailing tomorrow</span>`;
      nextList.appendChild(li);
    }
  }

  function updateDisplay(){
    if (!dataReady) return;
    const data = routesData[currentRoute];
    if (!data) return;

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const b = todayBucket();

    let outTimes = [], inTimes = [];
    if (data.mode === 'hkkf') {
      const isHoliday = (b === 'holiday');
      outTimes = isHoliday ? data.outbound.times.holiday : data.outbound.times.weekday;
      inTimes  = isHoliday ? data.inbound.times.holiday  : data.inbound.times.weekday;
    } else if (data.mode === 'sunferry') {
      const isHoliday = (b === 'holiday');
      outTimes = isHoliday ? data.outbound.times.holiday : data.outbound.times.weekday;
      inTimes  = isHoliday ? data.inbound.times.holiday  : data.inbound.times.weekday;
    } else if (data.mode === 'dbay') {
      outTimes = data.outbound.times[b] || [];
      inTimes  = data.inbound.times[b] || [];
    }

    renderNext('outbound', getNextN(nowMin, outTimes, 10), outTimes);
    renderNext('inbound',  getNextN(nowMin, inTimes, 10),  inTimes);
  }

  function loadRoute(routeId){
    const data = routesData[routeId];
    if (!data){ setMainStatus('No data', 'Route data not loaded.'); return; }

    document.getElementById('main-content').innerHTML = `
      <div class="route-row">
        <div class="card">
          <div class="title">${data.name}</div>
          <div class="meta">Operator: ${data.operator}\nTimetable shown for: ${dayLabelForHeader()}</div>
        </div>
        ${fareHtml(routeId)}
      </div>

      <div class="grid">
        <div class="panel outbound">
          <h3>${data.outbound.pier}</h3>
          <div class="countdown-wrap"><div class="countdown" id="outbound-countdown">--:--:--</div></div>
          <div class="sub">Time until next sailing</div>
          <div class="nextbox">
            <span class="status on" id="outbound-status">On time</span>
            <div class="timebig" id="outbound-next">--:--</div>
          </div>
          <div class="section-title">Next 10 sailings</div>
          <ul id="outbound-next-list"></ul>
        </div>

        <div class="panel inbound">
          <h3>${data.inbound.pier}</h3>
          <div class="countdown-wrap"><div class="countdown" id="inbound-countdown">--:--:--</div></div>
          <div class="sub">Time until next sailing</div>
          <div class="nextbox">
            <span class="status on" id="inbound-status">On time</span>
            <div class="timebig" id="inbound-next">--:--</div>
          </div>
          <div class="section-title">Next 10 sailings</div>
          <ul id="inbound-next-list"></ul>
        </div>
      </div>
    `;
    updateDisplay();
  }

  // Countdown ticker (every second)
  setInterval(() => {
    const now = new Date();
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

    ['outbound','inbound'].forEach(prefix => {
      const el = document.getElementById(`${prefix}-countdown`);
      if (!el) return;

      const departMin = nextDepartureMinutes[prefix];
      if (departMin == null){ el.textContent = '--:--:--'; return; }

      let diff = departMin*60 - nowSec;
      if (diff <= 0){ el.textContent = '00:00:00'; return; }

      const h = Math.floor(diff/3600);
      const m = Math.floor((diff%3600)/60);
      const s = diff%60;
      el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    });
  }, 1000);

  document.querySelectorAll('.route-btn').forEach(btn => {
    btn.addEventListener('click', () => selectRoute(btn.dataset.route));
  });

  // Initial load
  loadAllRoutes(true);

  // Recalculate "Next 10 sailings" every minute
  setInterval(updateDisplay, 60*1000);

  // Auto-refresh data every minute (no page reload; stays on current route)
  setInterval(() => loadAllRoutes(false), 60*1000); // uses setInterval for periodic refresh [web:258]
</script>
</body>
</html>
