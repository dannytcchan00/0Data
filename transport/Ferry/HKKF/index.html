<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Ferry Live – HKKF & Sun Ferry Routes (Countdown & Timetables)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#0a0a0a;color:#fff;min-height:100vh;overflow-x:hidden
    }
    .container{display:flex;height:100vh;max-width:1600px;margin:0 auto}
    .sidebar{
      width:320px;background:rgba(15,15,15,.95);backdrop-filter:blur(20px);
      border-right:1px solid #333;padding:30px 20px;overflow-y:auto;
      box-shadow:2px 0 20px rgba(0,0,0,.5)
    }
    .main{flex:1;padding:30px;display:flex;flex-direction:column;justify-content:center}
    .header{
      font-size:28px;font-weight:700;margin-bottom:25px;
      background:linear-gradient(135deg,#00d4ff,#0099cc);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      text-align:center
    }
    .route-group{margin-bottom:20px}
    .route-group h3{
      font-size:14px;margin-bottom:12px;color:#aaa;font-weight:500;
      text-transform:uppercase;letter-spacing:1px
    }
    .route-btn{
      width:100%;padding:14px 18px;border:1px solid rgba(255,255,255,.1);
      border-radius:12px;background:rgba(255,255,255,.05);color:#fff;
      cursor:pointer;font-size:15px;margin-bottom:10px;
      transition:all .25s ease;backdrop-filter:blur(10px);position:relative;overflow:hidden
    }
    .route-btn::before{
      content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
      transition:left .5s
    }
    .route-btn:hover::before{left:100%}
    .route-btn.active{
      background:linear-gradient(135deg,#00d4ff,#0099cc);border-color:#00d4ff;
      box-shadow:0 8px 32px rgba(0,212,255,.3);transform:translateY(-2px)
    }
    .route-info{
      background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);
      border-radius:16px;padding:25px;margin-bottom:30px;backdrop-filter:blur(20px)
    }
    .route-info div{margin-bottom:6px;font-size:15px;opacity:.9}
    .dual-panel{display:grid;grid-template-columns:1fr 1fr;gap:25px;height:100%}
    .direction-panel{
      background:rgba(20,20,20,.8);border-radius:20px;padding:24px 24px 18px;
      border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)
    }
    .direction.outbound{ border-image: linear-gradient(135deg, #00d4ff, #2ecc71) 1; }
    .direction.inbound{ border-image: linear-gradient(135deg, #ff6b6b, #ff8e8e) 1; }
    .direction-title{
      font-size:20px;font-weight:700;margin-bottom:18px;text-align:center;
      padding-bottom:10px;border-bottom:2px solid rgba(255,255,255,.1)
    }
    .outbound .direction-title{color:#00d4ff}
    .inbound .direction-title{color:#ff6b6b}
    .countdown{
      font-size:38px;font-weight:800;text-align:center;margin:8px 0 4px;
      min-height:52px;display:flex;align-items:center;justify-content:center;
      font-variant-numeric:tabular-nums;letter-spacing:2px;font-family:monospace
    }
    .countdown-label{
      text-align:center;font-size:12px;color:#aaa;margin-bottom:8px;
      font-weight:500;letter-spacing:.5px
    }
    .outbound .countdown{color:#00d4ff;text-shadow:0 0 20px rgba(0,212,255,.5)}
    .inbound .countdown{color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,.5)}
    .next-ferry{
      background:rgba(255,255,255,.04);padding:14px;border-radius:16px;
      text-align:center;margin:12px 0;border:1px solid rgba(255,255,255,.1)
    }
    .next-time{font-size:20px;font-weight:700;margin:4px 0}
    .status{
      padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
      display:inline-block
    }
    .status.on-time{
      background:rgba(46,204,113,.18);color:#2ecc71;border:1px solid rgba(46,204,113,.3)
    }
    .status.tomorrow{
      background:rgba(52,152,219,.18);color:#3498db;border:1px solid rgba(52,152,219,.3)
    }
    .timetable h3{
      margin-bottom:10px;font-size:14px;color:#aaa;font-weight:500;
      text-transform:uppercase;letter-spacing:1px
    }
    .timetable ul{list-style:none;max-height:260px;overflow-y:auto;padding:4px 0}
    .timetable li{
      padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);
      font-size:15px;display:flex;justify-content:space-between;align-items:center;
      flex-wrap:wrap;gap:4px
    }
    .time{font-weight:600;min-width:58px}
    .optional{color:#f39c12}
    .last{color:#e74c3c}
    .saturday-only{color:#9b59b6}
    .tomorrow{color:#3498db;opacity:.85}
    .note{
      font-size:12px;color:#88d4ff;margin-left:auto;font-weight:400;
      background:rgba(136,212,255,0.1);padding:2px 6px;border-radius:4px;
      border:1px solid rgba(136,212,255,0.3);white-space:nowrap
    }
    .loading{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;color:#666;font-size:20px
    }
    .legend{
      position:fixed;right:20px;bottom:20px;background:rgba(15,15,15,.95);
      border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px;
      font-size:12px;max-width:260px;line-height:1.4;backdrop-filter:blur(20px);
      box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:1000
    }
    .legend-title{
      font-weight:600;margin-bottom:8px;color:#00d4ff;font-size:13px;
      border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:5px
    }
    .legend-item{display:flex;align-items:center;margin-bottom:4px;opacity:.9}
    .legend-icon{margin-right:6px;font-size:14px;min-width:20px;text-align:center}
    @media (max-width:768px){
      .container{flex-direction:column;height:auto}
      .sidebar{width:100%;border-right:none;border-bottom:1px solid #333}
      .dual-panel{grid-template-columns:1fr;gap:18px}
      .countdown{font-size:32px;letter-spacing:1px}
      .legend{right:10px;bottom:10px;max-width:220px;font-size:11px;padding:10px}
      .timetable li{flex-direction:column;align-items:flex-start;gap:2px}
      .note{margin-left:0;margin-top:2px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="header">🛥️ Ferry Live</div>
      <div class="route-group">
        <h3>📍 Routes</h3>
        <button class="route-btn active" data-route="central-sokkwuwan" onclick="selectRoute('central-sokkwuwan')">
          Central ↔ Sok Kwu Wan
        </button>
        <button class="route-btn" data-route="central-yungshuewan" onclick="selectRoute('central-yungshuewan')">
          Central ↔ Yung Shue Wan
        </button>
        <button class="route-btn" data-route="central-pengchau" onclick="selectRoute('central-pengchau')">
          Central ↔ Peng Chau
        </button>
        <button class="route-btn" data-route="central-cheungchau" onclick="selectRoute('central-cheungchau')">
          Central ↔ Cheung Chau (Sun Ferry)
        </button>
        <button class="route-btn" data-route="central-muiwo" onclick="selectRoute('central-muiwo')">
          Central ↔ Mui Wo (Sun Ferry)
        </button>
      </div>
    </div>

    <div class="main" id="main-content">
      <div class="loading">
        <div style="font-size:24px;margin-bottom:10px;">🔄 Loading…</div>
        <div>Ferry departures will appear shortly</div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-title">🛥️ Legend</div>
    <div class="legend-item"><span class="legend-icon">▶️</span>Regular sailing</div>
    <div class="legend-item"><span class="legend-icon">📦</span>Cargo service (booking may be required)</div>
    <div class="legend-item"><span class="legend-icon">🛎️</span>Saturdays only</div>
    <div class="legend-item"><span class="legend-icon">🛑</span>Last sailing</div>
    <div class="legend-item"><span class="legend-icon">🌅</span>First sailing of next day</div>
  </div>

  <script>
    // Hei Ling Chau info for Peng Chau route
    const HEI_LING_CHAU_INFO_FOR_PENGCHAU = {
      fromHei: { '07:25': '07:10', '13:00': '12:45', '18:50': '18:35' },
      toHei:   { '09:15': '09:25', '15:15': '15:25', '19:30': '19:40' }
    };

    let routesData = {};
    let currentRoute = 'central-sokkwuwan';
    let hasInitialLoad = false;
    const nextDepartureMinutes = { outbound: null, inbound: null };

    async function loadFerryTimes(url, direction) {
      const res = await fetch(url);
      const text = await res.text();
      const weekdayMatch = text.match(/Monday to Saturday.*?(\[.*?\])/s);
      const holidayMatch = text.match(/Sunday and Public Holidays.*?(\[.*?\])/s);
      if (!weekdayMatch || !holidayMatch) throw new Error(`${direction} CSV format error`);
      const weekday = JSON.parse(weekdayMatch[1].replace(/'/g, '"'));
      const holiday = JSON.parse(holidayMatch[1].replace(/'/g, '"'));
      return { weekday, holiday };
    }

    function isHoliday() { return new Date().getDay() === 0; }

    function normaliseTime(t) {
      let s = t.replace(/^[*@#^{\}]+/, '');
      const m = s.match(/(\d{2}:\d{2})/);
      return m ? m[1] : '00:00';
    }

    function timeToMinutes(t) {
      const s = normaliseTime(t);
      const [h, m] = s.split(':').map(Number);
      return h * 60 + m;
    }

    function getNext10(nowMinutes, times) {
      return times.filter(t => timeToMinutes(t) > nowMinutes).slice(0, 10);
    }

    function ampmTo24(str) {
      let s = str.trim().toLowerCase();

      if (s.includes('noon')) {
        const m = s.match(/(\d{1,2}):(\d{2})/);
        let h = 12;
        let min = '00';
        if (m) {
          h = 12;
          min = m[2];
        }
        return `${h.toString().padStart(2,'0')}:${min}`;
      }

      const m = s.match(/^(\d{1,2}):(\d{2})\s*(a\.m\.|p\.m\.)$/);
      if (!m) return null;

      let h = parseInt(m[1], 10);
      const min = m[2];
      const suffix = m[3];

      if (suffix === 'a.m.') {
        if (h === 12) h = 0;
      } else {
        if (h !== 12) h += 12;
      }
      return `${h.toString().padStart(2,'0')}:${min}`;
    }

    // Sun Ferry loader – treat all as standard sailings for now
    async function loadSunFerryBidirectional(url, outboundLabel, inboundLabel) {
      const res = await fetch(url);
      const csv = await res.text();
      const lines = csv.split(/\r?\n/).filter(l => l.trim());
      const weekday = { outbound: [], inbound: [] };
      const holiday = { outbound: [], inbound: [] };

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(',');
        if (row.length < 3) continue;
        const direction   = row[0].trim();
        const serviceDate = row[1].trim();
        const serviceHour = row[2].trim();
        const hhmm        = ampmTo24(serviceHour);
        if (!hhmm) continue;

        let dirKey = null;
        if (direction === outboundLabel)      dirKey = 'outbound';
        else if (direction === inboundLabel)  dirKey = 'inbound';
        if (!dirKey) continue;

        const isHolidayRow = /Sundays and public holidays/i.test(serviceDate);
        const value = hhmm;

        if (isHolidayRow) holiday[dirKey].push(value);
        else              weekday[dirKey].push(value);
      }

      ['outbound','inbound'].forEach(d => {
        weekday[d].sort();
        holiday[d].sort();
      });

      return { weekday, holiday };
    }

    async function loadAllRoutes() {
      try {
        const [
          sokOut, sokIn,
          yungOut, yungIn,
          pengOut, pengIn
        ] = await Promise.all([
          loadFerryTimes('https://dannytcchan00.github.io/0Data/data/travel/HKKF/Central_Sok_Kwu_Wan/data.csv', 'Central → Sok Kwu Wan'),
          loadFerryTimes('https://dannytcchan00.github.io/0Data/data/travel/HKKF/Sok_Kwu_Wan_Central/data.csv', 'Sok Kwu Wan → Central'),
          loadFerryTimes('https://dannytcchan00.github.io/0Data/data/travel/HKKF/Central_Yung_Shue_Wan/data.csv', 'Central → Yung Shue Wan'),
          loadFerryTimes('https://dannytcchan00.github.io/0Data/data/travel/HKKF/Yung_Shue_Wan_Central/data.csv', 'Yung Shue Wan → Central'),
          loadFerryTimes('https://dannytcchan00.github.io/0Data/data/travel/HKKF/Central_Peng_Chau/data.csv', 'Central → Peng Chau'),
          loadFerryTimes('https://dannytcchan00.github.io/0Data/data/travel/HKKF/Peng_Chau_Central/data.csv', 'Peng Chau → Central')
        ]);

        const ccData = await loadSunFerryBidirectional(
          'https://dannytcchan00.github.io/0Data/data/travel/SunFerry/Central_Cheung_Chau/data.csv',
          'Central to Cheung Chau',
          'Cheung Chau to Central'
        );

        const muiData = await loadSunFerryBidirectional(
          'https://dannytcchan00.github.io/0Data/data/travel/SunFerry/Central_Mui_Wo/data.csv',
          'Central to Mui Wo',
          'Mui Wo to Central'
        );

        routesData = {
          'central-sokkwuwan': {
            name: 'Central ↔ Sok Kwu Wan',
            outbound: { pier: 'Central Pier 4 → Sok Kwu Wan Pier 2', times: sokOut },
            inbound:  { pier: 'Sok Kwu Wan Pier 2 → Central Pier 4', times: sokIn },
            duration: 'Approx. 30–40 minutes'
          },
          'central-yungshuewan': {
            name: 'Central ↔ Yung Shue Wan',
            outbound: { pier: 'Central Pier 4 → Yung Shue Wan Pier', times: yungOut },
            inbound:  { pier: 'Yung Shue Wan Pier → Central Pier 4', times: yungIn },
            duration: 'Approx. 40–50 minutes'
          },
          'central-pengchau': {
            name: 'Central ↔ Peng Chau (some sailings via Hei Ling Chau)',
            outbound: { pier: 'Central Pier 6 → Peng Chau Pier', times: pengOut },
            inbound:  { pier: 'Peng Chau Pier → Central Pier 6', times: pengIn },
            duration: 'Approx. 35–45 minutes'
          },
          'central-cheungchau': {
            name: 'Central ↔ Cheung Chau (ordinary and fast services)',
            outbound: { pier: 'Central Pier 5 → Cheung Chau Pier', times: {
              weekday: ccData.weekday.outbound,
              holiday: ccData.holiday.outbound
            }},
            inbound: { pier: 'Cheung Chau Pier → Central Pier 5', times: {
              weekday: ccData.weekday.inbound,
              holiday: ccData.holiday.inbound
            }},
            duration: 'Approx. 55–60 minutes, depending on vessel type'
          },
          'central-muiwo': {
            name: 'Central ↔ Mui Wo (ordinary and fast services)',
            outbound: { pier: 'Central Pier 6 → Mui Wo Pier', times: {
              weekday: muiData.weekday.outbound,
              holiday: muiData.holiday.outbound
            }},
            inbound: { pier: 'Mui Wo Pier → Central Pier 6', times: {
              weekday: muiData.weekday.inbound,
              holiday: muiData.holiday.inbound
            }},
            duration: 'Approx. 40–60 minutes, depending on vessel type'
          }
        };

        const loading = document.querySelector('.loading');
        if (loading) loading.innerHTML = '✅ All route data loaded.';

        if (!hasInitialLoad) {
          hasInitialLoad = true;
          currentRoute = 'central-sokkwuwan';
          selectRoute(currentRoute);
        } else {
          loadRoute(currentRoute);
        }

      } catch (error) {
        console.error('Failed to load route ', error);
        const loading = document.querySelector('.loading');
        if (loading) loading.innerHTML = '❌ Failed to load data. Please check the console.';
      }
    }

    function selectRoute(routeId) {
      currentRoute = routeId;
      document.querySelectorAll('.route-btn').forEach(btn => btn.classList.remove('active'));
      const btn = document.querySelector(`[data-route="${routeId}"]`);
      if (btn) btn.classList.add('active');
      loadRoute(routeId);
    }

    function loadRoute(routeId) {
      const data = routesData[routeId];
      if (!data) return;
      const isHol = isHoliday();

      document.getElementById('main-content').innerHTML = `
        <div class="route-info">
          <div><strong>${data.name}</strong></div>
          <div>⏱️ ${data.duration}</div>
          <div>Timetables are based on official operator data. Please refer to HKKF / Sun Ferry for the latest notices.</div>
          <div>${isHol ? 'Today is treated as Sunday / public holiday service.' : 'Today is treated as Monday–Saturday service.'}</div>
        </div>
        <div class="dual-panel">
          <div class="direction-panel direction outbound">
            <div class="direction-title">🚤 Outbound: ${data.outbound.pier}</div>
            <div class="countdown" id="outbound-countdown">--:--:--</div>
            <div class="countdown-label">Time until next departure</div>
            <div class="next-ferry">
              <div id="outbound-status" class="status on-time">On time</div>
              <div class="next-time" id="outbound-next">--:--</div>
            </div>
            <div class="timetable">
              <h3 id="outbound-title">${isHol ? 'Holiday' : 'Weekday'} · Next 10 sailings</h3>
              <ul id="outbound-list"></ul>
            </div>
          </div>
          <div class="direction-panel direction inbound">
            <div class="direction-title">🚤 Inbound: ${data.inbound.pier}</div>
            <div class="countdown" id="inbound-countdown">--:--:--</div>
            <div class="countdown-label">Time until next departure</div>
            <div class="next-ferry">
              <div id="inbound-status" class="status on-time">On time</div>
              <div class="next-time" id="inbound-next">--:--</div>
            </div>
            <div class="timetable">
              <h3 id="inbound-title">${isHol ? 'Holiday' : 'Weekday'} · Next 10 sailings</h3>
              <ul id="inbound-list"></ul>
            </div>
          </div>
        </div>`;
      updateDisplay();
    }

    function updateDisplay() {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const data = routesData[currentRoute];
      if (!data) return;
      const isHol = isHoliday();

      const outTimesAll = data.outbound.times;
      const inTimesAll  = data.inbound.times;
      const outTimes = isHol ? outTimesAll.holiday : outTimesAll.weekday;
      const inTimes  = isHol ? inTimesAll.holiday  : inTimesAll.weekday;

      const outNext10 = getNext10(nowMin, outTimes);
      updatePanel('outbound', outNext10, nowMin, outTimes, isHol, currentRoute);

      const inNext10 = getNext10(nowMin, inTimes);
      updatePanel('inbound', inNext10, nowMin, inTimes, isHol, currentRoute);
    }

    function updatePanel(prefix, nextTimes, nowMin, allTimes, isHol, routeId) {
      const list = document.getElementById(`${prefix}-list`);
      const title = document.getElementById(`${prefix}-title`);
      const nextTimeEl = document.getElementById(`${prefix}-next`);
      const status = document.getElementById(`${prefix}-status`);

      if (!list || !title || !nextTimeEl || !status) return;

      if (nextTimes.length > 0) {
        title.textContent = (isHol ? 'Holiday' : 'Weekday') + ' · Next 10 sailings';
        list.innerHTML = '';

        nextTimes.forEach(time => {
          const li = document.createElement('li');
          let icon = '▶️', cls = '', note = '';

          if (time.startsWith('^')) { icon = '🛑'; cls = 'last'; }
          else if (time.startsWith('{')) { icon = '🛎️'; cls = 'saturday-only'; }
          else if (time.startsWith('#')) { icon = '📦'; cls = 'optional'; }

          const displayTime = normaliseTime(time);

          if (routeId === 'central-pengchau' && HEI_LING_CHAU_INFO_FOR_PENGCHAU) {
            if (prefix === 'outbound') {
              const toHei = HEI_LING_CHAU_INFO_FOR_PENGCHAU.toHei[displayTime];
              if (toHei) note = `Then ${toHei} Peng Chau → Hei Ling Chau`;
            } else if (prefix === 'inbound') {
              const fromHei = HEI_LING_CHAU_INFO_FOR_PENGCHAU.fromHei[displayTime];
              if (fromHei) note = `${fromHei} Hei Ling Chau → Peng Chau`;
            }
          }

          li.innerHTML = `
            <span class="time ${cls}">${displayTime}</span>
            <span>${icon}</span>
            ${note ? `<span class="note">${note}</span>` : ''}
          `;
          list.appendChild(li);
        });

        const firstTimeStr = nextTimes[0];
        nextDepartureMinutes[prefix] = timeToMinutes(firstTimeStr);
        const firstClean = normaliseTime(firstTimeStr);
        nextTimeEl.textContent = firstClean;
        status.textContent = 'On time';
        status.className = 'status on-time';
      } else {
        nextDepartureMinutes[prefix] = null;
        const tomorrowFirst = allTimes[0];
        const tomorrowFirstClean = normaliseTime(tomorrowFirst);
        title.textContent = (isHol ? 'Holiday' : 'Weekday') + ' · First sailing tomorrow';
        list.innerHTML = `<li><span class="time tomorrow">${tomorrowFirstClean}</span><span>🌅</span></li>`;
        nextTimeEl.textContent = tomorrowFirstClean;
        status.textContent = 'First sailing tomorrow';
        status.className = 'status tomorrow';
      }
    }

    // 1‑second countdown
    setInterval(() => {
      const now = new Date();
      const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      ['outbound', 'inbound'].forEach(prefix => {
        const cd = document.getElementById(`${prefix}-countdown`);
        if (!cd) return;

        const departMin = nextDepartureMinutes[prefix];
        if (departMin == null) {
          cd.textContent = '--:--:--';
          return;
        }

        const departSec = departMin * 60;
        let diff = departSec - nowSec;

        if (diff <= 0) {
          cd.textContent = '00:00:00';
          return;
        }

        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        cd.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      });
    }, 1000);

    // Initial load
    loadAllRoutes();

    // Redraw countdown / next 10 sailings every minute
    setInterval(updateDisplay, 60000);

    // Reload CSV data every 5 minutes, keeping the current route
    setInterval(loadAllRoutes, 5 * 60 * 1000);
  </script>
</body>
</html>
