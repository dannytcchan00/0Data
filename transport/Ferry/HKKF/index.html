<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ferry Live Timetable</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
    .container{display:flex;min-height:100vh;max-width:1600px;margin:0 auto}
    .sidebar{width:360px;background:rgba(15,15,15,.95);border-right:1px solid #333;padding:26px 18px;overflow-y:auto}
    .main{flex:1;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:flex-start;align-items:stretch}

    .header{font-size:26px;font-weight:800;margin-bottom:18px;background:linear-gradient(135deg,#00d4ff,#0099cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
    .route-group{margin-bottom:18px}
    .route-group h3{font-size:12px;margin-bottom:10px;color:#aaa;font-weight:750;text-transform:uppercase;letter-spacing:1px}
    .route-btn{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-size:15px;margin-bottom:10px;text-align:left;transition:all .25s ease}
    .route-btn.active{background:linear-gradient(135deg,#00d4ff,#0099cc);border-color:#00d4ff;box-shadow:0 8px 32px rgba(0,212,255,.25)}
    .route-btn:disabled{opacity:.45;cursor:not-allowed}
    .hint{font-size:12px;color:#888;margin:-2px 0 12px 0;line-height:1.35}

    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px}
    .title{font-size:18px;font-weight:800;margin-bottom:8px}
    .meta{font-size:13px;color:#c7c7c7;line-height:1.5;white-space:pre-wrap}

    .route-row{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:stretch}

    .fare-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px}
    .fare-title{font-size:14px;font-weight:850;margin-bottom:4px}
    .fare-sub{font-size:12px;color:#aaa;margin-bottom:10px}
    table.fare-table{width:100%;border-collapse:collapse;font-size:13px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
    .fare-table th,.fare-table td{padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
    .fare-table th{text-align:left;font-weight:850;color:#ddd;background:rgba(255,255,255,.03)}
    .fare-table td.num{text-align:right;font-variant-numeric:tabular-nums}
    .fare-note{font-size:11px;color:#888;margin-top:8px;line-height:1.35}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .grid4{display:grid;grid-template-columns:1fr 1fr;gap:18px}

    .panel{background:rgba(20,20,20,.8);border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.08)}
    .panel.outbound{border-left:6px solid #2f81f7}
    .panel.inbound{border-left:6px solid #f97316}
    .panel h3{font-size:14px;font-weight:850;text-align:center;margin-bottom:10px}
    .panel.outbound h3{color:#b6d6ff}
    .panel.inbound h3{color:#ffd4b5}

    /* Inter-Island: color by pier */
    .panel.inter-cc{border-left:6px solid #22c55e}
    .panel.inter-cmw{border-left:6px solid #eab308}
    .panel.inter-mw{border-left:6px solid #3b82f6}
    .panel.inter-pc{border-left:6px solid #ec4899}
    .panel.inter-cc h3{color:#bbf7d0}
    .panel.inter-cmw h3{color:#fef9c3}
    .panel.inter-mw h3{color:#bfdbfe}
    .panel.inter-pc h3{color:#f9a8d4}

    .countdown-wrap{display:flex;justify-content:center}
    .countdown{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:32px;font-weight:900;letter-spacing:.5px;
      padding:8px 12px;border-radius:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
    }
    .panel.outbound .countdown{border-color:rgba(47,129,247,.45)}
    .panel.inbound .countdown{border-color:rgba(249,115,22,.45)}
    .panel.inter-cc .countdown{border-color:rgba(34,197,94,.45)}
    .panel.inter-cmw .countdown{border-color:rgba(234,179,8,.45)}
    .panel.inter-mw .countdown{border-color:rgba(59,130,246,.45)}
    .panel.inter-pc .countdown{border-color:rgba(236,72,153,.45)}

    .sub{font-size:12px;color:#aaa;text-align:center;margin:8px 0 10px}
    .nextbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;text-align:center;margin-bottom:10px}
    .status{display:inline-block;font-size:12px;font-weight:850;padding:6px 10px;border-radius:999px}
    .status.on{border:1px solid rgba(46,204,113,.35);background:rgba(46,204,113,.15);color:#2ecc71}
    .status.tom{border:1px solid rgba(52,152,219,.35);background:rgba(52,152,219,.15);color:#3498db}
    .timebig{font-size:18px;font-weight:900;margin-top:4px}

    .section-title{font-size:12px;color:#aaa;font-weight:850;letter-spacing:.8px;margin:10px 0 6px}
    ul{list-style:none;max-height:320px;overflow:auto;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:0 12px;background:rgba(255,255,255,.02)}
    li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;flex-wrap:wrap}
    li:last-child{border-bottom:none}
    .t{font-weight:850;min-width:64px}
    .tag{font-size:12px;font-weight:750;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#ddd}
    .panel.outbound .tag{color:#b6d6ff;border-color:rgba(47,129,247,.35);background:rgba(47,129,247,.12)}
    .panel.inbound .tag{color:#ffd4b5;border-color:rgba(249,115,22,.35);background:rgba(249,115,22,.12)}

    .tag.fast{color:#ffedd5;border-color:rgba(249,115,22,.35);background:rgba(249,115,22,.18)}
    .tag.ord{color:#dcfce7;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.18)}
    .tag.freight{color:#e0e7ff;border-color:rgba(99,102,241,.35);background:rgba(99,102,241,.18)}
    .tag.nofreight{color:#fecaca;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.18)}
    .tag.via{color:#e5e7eb;border-color:rgba(148,163,184,.35);background:rgba(148,163,184,.18)}
    .tag.last{color:#fef9c3;border-color:rgba(234,179,8,.35);background:rgba(234,179,8,.18)}

    .small{font-size:12px;color:#aaa;line-height:1.4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
    @media (max-width:1100px){.route-row{grid-template-columns:1fr}}
    @media (max-width:900px){
      .container{flex-direction:column}
      .sidebar{width:100%;border-right:none;border-bottom:1px solid #333}
      .grid,.grid4{grid-template-columns:1fr}
    }
  </style>
</head>

  let routesData = {};
  let interIslandGrouped = null;
  let currentRoute = 'central-sokkwuwan';
  let hasInitialLoad = false;
  let dataReady = false;

  const nextDepartureMinutes = { outbound: null, inbound: null };
  const interNextDepartureMin = {};

  function setMainStatus(title, msg){
    document.getElementById('main-content').innerHTML =
      `<div class="card"><div class="title">${title}</div><div class="meta">${msg}</div></div>`;
  }
  function setSidebarEnabled(enabled){
    document.querySelectorAll('.route-btn').forEach(b => b.disabled = !enabled);
  }

  // ===== date buckets =====
  function todayBucketGeneral(){
    const dow = new Date().getDay();
    if (dow === 0) return 'holiday';
    if (dow === 6) return 'saturday';
    return 'weekday';
  }
  function todayBucketPITCL(){
    const dow = new Date().getDay();
    if (dow === 6 || dow === 0) return 'holiday';
    return 'weekday';
  }
  function dayLabelForHeader(mode){
    if (mode === 'pitcl'){
      const b = todayBucketPITCL();
      return (b === 'holiday') ? 'Saturdays, Sundays & public holidays' : 'Mondays to Fridays (except public holidays)';
    }
    if (mode === 'inter-overview') return 'Daily';
    if (mode === 'daily') return 'Daily';
    const b = todayBucketGeneral();
    if (b === 'weekday') return 'Weekdays (except public holidays)';
    if (b === 'saturday') return 'Saturdays (except public holidays)';
    return 'Sundays & public holidays';
  }

  // ===== time utils =====
  function normaliseTimeHHMM(t){
    const s = String(t||'').replace(/^[*@#^{\}▲\^]+/, ''); // strip known prefix symbols for parsing [page:1]
    const m = s.match(/(\d{2}:\d{2})/);
    return m ? m[1] : '00:00';
  }
  function timeToMinutesHHMM(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    return h*60 + m;
  }
  function getNextN(nowMin, times, n){
    return times.filter(x => timeToMinutesHHMM(normaliseTimeHHMM(x.hhmm || x)) > nowMin).slice(0, n);
  }

  // supports a.m./p.m./noon
  function ampmTo24(h){
    let s = String(h || '').trim().toLowerCase();
    if (!s) return null;
    if (s.includes('noon')) {
      const m = s.match(/(\d{1,2}):(\d{2})/);
      const mm = m ? m[2] : '00';
      return `12:${mm}`;
    }
    const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(a\.m\.|p\.m\.)$/);
    if (!m) return null;
    let hh = parseInt(m[1], 10);
    const mm = m[2];
    const suf = m[4];
    if (suf === 'a.m.') { if (hh === 12) hh = 0; } else { if (hh !== 12) hh += 12; }
    return `${String(hh).padStart(2,'0')}:${mm}`;
  }

  // ===== robust CSV parser =====
  function parseCsvLine(line){
    const out = [];
    let cur = '';
    let inQuotes = false;
    for (let i=0;i<line.length;i++){
      const ch = line[i];
      if (ch === '"'){
        if (inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes){
        out.push(cur);
        cur = '';
      } else {
        cur += ch;
      }
    }
    out.push(cur);
    return out.map(s => s.trim());
  }

  function normaliseDirection(s){
    return String(s||'').trim().replace(/\s+/g,' ');
  }

  // ===== HKKF tag inference from prefix symbols (if present) =====
  function parseHkkfTimeToken(token){
    const raw = String(token||'').trim();
    if (!raw) return null;

    const flags = {
      isOrd: raw.includes('*'),                 // * Ordinary ferry service [page:1]
      isLast: raw.includes('^'),                // ^ Last sailing [page:1]
      viaHei: raw.includes('#'),                // # onward to Hei Ling Chau [page:1]
      freightOk: raw.includes('▲'),             // ▲ freight on these fast sailings [page:1]
      noFreight: raw.includes('{') || raw.includes('}'), // { } no freight allowed on first fast sailing [page:1]
    };

    // HKKF: no explicit "fast" symbol; infer:
    // If it's not ordinary (*) and looks like a time, treat as fast for tagging.
    const hhmm = normaliseTimeHHMM(raw);
    const isTime = /^\d{2}:\d{2}$/.test(hhmm);

    const isFast = isTime && !flags.isOrd && (flags.freightOk || flags.viaHei || (!flags.noFreight)); // conservative
    return { hhmm, raw, ...flags, isFast };
  }

  // ===== loaders =====
  async function loadHkkfFromGithubCsv(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const text = await res.text();

    const weekdayMatch = text.match(/Monday to Saturday.*?(\[.*?\])/s);
    const holidayMatch = text.match(/Sunday and Public Holidays.*?(\[.*?\])/s);
    if (!weekdayMatch || !holidayMatch) throw new Error(`HKKF CSV format not recognised\n${url}`);

    const wk = JSON.parse(weekdayMatch[1].replace(/'/g,'"'));
    const hd = JSON.parse(holidayMatch[1].replace(/'/g,'"'));

    // Convert tokens -> objects with flags (only if token contains special symbols)
    const mapTokens = (arr) => (arr||[]).map(t => {
      const obj = parseHkkfTimeToken(t);
      return obj ? obj : null;
    }).filter(Boolean);

    return { weekday: mapTokens(wk), holiday: mapTokens(hd) };
  }

  // Sun Ferry: parse Remark column (4th column) for fast/ordinary + freight
  // Per Sun Ferry dataspec: timetable remark "1" denotes Ordinary ferry service and freight service is allowed. [page:0]
  async function loadSunFerryBidirectionalFromGithubCsv(url, outboundLabel, inboundLabel){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const csv = await res.text();
    const lines = csv.split(/\r?\n/).filter(l => l.trim());

    const weekday = { outbound: [], inbound: [] };
    const holiday = { outbound: [], inbound: [] };

    for (let i=1;i<lines.length;i++){
      const row = lines[i].split(',');
      if (row.length < 3) continue;

      const direction = row[0].trim();
      const serviceDate = row[1].trim().toLowerCase();
      const serviceHour = row[2].trim();
      const remark = (row[3] || '').trim(); // SunFerry CSV has Remark column in your files

      const hhmm = ampmTo24(serviceHour);
      if (!hhmm) continue;

      let dirKey = null;
      if (direction === outboundLabel) dirKey = 'outbound';
      else if (direction === inboundLabel) dirKey = 'inbound';
      else continue;

      const isHolidayRow = serviceDate.includes('sundays and public holidays') || serviceDate.includes('sunday and public holidays');

      const remarkNum = remark ? Number(remark) : NaN;

      // Ordinary+Freight: 1/3/4 (dataspec lists 1,3,4 as ordinary + freight allowed; 2 is weekday-only qualifier). [page:0]
      const isOrd = (remarkNum === 1 || remarkNum === 3 || remarkNum === 4);
      const freightOk = isOrd; // per dataspec wording [page:0]
      const isFast = !isOrd;   // treat others as fast (no remark / remark=2 etc.)

      const obj = { hhmm, isFast, isOrd, freightOk, remark: remark || '' };

      if (isHolidayRow) holiday[dirKey].push(obj);
      else weekday[dirKey].push(obj);
    }

    const sortDedup = (arr) => {
      const by = new Map();
      (arr||[]).forEach(x => {
        const key = `${x.hhmm}|${x.isFast?'F':'O'}|${x.freightOk?'C':'N'}`;
        if (!by.has(key)) by.set(key, x);
      });
      return Array.from(by.values()).sort((a,b) => timeToMinutesHHMM(a.hhmm) - timeToMinutesHHMM(b.hhmm));
    };

    ['outbound','inbound'].forEach(k => {
      weekday[k] = sortDedup(weekday[k]);
      holiday[k] = sortDedup(holiday[k]);
    });

    return { weekday, holiday };
  }

  async function loadPITCLFromCsv(url, outboundText, inboundText){
    const res = await fetch(url, { cache:'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const csv = await res.text();
    const lines = csv.split(/\r?\n/).filter(l => l.trim());

    const header = lines[0].replace(/^\uFEFF/, '');
    const headers = parseCsvLine(header).map(x => x.toLowerCase());
    const idxDir  = headers.indexOf('direction');
    const idxDate = headers.indexOf('service date');
    const idxHour = headers.indexOf('service hour');
    if (idxDir < 0 || idxDate < 0 || idxHour < 0) throw new Error(`PITCL CSV header not recognised\n${url}`);

    const weekday = { outbound: [], inbound: [] };
    const holiday = { outbound: [], inbound: [] };

    for (let i=1;i<lines.length;i++){
      const row = parseCsvLine(lines[i]);
      if (row.length <= Math.max(idxDir, idxDate, idxHour)) continue;

      const direction = normaliseDirection(row[idxDir]);
      const serviceDate = String(row[idxDate]||'').trim().toLowerCase();
      const serviceHour = String(row[idxHour]||'').trim();

      const hhmm = ampmTo24(serviceHour);
      if (!hhmm) continue;

      let dirKey = null;
      if (direction === outboundText) dirKey = 'outbound';
      else if (direction === inboundText) dirKey = 'inbound';
      else continue;

      const isHolidayRow =
        serviceDate.includes('saturdays') || serviceDate.includes('saturday') ||
        serviceDate.includes('sundays')   || serviceDate.includes('sunday');

      const obj = { hhmm };
      if (isHolidayRow) holiday[dirKey].push(obj);
      else weekday[dirKey].push(obj);
    }

    const sortDedup = (arr) => Array.from(new Set(arr.map(x => x.hhmm))).sort().map(hhmm => ({hhmm}));
    ['outbound','inbound'].forEach(k => {
      weekday[k] = sortDedup(weekday[k]);
      holiday[k] = sortDedup(holiday[k]);
    });

    return { weekday, holiday };
  }

  async function loadInterIslandDirections(url){
    const res = await fetch(url, { cache:'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const csv = await res.text();
    const lines = csv.split(/\r?\n/).filter(l => l.trim());

    const header = lines[0].replace(/^\uFEFF/, '');
    const headers = header.split(',').map(x => x.trim().toLowerCase());
    const idxDir  = headers.indexOf('direction');
    const idxHour = headers.indexOf('service hour');
    if (idxDir < 0 || idxHour < 0) throw new Error(`Inter-Island CSV header not recognised\n${url}`);

    const out = {};
    for (let i=1;i<lines.length;i++){
      const row = lines[i].split(',');
      if (row.length <= Math.max(idxDir, idxHour)) continue;

      const direction = normaliseDirection(row[idxDir]);
      const hhmm = ampmTo24(row[idxHour]);
      if (!direction || !hhmm) continue;

      if (!out[direction]) out[direction] = [];
      out[direction].push(hhmm);
    }
    Object.keys(out).forEach(k => out[k] = Array.from(new Set(out[k])).sort());
    return out;
  }

  function groupInterIslandByDeparture(interMap){
    const byPier = {
      'Cheung Chau': {},
      'Mui Wo': {},
      'Peng Chau': {},
      'Chi Ma Wan': {}
    };
    Object.keys(interMap || {}).forEach(dir => {
      const parts = dir.split(' to ');
      if (parts.length !== 2) return;
      const from = parts[0].trim();
      const to = parts[1].trim();
      if (!byPier[from]) byPier[from] = {};
      byPier[from][to] = (interMap[dir] || []).slice();
    });
    Object.keys(byPier).forEach(from => {
      Object.keys(byPier[from]).forEach(to => {
        byPier[from][to] = Array.from(new Set(byPier[from][to])).sort();
      });
    });
    return byPier;
  }

  async function loadDbayFromGithubCsv(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Fetch failed (${res.status})\n${url}`);
    const csv = await res.text();
    const lines = csv.split(/\r?\n/).filter(l => l.trim());

    const header = lines[0].replace(/^\uFEFF/, '');
    const headers = header.split(',').map(x => x.trim().toLowerCase());
    const idxDir = headers.indexOf('direction');
    const idxDate = headers.indexOf('service date');
    const idxHour = headers.indexOf('service hour');
    if (idxDir < 0 || idxDate < 0 || idxHour < 0) throw new Error(`Discovery Bay CSV header not recognised\n${url}`);

    const out = { outbound:{weekday:[],saturday:[],holiday:[]}, inbound:{weekday:[],saturday:[],holiday:[]} };

    const bucket = (s) => {
      const x = String(s||'').trim().toLowerCase();
      if (x.includes('mondays to fridays')) return 'weekday';
      if (x.includes('saturdays')) return 'saturday';
      if (x.includes('sundays and public holidays') || x.includes('sunday and public holidays')) return 'holiday';
      return null;
    };

    for (let i=1;i<lines.length;i++){
      const row = lines[i].split(',');
      if (row.length <= Math.max(idxDir, idxDate, idxHour)) continue;

      const direction = row[idxDir].trim();
      const b = bucket(row[idxDate]);
      const hhmm = ampmTo24(row[idxHour]);
      if (!b || !hhmm) continue;

      const obj = { hhmm };
      if (direction === 'Central to Discovery Bay') out.outbound[b].push(obj);
      else if (direction === 'Discovery Bay to Central') out.inbound[b].push(obj);
    }

    ['outbound','inbound'].forEach(dir => {
      ['weekday','saturday','holiday'].forEach(b => {
        out[dir][b] = Array.from(new Set(out[dir][b].map(x => x.hhmm))).sort().map(hhmm => ({hhmm}));
      });
    });

    return out;
  }

  function fareHtml(routeId){
    const f = FARES[routeId];
    if (!f) {
      return `<div class="fare-card"><div class="fare-title">Fares</div><div class="fare-sub">No fare data available.</div></div>`;
    }

    const isPITCL = (routeId === 'central-mawan' || routeId === 'mawan-tsuenwan');
    const isDaily = (routeId.startsWith('inter-island'));
    const b = isDaily ? 'daily' : (isPITCL ? todayBucketPITCL() : todayBucketGeneral());

    const pack = (b === 'holiday') ? f.holiday : f.weekdaySat;
    const dayTitle = (b === 'holiday') ? f.holidayLabel : f.weekdaySatLabel;

    const colHead = pack.services.map(s => `<th style="text-align:right">${s}</th>`).join('');
    const rows = pack.rows.map(r => {
      const cells = r.values.map(v => `<td class="num">$${Number(v).toString()}</td>`).join('');
      return `<tr><td>${r.label}</td>${cells}</tr>`;
    }).join('');

    return `
      <div class="fare-card">
        <div class="fare-title">${f.title}</div>
        <div class="fare-sub">${isDaily ? 'All days' : dayTitle}</div>
        <table class="fare-table">
          <thead><tr><th>Passenger / Service</th>${colHead}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="fare-note">Note: Fares shown are as provided and may be subject to change.</div>
      </div>
    `;
  }

  function makeTagsHTML(x){
    const tags = [];
    if (x && x.isFast) tags.push(`<span class="tag fast">Fast Ferry</span>`);
    if (x && x.isOrd) tags.push(`<span class="tag ord">Ordinary</span>`);
    if (x && x.freightOk) tags.push(`<span class="tag freight">Freight OK</span>`);
    if (x && x.noFreight) tags.push(`<span class="tag nofreight">No freight</span>`);
    if (x && x.viaHei) tags.push(`<span class="tag via">Via Hei Ling Chau</span>`);
    if (x && x.isLast) tags.push(`<span class="tag last">Last</span>`);
    return tags.join('');
  }

  function renderNext(prefix, nextTimes, allTimes){
    const nextList = document.getElementById(`${prefix}-next-list`);
    const nextEl = document.getElementById(`${prefix}-next`);
    const status = document.getElementById(`${prefix}-status`);
    nextList.innerHTML = '';

    if (nextTimes.length){
      const item0 = nextTimes[0];
      const hhmm0 = normaliseTimeHHMM(item0.hhmm || item0);
      nextEl.textContent = hhmm0;

      status.textContent = 'On time';
      status.className = 'status on';
      nextDepartureMinutes[prefix] = timeToMinutesHHMM(hhmm0);

      nextTimes.forEach(item => {
        const hhmm = normaliseTimeHHMM(item.hhmm || item);
        const li = document.createElement('li');
        const tags = (typeof item === 'object') ? makeTagsHTML(item) : `<span class="tag">Scheduled</span>`;
        li.innerHTML = `<span class="t">${hhmm}</span>${tags || `<span class="tag">Scheduled</span>`}`;
        nextList.appendChild(li);
      });
    } else {
      nextDepartureMinutes[prefix] = null;
      const first = allTimes && allTimes.length ? allTimes[0] : null;
      const hhmmFirst = first ? normaliseTimeHHMM(first.hhmm || first) : '--:--';
      nextEl.textContent = hhmmFirst;
      status.textContent = 'Tomorrow';
      status.className = 'status tom';

      const li = document.createElement('li');
      li.innerHTML = `<span class="t">${hhmmFirst}</span><span class="tag">First sailing tomorrow</span>`;
      nextList.appendChild(li);
    }
  }

  function getNextInterPierDeparture(pier, interData){
    const destMap = (interData && interData[pier]) ? interData[pier] : {};
    const all = [];
    Object.keys(destMap).forEach(dest => {
      (destMap[dest] || []).forEach(t => all.push({ t, dest }));
    });

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();

    const future = all
      .map(x => ({...x, m: timeToMinutesHHMM(x.t)}))
      .filter(x => x.m > nowMin)
      .sort((a,b) => a.m - b.m);

    if (future.length) return future[0];

    const earliest = all
      .map(x => ({...x, m: timeToMinutesHHMM(x.t)}))
      .sort((a,b) => a.m - b.m);

    return earliest.length ? { ...earliest[0], tomorrow: true } : null;
  }

  function updateInterIslandOverviewNextTargets(){
    const data = routesData['inter-island-overview'];
    if (!data || !data.interData) return;

    const pierOrder = ['Cheung Chau','Chi Ma Wan','Mui Wo','Peng Chau'];

    pierOrder.forEach(pier => {
      const pierKey = pier.replace(/\s+/g,'-');
      const next = getNextInterPierDeparture(pier, data.interData);

      const elNext = document.getElementById(`inter-${pierKey}-next`);
      const elTo = document.getElementById(`inter-${pierKey}-to`);
      const elStatus = document.getElementById(`inter-${pierKey}-status`);

      if (!next){
        interNextDepartureMin[pierKey] = null;
        if (elNext) elNext.textContent = '--:--';
        if (elTo) elTo.textContent = '';
        if (elStatus){ elStatus.textContent = 'Tomorrow'; elStatus.className='status tom'; }
        return;
      }

      if (elNext) elNext.textContent = next.t;
      if (elTo) elTo.textContent = next.dest ? ('To: ' + next.dest) : '';
      if (elStatus){
        elStatus.textContent = next.tomorrow ? 'Tomorrow' : 'On time';
        elStatus.className = next.tomorrow ? 'status tom' : 'status on';
      }

      interNextDepartureMin[pierKey] = next.tomorrow ? null : next.m;
    });
  }

  function updateDisplay(){
    if (!dataReady) return;

    if (currentRoute === 'inter-island-overview') {
      updateInterIslandOverviewNextTargets();
      return;
    }

    const data = routesData[currentRoute];
    if (!data) return;

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();

    let outTimes = [], inTimes = [];

    if (data.mode === 'hkkf' || data.mode === 'sunferry'){
      const b = todayBucketGeneral();
      const isHoliday = (b === 'holiday');
      outTimes = isHoliday ? data.outbound.times.holiday : data.outbound.times.weekday;
      inTimes  = isHoliday ? data.inbound.times.holiday  : data.inbound.times.weekday;
    } else if (data.mode === 'pitcl'){
      const b = todayBucketPITCL();
      const isHoliday = (b === 'holiday');
      outTimes = isHoliday ? data.outbound.times.holiday : data.outbound.times.weekday;
      inTimes  = isHoliday ? data.inbound.times.holiday  : data.inbound.times.weekday;
    } else if (data.mode === 'daily'){
      outTimes = data.outbound.times.daily || [];
      inTimes  = data.inbound.times.daily  || [];
    } else if (data.mode === 'dbay'){
      const b = todayBucketGeneral();
      outTimes = data.outbound.times[b] || [];
      inTimes  = data.inbound.times[b] || [];
    }

    renderNext('outbound', getNextN(nowMin, outTimes, 10), outTimes);
    renderNext('inbound',  getNextN(nowMin, inTimes, 10),  inTimes);
  }

      dataReady = false;
      setSidebarEnabled(true);
      if (isFirst) setMainStatus('Error loading data', String(e && e.message ? e.message : e));
    }
  }

  // Countdown timer: outbound/inbound + inter overview
  setInterval(() => {
    const now = new Date();
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

    ['outbound','inbound'].forEach(prefix => {
      const el = document.getElementById(`${prefix}-countdown`);
      if (!el) return;

      const departMin = nextDepartureMinutes[prefix];
      if (departMin == null){ el.textContent = '--:--:--'; return; }

      let diff = departMin*60 - nowSec;
      if (diff <= 0){ el.textContent = '00:00:00'; return; }

      const h = Math.floor(diff/3600);
      const m = Math.floor((diff%3600)/60);
      const s = diff%60;
      el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    });

    if (currentRoute === 'inter-island-overview'){
      Object.keys(interNextDepartureMin).forEach(pierKey => {
        const el = document.getElementById(`inter-${pierKey}-countdown`);
        if (!el) return;

        const departMin = interNextDepartureMin[pierKey];
        if (departMin == null){ el.textContent = '--:--:--'; return; }

        let diff = departMin*60 - nowSec;
        if (diff <= 0){ el.textContent = '00:00:00'; return; }

        const h = Math.floor(diff/3600);
        const m = Math.floor((diff%3600)/60);
        const s = diff%60;
        el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      });
    }
  }, 1000);

  document.querySelectorAll('.route-btn').forEach(btn => {
    btn.addEventListener('click', () => selectRoute(btn.dataset.route));
  });

  loadAllRoutes(true);
  setInterval(updateDisplay, 60*1000);
  setInterval(() => loadAllRoutes(false), 60*1000);
</script>
</body>
</html>
