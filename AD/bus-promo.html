<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Promo Slider</title>
    <style>
        /* 確保圖片完美填滿，冇白邊 */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #ffffff; 
        }
        
        #slider-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out; /* 淡入淡出動畫時間：0.8秒 */
            display: block;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 10;
        }

        .slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* 確保圖片唔變形，自動填滿正方形 */
            display: block; 
        }
    </style>
</head>
<body>

    <div id="slider-container"></div>

    <script>
        // ==========================================
        // 🖼️ 喺度設定你嘅圖片同連結！
        // 你可以隨意加多幾行或者減少
        // ==========================================
        const promoData = [
            {
                image: "https://dannytcchan00.github.io/0Data/AD/imag/wangwang02.jpeg",              // 第一張圖嘅檔名或網址
                link: "https://www.change.org/p/%E8%B7%A8%E5%9C%8B%E9%80%A3%E7%BD%B2-%E7%82%BA%E5%BB%A3%E6%9D%B1%E6%8F%AD%E9%99%BD%E5%8F%97%E8%99%90%E6%B5%81%E6%B5%AA%E5%8B%95%E7%89%A9%E8%A8%8E%E5%9B%9E%E5%85%AC%E9%81%93-%E8%A6%81%E6%B1%82%E5%BE%B9%E6%9F%A5%E6%AE%98%E5%BF%8D%E8%99%90%E6%AE%BA%E6%A1%88%E8%88%87%E6%9D%91%E6%B0%91%E5%8C%85%E5%BA%87%E8%A1%8C%E7%82%BA?recruited_by_id=9141c8f0-85d2-11f1-99f2-a59f5612a925&utm_source=share_petition&utm_campaign=psf_combo_share_initial&utm_medium=copylink&share_id=nKmWnS78kj"      // 撳落去彈去邊
            },
            {
                image: "https://dannytcchan00.github.io/0Data/AD/imag/wangwang03.png",              // 第二張圖嘅檔名或網址
                link: "https://www.change.org/p/%E8%B7%A8%E5%9C%8B%E9%80%A3%E7%BD%B2-%E7%82%BA%E5%BB%A3%E6%9D%B1%E6%8F%AD%E9%99%BD%E5%8F%97%E8%99%90%E6%B5%81%E6%B5%AA%E5%8B%95%E7%89%A9%E8%A8%8E%E5%9B%9E%E5%85%AC%E9%81%93-%E8%A6%81%E6%B1%82%E5%BE%B9%E6%9F%A5%E6%AE%98%E5%BF%8D%E8%99%90%E6%AE%BA%E6%A1%88%E8%88%87%E6%9D%91%E6%B0%91%E5%8C%85%E5%BA%87%E8%A1%8C%E7%82%BA?recruited_by_id=9141c8f0-85d2-11f1-99f2-a59f5612a925&utm_source=share_petition&utm_campaign=psf_combo_share_initial&utm_medium=copylink&share_id=nKmWnS78kj"      // 撳落去彈去邊
            },
            {
                image: "https://dannytcchan00.github.io/0Data/AD/imag/wangwang04.jpeg",              // 第三張圖嘅檔名或網址
                link: "https://www.change.org/p/%E8%B7%A8%E5%9C%8B%E9%80%A3%E7%BD%B2-%E7%82%BA%E5%BB%A3%E6%9D%B1%E6%8F%AD%E9%99%BD%E5%8F%97%E8%99%90%E6%B5%81%E6%B5%AA%E5%8B%95%E7%89%A9%E8%A8%8E%E5%9B%9E%E5%85%AC%E9%81%93-%E8%A6%81%E6%B1%82%E5%BE%B9%E6%9F%A5%E6%AE%98%E5%BF%8D%E8%99%90%E6%AE%BA%E6%A1%88%E8%88%87%E6%9D%91%E6%B0%91%E5%8C%85%E5%BA%87%E8%A1%8C%E7%82%BA?recruited_by_id=9141c8f0-85d2-11f1-99f2-a59f5612a925&utm_source=share_petition&utm_campaign=psf_combo_share_initial&utm_medium=copylink&share_id=nKmWnS78kj"      // 撳落去彈去邊
            }
        ];

        const ROTATE_SPEED = 5000; // 每張圖片停留時間 (5000 = 5秒)

        // ==========================================
        // ⚙️ 下面係幻燈片系統邏輯 (唔需要改)
        // ==========================================
        const container = document.getElementById('slider-container');
        let currentIndex = 0;

        // 動態生成 HTML 圖片
        promoData.forEach((promo, index) => {
            const a = document.createElement('a');
            a.href = promo.link;
            a.target = "_blank"; // 開新分頁
            a.className = index === 0 ? 'slide active' : 'slide'; // 第一張預設顯示
            
            const img = document.createElement('img');
            img.src = promo.image;
            img.alt = `Promo ${index + 1}`;
            
            a.appendChild(img);
            container.appendChild(a);
        });

        const slides = document.querySelectorAll('.slide');

        // 如果圖片多過 1 張，先啟動自動輪播功能
        if (slides.length > 1) {
            setInterval(() => {
                // 將當前圖片隱藏
                slides[currentIndex].classList.remove('active');
                
                // 計算下一張圖片嘅號碼 (如果到尾就返去 0)
                currentIndex = (currentIndex + 1) % slides.length;
                
                // 將下一張圖片顯示
                slides[currentIndex].classList.add('active');
            }, ROTATE_SPEED);
        }
    </script>
</body>
</html>
