<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 復古紙張背景 -->
  <rect width="512" height="512" rx="115" fill="#FDFBF7"/>
  
  <!-- 手繪風太陽 (粉彩黃) -->
  <circle cx="160" cy="180" r="50" fill="#FFD93D" stroke="#4A4A4A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 手繪風雲朵 (粉彩藍) -->
  <path d="M190 220 C190 180, 250 180, 270 200 C290 160, 360 170, 370 210 C410 210, 410 270, 370 270 L190 270 C150 270, 150 220, 190 220 Z" fill="#A2D2FF" stroke="#4A4A4A" stroke-width="14" stroke-linejoin="round"/>

  <!-- 手繪風復古巴士 (懷舊紅) -->
  <path d="M130 290 Q130 260 160 260 L350 260 Q380 260 380 290 L380 390 Q380 410 360 410 L150 410 Q130 410 130 390 Z" fill="#FF6B6B" stroke="#4A4A4A" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- 忌廉黃橫條 -->
  <path d="M130 340 L380 340" stroke="#FFF0C2" stroke-width="24"/>
  <path d="M130 328 L380 328" stroke="#4A4A4A" stroke-width="12" stroke-linecap="round"/>
  <path d="M130 352 L380 352" stroke="#4A4A4A" stroke-width="12" stroke-linecap="round"/>

  <!-- 車窗 -->
  <rect x="155" y="280" width="45" height="40" rx="8" fill="#FDFBF7" stroke="#4A4A4A" stroke-width="12" stroke-linejoin="round"/>
  <rect x="215" y="280" width="45" height="40" rx="8" fill="#FDFBF7" stroke="#4A4A4A" stroke-width="12" stroke-linejoin="round"/>
  <rect x="275" y="280" width="80" height="40" rx="8" fill="#FDFBF7" stroke="#4A4A4A" stroke-width="12" stroke-linejoin="round"/>

  <!-- 車轆 -->
  <circle cx="190" cy="410" r="28" fill="#4A4A4A" />
  <circle cx="190" cy="410" r="10" fill="#FDFBF7" />
  <circle cx="320" cy="410" r="28" fill="#4A4A4A" />
  <circle cx="320" cy="410" r="10" fill="#FDFBF7" />
  
  <!-- 站牌小細節 -->
  <path d="M80 200 L80 430" stroke="#4A4A4A" stroke-width="12" stroke-linecap="round"/>
  <circle cx="80" cy="180" r="20" fill="#FFD93D" stroke="#4A4A4A" stroke-width="12"/>
</svg>
