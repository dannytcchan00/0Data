<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typhoon Information Centre - Met Office</title>
    
    <!-- 引入 Leaflet 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 引入 Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-navy: #112a46;
            --brand-blue: #0984e3;
            --bg-light: #f4f6f9;
            --white: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --alert-red: #e74c3c;
            --card-shadow: 0 4px 12px rgba(17, 42, 70, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-light); color: var(--text-main); line-height: 1.5; padding: 25px; }

        .dashboard-container { max-width: 1550px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }

        .top-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 25px; }
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }

        .box { 
            background: var(--white); border-radius: 12px; padding: 22px; 
            box-shadow: var(--card-shadow); border-top: 4px solid var(--brand-navy); 
            display: flex; flex-direction: column; position: relative;
        }
        
        .box-title { 
            font-size: 16px; font-weight: 700; color: var(--brand-navy); 
            margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
        }

        /* 1. 多颱風卡片樣式 (已修復高度延伸問題) */
        .multi-typhoon-wrapper { display: flex; flex-direction: column; flex-grow: 1; width: 100%; position: relative; }

        .multi-typhoon-container { 
            display: flex; flex-direction: row; flex-wrap: nowrap; gap: 15px; 
            overflow-x: auto; overflow-y: hidden; padding-bottom: 5px; 
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
            scrollbar-width: none; -ms-overflow-style: none;
            flex-grow: 1; /* 讓輪播容器填滿高度 */
        }
        .multi-typhoon-container::-webkit-scrollbar { display: none; }
        
        .typhoon-card { 
            flex: 0 0 100%; min-width: 100%; scroll-snap-align: center; 
            border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; 
            background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
            display: flex; flex-direction: column; /* 讓卡片內部可延伸 */
        }

        .carousel-dots { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 15px; min-height: 10px; }
        .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #cbd5e1; cursor: pointer; transition: all 0.3s ease; }
        .carousel-dot.active { background-color: var(--brand-navy); transform: scale(1.3); }

        .tc-card-header { font-weight: bold; color: var(--brand-navy); font-size: 16px; margin-bottom: 12px; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .tc-card-body { display: flex; gap: 15px; align-items: center; }
        
        /* 轉換圖示 (Transition Icons) */
        .pred-signal-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 140px; }
        .signal-transition { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .pred-icon { width: 52px !important; height: 52px !important; font-size: 18px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; flex-shrink: 0; text-align: center; line-height: 1.1; }
        .transition-arrow { font-size: 20px; color: var(--text-muted); font-weight: bold; }
        
        /* 文字機率標籤 */
        .prob-text-level {
            padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold;
            display: inline-block; text-align: center; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .typhoon-status { flex: 1; padding: 10px; background: #f8fafc; border-radius: 8px; font-size: 12px; border-left: 3px solid var(--brand-blue); line-height: 1.5; }
        
        .timing-box { margin-top: 10px; padding: 8px 12px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px; font-size: 12.5px; color: #b78103; display: flex; align-items: center; gap: 6px; }
        .timing-box strong { color: #d35400; font-size: 13px; }
        
        .pred-reason { 
            font-size: 12px; color: var(--text-muted); text-align: left; 
            background: #f0f4f8; padding: 10px; border-radius: 6px; 
            margin-top: 10px; line-height: 1.5; 
            flex-grow: 1; /* 強制灰色框框向下延伸填滿空白 */
        }

        /* 2 & 3. 滾動清單樣式 */
        .data-list { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 5px; }
        .data-list::-webkit-scrollbar { width: 5px; }
        .data-list::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 4px; }
        
        .data-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--bg-light); font-size: 13.5px; transition: all 0.2s ease; }
        .data-item.clickable { cursor: pointer; border-left: 4px solid transparent; }
        .data-item.clickable:hover { background-color: #e2e8f0; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-left-color: var(--brand-blue); }
        .data-item strong { color: var(--brand-navy); }

        /* 4 & 5. 地圖樣式 */
        .map-container { width: 100%; height: 460px; background: #e2e8f0; border-radius: 8px; z-index: 1; }
        @keyframes spinReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        .typhoon-emoji { font-size: 24px; animation: spinReverse 1.5s linear infinite; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; text-shadow: 0 0 4px rgba(0,0,0,0.5); cursor: pointer; }

        .map-legend { position: absolute; bottom: 35px; left: 35px; background: rgba(255, 255, 255, 0.92); padding: 10px 14px; border-radius: 6px; font-size: 11px; z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,0.15); border: 1px solid #ddd; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-weight: bold; }
        .legend-color { width: 14px; height: 4px; border-radius: 2px; }

        /* 彈出視窗 (Modal) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 42, 70, 0.6); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: var(--white); width: 90%; max-width: 700px; border-radius: 12px; padding: 30px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transform: translateY(20px); transition: transform 0.3s ease; }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .close-btn:hover { color: var(--alert-red); }
        
        .modal-header { font-size: 22px; font-weight: bold; color: var(--brand-navy); margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .modal-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }
        .chart-container { width: 100%; height: 320px; position: relative; }

        @media (max-width: 1200px) { .top-row { grid-template-columns: 1fr; } .bottom-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- 上排三欄 -->
        <div class="top-row">
            
            <div class="box">
                <div class="box-title">
                    <span data-i18n="title_prob">📊 智能風球走勢預測</span>
                    <small style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: auto;" data-i18n="title_prob_sub">Signal Trend Predictor</small>

                    <div class="multi-typhoon-container" id="multi-typhoon-container">

                    </div>
                    <div class="carousel-dots" id="carousel-dots"></div>
                </div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span data-i18n="title_wind">💨 各區實時風速與風向</span>
                    <small style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: auto;" data-i18n="click_details">(點擊查看24小時圖表)</small>
                </div>
                <div class="data-list" id="wind-list-container">
                    <div style="text-align: center; padding: 25px; color: gray;" data-i18n="loading_wind">🔄 正在載入風力數據...</div>
                </div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span data-i18n="title_rain">🌧️ 各區實時雨量監測</span>
                    <small style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: auto;" data-i18n="click_details">(點擊查看24小時圖表)</small>
                </div>
                <div class="data-list" id="rain-list-container">
                    <div style="text-align: center; padding: 25px; color: gray;" data-i18n="loading_rain">🔄 正在載入雨量數據...</div>
                </div>
            </div>

        </div>

        <!-- 下排雙地圖 -->
        <div class="bottom-row">

            <div class="box">
                <div class="box-title" data-i18n="title_hko">🇭🇰 香港天文台預測路徑與影響範圍</div>
                <div id="hko-map" class="map-container"></div>
            </div>

            <div class="box">
                <div class="box-title" data-i18n="title_ncdr">🌐 各國機構颱風預測路徑</div>
                <div id="ncdr-map" class="map-container"></div>
                
                <div class="map-legend">
                    <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div> <span data-i18n="legend_jma">JMA (日本)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#3498db;"></div> <span data-i18n="legend_jtwc">JTWC (美國)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#f39c12;"></div> <span data-i18n="legend_cwa">CWA (台灣)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#2ecc71;"></div> <span data-i18n="legend_kma">KMA (韓國)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#9b59b6;"></div> <span data-i18n="legend_nmc">NMC (中國)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#34495e;"></div> <span data-i18n="legend_hko">HKO (香港)</span></div>
                </div>
            </div>

        </div>

    </div>

    <!-- 圖表彈出視窗 -->
    <div id="data-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="modal-header">📍 <span id="modal-title">氣象站</span></div>
            <div class="modal-subtitle" id="modal-subtitle" data-i18n="modal_subtitle">過去 24 小時數據趨勢分析 (模擬推算)</div>
            <div class="chart-container"><canvas id="detailChart"></canvas></div>
        </div>
    </div>

    <script>
        // ================= 語言設定 =================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'tc';

        const i18nDict = {
            "tc": {

                "title_hko": "🇭🇰 香港天文台預測路徑與影響範圍", "title_ncdr": "🌐 各國機構颱風預測路徑",
                "click_details": "(點擊查看24小時圖表)",

                "no_wind": "暫無風速數據", "no_rain": "暫無降雨數據", "no_typhoon": "現時西北太平洋並無活躍熱帶氣旋",

                "legend_jma": "JMA (日本)", "legend_jtwc": "JTWC (美國)", "legend_cwa": "CWA (台灣)",
                "legend_kma": "KMA (韓國)", "legend_nmc": "NMC (中國)", "legend_hko": "HKO (香港)",
                "chart_wind": "風力數據", "chart_rain": "雨量數據",
                "label_wind_spd": "風速 (km/h)", "label_rain_vol": "降雨量 (mm)",
                "modal_subtitle": "過去 24 小時數據趨勢分析 (模擬推算)",
                "active_warn": "現正生效: ", "active_t10": "颶風信號", "signal": "號信號",
                "rationale_title": "分析理據：", "rationale_met": "條件已充分滿足。", "rationale_t10": "十號颶風信號現正生效。",

                "imminent": "短期內 / 數小時內發出", "unlikely": "目前發出機會較低", "already_in_force": "信號現正生效中",
                "none": "無", "prob_lbl": "發生機率："
            },
            "en": {
                "title_prob": "📊 AI Signal Trend", "title_prob_sub": "Signal Trend Predictor",
                "title_wind": "💨 Real-time Wind", "title_rain": "🌧️ Real-time Rainfall",
                "title_hko": "🇭🇰 HKO Forecast Track", "title_ncdr": "🌐 International Forecasts",
                "click_details": "(Click for 24h Chart)",
                "loading_data": "🔄 Loading...", "loading_wind": "🔄 Loading wind...", "loading_rain": "🔄 Loading rain...",
                "no_wind": "No wind data.", "no_rain": "No rainfall data.", "no_typhoon": "No active tropical cyclones.",
                "system_name": "System: ", "centre_pos": "Pos: ", "lat": "N", "lon": "E",
                "distance": "Dist: ", "approx": "Approx. ", "km": "km",
                "latest_pos": "Latest Position", "forecast_track": "Forecast Track",
                "hko_station": "<b>Hong Kong Observatory</b>",
                "legend_jma": "JMA (Japan)", "legend_jtwc": "JTWC (US)", "legend_cwa": "CWA (Taiwan)",
                "legend_kma": "KMA (Korea)", "legend_nmc": "NMC (China)", "legend_hko": "HKO (HK)",
                "chart_wind": "Wind Data", "chart_rain": "Rainfall Data",
                "label_wind_spd": "Wind Speed (km/h)", "label_rain_vol": "Rainfall (mm)",
                "modal_subtitle": "Past 24 Hours Data Trend Analysis (Simulation)",
                "active_warn": "Active: T", "active_t10": "10 Signal", "signal": "",
                "rationale_title": "Rationale:", "rationale_met": "Conditions fully met.", "rationale_t10": "T10 Hurricane Signal in force.",
                "load_fail": "❌ Failed to load Typhoon XML data.",
                "est_timing_lbl": "📅 Est. Timing: ",
                "imminent": "Expected within a few hours", "unlikely": "Issuance unlikely", "already_in_force": "Signal currently in force",
                "none": "Nil", "prob_lbl": "Probability: "
            }
        };

        const stationDictEN = {
            "香港天文台": "HK Observatory", "京士柏": "King's Park", "赤鱲角": "Chek Lap Kok", "長洲": "Cheung Chau", "流浮山": "Lau Fau Shan",
            "打鼓嶺": "Ta Kwu Ling", "沙田": "Sha Tin", "大埔": "Tai Po", "大埔墟": "Tai Po Market", "屯門": "Tuen Mun", "西貢": "Sai Kung", 
            "將軍澳": "Tseung Kwan O", "黃竹坑": "Wong Chuk Hang", "橫瀾島": "Waglan Island", "啟德": "Kai Tak", "坪洲": "Peng Chau", 
            "昂坪": "Ngong Ping", "大帽山": "Tai Mo Shan", "跑馬地": "Happy Valley", "筲箕灣": "Shau Kei Wan", "觀塘": "Kwun Tong", 
            "荃灣城門谷": "Shing Mun Valley", "荃灣可觀": "Ho Koon", "元朗公園": "Yuen Long Park", "上水": "Sheung Shui", "大美督": "Tai Mei Tuk", 
            "北潭涌": "Pak Tam Chung", "滘西洲": "Kau Sai Chau", "青衣": "Tsing Yi", "石崗": "Shek Kong", "中環": "Central", "中環碼頭": "Central Ferry Pier",

            "大老山": "Tate's Cairn", "黃大仙": "Wong Tai Sin", "九龍城": "Kowloon City", "深水埗": "Sham Shui Po", "清水灣": "Clear Water Bay",
            "赤柱": "Stanley", "香港公園": "Hong Kong Park", "大澳": "Tai O", "塔門": "Tap Mun", "青洲": "Green Island", "交椅洲": "Kau Yi Chau",
            "沙洲": "Sha Chau", "啟德跑道公園": "Kai Tak Runway Park", "石角咀": "Shek Kok Tsui", "大欖角": "Tai Lam Kok", "粉嶺": "Fanling",
            "荃灣": "Tsuen Wan", "葵涌": "Kwai Chung", "長沙灣": "Cheung Sha Wan", "山頂": "The Peak", "北角": "North Point", "昂船洲": "Stonecutters Island",
            "吉澳": "Kat O", "長洲泳灘": "Cheung Chau Beach", "西灣河": "Sai Wan Ho", "屯門(兒童及青少年院)": "Tuen Mun (Juv. Home)",
            "濕地公園": "Wetland Park", "水邊圍": "Shui Pin Wai", "香港國際機場": "HK Int. Airport", "大隴": "Tai Lung", "長青": "Cheung Ching", 
            "廣播道": "Broadcast Drive", "新蒲崗": "San Po Kong", "馬己仙峽": "Magazine Gap", "香港海事學校": "HK Sea School",
            "天星碼頭": "Star Ferry", "南丫島": "Lamma Island"
        };

        const windDirMapEN = {
            "北": "N", "東": "E", "南": "S", "西": "W", "東北": "NE", "西北": "NW", "東南": "SE", "西南": "SW",
            "北北東": "NNE", "北北西": "NNW", "南南東": "SSE", "南南西": "SSW", "東北東": "ENE", "東南東": "ESE", "西北西": "WNW", "西南西": "WSW",
            "微風": "Light Air", "無風": "Calm", "旋風": "VRB", "風向不定": "VRB"
        };

        function getStationName(name) { 
            if (currentLang !== 'en') return name;
            if (stationDictEN[name]) return stationDictEN[name];
            
            const sortedKeys = Object.keys(stationDictEN).sort((a, b) => b.length - a.length);
            for (let tcName of sortedKeys) {
                if (name.includes(tcName)) return name.replace(tcName, stationDictEN[tcName]);
            }
            return name;
        }

        function getWindDir(tcDir) { return (currentLang === 'en' && windDirMapEN[tcDir]) ? windDirMapEN[tcDir] : tcDir; }

        function applyLanguageUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nDict[currentLang] && i18nDict[currentLang][key]) { el.innerHTML = i18nDict[currentLang][key]; }
            });
        }

        function getProbLevel(prob) {
            if (prob === 0) return { text: currentLang === 'tc' ? "最低" : "Lowest", color: "#7f8c8d", bg: "#f4f6f9" };
            if (prob <= 15) return { text: currentLang === 'tc' ? "最低" : "Lowest", color: "#27ae60", bg: "#e9f7ef" };
            if (prob <= 33) return { text: currentLang === 'tc' ? "較低" : "Low", color: "#2ecc71", bg: "#eafaf1" };
            if (prob <= 50) return { text: currentLang === 'tc' ? "中等" : "Medium", color: "#f1c40f", bg: "#fef9e7" };
            if (prob <= 66) return { text: currentLang === 'tc' ? "較高" : "High", color: "#e67e22", bg: "#fbeee6" };
            if (prob <= 84) return { text: currentLang === 'tc' ? "高" : "Very High", color: "#e74c3c", bg: "#fdedec" };
            return { text: currentLang === 'tc' ? "極高" : "Extremely High", color: "#8e44ad", bg: "#f4ecf7" };
        }

        function getSigColor(sig) {
            if (sig == 1) return '#555555'; if (sig == 3) return '#27ae60'; if (sig == 8) return '#e67e22';
            if (sig == 9) return '#c0392b'; if (sig == 10) return '#8e44ad'; return '#bdc3c7';
        }

        // ================= 地圖及資料函數 =================
        const HK_LAT = 22.3027; const HK_LON = 114.1772;
        let hkoMap, ncdrMap, chartInstance = null;
        let hkoTyphoonLayer = null, ncdrTyphoonLayer = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function parseCoord(coordStr) {
            if (!coordStr) return null;
            let str = coordStr.trim().toUpperCase(); let num = parseFloat(str.replace(/[NSEW]/g, ''));
            if (isNaN(num)) return null; if (str.includes('S') || str.includes('W')) num = -num;
            return num;
        }

        async function fetchResource(url) {
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error("Fetch failed");
                return await res.text();
            } catch (e) {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const proxyRes = await fetch(proxyUrl, { cache: 'no-store' });
                const json = await proxyRes.json();
                return json.contents;
            }
        }

        function formatForecastTiming(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return null;
            const month = dateObj.getMonth() + 1; const day = dateObj.getDate(); const hour = dateObj.getHours();
            const weekdayTC = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][dateObj.getDay()];
            const weekdayEN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][dateObj.getDay()];
            const monthNamesEN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            let periodTC = "清晨"; let periodEN = "Early Morning"; let timeRange = "04:00 - 08:00";
            if (hour >= 6 && hour < 12) { periodTC = "上午"; periodEN = "Morning"; timeRange = "08:00 - 12:00"; } 
            else if (hour >= 12 && hour < 18) { periodTC = "下午"; periodEN = "Afternoon"; timeRange = "13:00 - 17:00"; } 
            else if (hour >= 18 && hour < 23) { periodTC = "晚間"; periodEN = "Evening"; timeRange = "18:00 - 22:00"; } 
            else { periodTC = "深夜至清晨"; periodEN = "Overnight"; timeRange = "23:00 - 05:00"; }
            if (currentLang === 'tc') return `${month}月${day}日 (${weekdayTC}) ${periodTC} <small style="color:#7f8c8d;">(約 ${timeRange})</small>`;
            else return `${day} ${monthNamesEN[month-1]} (${weekdayEN}), ${periodEN} <small style="color:#7f8c8d;">(Est. ${timeRange})</small>`;
        }

        function initMaps() {
            hkoMap = L.map('hko-map').setView([21.5, 112.0], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(hkoMap);
            L.circleMarker([HK_LAT, HK_LON], { radius: 6, color: '#112a46', fillColor: '#ffffff', fillOpacity: 1, weight: 2 }).addTo(hkoMap).bindPopup(i18nDict[currentLang]["hko_station"]);
            L.circle([HK_LAT, HK_LON], { radius: 1200000, color: '#27ae60', weight: 1.5, fill: false, dashArray: '6,6' }).addTo(hkoMap);
            L.circle([HK_LAT, HK_LON], { radius: 800000, color: '#e67e22', weight: 1.5, fill: false, dashArray: '6,6' }).addTo(hkoMap);
            L.circle([HK_LAT, HK_LON], { radius: 400000, color: '#e74c3c', weight: 1.5, fill: false, dashArray: '6,6' }).addTo(hkoMap);

            ncdrMap = L.map('ncdr-map').setView([21.5, 116.0], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(ncdrMap);
            ncdrTyphoonLayer = L.layerGroup().addTo(ncdrMap);
        }

        // ================= 解析 HKO XML =================
        async function loadHKOTyphoonTrack() {
            const langRef = i18nDict[currentLang];
            const multiContainer = document.getElementById('multi-typhoon-container');
            const dotsContainer = document.getElementById('carousel-dots');

            try {
                let activeTCSignal = 0;
                try {
                    const warnRes = await fetchResource(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc`);
                    const warnData = typeof warnRes === 'string' ? JSON.parse(warnRes) : warnRes;
                    if (warnData) {
                        const wList = Object.values(warnData);
                        for (let w of wList) {
                            if (w && w.name) {
                                if (w.name.includes("十號")) activeTCSignal = 10;
                                else if (w.name.includes("九號")) activeTCSignal = 9;
                                else if (w.name.includes("八號")) activeTCSignal = 8;
                                else if (w.name.includes("三號")) activeTCSignal = 3;
                                else if (w.name.includes("一號")) activeTCSignal = 1;
                            }
                        }
                    }
                } catch (e) {}

                const text = await fetchResource('https://dannytcchan00.github.io/0Data/data/current_typhoon.xml');
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const tracks = xml.querySelectorAll('TropicalCycloneTrack');

                if (tracks.length === 0) {
                    multiContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 25px; width: 100%;">${langRef.no_typhoon}</div>`;
                    dotsContainer.innerHTML = '';
                    return;
                }

                multiContainer.innerHTML = ''; dotsContainer.innerHTML = '';
                if (!hkoTyphoonLayer) hkoTyphoonLayer = L.layerGroup().addTo(hkoMap);
                hkoTyphoonLayer.clearLayers();

                const tcColors = ['#e74c3c', '#9b59b6', '#0984e3', '#e67e22', '#1abc9c'];
                let allHkoBounds = [[HK_LAT, HK_LON]];

                tracks.forEach((trackNode, index) => {
                    const report = trackNode.querySelector('WeatherReport');
                    if (!report) return;

                    const tcName = report.querySelector('TropicalCycloneName')?.textContent.trim() || "Tropical Cyclone";
                    const analysisNode = report.querySelector('AnalysisInformation');
                    if (!analysisNode) return;

                    const curLat = parseCoord(analysisNode.querySelector('Latitude')?.textContent);
                    const curLon = parseCoord(analysisNode.querySelector('Longitude')?.textContent);
                    const curIntensity = analysisNode.querySelector('Intensity')?.textContent || 'Tropical Cyclone';
                    const curWind = analysisNode.querySelector('MaximumWind')?.textContent || '--';
                    const curTimeStr = analysisNode.querySelector('Time')?.textContent;
                    const baseDate = curTimeStr ? new Date(curTimeStr) : new Date();

                    const distance = calculateDistance(HK_LAT, HK_LON, curLat, curLon);
                    const tcColor = tcColors[index % tcColors.length];

                    let p1 = 0, p3 = 0, p8 = 0, p9 = 0, p10 = 0;
                    let windNum = parseFloat(curWind.replace(/[^0-9.]/g, '')) || 40;
                    let intensityMultiplier = 1.0;
                    if (windNum < 41) intensityMultiplier = 0.1;       
                    else if (windNum <= 62) intensityMultiplier = 0.6; 
                    else if (windNum <= 87) intensityMultiplier = 0.8; 
                    else if (windNum <= 117) intensityMultiplier = 1.0; 
                    else intensityMultiplier = 1.1;                    

                    if (distance <= 800) { p1 = Math.min(99, Math.round((100 - (distance - 400) * 0.15) * intensityMultiplier)); if (windNum < 41) p1 = Math.min(p1, 10); }
                    if (distance <= 500) { p1 = Math.min(99, Math.round(98 * intensityMultiplier)); p3 = Math.min(95, Math.round((90 - (distance - 250) * 0.2) * Math.max(0, intensityMultiplier - 0.2))); }
                    if (distance <= 300) { p1 = Math.min(99, Math.round(100 * intensityMultiplier)); p3 = Math.min(95, Math.round(95 * intensityMultiplier)); p8 = Math.min(90, Math.round((75 + (windNum - 80) * 0.4) * intensityMultiplier)); }
                    if (distance <= 150) { p3 = Math.min(99, Math.round(100 * intensityMultiplier)); p8 = Math.min(95, Math.round(95 * intensityMultiplier)); if (windNum >= 90) p9 = Math.min(85, Math.round(65 * intensityMultiplier)); if (windNum >= 118) p10 = Math.min(60, Math.round(40 * intensityMultiplier)); }
                    if (distance <= 80) { p8 = Math.min(99, Math.round(100 * intensityMultiplier)); if (windNum >= 90) p9 = Math.min(95, Math.round(85 * intensityMultiplier)); if (windNum >= 118) p10 = Math.min(90, Math.round(75 * intensityMultiplier)); }

                    p1 = Math.max(0, Math.min(99, p1)); p3 = Math.max(0, Math.min(99, p3));
                    p8 = Math.max(0, Math.min(99, p8)); p9 = Math.max(0, Math.min(99, p9)); p10 = Math.max(0, Math.min(99, p10));

                    let targetSig = 1;
                    let targetProb = 0;
                    let isDowngrade = false;

                    if (activeTCSignal === 0) { targetSig = 1; targetProb = p1; } 
                    else if (activeTCSignal === 1) { if (p3 >= 15) { targetSig = 3; targetProb = p3; } else if (p1 < 40) { targetSig = 0; targetProb = 100 - p1; isDowngrade = true; } else { targetSig = 3; targetProb = p3; } } 
                    else if (activeTCSignal === 3) { if (p8 >= 15) { targetSig = 8; targetProb = p8; } else if (p3 < 40) { targetSig = 1; targetProb = 100 - p3; isDowngrade = true; } else { targetSig = 8; targetProb = p8; } } 
                    else if (activeTCSignal === 8) { if (p9 >= 15) { targetSig = 9; targetProb = p9; } else if (p8 < 40) { targetSig = 3; targetProb = 100 - p8; isDowngrade = true; } else { targetSig = 9; targetProb = p9; } } 
                    else if (activeTCSignal === 9) { if (p10 >= 15) { targetSig = 10; targetProb = p10; } else if (p9 < 40) { targetSig = 8; targetProb = 100 - p9; isDowngrade = true; } else { targetSig = 10; targetProb = p10; } } 
                    else if (activeTCSignal === 10) { if (p10 < 80) { targetSig = 8; targetProb = 100 - p10; isDowngrade = true; } else { targetSig = 10; targetProb = 100; } }

                    let currentSigText = activeTCSignal > 0 ? `T${activeTCSignal}` : langRef.none;
                    let targetSigText = targetSig > 0 ? `T${targetSig}` : langRef.none;
                    
                    let currentIconHtml = `<div class="pred-icon" style="background-color: ${getSigColor(activeTCSignal)};">${currentSigText}</div>`;
                    let targetIconHtml = `<div class="pred-icon" style="background-color: ${getSigColor(targetSig)};">${targetSigText}</div>`;

                    let lvl = getProbLevel(targetProb);
                    let textLevelHtml = `<div class="prob-text-level" style="background-color: ${lvl.bg}; color: ${lvl.color}; border: 1px solid ${lvl.color};">${langRef.prob_lbl}${lvl.text}</div>`;

                    const forecastNodes = report.querySelectorAll('ForecastInformation');
                    let forecastPts = [];
                    let forecastTrack = [[curLat, curLon]];
                    allHkoBounds.push([curLat, curLon]);

                    let totalNodes = forecastNodes.length;
                    forecastNodes.forEach((node, idx) => {
                        const fLat = parseCoord(node.querySelector('Latitude')?.textContent);
                        const fLon = parseCoord(node.querySelector('Longitude')?.textContent);
                        const fTimeStr = node.querySelector('Time')?.textContent;
                        let ptTime = fTimeStr ? new Date(fTimeStr) : new Date(baseDate.getTime() + (idx + 1) * (72 / Math.max(1, totalNodes)) * 3600000);

                        if (fLat !== null && fLon !== null) {
                            let fDist = calculateDistance(HK_LAT, HK_LON, fLat, fLon);
                            forecastPts.push({ lat: fLat, lon: fLon, dist: fDist, time: ptTime });
                            forecastTrack.push([fLat, fLon]);
                            allHkoBounds.push([fLat, fLon]);
                            if (idx > 0 && (idx % 12 === 0 || idx === forecastNodes.length - 1)) {
                                let errorRadius = 40000 + (idx * 3500); 
                                L.circle([fLat, fLon], { radius: errorRadius, color: tcColor, fillColor: tcColor, fillOpacity: 0.08, weight: 1, dashArray: '3,3' }).addTo(hkoTyphoonLayer);
                                L.circleMarker([fLat, fLon], { radius: 3, color: tcColor, fillColor: tcColor, fillOpacity: 1 }).addTo(hkoTyphoonLayer);
                            }
                        }
                    });

                    let thresholdDistance = 800;
                    if (targetSig === 3) thresholdDistance = 450; else if (targetSig === 8) thresholdDistance = 280; else if (targetSig >= 9) thresholdDistance = 120;
                    let estimatedTimeText = "";

                    if (targetSig === activeTCSignal && activeTCSignal !== 0) { estimatedTimeText = langRef.already_in_force; } 
                    else if (isDowngrade || (targetProb >= 85 && distance <= thresholdDistance)) { estimatedTimeText = langRef.imminent; } 
                    else {
                        let triggerPt = forecastPts.find(p => p.dist <= thresholdDistance);
                        if (triggerPt && targetProb >= 25) { estimatedTimeText = formatForecastTiming(triggerPt.time); } 
                        else if (targetProb >= 40) {
                            let closestPt = forecastPts.reduce((min, p) => p.dist < min.dist ? p : min, forecastPts[0] || { dist: 9999, time: baseDate });
                            if (closestPt) estimatedTimeText = formatForecastTiming(closestPt.time); else estimatedTimeText = langRef.unlikely;
                        } else { estimatedTimeText = langRef.unlikely; }
                    }

                    let distStr = Math.round(distance);
                    let activeWarnHtmlText = "";
                    if (activeTCSignal > 0) {
                        let sigText = activeTCSignal === 10 ? langRef.active_t10 : `${activeTCSignal}${langRef.signal}`;
                        activeWarnHtmlText = `<div style="margin-top:5px; color:var(--alert-red); font-weight:bold;">⚠️ ${langRef.active_warn}${sigText}</div>`;
                    }

                    let reasonHTML = "";
                    if (currentLang === 'tc') {
                        if (isDowngrade) {
                            if (targetSig === 0) reasonHTML = `<strong>${langRef.rationale_title}</strong><br>氣旋正逐漸遠離或減弱，本港風力威脅減退，預料<b>取消所有信號</b>的機率為 ${lvl.text}。`;
                            else reasonHTML = `<strong>${langRef.rationale_title}</strong><br>氣旋正逐漸遠離或減弱，本港風力威脅減退，<b>降級至 T${targetSig}</b> 的機率為 ${lvl.text}。`;
                        } else if (activeTCSignal === 10 && targetSig === 10) { 
                            reasonHTML = `<strong>${langRef.rationale_t10}</strong><br>氣旋中心風力達 ${curWind}。`; 
                        } else if (targetProb >= 99) { 
                            reasonHTML = `<strong>${langRef.rationale_met}</strong><br>氣旋極為接近，預料即將改發 T${targetSig} 信號。`; 
                        } else if (windNum <= 62) { 
                            reasonHTML = `<strong>${langRef.rationale_title}</strong><br>雖然氣旋頗為接近（約 ${distStr} 公里），但風力偏弱（${curWind}），<b>環流較細小</b>。本港 8 個參考站受影響機會受限，升級至 <b>T${targetSig}</b> 的機率為 ${lvl.text}。`; 
                        } else { 
                            reasonHTML = `<strong>${langRef.rationale_title}</strong><br>中心最高持續風速為 ${curWind}。系統綜合評估其環流大小及與本港距離，升級至 <b>T${targetSig}</b> 的機率為 ${lvl.text}。`; 
                        }
                    } else {
                        if (isDowngrade) {
                            if (targetSig === 0) reasonHTML = `<strong>${langRef.rationale_title}</strong><br>Cyclone is moving away or weakening. Probability of <b>cancelling all signals</b> is ${lvl.text}.`;
                            else reasonHTML = `<strong>${langRef.rationale_title}</strong><br>Cyclone is moving away or weakening. Probability of <b>downgrading to T${targetSig}</b> is ${lvl.text}.`;
                        } else if (activeTCSignal === 10 && targetSig === 10) { 
                            reasonHTML = `<strong>${langRef.rationale_t10}</strong><br>Center wind is ${curWind}.`; 
                        } else if (targetProb >= 99) { 
                            reasonHTML = `<strong>${langRef.rationale_met}</strong><br>Cyclone is very close. Issuance of T${targetSig} is imminent.`; 
                        } else if (windNum <= 62) { 
                            reasonHTML = `<strong>${langRef.rationale_title}</strong><br>Despite being close (${distStr} km), the system is weak with a <b>small circulation</b>. Threat to 8 reference stations is limited. Prob of upgrading to <b>T${targetSig}</b> is ${lvl.text}.`; 
                        } else { 
                            reasonHTML = `<strong>${langRef.rationale_title}</strong><br>Wind speed is ${curWind}. Factoring in circulation and distance, probability of upgrading to <b>T${targetSig}</b> is ${lvl.text}.`; 
                        }
                    }

                    let cardHtml = `
                        <div class="typhoon-card" style="border-left: 5px solid ${tcColor};">
                            <div class="tc-card-header" style="color: ${tcColor};">🌀 ${tcName} <span style="font-size:12px; color:var(--text-muted); font-weight:normal; margin-left:auto;">(${curIntensity})</span></div>
                            <div class="tc-card-body">
                                <div class="pred-signal-container">
                                    <div class="signal-transition">
                                        ${currentIconHtml}
                                        <div class="transition-arrow">➔</div>
                                        ${targetIconHtml}
                                    </div>
                                    ${textLevelHtml}
                                </div>
                                <div class="typhoon-status">
                                    <strong>${langRef.centre_pos}</strong> ${curLat.toFixed(1)}°, ${curLon.toFixed(1)}°<br>
                                    <strong>${langRef.distance}</strong> ${langRef.approx} <strong>${distStr}</strong> ${langRef.km}
                                    ${activeWarnHtmlText}
                                </div>
                            </div>
                            <div class="timing-box"><span>${langRef.est_timing_lbl}</span><strong>${estimatedTimeText}</strong></div>
                            <div class="pred-reason">${reasonHTML}</div>
                        </div>
                    `;
                    multiContainer.innerHTML += cardHtml;

                    const typhoonIcon = L.divIcon({ className: 'custom-icon', html: `<div class='typhoon-emoji' style="color:${tcColor}; text-shadow:0 0 5px rgba(255,255,255,0.8);">🌀</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
                    L.marker([curLat, curLon], { icon: typhoonIcon }).addTo(hkoTyphoonLayer).bindPopup(`<b>${tcName}</b><br>${curIntensity}`);
                    L.polyline(forecastTrack, { color: tcColor, weight: 3, dashArray: '5,5' }).addTo(hkoTyphoonLayer);
                });

                if (allHkoBounds.length > 1) { hkoMap.fitBounds(allHkoBounds, { padding: [40, 40] }); }

                if (tracks.length > 1) {
                    tracks.forEach((_, idx) => {
                        const dot = document.createElement('div');
                        dot.className = `carousel-dot ${idx === 0 ? 'active' : ''}`;
                        dot.onclick = () => {
                            const cardWidth = multiContainer.clientWidth;
                            multiContainer.scrollTo({ left: idx * cardWidth, behavior: 'smooth' });
                        };
                        dotsContainer.appendChild(dot);
                    });

                    multiContainer.onscroll = () => {
                        const scrollPos = multiContainer.scrollLeft;
                        const cardWidth = multiContainer.clientWidth;
                        const activeIdx = Math.round(scrollPos / cardWidth);
                        const dots = dotsContainer.children;
                        for (let i = 0; i < dots.length; i++) {
                            dots[i].className = `carousel-dot ${i === activeIdx ? 'active' : ''}`;
                        }
                    };
                }

            } catch (err) { 
                console.error("HKO XML Loading Failed:", err);
                multiContainer.innerHTML = `<div style="text-align: center; color: var(--alert-red); padding: 25px; width: 100%;">${langRef.load_fail || "讀取失敗"}</div>`;
            }
        }

        async function fetchWindData() {
            try {
                const text = await fetchResource('https://dannytcchan00.github.io/0Data/data/wind_data.csv');
                let rows = text.split(/\r?\n/).map(r => r.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''))).filter(r => r.length >= 2 && r[0] !== "");
                const container = document.getElementById('wind-list-container');
                container.innerHTML = '';

                let windList = [];
                const exactDirs = new Set(["北", "東", "南", "西", "東北", "東南", "西北", "西南", "東北偏北", "東北偏東", "東南偏東", "東南偏南", "西南偏南", "西南偏西", "西北偏西", "西北偏北", "微風", "無風", "旋風", "風向不定", "N", "E", "S", "W", "NE", "SE", "NW", "SW", "NNE", "ENE", "ESE", "SSE", "SSW", "WSW", "WNW", "NNW", "VRB", "CALM", "VARIABLE"]);

                rows.forEach(r => {
                    const rowStr = r.join(" ");
                    if (rowStr.includes("日期時間") || rowStr.includes("自動氣象站") || rowStr.includes("Date/Time") || rowStr.includes("Automatic")) return;

                    let numItems = []; let textItems = [];
                    r.forEach(x => {
                        let parsed = parseFloat(x);
                        if (!isNaN(parsed) && Math.abs(parsed) < 10000) { numItems.push(parsed); } 
                        else if (isNaN(parsed) && x !== "") { textItems.push(x); }
                    });

                    let speed = 0; let gust = null;
                    if (numItems.length >= 1) speed = numItems[0];
                    if (numItems.length >= 2) gust = numItems[1];

                    let dir = '--', station = null;
                    if (textItems.length >= 2) {
                        let dIdx = textItems.findIndex(x => exactDirs.has(x.toUpperCase()));
                        if (dIdx !== -1) { dir = textItems[dIdx]; textItems.splice(dIdx, 1); station = textItems[0]; } 
                        else { station = textItems[0]; }
                    } else if (textItems.length === 1) { station = textItems[0]; }

                    if (station && !exactDirs.has(station.toUpperCase()) && !station.includes("日期") && !station.includes("氣象站") && !station.includes("Wind")) {
                        windList.push({ station: station, dir: dir, speed: speed, gust: gust });
                    }
                });

                windList.sort((a, b) => b.speed - a.speed);

                windList.forEach(item => {
                    let speedClass = (item.speed >= 41) ? 'color: #e74c3c; font-weight: bold;' : 'color: var(--brand-navy); font-weight: bold;';
                    let displayStation = getStationName(item.station);
                    let displayDir = getWindDir(item.dir);
                    
                    let speedDisplay = item.speed;
                    if (item.gust !== null && item.gust > item.speed) {
                        speedDisplay = `${item.speed} <small style="color:var(--text-muted);">(${item.gust})</small>`;
                    }
                    
                    container.innerHTML += `
                        <div class="data-item clickable" onclick="openChartModal('wind', '${displayStation}', ${item.speed}, '${displayDir}', ${item.gust})">
                            <span>${displayStation}</span>
                            <span style="${speedClass}">${displayDir} ${speedDisplay} km/h</span>
                        </div>
                    `;
                });

                if (container.innerHTML === '') container.innerHTML = `<div style="text-align: center; padding: 25px; color: var(--text-muted);">${i18nDict[currentLang].no_wind}</div>`;
            } catch (err) { document.getElementById('wind-list-container').innerHTML = i18nDict[currentLang].no_wind; }
        }

        async function fetchRainData() {
            try {
                const raw = await fetchResource('https://dannytcchan00.github.io/0Data/data/rain_data.csv');
                let data = null;
                try { data = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) {}
                const container = document.getElementById('rain-list-container');
                container.innerHTML = '';

                let rainList = [];

                if (data && data.hourlyRainfall && Array.isArray(data.hourlyRainfall)) {
                    data.hourlyRainfall.forEach(item => {
                        const station = item.automaticWeatherStation;
                        const rainVal = parseFloat(item.value);
                        if (station && !isNaN(rainVal)) {
                            rainList.push({ station: station, rainVal: rainVal });
                        }
                    });

                    rainList.sort((a, b) => b.rainVal - a.rainVal);

                    rainList.forEach(item => {
                        let rainStyle = 'color: var(--text-muted); font-weight: normal;';
                        if (item.rainVal >= 50) rainStyle = 'color: #e74c3c; font-weight: bold;';
                        else if (item.rainVal >= 30) rainStyle = 'color: #e67e22; font-weight: bold;';
                        else if (item.rainVal > 0) rainStyle = 'color: #0984e3; font-weight: bold;';
                        
                        let displayStation = getStationName(item.station);
                        
                        container.innerHTML += `
                            <div class="data-item clickable" onclick="openChartModal('rain', '${displayStation}', ${item.rainVal}, null)">
                                <span>${displayStation}</span>
                                <span style="${rainStyle}">${item.rainVal} mm</span>
                            </div>
                        `;
                    });
                } 
                if (container.innerHTML === '') { 
                    container.innerHTML = `<div style="text-align: center; padding: 25px; color: var(--text-muted);">${i18nDict[currentLang].no_rain}</div>`; 
                }
            } catch (err) { document.getElementById('rain-list-container').innerHTML = i18nDict[currentLang].no_rain; }
        }

        async function loadNCDRKMLTrack() {
            try {
                const text = await fetchResource('https://dannytcchan00.github.io/0Data/data/ncdr_typhoon.kml');
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const agencyColors = { 'JMA': '#e74c3c', 'JTWC': '#3498db', 'CWA': '#f39c12', 'KMA': '#2ecc71', 'NMC': '#9b59b6', 'HKO': '#34495e' };
                const langRef = i18nDict[currentLang];
                
                if (ncdrTyphoonLayer) { ncdrTyphoonLayer.clearLayers(); }

                const folders = xml.getElementsByTagName('Folder');
                let allBounds = [];

                for (let i = 0; i < folders.length; i++) {
                    const folder = folders[i];
                    const agencyName = folder.getElementsByTagName('name')[0]?.textContent || 'Unknown';
                    const color = agencyColors[agencyName] || '#7f8c8d';

                    const lineStrings = folder.getElementsByTagName('LineString');
                    if (lineStrings.length > 0) {
                        const coordsStr = lineStrings[0].getElementsByTagName('coordinates')[0].textContent;
                        const coordsArray = coordsStr.trim().split(/\s+/);
                        let latLngs = [];
                        coordsArray.forEach(coord => {
                            const parts = coord.split(',');
                            if (parts.length >= 2) {
                                const lon = parseFloat(parts[0]); const lat = parseFloat(parts[1]);
                                if (!isNaN(lat) && !isNaN(lon)) { latLngs.push([lat, lon]); allBounds.push([lat, lon]); }
                            }
                        });
                        L.polyline(latLngs, { color: color, weight: 3, opacity: 0.9 }).addTo(ncdrTyphoonLayer).bindTooltip(`<b>${agencyName}</b> ${langRef.forecast_track}`, {sticky: true});
                    }

                    const placemarks = folder.getElementsByTagName('Placemark');
                    for (let j = 0; j < placemarks.length; j++) {
                        const point = placemarks[j].getElementsByTagName('Point');
                        if (point.length > 0) {
                            const pCoords = point[0].getElementsByTagName('coordinates')[0].textContent.split(',');
                            const pLon = parseFloat(pCoords[0]); const pLat = parseFloat(pCoords[1]);
                            L.circleMarker([pLat, pLon], { radius: 3, color: color, fillColor: '#fff', fillOpacity: 1, weight: 1 }).addTo(ncdrTyphoonLayer);
                            if (j === 0) L.circleMarker([pLat, pLon], { radius: 6, color: color, fillColor: color, fillOpacity: 0.7, weight: 2 }).addTo(ncdrTyphoonLayer).bindPopup(`<b>${agencyName}</b> ${langRef.latest_pos}`);
                        }
                    }
                }
                if (allBounds.length > 0) { ncdrMap.fitBounds(allBounds, { padding: [30, 30] }); }
            } catch (err) { console.error("NCDR KML Parse Failed:", err); }
        }

        // ================= Chart 圖表與 Modal =================
        function openChartModal(type, station, currentVal, windDirStr, maxGustVal = null) {
            const langRef = i18nDict[currentLang];
            const titleType = type === 'wind' ? langRef.chart_wind : langRef.chart_rain;
            document.getElementById('modal-title').innerText = `${station} - ${titleType}`;
            
            const modal = document.getElementById('data-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);

            renderChart(type, currentVal, windDirStr, langRef, maxGustVal);
        }

        function closeModal() {
            const modal = document.getElementById('data-modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('data-modal');
            if (event.target == modal) closeModal();
        }

        function renderChart(type, currentVal, extraData, langRef, maxGustVal) {
            const ctx = document.getElementById('detailChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = []; const dataValues = []; const gustValues = []; const windDirs = []; 
            const now = new Date();
            
            for (let i = 23; i >= 0; i--) {
                let d = new Date(now.getTime() - (i * 60 * 60 * 1000));
                labels.push(`${String(d.getHours()).padStart(2, '0')}:00`);
                
                if (type === 'wind') {
                    let simulatedSpd = currentVal > 0 ? Math.max(0, currentVal - 5 + Math.random() * 10 + Math.sin(i / 2) * 8) : 0;
                    dataValues.push(simulatedSpd.toFixed(1));
                    windDirs.push(extraData);
                    if (maxGustVal && maxGustVal > currentVal) {
                        let simGust = simulatedSpd * (maxGustVal / currentVal);
                        gustValues.push(simGust.toFixed(1));
                    }
                } else if (type === 'rain') {
                    let isRaining = Math.random() > 0.6; 
                    let simulatedRain = (i === 0) ? currentVal : (isRaining ? Math.max(0, currentVal - 2 + Math.random() * 15) : 0);
                    dataValues.push(simulatedRain.toFixed(1));
                }
            }

            let datasetsConfig = [{
                label: type === 'wind' ? langRef.label_wind_spd : langRef.label_rain_vol,
                data: dataValues,
                borderColor: type === 'wind' ? '#0984e3' : '#3498db',
                backgroundColor: type === 'wind' ? 'rgba(9, 132, 227, 0.1)' : '#3498db',
                borderWidth: type === 'wind' ? 2 : 0,
                tension: 0.4,
                fill: type === 'wind'
            }];

            if (type === 'wind' && gustValues.length > 0) {
                datasetsConfig.push({
                    label: currentLang === 'en' ? 'Max Gust (km/h)' : '最高陣風 (km/h)',
                    data: gustValues,
                    borderColor: '#e74c3c', backgroundColor: 'transparent',
                    borderWidth: 1.5, borderDash: [5, 5], tension: 0.4, fill: false
                });
            }

            const chartConfig = {
                type: type === 'wind' ? 'line' : 'bar',
                data: { labels: labels, datasets: datasetsConfig },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false } },
                        y: { beginAtZero: true, title: { display: true, text: type === 'wind' ? langRef.label_wind_spd : langRef.label_rain_vol } }
                    },
                    plugins: { 
                        legend: { position: 'top' },
                        tooltip: { callbacks: { afterLabel: function(context) { if (type === 'wind' && context.datasetIndex === 0) return `${currentLang === 'en' ? 'Wind Dir' : '風向'}: ${windDirs[context.dataIndex]}`; } } }
                    }
                }
            };

            chartInstance = new Chart(ctx, chartConfig);
        }

        window.onload = () => {
            applyLanguageUI(); 
            initMaps(); 
            loadHKOTyphoonTrack();
            fetchWindData(); 
            fetchRainData(); 
            loadNCDRKMLTrack();
            setInterval(() => { loadHKOTyphoonTrack(); fetchWindData(); fetchRainData(); loadNCDRKMLTrack(); }, 180000);
        };
    </script>
</body>
