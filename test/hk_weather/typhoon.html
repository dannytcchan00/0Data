<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typhoon Information Centre - Met Office</title>
    
    <!-- 引入 Leaflet 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 引入 Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-navy: #112a46;
            --brand-blue: #0984e3;
            --bg-light: #f4f6f9;
            --white: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --alert-red: #e74c3c;
            --alert-orange: #e67e22;
            --card-shadow: 0 4px 12px rgba(17, 42, 70, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-light); color: var(--text-main); line-height: 1.5; padding: 25px; }

        .dashboard-container { max-width: 1550px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }

        .top-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 25px; }
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }

        .box { 
            background: var(--white); 
            border-radius: 12px; 
            padding: 22px; 
            box-shadow: var(--card-shadow); 
            border-top: 4px solid var(--brand-navy); 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }
        
        .box-title { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--brand-navy); 
            margin-bottom: 18px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }

        /* 1. 機率預測樣式 */
        .prob-container { display: flex; flex-direction: column; gap: 12px; }
        .prob-item { display: flex; align-items: center; gap: 12px; }
        .signal-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 14px; flex-shrink: 0; }
        .sig-1 { background-color: #555555; } 
        .sig-3 { background-color: #27ae60; } 
        .sig-8 { background-color: #e67e22; } 
        .sig-9 { background-color: #c0392b; } 
        .sig-10 { background-color: #8e44ad; }
        
        .progress-bar-bg { flex-grow: 1; background: #eee; height: 10px; border-radius: 5px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 1s ease-in-out; }
        .prob-text { width: 45px; text-align: right; font-weight: bold; color: var(--brand-navy); font-size: 13px; }
        .typhoon-status { margin-top: 15px; padding: 12px; background: #f8fafc; border-radius: 8px; font-size: 12.5px; border-left: 4px solid var(--brand-blue); line-height: 1.5; }

        /* 2 & 3. 滾動清單樣式 */
        .data-list { display: flex; flex-direction: column; gap: 8px; max-height: 330px; overflow-y: auto; padding-right: 5px; }
        .data-list::-webkit-scrollbar { width: 5px; }
        .data-list::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 4px; }
        
        .data-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 14px; border-radius: 8px; background: var(--bg-light); font-size: 13.5px; 
            transition: all 0.2s ease;
        }
        
        /* 加入可點擊的 hover 效果 */
        .data-item.clickable { cursor: pointer; border-left: 4px solid transparent; }
        .data-item.clickable:hover { 
            background-color: #e2e8f0; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-left-color: var(--brand-blue);
        }
        
        .data-item strong { color: var(--brand-navy); }

        /* 4 & 5. 地圖樣式 */
        .map-container { width: 100%; height: 460px; background: #e2e8f0; border-radius: 8px; z-index: 1; }
        
        @keyframes spinReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        .typhoon-emoji { font-size: 28px; animation: spinReverse 1.5s linear infinite; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; text-shadow: 0 0 6px rgba(0,0,0,0.4); }

        .map-legend {
            position: absolute; bottom: 35px; left: 35px; background: rgba(255, 255, 255, 0.92);
            padding: 10px 14px; border-radius: 6px; font-size: 11px; z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); border: 1px solid #ddd;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-weight: bold; }
        .legend-color { width: 14px; height: 4px; border-radius: 2px; }

        /* ================= 彈出視窗 (Modal) ================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 42, 70, 0.6); z-index: 2000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: var(--white); width: 90%; max-width: 700px;
            border-radius: 12px; padding: 30px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; font-size: 28px;
            cursor: pointer; color: var(--text-muted); transition: 0.2s;
        }
        .close-btn:hover { color: var(--alert-red); }
        
        .modal-header { font-size: 22px; font-weight: bold; color: var(--brand-navy); margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .modal-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }
        .chart-container { width: 100%; height: 320px; position: relative; }

        @media (max-width: 1200px) {
            .top-row { grid-template-columns: 1fr; }
            .bottom-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- ================= 上排三欄 (Top Row) ================= -->
        <div class="top-row">
            
            <div class="box">
                <div class="box-title" data-i18n="title_prob">📊 智能風球生效機率預測</div>
                <div class="prob-container">
                    <div class="prob-item"><div class="signal-icon sig-1">T1</div><div class="progress-bar-bg"><div class="progress-fill sig-1" id="bar-1" style="width: 0%;"></div></div><div class="prob-text" id="txt-1">0%</div></div>
                    <div class="prob-item"><div class="signal-icon sig-3">T3</div><div class="progress-bar-bg"><div class="progress-fill sig-3" id="bar-3" style="width: 0%;"></div></div><div class="prob-text" id="txt-3">0%</div></div>
                    <div class="prob-item"><div class="signal-icon sig-8">T8</div><div class="progress-bar-bg"><div class="progress-fill sig-8" id="bar-8" style="width: 0%;"></div></div><div class="prob-text" id="txt-8">0%</div></div>
                    <div class="prob-item"><div class="signal-icon sig-9">T9</div><div class="progress-bar-bg"><div class="progress-fill sig-9" id="bar-9" style="width: 0%;"></div></div><div class="prob-text" id="txt-9">0%</div></div>
                    <div class="prob-item"><div class="signal-icon sig-10">T10</div><div class="progress-bar-bg"><div class="progress-fill sig-10" id="bar-10" style="width: 0%;"></div></div><div class="prob-text" id="txt-10">0%</div></div>
                </div>
                <div class="typhoon-status" id="typhoon-status" data-i18n="loading_data">🔄 正在讀取數據...</div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span data-i18n="title_wind">💨 各區實時風速與風向</span>
                    <small style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: auto;" data-i18n="click_details">(點擊查看24小時圖表)</small>
                </div>
                <div class="data-list" id="wind-list-container">
                    <div style="text-align: center; padding: 25px; color: gray;" data-i18n="loading_wind">🔄 正在載入風力數據...</div>
                </div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span data-i18n="title_rain">🌧️ 各區實時雨量監測</span>
                    <small style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: auto;" data-i18n="click_details">(點擊查看24小時圖表)</small>
                </div>
                <div class="data-list" id="rain-list-container">
                    <div style="text-align: center; padding: 25px; color: gray;" data-i18n="loading_rain">🔄 正在載入雨量數據...</div>
                </div>
            </div>

        </div>

        <!-- ================= 下排雙地圖 (Bottom Row) ================= -->
        <div class="bottom-row">

            <div class="box">
                <div class="box-title" data-i18n="title_hko">🇭🇰 香港天文台預測路徑與影響範圍</div>
                <div id="hko-map" class="map-container"></div>
            </div>

            <div class="box">
                <div class="box-title" data-i18n="title_ncdr">🌐 各國機構颱風預測路徑</div>
                <div id="ncdr-map" class="map-container"></div>
                
                <div class="map-legend">
                    <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div> <span data-i18n="legend_jma">JMA (日本)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#3498db;"></div> <span data-i18n="legend_jtwc">JTWC (美國)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#f39c12;"></div> <span data-i18n="legend_cwa">CWA (台灣)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#2ecc71;"></div> <span data-i18n="legend_kma">KMA (韓國)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#9b59b6;"></div> <span data-i18n="legend_nmc">NMC (中國)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#34495e;"></div> <span data-i18n="legend_hko">HKO (香港)</span></div>
                </div>
            </div>

        </div>

    </div>

    <!-- ================= 圖表彈出視窗 (Chart Modal) ================= -->
    <div id="data-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="modal-header">
                📍 <span id="modal-title">氣象站</span>
            </div>
            <div class="modal-subtitle" id="modal-subtitle">過去 24 小時數據趨勢分析 (模擬推算)</div>
            
            <div class="chart-container">
                <canvas id="detailChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ================= 語言設定 =================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'tc';

        const i18nDict = {
            "tc": {
                "title_prob": "📊 智能風球生效機率預測", "title_wind": "💨 各區實時風速與風向", "title_rain": "🌧️ 各區實時雨量監測",
                "title_hko": "🇭🇰 香港天文台預測路徑與影響範圍", "title_ncdr": "🌐 各國機構颱風預測路徑",
                "click_details": "(點擊查看24小時圖表)",
                "loading_data": "🔄 正在讀取數據...", "loading_wind": "🔄 正在載入風力數據...", "loading_rain": "🔄 正在載入雨量數據...",
                "no_wind": "暫無風速數據", "no_rain": "暫無降雨數據",
                "system_name": "系統名稱：", "centre_pos": "中心位置：", "lat": "北緯", "lon": "東經",
                "distance": "距港距離：", "approx": "約", "km": "公里",
                "latest_pos": "最新預測起點", "forecast_track": "預測路徑",
                "hko_station": "<b>香港天文台 (HKO)</b>",
                "legend_jma": "JMA (日本)", "legend_jtwc": "JTWC (美國)", "legend_cwa": "CWA (台灣)",
                "legend_kma": "KMA (韓國)", "legend_nmc": "NMC (中國)", "legend_hko": "HKO (香港)",
                "chart_wind": "風力數據", "chart_rain": "雨量數據",
                "label_wind_spd": "風速 (km/h)", "label_rain_vol": "降雨量 (mm)"
            },
            "en": {
                "title_prob": "📊 AI Signal Probability", "title_wind": "💨 Real-time Wind", "title_rain": "🌧️ Real-time Rainfall",
                "title_hko": "🇭🇰 HKO Forecast Track", "title_ncdr": "🌐 International Forecasts",
                "click_details": "(Click for 24h Chart)",
                "loading_data": "🔄 Loading...", "loading_wind": "🔄 Loading wind...", "loading_rain": "🔄 Loading rain...",
                "no_wind": "No wind data.", "no_rain": "No rainfall data.",
                "system_name": "System: ", "centre_pos": "Centre: ", "lat": "N", "lon": "E",
                "distance": "Dist to HK: ", "approx": "Approx. ", "km": "km",
                "latest_pos": "Latest Position", "forecast_track": "Forecast Track",
                "hko_station": "<b>Hong Kong Observatory</b>",
                "legend_jma": "JMA (Japan)", "legend_jtwc": "JTWC (US)", "legend_cwa": "CWA (Taiwan)",
                "legend_kma": "KMA (Korea)", "legend_nmc": "NMC (China)", "legend_hko": "HKO (HK)",
                "chart_wind": "Wind Data", "chart_rain": "Rainfall Data",
                "label_wind_spd": "Wind Speed (km/h)", "label_rain_vol": "Rainfall (mm)"
            }
        };

        const stationDictEN = {
            "香港天文台": "HK Observatory", "京士柏": "King's Park", "赤鱲角": "Chek Lap Kok", "長洲": "Cheung Chau", "流浮山": "Lau Fau Shan",
            "打鼓嶺": "Ta Kwu Ling", "沙田": "Sha Tin", "大埔": "Tai Po", "屯門": "Tuen Mun", "西貢": "Sai Kung", "將軍澳": "Tseung Kwan O",
            "黃竹坑": "Wong Chuk Hang", "橫瀾島": "Waglan Island", "啟德": "Kai Tak", "坪洲": "Peng Chau", "昂坪": "Ngong Ping"
        };

        const windDirMapEN = {
            "北": "N", "東": "E", "南": "S", "西": "W", 
            "東北": "NE", "西北": "NW", "東南": "SE", "西南": "SW",
            "微風": "Light Air", "無風": "Calm", "旋風": "VRB"
        };

        function getStationName(name) {
            for (let tcName in stationDictEN) { if (name.includes(tcName)) return (currentLang === 'en') ? name.replace(tcName, stationDictEN[tcName]) : name; }
            return name;
        }
        function getWindDir(tcDir) { return (currentLang === 'en' && windDirMapEN[tcDir]) ? windDirMapEN[tcDir] : tcDir; }

        function applyLanguageUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nDict[currentLang] && i18nDict[currentLang][key]) { el.innerHTML = i18nDict[currentLang][key]; }
            });
        }

        // ================= 地圖及數據讀取邏輯 =================
        const HK_LAT = 22.3027; const HK_LON = 114.1772;
        let hkoMap, ncdrMap, chartInstance = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function parseCoord(coordStr) {
            if (!coordStr) return null;
            let str = coordStr.trim().toUpperCase(); let num = parseFloat(str.replace(/[NSEW]/g, ''));
            if (isNaN(num)) return null; if (str.includes('S') || str.includes('W')) num = -num;
            return num;
        }

        async function fetchResource(url) {
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error("Fetch failed");
                return await res.text();
            } catch (e) {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const proxyRes = await fetch(proxyUrl, { cache: 'no-store' });
                const json = await proxyRes.json();
                return json.contents;
            }
        }

        function initMaps() {
            hkoMap = L.map('hko-map').setView([21.5, 112.0], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(hkoMap);
            L.circleMarker([HK_LAT, HK_LON], { radius: 6, color: '#112a46', fillColor: '#ffffff', fillOpacity: 1, weight: 2 }).addTo(hkoMap).bindPopup(i18nDict[currentLang]["hko_station"]);
            L.circle([HK_LAT, HK_LON], { radius: 1200000, color: '#27ae60', weight: 1.5, fill: false, dashArray: '6,6' }).addTo(hkoMap);
            L.circle([HK_LAT, HK_LON], { radius: 800000, color: '#e67e22', weight: 1.5, fill: false, dashArray: '6,6' }).addTo(hkoMap);
            L.circle([HK_LAT, HK_LON], { radius: 400000, color: '#e74c3c', weight: 1.5, fill: false, dashArray: '6,6' }).addTo(hkoMap);

            ncdrMap = L.map('ncdr-map').setView([21.5, 116.0], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(ncdrMap);
        }

        async function loadHKOTyphoonTrack() {
            try {
                const text = await fetchResource('https://dannytcchan00.github.io/0Data/data/current_typhoon.xml');
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const tcName = xml.querySelector('TropicalCycloneName')?.textContent.trim() || "Tropical Cyclone";
                const analysisNode = xml.querySelector('AnalysisInformation');

                if (analysisNode) {
                    const curLat = parseCoord(analysisNode.querySelector('Latitude')?.textContent);
                    const curLon = parseCoord(analysisNode.querySelector('Longitude')?.textContent);
                    const curIntensity = analysisNode.querySelector('Intensity')?.textContent || 'Tropical Cyclone';
                    const curWind = analysisNode.querySelector('MaximumWind')?.textContent || '--';
                    const distance = calculateDistance(HK_LAT, HK_LON, curLat, curLon);
                    const langRef = i18nDict[currentLang];

                    document.getElementById('typhoon-status').innerHTML = `
                        <strong>${langRef.system_name}</strong> ${tcName} (${curIntensity})<br>
                        <strong>${langRef.centre_pos}</strong> ${langRef.lat} ${curLat.toFixed(2)}°, ${langRef.lon} ${curLon.toFixed(2)}°<br>
                        <strong>${langRef.distance}</strong> ${langRef.approx} <strong>${Math.round(distance)}</strong> ${langRef.km}
                    `;

                    let p1 = 0, p3 = 0, p8 = 0, p9 = 0, p10 = 0;
                    let windNum = parseFloat(curWind.replace(/[^0-9.]/g, '')) || 65;
                    if (distance <= 800) p1 = Math.min(100, Math.round(100 - (distance - 400) * 0.1));
                    if (distance <= 500) { p1 = 98; p3 = Math.min(95, Math.round(90 - (distance - 250) * 0.2)); }
                    if (distance <= 300) { p1 = 100; p3 = 95; p8 = Math.min(90, Math.round(75 + (windNum - 65) * 0.3)); }
                    if (distance <= 150) { p3 = 100; p8 = 95; if (windNum >= 90) p9 = 65; if (windNum >= 118) p10 = 40; }
                    if (distance <= 80) { p8 = 100; if (windNum >= 90) p9 = 85; if (windNum >= 118) p10 = 75; }

                    document.getElementById('bar-1').style.width = p1 + '%'; document.getElementById('txt-1').innerText = p1 + '%';
                    document.getElementById('bar-3').style.width = p3 + '%'; document.getElementById('txt-3').innerText = p3 + '%';
                    document.getElementById('bar-8').style.width = p8 + '%'; document.getElementById('txt-8').innerText = p8 + '%';
                    document.getElementById('bar-9').style.width = p9 + '%'; document.getElementById('txt-9').innerText = p9 + '%';
                    document.getElementById('bar-10').style.width = p10 + '%'; document.getElementById('txt-10').innerText = p10 + '%';

                    const typhoonIcon = L.divIcon({ className: 'custom-icon', html: "<div class='typhoon-emoji'>🌀</div>", iconSize: [34, 34], iconAnchor: [17, 17] });
                    L.marker([curLat, curLon], { icon: typhoonIcon }).addTo(hkoMap).bindPopup(`<b>${tcName}</b>`);

                    const forecastNodes = xml.querySelectorAll('ForecastInformation');
                    let forecastTrack = [[curLat, curLon]];
                    forecastNodes.forEach((node, index) => {
                        const fLat = parseCoord(node.querySelector('Latitude')?.textContent);
                        const fLon = parseCoord(node.querySelector('Longitude')?.textContent);
                        if (fLat !== null && fLon !== null) {
                            forecastTrack.push([fLat, fLon]);
                            if (index > 0 && (index % 12 === 0 || index === forecastNodes.length - 1)) {
                                let errorRadius = 40000 + (index * 3500); 
                                L.circle([fLat, fLon], { radius: errorRadius, color: '#f39c12', fillColor: '#f1c40f', fillOpacity: 0.12, weight: 1, dashArray: '3,3' }).addTo(hkoMap);
                                L.circleMarker([fLat, fLon], { radius: 3.5, color: '#d35400', fillColor: '#e67e22', fillOpacity: 1 }).addTo(hkoMap);
                            }
                        }
                    });
                    L.polyline(forecastTrack, { color: '#d35400', weight: 3, dashArray: '5,5' }).addTo(hkoMap);
                }
            } catch (err) {}
        }

        async function fetchWindData() {
            try {
                const text = await fetchResource('https://dannytcchan00.github.io/0Data/data/wind_data.csv');
                let rows = text.split(/\r?\n/).map(r => r.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''))).filter(r => r.length >= 2 && r[0] !== "");
                const container = document.getElementById('wind-list-container');
                container.innerHTML = '';

                rows.forEach(r => {
                    const rowStr = r.join(" ");
                    if (rowStr.includes("日期時間") || rowStr.includes("自動氣象站") || rowStr.includes("Date/Time") || rowStr.includes("Automatic")) return;

                    let cleanedRow = r.filter(x => isNaN(parseFloat(x)) || Math.abs(parseFloat(x)) < 10000);
                    let textItems = cleanedRow.filter(x => isNaN(parseFloat(x)) && x !== "");
                    let speedStr = cleanedRow.find(x => !isNaN(parseFloat(x)) && x !== "");
                    let speed = speedStr !== undefined ? parseFloat(speedStr) : 0;
                    let dir = '--', station = null;
                    const dirWords = ["北", "東", "南", "西", "微風", "無風", "旋風", "N", "E", "S", "W", "VRB", "CALM"];
                    
                    if (textItems.length >= 2) {
                        let dIdx = textItems.findIndex(x => dirWords.some(dw => x.toUpperCase().includes(dw)));
                        if (dIdx !== -1) { dir = textItems[dIdx]; textItems.splice(dIdx, 1); station = textItems[0]; }
                        else { station = textItems[0]; dir = textItems[1]; }
                    } else if (textItems.length === 1) { station = textItems[0]; }

                    if (station && !station.includes("日期") && !station.includes("氣象站")) {
                        let speedClass = (speed >= 41) ? 'color: #e74c3c; font-weight: bold;' : 'color: var(--brand-navy); font-weight: bold;';
                        let displayStation = getStationName(station);
                        let displayDir = getWindDir(dir);
                        
                        // 點擊觸發圖表事件
                        container.innerHTML += `
                            <div class="data-item clickable" onclick="openChartModal('wind', '${displayStation}', ${speed}, '${displayDir}')">
                                <span>${displayStation}</span>
                                <span style="${speedClass}">${displayDir} ${speed} km/h</span>
                            </div>
                        `;
                    }
                });

                if (container.innerHTML === '') container.innerHTML = `<div style="text-align: center; padding: 25px; color: var(--text-muted);">${i18nDict[currentLang].no_wind}</div>`;
            } catch (err) { document.getElementById('wind-list-container').innerHTML = i18nDict[currentLang].no_wind; }
        }

        async function fetchRainData() {
            try {
                const raw = await fetchResource('https://dannytcchan00.github.io/0Data/data/rain_data.csv');
                let data = null;
                try { data = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) {}
                const container = document.getElementById('rain-list-container');
                container.innerHTML = '';

                if (data && data.hourlyRainfall && Array.isArray(data.hourlyRainfall)) {
                    data.hourlyRainfall.forEach(item => {
                        const station = item.automaticWeatherStation;
                        const rainVal = parseFloat(item.value);
                        if (station && !isNaN(rainVal)) {
                            let rainStyle = 'color: var(--text-muted); font-weight: normal;';
                            if (rainVal >= 50) rainStyle = 'color: #e74c3c; font-weight: bold;';
                            else if (rainVal >= 30) rainStyle = 'color: #e67e22; font-weight: bold;';
                            else if (rainVal > 0) rainStyle = 'color: #0984e3; font-weight: bold;';
                            
                            let displayStation = getStationName(station);
                            
                            // 點擊觸發圖表事件
                            container.innerHTML += `
                                <div class="data-item clickable" onclick="openChartModal('rain', '${displayStation}', ${rainVal}, null)">
                                    <span>${displayStation}</span>
                                    <span style="${rainStyle}">${rainVal} mm</span>
                                </div>
                            `;
                        }
                    });
                } else { container.innerHTML = `<div style="text-align: center; padding: 25px; color: var(--text-muted);">${i18nDict[currentLang].no_rain}</div>`; }
            } catch (err) { document.getElementById('rain-list-container').innerHTML = i18nDict[currentLang].no_rain; }
        }

        async function loadNCDRKMLTrack() {
            try {
                const text = await fetchResource('https://dannytcchan00.github.io/0Data/data/ncdr_typhoon.kml');
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const agencyColors = { 'JMA': '#e74c3c', 'JTWC': '#3498db', 'CWA': '#f39c12', 'KMA': '#2ecc71', 'NMC': '#9b59b6', 'HKO': '#34495e' };
                const folders = xml.getElementsByTagName('Folder');
                let allBounds = [];
                const langRef = i18nDict[currentLang];

                for (let i = 0; i < folders.length; i++) {
                    const folder = folders[i];
                    const agencyName = folder.getElementsByTagName('name')[0]?.textContent || 'Unknown';
                    const color = agencyColors[agencyName] || '#7f8c8d';

                    const lineStrings = folder.getElementsByTagName('LineString');
                    if (lineStrings.length > 0) {
                        const coordsStr = lineStrings[0].getElementsByTagName('coordinates')[0].textContent;
                        const coordsArray = coordsStr.trim().split(/\s+/);
                        let latLngs = [];
                        coordsArray.forEach(coord => {
                            const parts = coord.split(',');
                            if (parts.length >= 2) {
                                const lon = parseFloat(parts[0]); const lat = parseFloat(parts[1]);
                                if (!isNaN(lat) && !isNaN(lon)) { latLngs.push([lat, lon]); allBounds.push([lat, lon]); }
                            }
                        });
                        L.polyline(latLngs, { color: color, weight: 3, opacity: 0.9 }).addTo(ncdrMap).bindTooltip(`<b>${agencyName}</b> ${langRef.forecast_track}`, {sticky: true});
                    }

                    const placemarks = folder.getElementsByTagName('Placemark');
                    for (let j = 0; j < placemarks.length; j++) {
                        const point = placemarks[j].getElementsByTagName('Point');
                        if (point.length > 0) {
                            const pCoords = point[0].getElementsByTagName('coordinates')[0].textContent.split(',');
                            const pLon = parseFloat(pCoords[0]); const pLat = parseFloat(pCoords[1]);
                            L.circleMarker([pLat, pLon], { radius: 3, color: color, fillColor: '#fff', fillOpacity: 1, weight: 1 }).addTo(ncdrMap);
                            if (j === 0) L.circleMarker([pLat, pLon], { radius: 6, color: color, fillColor: color, fillOpacity: 0.7, weight: 2 }).addTo(ncdrMap).bindPopup(`<b>${agencyName}</b> ${langRef.latest_pos}`);
                        }
                    }
                }
                if (allBounds.length > 0) { ncdrMap.fitBounds(allBounds, { padding: [30, 30] }); }
            } catch (err) {}
        }

        // ================= Chart 圖表與 Modal 邏輯 =================
        function openChartModal(type, station, currentVal, extraData) {
            const langRef = i18nDict[currentLang];
            const titleType = type === 'wind' ? langRef.chart_wind : langRef.chart_rain;
            
            document.getElementById('modal-title').innerText = `${station} - ${titleType}`;
            
            const modal = document.getElementById('data-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);

            renderChart(type, currentVal, extraData, langRef);
        }

        function closeModal() {
            const modal = document.getElementById('data-modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('data-modal');
            if (event.target == modal) closeModal();
        }

        function renderChart(type, currentVal, extraData, langRef) {
            const ctx = document.getElementById('detailChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            // 生成最近 24 小時的時間標籤 (模擬歷史資料)[cite: 1]
            const labels = [];
            const dataValues = [];
            const windDirs = []; // 僅用於風力圖表
            const now = new Date();
            
            for (let i = 23; i >= 0; i--) {
                let d = new Date(now.getTime() - (i * 60 * 60 * 1000));
                labels.push(`${String(d.getHours()).padStart(2, '0')}:00`);
                
                // 數學模擬引擎：以當前數值推算過去 24 小時趨勢[cite: 1]
                if (type === 'wind') {
                    // 風速：加入隨機波動
                    let simulatedSpd = currentVal > 0 ? Math.max(0, currentVal - 5 + Math.random() * 10 + Math.sin(i / 2) * 8) : 0;
                    dataValues.push(simulatedSpd.toFixed(1));
                    windDirs.push(extraData); // 模擬過去風向不變
                } else if (type === 'rain') {
                    // 雨量：間歇性陣雨模擬
                    let isRaining = Math.random() > 0.6; 
                    let simulatedRain = (i === 0) ? currentVal : (isRaining ? Math.max(0, currentVal - 2 + Math.random() * 15) : 0);
                    dataValues.push(simulatedRain.toFixed(1));
                }
            }

            const chartConfig = {
                type: type === 'wind' ? 'line' : 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: type === 'wind' ? langRef.label_wind_spd : langRef.label_rain_vol,
                        data: dataValues,
                        borderColor: type === 'wind' ? '#0984e3' : '#3498db',
                        backgroundColor: type === 'wind' ? 'rgba(9, 132, 227, 0.1)' : '#3498db',
                        borderWidth: type === 'wind' ? 2 : 0,
                        tension: 0.4,
                        fill: type === 'wind'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false } },
                        y: { 
                            beginAtZero: true,
                            title: { display: true, text: type === 'wind' ? langRef.label_wind_spd : langRef.label_rain_vol }
                        }
                    },
                    plugins: { 
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                // 如果是風力，Tooltip 額外顯示風向
                                afterLabel: function(context) {
                                    if (type === 'wind') {
                                        return `${currentLang === 'en' ? 'Wind Dir' : '風向'}: ${windDirs[context.dataIndex]}`;
                                    }
                                }
                            }
                        }
                    }
                }
            };

            chartInstance = new Chart(ctx, chartConfig);
        }

        window.onload = () => {
            applyLanguageUI();
            initMaps();
            loadHKOTyphoonTrack();
            fetchWindData();
            fetchRainData();
            loadNCDRKMLTrack();

            setInterval(() => {
                loadHKOTyphoonTrack();
                fetchWindData();
                fetchRainData();
            }, 180000);
        };
    </script>
</body>
