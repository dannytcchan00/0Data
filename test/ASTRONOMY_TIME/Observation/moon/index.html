<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">月出月落與月球軌跡 - Met Office</title>
    
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 沿用 Met Office 專業 Dashboard 設計風格 */
        :root {
            --brand-navy: #112a46;
            /* 月亮轉用偏柔和嘅銀黃色 */
            --brand-moon: #f1c40f; 
            --bg-light: #f0f2f5;
            --white: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --card-shadow: 0 4px 12px rgba(17, 42, 70, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); padding: 30px; }

        /* 標題與容器 */
        .page-header { margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .page-header h1 { color: var(--brand-navy); font-size: 24px; }
        
        .box { 
            background: var(--white); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: var(--card-shadow); 
            border-top: 4px solid var(--brand-navy); 
            max-width: 900px;
            margin: 0 auto;
        }

        /* 頂部時間資訊卡片 */
        .time-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .info-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .card-icon { font-size: 32px; margin-bottom: 10px; }
        .card-label { font-size: 14px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
        .card-time { font-size: 28px; font-weight: bold; color: var(--brand-navy); }
        .card-desc { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        /* 圖表容器 */
        .chart-container {
            width: 100%;
            height: 350px;
            position: relative;
        }

        .chart-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--brand-navy);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1 id="header-title" data-i18n="header_title">🌙 月出月落與月球軌跡</h1>
    </div>

    <div class="box">
        <!-- 頂部三個重要時間 -->
        <div class="time-info-grid">
            <div class="info-card">
                <div class="card-icon">🌔</div>
                <div class="card-label" data-i18n="lbl_moonrise">月出時間 (Moonrise)</div>
                <div class="card-time" id="val-moonrise">--:--</div>
                <div class="card-desc" data-i18n="desc_moonrise">月亮升起，點綴夜空</div>
            </div>
            <div class="info-card" style="border-bottom: 3px solid var(--brand-moon);">
                <div class="card-icon">🌕</div>
                <div class="card-label" data-i18n="lbl_transit">最高點 (Moon Transit)</div>
                <div class="card-time" id="val-transit">--:--</div>
                <div class="card-desc" data-i18n="desc_transit">月球到達正南方，仰角最高</div>
            </div>
            <div class="info-card">
                <div class="card-icon">🌘</div>
                <div class="card-label" data-i18n="lbl_moonset">月落時間 (Moonset)</div>
                <div class="card-time" id="val-moonset">--:--</div>
                <div class="card-desc" data-i18n="desc_moonset">月亮落下，迎接破曉</div>
            </div>
        </div>

        <!-- 月球軌跡圖表 -->
        <div class="chart-title" data-i18n="chart_title">今日月球仰角軌跡圖</div>
        <div class="chart-container">
            <canvas id="moonPathChart"></canvas>
        </div>
    </div>

    <script>
        // ================= 語言設定及 URL 參數讀取 =================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'tc';

        document.documentElement.lang = currentLang === 'en' ? 'en-GB' : 'zh-HK';

        const i18nDict = {
            "tc": {
                "page_title": "月出月落與月球軌跡 - Met Office",
                "header_title": "🌙 月出月落與月球軌跡",
                "lbl_moonrise": "月出時間 (Moonrise)",
                "desc_moonrise": "月亮升起，點綴夜空",
                "lbl_transit": "最高點 (Moon Transit)",
                "desc_transit": "月球到達正南方，仰角最高",
                "lbl_moonset": "月落時間 (Moonset)",
                "desc_moonset": "月亮落下，迎接破曉",
                "chart_title": "今日月球仰角軌跡圖"
            },
            "en": {
                "page_title": "Moonrise, Moonset & Moon Path - Met Office",
                "header_title": "🌙 Moonrise, Moonset & Moon Path",
                "lbl_moonrise": "Moonrise Time",
                "desc_moonrise": "Moon rises, illuminating the night",
                "lbl_transit": "Moon Transit",
                "desc_transit": "Moon reaches due south, highest elevation",
                "lbl_moonset": "Moonset Time",
                "desc_moonset": "Moon sets, dawn approaches",
                "chart_title": "Today's Moon Elevation Path"
            }
        };

        function applyLanguageUI() {
            document.getElementById('page-title').innerText = i18nDict[currentLang]["page_title"];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nDict[currentLang] && i18nDict[currentLang][key]) { 
                    el.innerHTML = i18nDict[currentLang][key]; 
                }
            });
        }
        
        applyLanguageUI(); 

        // ================= 參數設定 =================
        // 使用 "Met Office" 檔案入面提到嘅月出月落時間
        const moonriseTimeStr = "16:20"; 
        const moonsetTimeStr = "03:15";
        
        function timeToDecimal(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0]) + parseInt(parts[1]) / 60;
        }

        // 轉換小數為時間，並處理跨越 24 小時嘅情況
        function decimalToTime(decimal) {
            let hrs = Math.floor(decimal);
            const mins = Math.round((decimal - hrs) * 60);
            if (hrs >= 24) hrs -= 24; // 凌晨時間修正
            if (hrs < 0) hrs += 24;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        let moonriseDec = timeToDecimal(moonriseTimeStr);
        let moonsetDec = timeToDecimal(moonsetTimeStr);

        // 【跨日邏輯】如果月落時間數值細過月出（即係跨越咗半夜），將月落時間加 24 小時
        if (moonsetDec < moonriseDec) {
            moonsetDec += 24;
        }

        const transitDec = (moonriseDec + moonsetDec) / 2; 

        document.getElementById('val-moonrise').innerText = moonriseTimeStr;
        document.getElementById('val-moonset').innerText = moonsetTimeStr;
        document.getElementById('val-transit').innerText = decimalToTime(transitDec);

        // ================= 準備圖表數據 =================
        const labels = [];
        const pathData = [];     
        const highestPoint = []; 

        const startHour = Math.floor(moonriseDec) - 1;
        const endHour = Math.ceil(moonsetDec) + 1;

        for (let i = startHour; i <= endHour; i += 0.5) {
            labels.push(decimalToTime(i)); // 顯示時間會自動扣減 24 變返凌晨
            
            if (i < moonriseDec || i > moonsetDec) {
                pathData.push(0);
                highestPoint.push(null);
            } else {
                const progress = (i - moonriseDec) / (moonsetDec - moonriseDec);
                const elevation = Math.sin(progress * Math.PI) * 100; 
                pathData.push(elevation);
                
                if (Math.abs(i - transitDec) < 0.25) {
                    highestPoint.push(elevation);
                } else {
                    highestPoint.push(null);
                }
            }
        }

        // ================= 實時月球位置追蹤 Plugin =================
        const currentMoonTrackerPlugin = {
            id: 'currentMoonTracker',
            afterDatasetsDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                
                const now = new Date();
                let currentDec = now.getHours() + now.getMinutes() / 60;
                
                // 【跨日邏輯】如果而家係凌晨，而且月亮係尋晚升起嘅，將目前時間加 24 嚟配合 X 軸
                if (moonsetDec > 24 && currentDec < (moonsetDec - 24)) {
                    currentDec += 24;
                }
                
                if (currentDec >= startHour && currentDec <= endHour) {
                    
                    const exactIndex = (currentDec - startHour) / 0.5;
                    const xPos = x.getPixelForDecimal(exactIndex);
                    
                    let elevation = 0;
                    if (currentDec > moonriseDec && currentDec < moonsetDec) {
                        const progress = (currentDec - moonriseDec) / (moonsetDec - moonriseDec);
                        elevation = Math.sin(progress * Math.PI) * 100;
                    }
                    const yPos = y.getPixelForValue(elevation);
                    
                    ctx.save();
                    ctx.font = '32px Arial'; 
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // 月球發光陰影效果
                    ctx.shadowColor = 'rgba(241, 196, 15, 0.6)';
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillText('🌝', xPos, yPos);
                    ctx.restore();
                }
            }
        };

        // ================= 繪製 Chart.js =================
        const ctx = document.getElementById('moonPathChart').getContext('2d');
        
        const labelTransit = currentLang === 'en' ? 'Moon Transit' : '月球最高點';
        const labelPath = currentLang === 'en' ? 'Moon Path' : '月球軌跡';
        const tooltipPeak = currentLang === 'en' ? ' Peak Reached' : ' 最高點到達';
        const tooltipElevation = currentLang === 'en' ? ' Moon Elevation' : ' 月球仰角狀態';

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: labelTransit,
                        data: highestPoint,
                        borderColor: '#9b59b6', // 最高點用紫色標示
                        backgroundColor: '#9b59b6',
                        pointStyle: 'star',
                        pointRadius: 10,
                        pointHoverRadius: 12,
                        showLine: false
                    },
                    {
                        label: labelPath,
                        data: pathData,
                        borderColor: '#f1c40f', // 月球軌跡顏色
                        backgroundColor: 'rgba(241, 196, 15, 0.1)', // 淡淡嘅黃色
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0, 
                        pointHitRadius: 10
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: '#666' }
                    },
                    y: {
                        display: false, 
                        min: -5,
                        max: 110
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                if (context.datasetIndex === 0) {
                                    return tooltipPeak;
                                }
                                return tooltipElevation;
                            }
                        }
                    }
                }
            },
            plugins: [currentMoonTrackerPlugin] // 註冊月球追蹤 Plugin
        });
    </script>
</body>
</html>
