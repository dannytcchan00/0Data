<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">日出日落與太陽軌跡 - Met Office</title>
    
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 沿用 Met Office 專業 Dashboard 設計風格 */
        :root {
            --brand-navy: #112a46;
            --brand-gold: #f39c12;
            --bg-light: #f0f2f5;
            --white: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --card-shadow: 0 4px 12px rgba(17, 42, 70, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); padding: 30px; }

        /* 標題與容器 */
        .page-header { margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .page-header h1 { color: var(--brand-navy); font-size: 24px; }
        
        .box { 
            background: var(--white); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: var(--card-shadow); 
            border-top: 4px solid var(--brand-navy); 
            max-width: 900px;
            margin: 0 auto;
        }

        /* 頂部時間資訊卡片 */
        .time-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .info-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .card-icon { font-size: 32px; margin-bottom: 10px; }
        .card-label { font-size: 14px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
        .card-time { font-size: 28px; font-weight: bold; color: var(--brand-navy); }
        .card-desc { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        /* 圖表容器 */
        .chart-container {
            width: 100%;
            height: 350px;
            position: relative;
        }

        .chart-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--brand-navy);
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <div class="page-header">
        <h1 id="header-title" data-i18n="header_title">☀️ 日出日落與太陽軌跡</h1>
    </div>

    <div class="box">
        <!-- 頂部三個重要時間 -->
        <div class="time-info-grid">
            <div class="info-card">
                <div class="card-icon">🌅</div>
                <div class="card-label" data-i18n="lbl_sunrise">日出時間 (Sunrise)</div>
                <div class="card-time" id="val-sunrise">--:--</div>
                <div class="card-desc" data-i18n="desc_sunrise">破曉，迎接新一日</div>
            </div>
            <div class="info-card" style="border-bottom: 3px solid var(--brand-gold);">
                <div class="card-icon">🌞</div>
                <div class="card-label" data-i18n="lbl_noon">最高點 (Solar Noon)</div>
                <div class="card-time" id="val-noon">--:--</div>
                <div class="card-desc" data-i18n="desc_noon">太陽到達正南方，仰角最高</div>
            </div>
            <div class="info-card">
                <div class="card-icon">🌇</div>
                <div class="card-label" data-i18n="lbl_sunset">日落時間 (Sunset)</div>
                <div class="card-time" id="val-sunset">--:--</div>
                <div class="card-desc" data-i18n="desc_sunset">黃昏，黑夜即將降臨</div>
            </div>
        </div>

        <!-- 太陽軌跡圖表 -->
        <div class="chart-title" data-i18n="chart_title">今日太陽仰角軌跡圖</div>
        <div class="chart-container">
            <canvas id="sunPathChart"></canvas>
        </div>
    </div>

    <script>
        // ================= 語言設定及 URL 參數讀取 =================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'tc';

        document.documentElement.lang = currentLang === 'en' ? 'en-GB' : 'zh-HK';

        const i18nDict = {
            "tc": {
                "page_title": "日出日落與太陽軌跡 - Met Office",
                "header_title": "☀️ 日出日落與太陽軌跡",
                "lbl_sunrise": "日出時間 (Sunrise)",
                "desc_sunrise": "破曉，迎接新一日",
                "lbl_noon": "最高點 (Solar Noon)",
                "desc_noon": "太陽到達正南方，仰角最高",
                "lbl_sunset": "日落時間 (Sunset)",
                "desc_sunset": "黃昏，黑夜即將降臨",
                "chart_title": "今日太陽仰角軌跡圖"
            },
            "en": {
                "page_title": "Sunrise, Sunset & Sun Path - Met Office",
                "header_title": "☀️ Sunrise, Sunset & Sun Path",
                "lbl_sunrise": "Sunrise Time",
                "desc_sunrise": "Dawn, welcoming a new day",
                "lbl_noon": "Solar Noon",
                "desc_noon": "Sun reaches due south, highest elevation",
                "lbl_sunset": "Sunset Time",
                "desc_sunset": "Dusk, night is approaching",
                "chart_title": "Today's Sun Elevation Path"
            }
        };

        function applyLanguageUI() {
            document.getElementById('page-title').innerText = i18nDict[currentLang]["page_title"];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nDict[currentLang] && i18nDict[currentLang][key]) { 
                    el.innerHTML = i18nDict[currentLang][key]; 
                }
            });
        }
        
        applyLanguageUI(); 

        // ================= 參數設定 =================
        const sunriseTimeStr = "06:15"; 
        const sunsetTimeStr = "18:45";
        
        function timeToDecimal(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0]) + parseInt(parts[1]) / 60;
        }

        function decimalToTime(decimal) {
            const hrs = Math.floor(decimal);
            const mins = Math.round((decimal - hrs) * 60);
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        const sunriseDec = timeToDecimal(sunriseTimeStr);
        const sunsetDec = timeToDecimal(sunsetTimeStr);
        const noonDec = (sunriseDec + sunsetDec) / 2; 

        document.getElementById('val-sunrise').innerText = sunriseTimeStr;
        document.getElementById('val-sunset').innerText = sunsetTimeStr;
        document.getElementById('val-noon').innerText = decimalToTime(noonDec);

        // ================= 準備圖表數據 =================
        const labels = [];
        const pathData = [];     
        const highestPoint = []; 

        const startHour = Math.floor(sunriseDec) - 1;
        const endHour = Math.ceil(sunsetDec) + 1;

        for (let i = startHour; i <= endHour; i += 0.5) {
            labels.push(decimalToTime(i));
            
            if (i < sunriseDec || i > sunsetDec) {
                pathData.push(0);
                highestPoint.push(null);
            } else {
                const progress = (i - sunriseDec) / (sunsetDec - sunriseDec);
                const elevation = Math.sin(progress * Math.PI) * 100; 
                pathData.push(elevation);
                
                if (Math.abs(i - noonDec) < 0.25) {
                    highestPoint.push(elevation);
                } else {
                    highestPoint.push(null);
                }
            }
        }

        // ================= 新增：實時太陽位置追蹤 Plugin =================
        const currentSunTrackerPlugin = {
            id: 'currentSunTracker',
            afterDatasetsDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                
                // 取得目前真實時間，並轉換成小數 (例如 14:30 = 14.5)
                const now = new Date();
                const currentDec = now.getHours() + now.getMinutes() / 60;
                
                // 檢查目前時間係咪喺圖表顯示嘅範圍內 (日出前1小時 至 日落後1小時)
                if (currentDec >= startHour && currentDec <= endHour) {
                    
                    // 1. 計算 X 軸位置 (利用 Chart.js 內建小數轉換功能)
                    // 因為 X 軸每個點相隔 0.5 小時，所以要除返 0.5 搵出精確嘅小數 Index
                    const exactIndex = (currentDec - startHour) / 0.5;
                    const xPos = x.getPixelForDecimal(exactIndex);
                    
                    // 2. 計算 Y 軸位置 (沿用完美嘅 Sine Wave 仰角公式)
                    let elevation = 0;
                    if (currentDec > sunriseDec && currentDec < sunsetDec) {
                        const progress = (currentDec - sunriseDec) / (sunsetDec - sunriseDec);
                        elevation = Math.sin(progress * Math.PI) * 100;
                    }
                    const yPos = y.getPixelForValue(elevation);
                    
                    // 3. 喺畫布上面直接畫 🌞 Emoji
                    ctx.save();
                    ctx.font = '32px Arial'; // 設定 Emoji 大細
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // 加啲陰影令個太陽望落立體啲、發光咁
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillText('🌞', xPos, yPos);
                    ctx.restore();
                }
            }
        };

        // ================= 繪製 Chart.js =================
        const ctx = document.getElementById('sunPathChart').getContext('2d');
        
        const labelSolarNoon = currentLang === 'en' ? 'Solar Noon' : '太陽最高點 (Solar Noon)';
        const labelSunPath = currentLang === 'en' ? 'Sun Path' : '太陽軌跡';
        const tooltipPeak = currentLang === 'en' ? ' Peak Reached' : ' 最高點到達';
        const tooltipElevation = currentLang === 'en' ? ' Sun Elevation' : ' 太陽仰角狀態';

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: labelSolarNoon,
                        data: highestPoint,
                        borderColor: '#e74c3c',
                        backgroundColor: '#e74c3c',
                        pointStyle: 'star',
                        pointRadius: 10,
                        pointHoverRadius: 12,
                        showLine: false
                    },
                    {
                        label: labelSunPath,
                        data: pathData,
                        borderColor: '#f39c12',
                        backgroundColor: 'rgba(243, 156, 18, 0.15)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0, 
                        pointHitRadius: 10
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: '#666' }
                    },
                    y: {
                        display: false, 
                        min: -5,
                        max: 110
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                if (context.datasetIndex === 0) {
                                    return tooltipPeak;
                                }
                                return tooltipElevation;
                            }
                        }
                    }
                }
            },
            plugins: [currentSunTrackerPlugin] // 註冊剛剛寫好嘅追蹤太陽 Plugin
        });
    </script>
</body>
</html>
