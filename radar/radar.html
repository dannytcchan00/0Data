<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天氣雷達 (200公里直徑)</title>
    <style>
        /* 移除所有預設邊界、空間同隱藏捲軸 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6; /* 明亮底色 */
        }

        /* 雷達地圖強制 100% 佔滿畫面 */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 嵌入式雷達地圖：zoom=10 剛好覆蓋直徑約 200 公里範圍 -->
    <iframe
        src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&zoom=10&overlay=radar&product=radar&level=surface&lat=22.319&lon=114.169"
        allowfullscreen>
    </iframe>

</body>
</html>
