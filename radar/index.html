<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時天氣雷達動畫 | Neo-brutalism</title>
    <style>
        body {
            background-color: #FFE600; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .brutal-card {
            background-color: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 12px 12px 0px #000000;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .signage-title {
            font-family: "PMingLiU", "MingLiU", "DFKai-SB", serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background-color: #FF0055;
            color: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            padding: 10px 24px;
            margin-top: -50px; 
            margin-bottom: 24px;
            display: inline-block;
        }

        .radar-container {
            background-color: #00E5FF;
            border: 4px solid #000000;
            padding: 15px;
            box-shadow: 8px 8px 0px #000000;
            margin-bottom: 20px;
            position: relative;
            /* 固定比例避免圖片切換時閃爍變形 */
            aspect-ratio: 1 / 1; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .radar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: 3px solid #000000;
            background-color: #FFF;
        }

        .status-badge {
            font-size: 1rem;
            font-weight: bold;
            background-color: #000000;
            color: #39FF14; 
            padding: 8px 16px;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #FFFFFF, 8px 8px 0px #000000; 
            display: inline-block;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="brutal-card">
        <div class="signage-title">氣象雷達觀測</div>
        
        <div class="radar-container">
            <img id="radar-image" class="radar-img" src="https://via.placeholder.com/500x500.png?text=載入中..." alt="香港天文台雷達圖" />
        </div>

        <div class="status-badge">
            ● 實時動畫播放中 (LIVE)
        </div>
    </div>

    <script>
        const totalFrames = 20;
        const frames = [];
        let currentFrame = 0;
        const radarImage = document.getElementById('radar-image');
        
        // 獲取當前時間戳，確保同一批次的 20 張圖都用同一個參數，避開快取
        const timestamp = new Date().getTime(); 

        // 預先準備好 20 張圖的 GitHub Pages 絕對路徑網址
        for (let i = 0; i < totalFrames; i++) {
            // padStart 會將數字轉成 00, 01, 02... 格式
            const frameNumber = i.toString().padStart(2, '0');
            const imgUrl = `https://dannytcchan00.github.io/0Data/radar/imag/frame_${frameNumber}.png?t=${timestamp}`;
            frames.push(imgUrl);
            
            // 隱藏在背景預載圖片，避免切換時出現空白閃爍
            const preloadImg = new Image();
            preloadImg.src = imgUrl;
        }

        function playAnimation() {
            // 更改 img 標籤的 src 來切換圖片
            radarImage.src = frames[currentFrame];
            // 循環計數器 (0 到 19，然後回到 0)
            currentFrame = (currentFrame + 1) % totalFrames;
        }

        // 每 500 毫秒 (0.5秒) 切換一張圖，製造動畫效果
        setInterval(playAnimation, 500);

        // 每 10 分鐘自動重新載入整個網頁，確保獲取到下一批最新的 20 張圖
        setInterval(() => {
            window.location.reload();
        }, 600000);
    </script>

</body>
</html>
