<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時天氣雷達動畫 | Neo-brutalism</title>
    <style>
        body {
            background-color: #FFE600; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .brutal-card {
            background-color: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 12px 12px 0px #000000;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .signage-title {
            font-family: "PMingLiU", "MingLiU", "DFKai-SB", serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background-color: #FF0055;
            color: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            padding: 10px 24px;
            margin-top: -50px; 
            margin-bottom: 24px;
            display: inline-block;
        }

        .radar-container {
            background-color: #00E5FF;
            border: 4px solid #000000;
            /* 移除原本的 padding: 15px，消除內部留白 */
            padding: 0;
            box-shadow: 8px 8px 0px #000000;
            margin-bottom: 20px;
            position: relative;
            /* 讓圖片填滿容器，移除 aspect-ratio 限制 */
            display: flex;
            justify-content: center;
            align-items: center;
            /* 可選：若圖片本身有透明背景，可保留底色；否則圖片會完全覆蓋 */
        }

        .radar-img {
            width: 100%;
            height: auto; /* 保持圖片原始比例，高度自動適應 */
            display: block; /* 移除圖片底部的預設空白間隙 */
            /* 移除圖片本身的 border: 3px solid #000000，因為外框已有黑邊 */
            border: none;
            background-color: transparent; /* 若圖片有透明部分，會顯示外框的青色背景 */
            object-fit: cover; /* 確保圖片填滿容器，必要時裁切邊緣以消滅空白 */
        }

        .status-badge {
            font-size: 1rem;
            font-weight: bold;
            background-color: #000000;
            color: #39FF14; 
            padding: 8px 16px;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #FFFFFF, 8px 8px 0px #000000; 
            display: inline-block;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="brutal-card">
        <div class="signage-title">氣象雷達觀測</div>
        
        <div class="radar-container">
            <img id="radar-image" class="radar-img" src="https://via.placeholder.com/500x500.png?text=載入中..." alt="香港天文台雷達圖" />
        </div>

        <div class="status-badge">
            ● 實時動畫播放中 (LIVE)
        </div>
    </div>

    <script>
        const totalFrames = 20;
        const frames = [];
        let currentFrame = 0;
        const radarImage = document.getElementById('radar-image');
        
        const timestamp = new Date().getTime(); 

        for (let i = 0; i < totalFrames; i++) {
            const frameNumber = i.toString().padStart(2, '0');
            const imgUrl = `https://dannytcchan00.github.io/0Data/radar/imag/frame_${frameNumber}.png?t=${timestamp}`;
            frames.push(imgUrl);
            
            const preloadImg = new Image();
            preloadImg.src = imgUrl;
        }

        function playAnimation() {
            radarImage.src = frames[currentFrame];
            currentFrame = (currentFrame + 1) % totalFrames;
        }

        setInterval(playAnimation, 500);

        setInterval(() => {
            window.location.reload();
        }, 600000);
    </script>

</body>
</html>
