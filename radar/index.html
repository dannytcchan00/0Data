<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時天氣雷達 | Neo-brutalism</title>
    <style>
        /* Neo-brutalism 核心風格設定 */
        body {
            /* 鮮豔的底色，常見於新粗野主義 */
            background-color: #FFE600; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .brutal-card {
            background-color: #FFFFFF;
            /* 粗黑邊框與無漸層硬陰影 */
            border: 4px solid #000000;
            box-shadow: 12px 12px 0px #000000;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .signage-title {
            /* 帶有復古排版與傳統字體韻味的標題設計 */
            font-family: "PMingLiU", "MingLiU", "DFKai-SB", serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background-color: #FF0055;
            color: #FFFFFF;
            /* 標題本身的粗野主義方塊設計 */
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            padding: 10px 24px;
            margin-top: -50px; /* 故意凸出卡片的設計 */
            margin-bottom: 24px;
            display: inline-block;
        }

        .radar-container {
            /* 圖片外框設定 */
            background-color: #00E5FF;
            border: 4px solid #000000;
            padding: 15px;
            box-shadow: 8px 8px 0px #000000;
            margin-bottom: 20px;
        }

        .radar-img {
            width: 100%;
            max-width: 100%;
            border: 3px solid #000000;
            display: block;
            background-color: #FFF;
        }

        .status-badge {
            font-size: 1rem;
            font-weight: bold;
            background-color: #000000;
            color: #39FF14; /* 螢光綠文字 */
            padding: 8px 16px;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #FFFFFF, 8px 8px 0px #000000; /* 雙層陰影 */
            display: inline-block;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="brutal-card">
        <!-- 結合舊字體排版美學的標題 -->
        <div class="signage-title">即時天氣雷達</div>
        
        <div class="radar-container">
            <!-- 直接使用你指定的 GitHub Pages 絕對路徑 -->
            <img id="radar-image" class="radar-img" src="https://dannytcchan00.github.io/0Data/radar/imag/latest_radar.png" alt="香港天文台雷達圖" onerror="this.src='https://via.placeholder.com/500x500.png?text=載入中...'" />
        </div>

        <div class="status-badge">
            ● 系統自動同步中 (10MIN)
        </div>
    </div>

    <script>
        function refreshRadar() {
            const radarImg = document.getElementById('radar-image');
            // 將 JavaScript 裡的更新路徑換成絕對網址，並保留時間戳強制清除快取
            radarImg.src = 'https://dannytcchan00.github.io/0Data/radar/imag/latest_radar.png?t=' + new Date().getTime();
        }

        // 每 10 分鐘 (600000 毫秒) 自動在前端重新載入一次圖片
        setInterval(refreshRadar, 600000);
    </script>

</body>
</html>
