<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKO & Multi-Agency - Neo-Brutalist Cyclone Track</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-light: #f4f0ea;
            --main-yellow: #ffde59;
            --main-blue: #38b6ff;
            --main-red: #ff3131;
            --main-green: #00bf63;
            --main-orange: #ff914d;
            --border-dark: #121212;
            --shadow-solid: 6px 6px 0px var(--border-dark);
            --border-thick: 4px solid var(--border-dark);
            --border-thin: 2px solid var(--border-dark);
            
            /* 各國專屬顏色 */
            --agency-jtwc: #00e5ff;
            --agency-jma: #ff00ff;
            --agency-nmc: #9d00ff;
            --agency-cwa: #ff8c00;
            --agency-kma: #ccff00;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Space Mono', monospace; 
            background-color: var(--bg-light); color: var(--border-dark); overflow: hidden;
        }
        #map { width: 100vw; height: 100vh; background-color: var(--bg-light); }
        
        #info-box { 
            position: absolute; top: 20px; left: 20px; z-index: 1000; 
            background: #ffffff; padding: 20px; 
            border: var(--border-thick); box-shadow: var(--shadow-solid);
            width: 330px; max-height: 85vh; overflow-y: auto;
            transition: all 0.2s ease-in-out; border-radius: 0;
        }
        
        #info-box::-webkit-scrollbar { width: 10px; border-left: var(--border-thin); }
        #info-box::-webkit-scrollbar-thumb { background: var(--border-dark); }
        
        .info-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border-thick); padding-bottom: 15px; margin-bottom: 15px;
        }
        .info-header h3 { 
            margin: 0; font-family: 'Work Sans', sans-serif; font-weight: 900;
            font-size: 20px; text-transform: uppercase; letter-spacing: -0.5px;
            background: var(--main-yellow); padding: 4px 8px;
            border: var(--border-thin); box-shadow: 2px 2px 0px var(--border-dark);
        }
        
        #toggle-btn {
            background: var(--main-red); border: var(--border-thin); color: #fff;
            cursor: pointer; width: 34px; height: 34px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: 900; box-shadow: 3px 3px 0px var(--border-dark);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        #toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px var(--border-dark); }
        
        .collapsed #info-content { display: none; }
        .collapsed .info-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .tc-name { 
            font-family: 'Work Sans', sans-serif; color: var(--border-dark); 
            font-size: 26px; font-weight: 900; margin-bottom: 10px; display: block;
            text-transform: uppercase; background-color: var(--bg-light);
            padding: 5px 10px; border: var(--border-thin); box-shadow: 3px 3px 0px var(--border-dark);
            width: fit-content;
        }
        
        .tc-details {
            font-size: 13px; line-height: 1.6; margin-bottom: 15px;
            padding: 12px; background: #fff; border: var(--border-thick);
            box-shadow: var(--shadow-solid); font-weight: 700;
        }
        
        .intensity-badge {
            font-family: 'Work Sans', sans-serif; font-weight: 900;
            padding: 2px 6px; border: var(--border-thin); border-radius: 0;
            box-shadow: 2px 2px 0px var(--border-dark); color: var(--border-dark); display: inline-block;
        }
        
        /* 威脅矩陣樣式 */
        .threat-matrix { margin-top:15px; border:var(--border-thick); background:#fff; box-shadow:var(--shadow-solid); }
        .tm-header { background:var(--border-dark); color:#fff; font-weight:900; padding:6px; font-size:12px; text-transform:uppercase; text-align:center; }
        .tm-row { display:flex; justify-content:space-between; align-items:center; border-top:var(--border-thin); padding:6px; background:#fff;}
        .tm-label { font-weight:900; padding:2px 6px; border:2px solid var(--border-dark); font-size:11px; }
        .tm-data { font-weight:700; font-size:12px; }

        .legend { margin-top: 20px; font-size: 11px; font-weight: 700; border-top: var(--border-thick); padding-top: 15px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; line-height:1.2; text-transform:uppercase; }
        .color-box { width: 14px; height: 14px; margin-right: 10px; border: var(--border-thin); display: inline-block; flex-shrink: 0; }
        .dashed-line { border-bottom: 3px dashed var(--border-dark); height: 0; width: 16px; margin-right: 10px; flex-shrink: 0;}
        
        .leaflet-popup-content-wrapper { 
            background: #fff; color: var(--border-dark); border: var(--border-thick); border-radius: 0;
            box-shadow: var(--shadow-solid); font-family: 'Space Mono', monospace; font-weight: 700;
        }
        .leaflet-popup-tip-container { display: none; }
        .popup-title { 
            font-family: 'Work Sans', sans-serif; font-weight: 900; color: var(--border-dark); 
            padding: 4px 8px; margin: -14px -20px 10px -20px; text-transform: uppercase; border-bottom: var(--border-thick);
        }
        
        .permanent-tooltip {
            background-color: #fff; border: var(--border-thin); color: var(--border-dark);
            font-weight: 700; font-family: 'Space Mono', monospace; border-radius: 0;
            box-shadow: 4px 4px 0px var(--border-dark); white-space: nowrap; padding: 6px 10px;
        }
        .permanent-tooltip .leaflet-tooltip-left::before, .permanent-tooltip .leaflet-tooltip-right::before, .permanent-tooltip .leaflet-tooltip-top::before { display: none; }
        
        .closest-tooltip {
            background-color: #fff; border: var(--border-thin); box-shadow: 3px 3px 0px var(--border-dark);
            color: var(--border-dark); font-weight: 900; font-size: 10px; border-radius: 0; padding: 4px 6px;
        }

        @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        @keyframes brutalBounce { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-3px, -3px); } }
        
        .typhoon-emoji {
            font-size: 50px; display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; animation: spin-ccw 1.5s linear infinite; filter: drop-shadow(4px 4px 0px var(--border-dark)); 
        }
        .typhoon-bounce { width: 100%; height: 100%; animation: brutalBounce 0.5s steps(2) infinite; }

        .low-pressure-icon {
            background-color: #fff; color: var(--border-dark); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; font-family: 'Work Sans', sans-serif;
            border: var(--border-thick); box-shadow: 2px 2px 0px var(--border-dark);
        }

        #update-progress-container { width: 100%; height: 8px; background: #fff; border: var(--border-thin); margin-top: 15px; }
        #update-progress-bar { height: 100%; width: 0%; background: var(--main-blue); transition: width 1s linear; }
        .refresh-text { font-size: 11px; font-weight: 700; color: var(--border-dark); text-align: right; margin-top: 5px; text-transform: uppercase; }
        
        .agency-label-icon { background: transparent; border: none; }
    </style>
</head>
<body>
    <div id="info-box">
        <div class="info-header">
            <h3>🌀 CYCLONE RADAR</h3>
            <button id="toggle-btn" title="Toggle Info">X</button>
        </div>
        <div id="info-content">
            <div id="tc-data" style="font-weight: bold;">[ FETCHING DATA... ]</div>
            <div id="update-progress-container"><div id="update-progress-bar"></div></div>
            <div class="refresh-text">SYNC IN <span id="countdown">300</span>s</div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.getElementById('toggle-btn').addEventListener('click', function() {
            const infoBox = document.getElementById('info-box');
            infoBox.classList.toggle('collapsed');
            this.innerText = infoBox.classList.contains('collapsed') ? 'O' : 'X';
        });

        function getIntensityColor(intensityStr) {
            let s = intensityStr.toLowerCase();
            if (s.includes('low pressure') || s.includes('tropical depression')) return 'var(--main-green)';
            if (s.includes('severe tropical storm')) return 'var(--main-yellow)';
            if (s.includes('tropical storm')) return 'var(--main-blue)';
            if (s.includes('super typhoon') || s.includes('severe typhoon')) return 'var(--main-red)';
            if (s.includes('typhoon')) return 'var(--main-orange)';
            return '#ffffff';
        }
        
        function getIntensityHex(intensityStr) {
            let s = intensityStr.toLowerCase();
            if (s.includes('low pressure') || s.includes('tropical depression')) return '#00bf63';
            if (s.includes('severe tropical storm')) return '#ffde59';
            if (s.includes('tropical storm')) return '#38b6ff';
            if (s.includes('super typhoon') || s.includes('severe typhoon')) return '#ff3131';
            if (s.includes('typhoon')) return '#ff914d';
            return '#121212';
        }

        // ==========================================
        // 定義全局變數與座標 (正名各國氣象廳全稱)
        // ==========================================
        const HKO_COORDS = [22.3023, 114.1741];

        const REGIONS = {
            'HKO': { name: 'Royal Hong Kong Observatory', lat: 22.3023, lon: 114.1741, color: '#ff3131' },
            'CWA': { name: 'Republic of China Central Weather Administration', lat: 25.0375, lon: 121.5173, color: '#ff8c00' },
            'JMA': { name: 'Japan Meteorological Agency', lat: 35.6670, lon: 139.7450, color: '#ff00ff' },
            'KMA': { name: 'Korea Meteorological Administration', lat: 37.4938, lon: 126.9144, color: '#ccff00' }
        };

        const agencyConfig = {
            'JTWC': { color: '#00e5ff', name: 'USA (JTWC)' },     
            'JMA':  { color: '#ff00ff', name: 'Japan Meteorological Agency (JMA)' },    
            'NMC':  { color: '#9d00ff', name: 'CHINA (NMC)' },    
            'CWA':  { color: '#ff8c00', name: 'Republic of China Central Weather Administration (CWA)' },   
            'KMA':  { color: '#ccff00', name: 'Korea Meteorological Administration (KMA)' }     
        };

        var map = L.map('map').setView(HKO_COORDS, 5);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { 
            attribution: '© OpenStreetMap & CartoDB', maxZoom: 18 
        }).addTo(map);

        // 畫香港專屬距離圈
        L.circle(HKO_COORDS, { radius: 1200000, color: '#121212', weight: 2, fillColor: '#38b6ff', fillOpacity: 0.1, dashArray: '10, 10' }).addTo(map);
        L.circle(HKO_COORDS, { radius: 800000, color: '#121212', weight: 2, fillColor: '#ffde59', fillOpacity: 0.1, dashArray: '10, 10' }).addTo(map);
        L.circle(HKO_COORDS, { radius: 300000, color: '#121212', weight: 3, fillColor: '#ff3131', fillOpacity: 0.15 }).addTo(map);
        L.circle(HKO_COORDS, { radius: 100000, color: '#121212', weight: 3, fillColor: '#c13584', fillOpacity: 0.25 }).addTo(map); 
        L.circle(HKO_COORDS, { radius: 50000, color: '#121212', weight: 4, fillColor: '#121212', fillOpacity: 0.4 }).addTo(map); 

        // ==========================================
        // 建立四大氣象廳的固定地標，並儲存在 hqMarkers
        // ==========================================
        const hqMarkers = {};
        for (let key in REGIONS) {
            let r = REGIONS[key];
            let rIcon = L.divIcon({ 
                html: `<div style="width:14px;height:14px;background:#121212;border:2px solid ${r.color};box-shadow:3px 3px 0px #121212;"></div>`, 
                className: '', iconSize: [18, 18], iconAnchor: [9, 9] 
            });
            hqMarkers[key] = L.marker([r.lat, r.lon], { icon: rIcon }).addTo(map);
            // 預設無威脅時的 Popup 內容 (包含各國全名)
            hqMarkers[key].bindPopup(`
                <div class="popup-title" style="background:${r.color}; color:${key==='HKO'?'#fff':'#121212'};">${key} HQ</div>
                <div style="text-align:center; padding: 5px; max-width: 200px; margin: 0 auto;">
                    <b style="font-size:13px; line-height:1.3; display:block;">${r.name}</b>
                    <div style="margin-top:8px; padding-top:6px; border-top:2px dashed #121212; text-align:center; font-size:11px; font-weight:900; color:var(--main-green);">
                        NO ACTIVE THREAT
                    </div>
                </div>
            `);
        }

        const tcDataContainer = document.getElementById('tc-data');
        let tcLayerGroup = L.layerGroup().addTo(map);
        let isFirstLoad = true;

        async function loadTyphoonData() {
            try {
                const hkoUrl = 'https://dannytcchan00.github.io/0Data/data/current_typhoon.xml';
                const ncdrUrl = 'https://dannytcchan00.github.io/0Data/data/ncdr_typhoon.kml';
                
                let cacheBuster = '?t=' + new Date().getTime();
                
                let [hkoRes, ncdrRes] = await Promise.all([
                    fetch(hkoUrl + cacheBuster, { cache: "no-store" }).catch(() => null),
                    fetch(ncdrUrl + cacheBuster, { cache: "no-store" }).catch(() => null)
                ]);
                
                tcLayerGroup.clearLayers();
                let allMapBoundsLatLngs = []; 
                let tcName = "UNNAMED SYSTEM"; 
                let latestData = {};
                
                let regionStats = {
                    'HKO': { currDist: '--', minDist: Infinity, cpaPoint: null },
                    'CWA': { currDist: '--', minDist: Infinity, cpaPoint: null },
                    'JMA': { currDist: '--', minDist: Infinity, cpaPoint: null },
                    'KMA': { currDist: '--', minDist: Infinity, cpaPoint: null }
                };

                // ==========================================
                // 1. 處理 HKO XML 資料 
                // ==========================================
                if (hkoRes && hkoRes.ok) {
                    let tcXmlStr = await hkoRes.text();
                    let data = (new window.DOMParser()).parseFromString(tcXmlStr, "text/xml");
                    
                    let nameNodes = data.querySelectorAll('TropicalCycloneName');
                    if (nameNodes.length > 0 && nameNodes[0].textContent.trim() !== "") {
                        tcName = nameNodes[0].textContent.trim();
                    }
                    
                    let latNodes = data.querySelectorAll('Latitude');
                    let lonNodes = data.querySelectorAll('Longitude');
                    
                    if (latNodes.length > 0 && lonNodes.length > 0) {
                        let pathData = []; 
                        let forecastStepCounter = 0; 
                        
                        for (let i = 0; i < latNodes.length; i++) {
                            let lat = parseFloat(latNodes[i].textContent.replace('N', '').trim());
                            let lon = parseFloat(lonNodes[i].textContent.replace('E', '').trim());
                            
                            if (!isNaN(lat) && !isNaN(lon)) {
                                allMapBoundsLatLngs.push([lat, lon]);
                                
                                let parentNode = latNodes[i].parentNode;
                                let timeNode = parentNode.querySelector('Time');
                                let intensityNode = parentNode.querySelector('Intensity');
                                let windNode = parentNode.querySelector('MaximumWind');
                                let pressureNode = parentNode.querySelector('CentralPressure');
                                
                                let rawTime = timeNode ? new Date(timeNode.textContent) : new Date();
                                let timeText = `${rawTime.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })} HKT`;
                                let intensityText = intensityNode ? intensityNode.textContent : 'UNKNOWN';
                                let windText = windNode ? windNode.textContent : 'N/A';
                                let pressureText = pressureNode ? pressureNode.textContent : 'N/A';
                                
                                let pointColorHex = getIntensityHex(intensityText);
                                let isLowPressure = intensityText.includes('Low Pressure');
                                let lIcon = L.divIcon({ html: '<div class="low-pressure-icon">L</div>', className: '', iconSize: [26, 26], iconAnchor: [13, 13] });
                                
                                let nodeTypeStr = "FCST";
                                let isPast = false;
                                if(parentNode.tagName === 'PastInformation') { nodeTypeStr = "PAST"; isPast = true; }
                                else if(parentNode.tagName === 'AnalysisInformation') { nodeTypeStr = "LIVE"; isPast = true; } 

                                // 計算四個城市的距離
                                for (let key in REGIONS) {
                                    let dist = map.distance([REGIONS[key].lat, REGIONS[key].lon], [lat, lon]) / 1000;
                                    
                                    if (nodeTypeStr === "LIVE") {
                                        regionStats[key].currDist = Math.round(dist);
                                    }
                                    if (dist < regionStats[key].minDist) {
                                        regionStats[key].minDist = dist;
                                        regionStats[key].cpaPoint = { lat: lat, lon: lon, dist: dist, time: timeText, status: nodeTypeStr };
                                    }
                                }

                                pathData.push({ lat: lat, lon: lon, colorHex: pointColorHex, isPast: isPast });
                                let marker;
                                
                                if(parentNode.tagName === 'PastInformation') {
                                    if (isLowPressure) marker = L.marker([lat, lon], { icon: lIcon });
                                    else marker = L.circleMarker([lat, lon], { radius: 6, fillColor: pointColorHex, color: '#121212', weight: 3, fillOpacity: 1 });
                                    marker.bindPopup(`<div class="popup-title" style="background:${pointColorHex};">HKO PAST</div><div>INT: ${intensityText}</div><div>T: ${timeText}</div>`);
                                    tcLayerGroup.addLayer(marker);
                                } 
                                else if(parentNode.tagName === 'AnalysisInformation') {
                                    latestData = { lat: lat, lon: lon, time: timeText, intensity: intensityText, wind: windText, pressure: pressureText, color: getIntensityColor(intensityText) };
                                    
                                    if (isLowPressure) {
                                        marker = L.marker([lat, lon], { icon: lIcon });
                                    } else {
                                        let windSpeed = parseInt(windText) || 60;
                                        let circulationRadius = windSpeed > 118 ? 250000 : (windSpeed > 88 ? 200000 : 150000); 
                                        let circCircle = L.circle([lat, lon], { radius: circulationRadius, color: '#121212', weight: 3, fillColor: '#38b6ff', fillOpacity: 0.3, dashArray: '15, 15' });
                                        tcLayerGroup.addLayer(circCircle);

                                        let spinIcon = L.divIcon({ html: '<div class="typhoon-bounce"><div class="typhoon-emoji">🌀</div></div>', className: '', iconSize: [60, 60], iconAnchor: [30, 30] });
                                        marker = L.marker([lat, lon], { icon: spinIcon });
                                        marker.bindTooltip(`<div style="background:${latestData.color}; margin:-8px -12px; padding:4px 8px; border-bottom:2px solid #121212; text-transform:uppercase;"><b>[ ${tcName} ]</b></div><br>INT: ${intensityText}<br>WND: ${windText}`, { permanent: true, direction: 'right', className: 'permanent-tooltip', offset: [30, 0] });
                                    }
                                    marker.bindPopup(`<div class="popup-title" style="background:${pointColorHex};">HKO LIVE</div><div>T: ${timeText}</div><div>LOC: ${lat}, ${lon}</div>`);
                                    tcLayerGroup.addLayer(marker);
                                } 
                                else if (parentNode.tagName === 'ForecastInformation') {
                                    forecastStepCounter++;
                                    if (isLowPressure) {
                                        marker = L.marker([lat, lon], { icon: lIcon });
                                    } else {
                                        let coneRadius = 30000 + (forecastStepCounter * 4000); 
                                        let coneCircle = L.circle([lat, lon], { radius: coneRadius, color: '#121212', weight: 1, fillColor: pointColorHex, fillOpacity: 0.15 });
                                        tcLayerGroup.addLayer(coneCircle);
                                        
                                        let squareIcon = L.divIcon({ html: `<div style="width:10px;height:10px;background:${pointColorHex};border:2px solid #121212;"></div>`, className: '', iconSize: [14, 14], iconAnchor: [7, 7] });
                                        marker = L.marker([lat, lon], { icon: squareIcon });
                                    }
                                    marker.bindPopup(`<div class="popup-title" style="background:${pointColorHex};">HKO FCST</div><div>INT: ${intensityText}</div><div>T: ${timeText}</div>`);
                                    tcLayerGroup.addLayer(marker);
                                }
                            }
                        }
                        
                        for (let i = 0; i < pathData.length - 1; i++) {
                            let p1 = pathData[i]; let p2 = pathData[i+1];
                            let lineColor = p2.colorHex; 
                            if (p2.isPast) {
                                tcLayerGroup.addLayer(L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], {color: '#121212', weight: 8, opacity: 1})); 
                                tcLayerGroup.addLayer(L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], {color: lineColor, weight: 4, opacity: 1})); 
                            } else {
                                tcLayerGroup.addLayer(L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], {color: lineColor, weight: 5, opacity: 1, dashArray: '10, 8', lineJoin: 'square'}));
                            }
                        }
                        
                        // 【重點新增】更新各氣象廳地標的 Popup 內容 (帶有全名與即時數據) 與畫虛線
                        for (let key in REGIONS) {
                            let stats = regionStats[key];
                            
                            // 更新 Popup
                            let currDistText = stats.currDist !== '--' ? stats.currDist + ' km' : '-- km';
                            let cpaDistText = stats.minDist !== Infinity ? Math.round(stats.minDist) + ' km' : '-- km';
                            
                            let popupHtml = `
                                <div class="popup-title" style="background:${REGIONS[key].color}; color:${key==='HKO'?'#fff':'#121212'};">${key} HQ</div>
                                <div style="text-align:center; padding: 5px; max-width: 220px; margin: 0 auto;">
                                    <b style="font-size:13px; line-height:1.3; display:block;">${REGIONS[key].name}</b>
                                    <div style="margin-top:8px; padding-top:6px; border-top:2px dashed #121212; text-align:left; font-size:11px; font-weight:900;">
                                        <div style="margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;">
                                            <span style="background:#121212;color:#fff;padding:2px 4px;">NOW</span> 
                                            <span>${currDistText}</span>
                                        </div>
                                        <div style="display:flex; justify-content:space-between; align-items:center;">
                                            <span style="background:var(--main-yellow);color:#121212;padding:2px 4px;border:1px solid #121212;">CPA</span> 
                                            <span>${cpaDistText}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                            hqMarkers[key].setPopupContent(popupHtml);

                            // 畫 CPA 虛線
                            if (stats.cpaPoint) {
                                tcLayerGroup.addLayer(L.polyline([[REGIONS[key].lat, REGIONS[key].lon], [stats.cpaPoint.lat, stats.cpaPoint.lon]], { 
                                    color: '#121212', weight: 4, dashArray: '5, 5', opacity: 0.5 
                                }));
                                tcLayerGroup.addLayer(L.polyline([[REGIONS[key].lat, REGIONS[key].lon], [stats.cpaPoint.lat, stats.cpaPoint.lon]], { 
                                    color: REGIONS[key].color, weight: 2, dashArray: '5, 5', opacity: 1 
                                }));
                                
                                if (stats.cpaPoint.status !== "LIVE") {
                                    let closestIcon = L.divIcon({ html: `<div style="width:10px;height:10px;background:${REGIONS[key].color};border:2px solid #121212;border-radius:50%;"></div>`, className: '', iconSize: [14, 14], iconAnchor: [7, 7] });
                                    let closestMarker = L.marker([stats.cpaPoint.lat, stats.cpaPoint.lon], { icon: closestIcon })
                                    .bindTooltip(`<b>${key} CPA:</b> ${Math.round(stats.minDist)}km`, { permanent: true, direction: 'top', className: 'closest-tooltip', offset: [0, -5] });
                                    tcLayerGroup.addLayer(closestMarker);
                                }
                            }
                        }
                    }
                }

                // ==========================================
                // 2. 處理多國 KML 資料 
                // ==========================================
                if (ncdrRes && ncdrRes.ok) {
                    let kmlText = await ncdrRes.text();
                    let kmlData = new DOMParser().parseFromString(kmlText, "text/xml");
                    
                    let folders = kmlData.querySelectorAll("Folder");
                    
                    folders.forEach(folder => {
                        let agencyNameRaw = folder.querySelector("name") ? folder.querySelector("name").textContent.trim() : "UNKNOWN";
                        let agencyDetails = agencyConfig[agencyNameRaw] || { color: '#000000', name: agencyNameRaw };
                        let agencyColor = agencyDetails.color;
                        let agencyFullName = agencyDetails.name;
                        let placemarks = folder.querySelectorAll("Placemark");
                        let agencyLatLngs = []; 
                        let pointIndex = 0; 

                        placemarks.forEach(pm => {
                            let lineString = pm.querySelector("LineString coordinates");
                            if (lineString) {
                                let coords = lineString.textContent.trim().split(/\s+/);
                                let latlngs = coords.map(c => {
                                    let pts = c.split(',');
                                    return pts.length >= 2 ? [parseFloat(pts[1]), parseFloat(pts[0])] : null;
                                }).filter(Boolean);
                                
                                if (latlngs.length > 0) {
                                    allMapBoundsLatLngs.push(...latlngs);
                                    agencyLatLngs = latlngs; 
                                    tcLayerGroup.addLayer(L.polyline(latlngs, {color: '#121212', weight: 6, opacity: 1, lineJoin: 'square'}));
                                    tcLayerGroup.addLayer(L.polyline(latlngs, {color: agencyColor, weight: 3, opacity: 1, dashArray: '6, 6'}));
                                }
                            }
                            
                            let point = pm.querySelector("Point coordinates");
                            if (point) {
                                let pts = point.textContent.trim().split(',');
                                if (pts.length >= 2) {
                                    let lat = parseFloat(pts[1]); let lon = parseFloat(pts[0]);
                                    let name = pm.querySelector("name") ? pm.querySelector("name").textContent : `${agencyNameRaw} Point`;
                                    
                                    let markerIcon;
                                    if (agencyNameRaw === 'CWA' && pointIndex === 0) {
                                        markerIcon = L.divIcon({ 
                                            html: `<div class="typhoon-bounce"><div class="typhoon-emoji" style="font-size:40px; filter: drop-shadow(3px 3px 0px ${agencyColor});">🌀</div></div>`, 
                                            className: '', iconSize: [46, 46], iconAnchor: [23, 23] 
                                        });
                                    } else {
                                        markerIcon = L.divIcon({ html: `<div style="width:8px;height:8px;background:${agencyColor};border:2px solid #121212;border-radius:50%;"></div>`, className: '', iconSize: [12, 12], iconAnchor: [6, 6] });
                                    }
                                    
                                    let marker = L.marker([lat, lon], { icon: markerIcon });
                                    marker.bindPopup(`<div class="popup-title" style="background:${agencyColor}; color:#121212;">${agencyFullName}</div><div>${name}</div>`);
                                    tcLayerGroup.addLayer(marker);
                                    pointIndex++; 
                                }
                            }
                        });

                        if (agencyLatLngs.length > 0) {
                            let lastPoint = agencyLatLngs[agencyLatLngs.length - 1];
                            let labelIcon = L.divIcon({
                                className: 'agency-label-icon',
                                html: `<div style="background:${agencyColor}; color:#121212; border:2px solid #121212; font-family:'Work Sans',sans-serif; font-weight:900; font-size:10px; padding:2px 4px; box-shadow: 2px 2px 0px #121212; white-space:nowrap; margin-top:8px;">[${agencyNameRaw}]</div>`,
                                iconSize: [null, null],
                                iconAnchor: [15, 0] 
                            });
                            tcLayerGroup.addLayer(L.marker(lastPoint, { icon: labelIcon, interactive: false }));
                        }
                    });
                }

                if (!latestData.lat && allMapBoundsLatLngs.length === 0) {
                    tcDataContainer.innerHTML = "<div style='background:#00bf63; color:#121212; padding:10px; border:3px solid #121212; font-weight:900;'>SYSTEM NORMAL. NO ACTIVE THREATS.</div>";
                    
                    // 如果沒有颱風，把地標的 popup 重置為無威脅狀態
                    for (let key in REGIONS) {
                        let r = REGIONS[key];
                        hqMarkers[key].setPopupContent(`
                            <div class="popup-title" style="background:${r.color}; color:${key==='HKO'?'#fff':'#121212'};">${key} HQ</div>
                            <div style="text-align:center; padding: 5px; max-width: 200px; margin: 0 auto;">
                                <b style="font-size:13px; line-height:1.3; display:block;">${r.name}</b>
                                <div style="margin-top:8px; padding-top:6px; border-top:2px dashed #121212; text-align:center; font-size:11px; font-weight:900; color:var(--main-green);">
                                    NO ACTIVE THREAT
                                </div>
                            </div>
                        `);
                    }
                    return;
                }

                let htmlContent = `<span class="tc-name">${tcName}</span>`;
                
                if(latestData.lat) {
                    htmlContent += `
                    <div class="tc-details">
                        <div style="margin-bottom:8px;"><b>INT</b> <span class="intensity-badge" style="background:${latestData.color};">${latestData.intensity}</span></div>
                        <div><b>LOC</b> ${latestData.lat}°N, ${latestData.lon}°E</div>
                        <div><b>WND</b> ${latestData.wind}</div>
                        <div><b>PRS</b> ${latestData.pressure !== 'N/A' ? latestData.pressure : '-- hPa'}</div>
                        
                        <div class="threat-matrix">
                            <div class="tm-header">AGENCY THREAT DISTANCE</div>
                            
                            <div class="tm-row">
                                <span class="tm-label" style="background:var(--main-red); color:#fff;">HKO</span>
                                <span class="tm-data">NOW: ${regionStats['HKO'].currDist}km <span style="color:#aaa;">|</span> CPA: ${Math.round(regionStats['HKO'].minDist)}km</span>
                            </div>
                            <div class="tm-row">
                                <span class="tm-label" style="background:var(--agency-cwa); color:#121212;">CWA</span>
                                <span class="tm-data">NOW: ${regionStats['CWA'].currDist}km <span style="color:#aaa;">|</span> CPA: ${Math.round(regionStats['CWA'].minDist)}km</span>
                            </div>
                            <div class="tm-row">
                                <span class="tm-label" style="background:var(--agency-jma); color:#fff;">JMA</span>
                                <span class="tm-data">NOW: ${regionStats['JMA'].currDist}km <span style="color:#aaa;">|</span> CPA: ${Math.round(regionStats['JMA'].minDist)}km</span>
                            </div>
                            <div class="tm-row">
                                <span class="tm-label" style="background:var(--agency-kma); color:#121212;">KMA</span>
                                <span class="tm-data">NOW: ${regionStats['KMA'].currDist}km <span style="color:#aaa;">|</span> CPA: ${Math.round(regionStats['KMA'].minDist)}km</span>
                            </div>
                        </div>
                        
                        <div style="margin-top: 15px; font-size:10px; text-align:right; border-top:var(--border-thin); padding-top:5px;">UPD: ${latestData.time}</div>
                    </div>`;
                }
                
                // 【重點更新】左下角的圖例區域全部改為正式全名
                htmlContent += `
                <div class="legend">
                    <div style="margin-bottom:10px; font-weight:900;">HKO TRACK:</div>
                    <div class="legend-item"><div class="dashed-line" style="border-bottom-color:#121212;"></div> ROYAL HONG KONG OBSERVATORY</div>
                    
                    <div style="margin-top:15px; margin-bottom:10px; font-weight:900; border-top:var(--border-thin); padding-top:10px;">MULTI-AGENCY FORECASTS:</div>
                    <div class="legend-item"><div class="dashed-line" style="border-bottom-color:var(--agency-jtwc);"></div> USA (JTWC)</div>
                    <div class="legend-item"><div class="dashed-line" style="border-bottom-color:var(--agency-jma);"></div> JAPAN METEOROLOGICAL AGENCY</div>
                    <div class="legend-item"><div class="dashed-line" style="border-bottom-color:var(--agency-nmc);"></div> CHINA (NMC)</div>
                    <div class="legend-item"><div class="dashed-line" style="border-bottom-color:var(--agency-cwa);"></div> ROC CENTRAL WEATHER ADMINISTRATION</div>
                    <div class="legend-item"><div class="dashed-line" style="border-bottom-color:var(--agency-kma);"></div> KOREA METEOROLOGICAL ADMINISTRATION</div>
                    
                    <div style="margin-top:15px; margin-bottom:10px; font-weight:900; border-top:var(--border-thin); padding-top:10px;">INTENSITY COLORS:</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-green);"></span> TD / LOW PRESSURE</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-blue);"></span> TS (TROPICAL STORM)</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-yellow);"></span> STS (SEVERE TROPICAL STORM)</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-orange);"></span> TYPHOON</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-red);"></span> SUPER / SEVERE TYPHOON</div>
                    
                    <div style="margin-top:15px; margin-bottom:10px; font-weight:900; border-top:var(--border-thin); padding-top:10px;">HK DISTANCE:</div>
                    <div class="legend-item"><span class="color-box" style="background:#121212;"></span> 50km (IMMINENT)</div>
                    <div class="legend-item"><span class="color-box" style="background:#c13584;"></span> 100km (CRITICAL)</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-red);"></span> 300km (WARN)</div>
                    <div class="legend-item"><span class="color-box" style="background:var(--main-yellow);"></span> 800km (ALRT)</div>
                </div>`;

                tcDataContainer.innerHTML = htmlContent;
                
                if (isFirstLoad && allMapBoundsLatLngs.length > 0) {
                    let bounds = L.latLngBounds(allMapBoundsLatLngs);
                    bounds.extend(HKO_COORDS);
                    map.fitBounds(bounds, { padding: [50, 50] }); 
                    isFirstLoad = false;
                }
                
            } catch (err) {
                tcDataContainer.innerHTML = `<div style='background:#ffde59; color:#121212; padding:10px; border:3px solid #121212; font-weight:900;'>SYS FAIL: ${err.message}</div>`;
            }
        }
        
        const REFRESH_INTERVAL_SECONDS = 300; 
        let timeLeft = REFRESH_INTERVAL_SECONDS;
        const progressBar = document.getElementById('update-progress-bar');
        const countdownText = document.getElementById('countdown');

        function startAutoRefresh() {
            setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    timeLeft = REFRESH_INTERVAL_SECONDS; 
                    loadTyphoonData(); 
                }
                countdownText.innerText = timeLeft;
                let percentage = ((REFRESH_INTERVAL_SECONDS - timeLeft) / REFRESH_INTERVAL_SECONDS) * 100;
                progressBar.style.width = percentage + '%';
            }, 1000);
        }
        
        loadTyphoonData();
        startAutoRefresh();
    </script>
</body>
</html>
