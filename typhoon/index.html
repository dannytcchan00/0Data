<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKO - Tropical Cyclone Track</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: #121212;
            color: #e0e0e0;
        }
        #map { width: 100vw; height: 100vh; }
        
        #info-box { 
            position: absolute; top: 20px; left: 20px; z-index: 1000; 
            background: rgba(25, 25, 25, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            width: 320px; 
            max-height: 80vh; 
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        
        #info-box::-webkit-scrollbar { width: 6px; }
        #info-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .info-header h3 { margin: 0; color: #4fc3f7; font-size: 16px; }
        
        #toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            width: 26px; height: 26px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; font-weight: bold;
            transition: background 0.3s;
        }
        #toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }
        
        .collapsed #info-content { display: none; }
        .collapsed .info-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .tc-details {
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .tc-details b { color: #fff; }
        .tc-name { color: #ff5252; font-size: 18px; font-weight: bold; margin-bottom: 5px; display:block;}
        
        .status-msg { font-size: 14px; color: #aaa; }
        
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { 
            background: rgba(40, 40, 40, 0.95); 
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .popup-title { font-weight: bold; color: #ff5252; margin-bottom: 5px; border-bottom: 1px solid #555; padding-bottom: 3px;}
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes flashEffect {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(255, 82, 82, 0.9)); }
            50% { opacity: 0.4; filter: drop-shadow(0 0 25px rgba(255, 82, 82, 0.2)); }
        }
        
        .typhoon-emoji {
            font-size: 52px; 
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            animation: spin 1.5s linear infinite; 
        }
        .typhoon-flash {
            width: 100%; height: 100%;
            animation: flashEffect 1.2s ease-in-out infinite; 
        }

        .low-pressure-icon {
            background-color: #607d8b; 
            color: #ffffff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; font-family: Arial, sans-serif;
            border: 2px solid #ffffff; box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
        }

        .permanent-tooltip {
            background-color: rgba(20, 20, 20, 0.85);
            border: 1px solid #ff5252;
            color: #fff;
            font-size: 11px;
            font-family: monospace;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 82, 82, 0.4);
            white-space: nowrap;
            padding: 6px 10px;
        }
        .permanent-tooltip .leaflet-tooltip-left::before { border-left-color: rgba(20, 20, 20, 0.85); }
        .permanent-tooltip .leaflet-tooltip-right::before { border-right-color: rgba(20, 20, 20, 0.85); }
        
        .closest-tooltip {
            background-color: rgba(212, 175, 55, 0.9);
            border: 1px solid #fff; color: #000; font-weight: bold; font-size: 10px; border-radius: 4px;
        }
        .closest-tooltip .leaflet-tooltip-top::before { border-top-color: rgba(212, 175, 55, 0.9); }
        
        .legend {
            margin-top: 15px; font-size: 11px; color: #aaa;
            border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .color-box { width: 12px; height: 12px; margin-right: 8px; display: inline-block; }
        .circle-box { border-radius: 50%; }
        .dashed-line { border-bottom: 2px dashed #ff5252; height: 0; width: 12px; margin-right: 8px;}
        .l-legend-icon {
            background-color: #607d8b; color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 9px; font-weight: bold; width: 12px; height: 12px; margin-right: 8px; border-radius: 50%;
        }

        /* ============================
           自動更新進度條樣式
           ============================ */
        #update-progress-container {
            width: 100%; height: 3px; background: rgba(255,255,255,0.1); margin-top: 10px; border-radius: 2px; overflow: hidden;
        }
        #update-progress-bar {
            height: 100%; width: 0%; background: #4fc3f7; transition: width 1s linear;
        }
        .refresh-text {
            font-size: 10px; color: #777; text-align: right; margin-top: 3px;
        }
    </style>
</head>
<body>
    <div id="info-box">
        <div class="info-header">
            <h3>🌀 Live Tropical Cyclone</h3>
            <button id="toggle-btn" title="Toggle Info">－</button>
        </div>
        <div id="info-content">
            <div id="tc-data" class="status-msg">⏳ Fetching astronomical data...</div>
            
            <!-- 自動更新進度條 -->
            <div id="update-progress-container">
                <div id="update-progress-bar"></div>
            </div>
            <div class="refresh-text">Auto-refresh in <span id="countdown">300</span>s</div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.getElementById('toggle-btn').addEventListener('click', function() {
            const infoBox = document.getElementById('info-box');
            infoBox.classList.toggle('collapsed');
            this.innerText = infoBox.classList.contains('collapsed') ? '＋' : '－';
        });

        const HKO_COORDS = [22.3023, 114.1741];
        var map = L.map('map').setView(HKO_COORDS, 5);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { 
            attribution: '© OpenStreetMap & CartoDB',
            maxZoom: 18 
        }).addTo(map);

        L.circle(HKO_COORDS, { radius: 1200000, color: '#4fc3f7', weight: 1, fillOpacity: 0.05, dashArray: '5, 5' }).addTo(map);
        L.circle(HKO_COORDS, { radius: 800000, color: '#ffd54f', weight: 1, fillOpacity: 0.05, dashArray: '5, 5' }).addTo(map);
        L.circle(HKO_COORDS, { radius: 300000, color: '#ff5252', weight: 2, fillOpacity: 0.1 }).addTo(map);

        L.circleMarker(HKO_COORDS, { 
            radius: 6, fillColor: '#d4af37', color: '#fff', weight: 1.5, fillOpacity: 1 
        }).addTo(map).bindPopup(`
            <div style="text-align:center; padding: 5px;">
                <b style="color:#d4af37; font-size:15px; letter-spacing: 1px;">皇家香港天文台</b><br>
                <span style="font-size:11px; color:#aaa;">Royal Hong Kong Observatory</span>
            </div>
        `);

        const tcDataContainer = document.getElementById('tc-data');
        
        // 用來記錄地圖上的颱風路徑圖層，方便下次刷新時清除舊圖層
        let tcLayerGroup = L.layerGroup().addTo(map);
        
        // 記錄第一次載入，用來判斷要不要自動縮放地圖
        let isFirstLoad = true;

        async function loadTyphoonData() {
            try {
                const targetUrl = 'https://dannytcchan00.github.io/0Data/data/current_typhoon.xml';
                let tcResponse = await fetch(targetUrl + '?t=' + new Date().getTime(), { cache: "no-store" });
                
                // 每次載入前，清除地圖上的舊颱風圖層
                tcLayerGroup.clearLayers();
                
                if (!tcResponse.ok) {
                    tcDataContainer.innerHTML = "<span style='color:#aed581;'>✅ Clear skies. No active tropical cyclones detected.</span>";
                    return;
                }
                
                let tcXmlStr = await tcResponse.text();
                let data = (new window.DOMParser()).parseFromString(tcXmlStr, "text/xml");
                
                let nameNodes = data.querySelectorAll('TropicalCycloneName');
                let tcName = nameNodes.length > 0 ? nameNodes[0].textContent : "Tropical Cyclone";
                
                let latNodes = data.querySelectorAll('Latitude');
                let lonNodes = data.querySelectorAll('Longitude');
                
                if (latNodes.length > 0 && lonNodes.length > 0) {
                    let pastLatLngs = [];
                    let forecastLatLngs = [];
                    let forecastStepCounter = 0; 
                    let latestData = {}; 
                    
                    let minDistance = Infinity;
                    let closestPoint = null;
                    
                    for (let i = 0; i < latNodes.length; i++) {
                        let lat = parseFloat(latNodes[i].textContent.replace('N', '').trim());
                        let lon = parseFloat(lonNodes[i].textContent.replace('E', '').trim());
                        
                        if (!isNaN(lat) && !isNaN(lon)) {
                            let parentNode = latNodes[i].parentNode;
                            let timeNode = parentNode.querySelector('Time');
                            let intensityNode = parentNode.querySelector('Intensity');
                            let windNode = parentNode.querySelector('MaximumWind');
                            let pressureNode = parentNode.querySelector('CentralPressure');
                            
                            let rawTime = timeNode ? new Date(timeNode.textContent) : new Date();
                            let timeText = `${rawTime.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })} HKT`;
                            
                            let intensityText = intensityNode ? intensityNode.textContent : 'Unknown Intensity';
                            let windText = windNode ? windNode.textContent : 'N/A';
                            let pressureText = pressureNode ? pressureNode.textContent : 'N/A';
                            
                            let isLowPressure = intensityText.includes('Low Pressure');
                            let marker;
                            let lIcon = L.divIcon({ html: '<div class="low-pressure-icon">L</div>', className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
                            
                            let distToHK = map.distance(HKO_COORDS, [lat, lon]) / 1000;
                            
                            let nodeTypeStr = "Forecast";
                            if(parentNode.tagName === 'PastInformation') nodeTypeStr = "Past";
                            else if(parentNode.tagName === 'AnalysisInformation') nodeTypeStr = "Current";

                            if (distToHK < minDistance) {
                                minDistance = distToHK;
                                closestPoint = { lat: lat, lon: lon, dist: distToHK, time: timeText, status: nodeTypeStr };
                            }

                            if(parentNode.tagName === 'PastInformation') {
                                pastLatLngs.push([lat, lon]);
                                if (isLowPressure) marker = L.marker([lat, lon], { icon: lIcon });
                                else marker = L.circleMarker([lat, lon], { radius: 3, fillColor: '#607d8b', color: '#607d8b', weight: 1, fillOpacity: 0.4, opacity: 0.4 });
                                marker.bindPopup(`<div class="popup-title">${tcName} [Past]</div><div>Intensity: ${intensityText}</div><div>Time: ${timeText}</div><div>Dist. to HK: ~${Math.round(distToHK)} km</div>`);
                                tcLayerGroup.addLayer(marker);
                            } 
                            else if(parentNode.tagName === 'AnalysisInformation') {
                                pastLatLngs.push([lat, lon]);
                                forecastLatLngs.push([lat, lon]); 
                                latestData = { lat: lat, lon: lon, time: timeText, intensity: intensityText, wind: windText, pressure: pressureText, distToHK: distToHK };
                                
                                if (isLowPressure) {
                                    marker = L.marker([lat, lon], { icon: lIcon });
                                    marker.bindTooltip(`<b>${tcName}</b><br>${intensityText}`, { permanent: true, direction: 'right', className: 'permanent-tooltip', offset: [15, 0] });
                                } else {
                                    let windSpeed = parseInt(windText) || 60;
                                    let circulationRadius = windSpeed > 118 ? 250000 : (windSpeed > 88 ? 200000 : 150000); 
                                    let circCircle = L.circle([lat, lon], { radius: circulationRadius, color: '#00e5ff', weight: 1.5, fillColor: '#00e5ff', fillOpacity: 0.1, dashArray: '4, 4' });
                                    tcLayerGroup.addLayer(circCircle);

                                    let spinIcon = L.divIcon({ html: '<div class="typhoon-flash"><div class="typhoon-emoji">🌀</div></div>', className: '', iconSize: [60, 60], iconAnchor: [30, 30] });
                                    marker = L.marker([lat, lon], { icon: spinIcon });
                                    marker.bindTooltip(`<b>${tcName}</b><br>${intensityText}<br>Max Wind: ${windText}`, { permanent: true, direction: 'right', className: 'permanent-tooltip', offset: [30, 0] });
                                }
                                marker.bindPopup(`<div class="popup-title">${tcName} [Current]</div><div>Time: ${timeText}</div><div>Location: ${lat}°N, ${lon}°E</div><div>Dist. to HK: ~${Math.round(distToHK)} km</div>`);
                                tcLayerGroup.addLayer(marker);
                            } 
                            else if (parentNode.tagName === 'ForecastInformation') {
                                forecastLatLngs.push([lat, lon]);
                                forecastStepCounter++;
                                
                                if (isLowPressure) {
                                    marker = L.marker([lat, lon], { icon: lIcon });
                                } else {
                                    let coneRadius = 30000 + (forecastStepCounter * 4000); 
                                    let coneCircle = L.circle([lat, lon], { radius: coneRadius, stroke: false, fillColor: '#ff5252', fillOpacity: 0.02 });
                                    tcLayerGroup.addLayer(coneCircle);
                                    marker = L.circleMarker([lat, lon], { radius: 3, fillColor: '#ff5252', color: '#ff5252', weight: 1, fillOpacity: 0.8 });
                                }
                                marker.bindPopup(`<div class="popup-title">${tcName} [Forecast]</div><div>Intensity: ${intensityText}</div><div>Time: ${timeText}</div><div>Dist. to HK: ~${Math.round(distToHK)} km</div>`);
                                tcLayerGroup.addLayer(marker);
                            }
                        }
                    }
                    
                    if (pastLatLngs.length > 1) {
                        tcLayerGroup.addLayer(L.polyline(pastLatLngs, {color: '#4fc3f7', weight: 2, opacity: 0.8}));
                    }
                    if (forecastLatLngs.length > 1) {
                        tcLayerGroup.addLayer(L.polyline(forecastLatLngs, {color: '#ff5252', weight: 2, opacity: 0.9, dashArray: '6, 6'}));
                    }
                    
                    if (closestPoint) {
                        let dashLine = L.polyline([HKO_COORDS, [closestPoint.lat, closestPoint.lon]], { color: '#d4af37', weight: 1.5, dashArray: '4, 6', opacity: 0.6 });
                        tcLayerGroup.addLayer(dashLine);
                        
                        if (closestPoint.status !== "Current") {
                            let closestMarker = L.circleMarker([closestPoint.lat, closestPoint.lon], { radius: 5, color: '#d4af37', fillColor: '#121212', weight: 2, fillOpacity: 1 })
                            .bindTooltip(`Closest: ~${Math.round(closestPoint.dist)}km`, { permanent: true, direction: 'top', className: 'closest-tooltip', offset: [0, -5] });
                            tcLayerGroup.addLayer(closestMarker);
                        }
                    }

                    let htmlContent = `<span class="tc-name">${tcName}</span>`;
                    
                    if(latestData.lat) {
                        let distColor = latestData.distToHK <= 300 ? '#ff5252' : (latestData.distToHK <= 800 ? '#ffd54f' : '#4fc3f7');
                        htmlContent += `
                        <div class="tc-details">
                            <div><b>Intensity:</b> ${latestData.intensity}</div>
                            <div><b>Location:</b> ${latestData.lat}°N, ${latestData.lon}°E</div>
                            <div><b>Dist. to HK:</b> <span style="color:${distColor}; font-weight:bold;">~${Math.round(latestData.distToHK)} km</span></div>
                            <div><b>Max Wind:</b> ${latestData.wind}</div>
                            <div><b>Pressure:</b> ${latestData.pressure !== 'N/A' ? latestData.pressure : '-- hPa'}</div>
                            
                            <div style="margin-top:10px; padding-top:10px; border-top:1px dashed rgba(255,255,255,0.2);">
                                <div style="color:#d4af37; font-weight:bold; font-size:12px;">📍 Closest Approach:</div>
                                <div><b>~${Math.round(closestPoint.dist)} km</b> <span style="color:#aaa; font-size:11px;">(${closestPoint.status})</span></div>
                                <div style="font-size:11px; color:#aaa;">Time: ${closestPoint.time}</div>
                            </div>
                            
                            <div style="margin-top: 10px; font-size:11px; color:#777; text-align:right;">Data Update: ${latestData.time}</div>
                        </div>`;
                    }
                    
                    htmlContent += `
                    <div class="legend">
                        <div class="legend-item"><div class="dashed-line"></div> Forecast Track</div>
                        <div class="legend-item"><span class="color-box circle-box" style="border:1.5px dashed #00e5ff; background:rgba(0,229,255,0.2);"></span> Circulation Area</div>
                        <div class="legend-item"><span class="color-box circle-box" style="background:rgba(255,82,82,0.3);"></span> Potential Track Area</div>
                        <div class="legend-item"><span class="l-legend-icon">L</span> Low Pressure Area</div>
                        <div style="margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1);"></div>
                        <div class="legend-item"><span class="color-box circle-box" style="background:#ff5252;"></span> HK 300km (Warning)</div>
                        <div class="legend-item"><span class="color-box circle-box" style="background:#ffd54f;"></span> HK 800km (Alert)</div>
                    </div>`;

                    tcDataContainer.innerHTML = htmlContent;
                    
                    // 只在第一次載入時自動縮放，避免使用者在拖曳地圖時突然被拉走
                    if (isFirstLoad) {
                        let allLatLngs = pastLatLngs.concat(forecastLatLngs);
                        let bounds = L.latLngBounds(allLatLngs);
                        bounds.extend(HKO_COORDS);
                        map.fitBounds(bounds, { padding: [50, 50] }); 
                        isFirstLoad = false;
                    }
                    
                } else {
                    tcDataContainer.innerHTML = "<span style='color:#ff5252;'>❌ Parse Failed. Check XML structure.</span>";
                }
            } catch (err) {
                tcDataContainer.innerHTML = `<span style='color:#ff5252; font-weight:bold;'>⚠️ Load Error</span><br><span style="font-size:12px;">${err.message}</span>`;
            }
        }
        
        // ==========================================
        // 5 分鐘自動刷新機制 (包含進度條倒數)
        // ==========================================
        const REFRESH_INTERVAL_SECONDS = 300; // 5分鐘 = 300秒
        let timeLeft = REFRESH_INTERVAL_SECONDS;
        const progressBar = document.getElementById('update-progress-bar');
        const countdownText = document.getElementById('countdown');

        function startAutoRefresh() {
            // 每秒鐘更新進度條與數字
            setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    timeLeft = REFRESH_INTERVAL_SECONDS; // 重置時間
                    loadTyphoonData(); // 執行背景資料更新
                }
                // 更新數字
                countdownText.innerText = timeLeft;
                // 更新進度條長度 (0 到 100%)
                let percentage = ((REFRESH_INTERVAL_SECONDS - timeLeft) / REFRESH_INTERVAL_SECONDS) * 100;
                progressBar.style.width = percentage + '%';
            }, 1000);
        }
        
        // 首次啟動
        loadTyphoonData();
        startAutoRefresh();
    </script>
</body>
</html>
