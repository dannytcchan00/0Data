<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HK Tracker">
    <title>HK Dashboard - Ultimate Tracker</title>
    <style>
        :root {
            --bg-color: #000000; --panel-bg: #0c0c0c; --panel-border: #1a1a1a;
            --text-main: #ffffff; --text-muted: #666666; --warning-red: #ff4d4d;
            --normal-bg: rgba(255, 255, 255, 0.02);
            --kmb-bg: #140202; --kmb-border: #991414;
            --ctb-bg: #141100; --ctb-border: #a38200;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .main-content { display: grid; grid-template-columns: 350px 1fr; gap: 15px; padding: 15px; flex: 1; overflow: hidden; }
        .panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; }

        /* --- 左側天氣面板 --- */
        .left-col { display: flex; flex-direction: column; gap: 15px; height: 100%; }
        .integrated-weather-panel { flex: 1; overflow-y: hidden; display: flex; flex-direction: column; gap: 10px; }
        .top-info-bar { display: flex; justify-content: flex-start; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
        .date-container { display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .holiday-badge { font-size: 0.8rem; font-weight: 600; color: var(--warning-red); background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); padding: 2px 6px; border-radius: 6px; letter-spacing: 0.5px; }
        
        .weather-time-main { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); border-radius: 12px 12px 0 0; border: 1px solid rgba(255,255,255,0.05); border-bottom: none; gap: 10px; }
        .time-block { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .time-display { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .utc-display { font-size: 1rem; font-weight: 500; color: #888; font-variant-numeric: tabular-nums; }

        .weather-block { display: flex; align-items: center; gap: 12px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 12px; }
        .weather-status-icon { width: 70px; height: 70px; min-width: 70px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        
        .weather-current-stats { display: flex; flex-direction: column; align-items: flex-end; }
        .current-temp { font-size: 2.2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: -1px; }
        .current-hum { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }
        .current-hum span { color: #4da6ff; font-weight: 700; font-size: 1rem; }
        
        .weather-grid-inline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-top: none; border-radius: 0 0 12px 12px; padding: 8px; }
        .w-item { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .w-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap;}
        .w-val { font-size: 0.95rem; font-weight: 700; color: #ddd; }

        .alert-box { border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; text-align: left; display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        .alert-active { background: rgba(255, 77, 77, 0.08); border: 1px solid rgba(255, 77, 77, 0.4); animation: alertBlink 2s infinite ease-in-out; }
        .alert-none { background: var(--normal-bg); border: 1px solid var(--panel-border); color: var(--text-muted); font-weight: normal; text-align: center; }
        .swt-box { border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600; line-height: 1.4; text-align: left; background: rgba(255, 215, 0, 0.08); border: 1px solid rgba(255, 215, 0, 0.4); color: #ffd700; animation: swtBlink 2s infinite ease-in-out; margin-top: 5px; }

        .forecast-container { display: flex; gap: 6px; margin-top: 8px; margin-bottom: 5px; }
        .forecast-item { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 3px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .fc-date { font-size: 0.72rem; color: #ccc; font-weight: bold; }
        .fc-icon { width: 35px; height: 35px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));}
        .fc-temp { font-size: 0.8rem; font-weight: 700; color: #fff; letter-spacing: -0.5px;}
        .fc-psr { font-size: 0.68rem; font-weight: 600; padding: 1px 4px; border-radius: 4px; background: rgba(0,0,0,0.3);}
        .psr-high { color: #ff4d4d; } .psr-mid { color: #ffcc00; } .psr-low { color: #4da6ff; }

        /* --- 右側面板 --- */
        .right-col { display: flex; flex-direction: column; gap: 15px; height: 100%; overflow: hidden; }
        h2 { margin: 0 0 12px 0; font-size: 1.05rem; color: var(--text-muted); border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .settings-btn { cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; }
        .settings-btn:hover { transform: scale(1.1); }
        .refresh-indicator { font-size: 0.75rem; color: #00ff66; font-weight: normal; margin-right: 10px;}

        /* 港鐵 */
        .mtr-section { flex: 0 0 auto; }
        .mtr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .station-card { border-radius: 12px; padding: 12px; background: #111; border: 1px solid #333; position: relative; overflow: hidden; }
        .station-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; color: #fff; display: flex; justify-content: space-between; align-items: center; z-index: 2; position: relative; }
        .line-badge { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; font-weight: bold; letter-spacing: 0.5px; z-index: 2; position: relative; }
        .mtr-data-container { position: relative; z-index: 2; }
        .mtr-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; overflow: hidden; }
        .mtr-item:last-child { border-bottom: none; }
        .mtr-dest { white-space: nowrap; flex: 0 0 85px; }
        .mtr-eta-container { flex: 1; text-align: right; overflow: hidden; display: flex; justify-content: flex-end; }
        .mtr-eta { font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }

        /* 巴士 */
        .bus-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .bus-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 5px; overflow-y: auto; align-content: flex-start; padding-right: 5px; }
        .bus-grid::-webkit-scrollbar { width: 4px; }
        .bus-grid::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        .bus-card { min-height: 85px; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; }
        .bus-card.kmb { background: var(--kmb-bg); border: 1px solid var(--kmb-border); }
        .bus-card.ctb { background: var(--ctb-bg); border: 1px solid var(--ctb-border); }
        .bus-no { font-size: 1.15rem; font-weight: 900; line-height: 1; }
        .bus-dest { font-size: 0.65rem; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .bus-eta { font-size: 0.75rem; font-weight: bold; text-align: right; font-variant-numeric: tabular-nums; width: 100%; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 2px; margin-top: auto; }
        .bus-card.kmb .bus-eta { color: #ff5252; }
        .bus-card.ctb .bus-eta { color: #ffcc00; }
        
        /* --- Modal --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--panel-bg); border: 1px solid #333; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;}
        .modal-header { padding: 15px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; background: #111;}
        .modal-header h3 { margin: 0; font-size: 1.2rem; color: #fff; }
        .modal-count { font-size: 0.9rem; color: #aaa; background: #222; padding: 3px 8px; border-radius: 12px; }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 15px; border-top: 1px solid var(--panel-border); display: flex; justify-content: flex-end; gap: 10px; background: #111;}
        
        .modal-btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s;}
        .btn-cancel { background: #333; color: #fff; }
        .btn-save { background: #0071CE; color: #fff; }
        .btn-save:hover { background: #005ea8; }
        .btn-back { background: #444; color: #fff; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px;}

        /* Bus Modal UI */
        .bus-manager-list { display:flex; flex-direction:column; gap:8px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;}
        .bus-manager-item { display:flex; justify-content:space-between; align-items:center; background: #1a1a1a; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;}
        .bus-manager-info { display:flex; flex-direction:column; gap: 2px;}
        .bm-route { font-weight:bold; font-size: 1.05rem;}
        .bm-stop { font-size: 0.85rem; color:#aaa;}
        .bm-delete { background:#ff4d4d20; color:#ff4d4d; border:1px solid #ff4d4d50; border-radius:6px; padding:6px 10px; cursor:pointer;}
        
        .search-engine-box { background: #151515; padding: 12px; border-radius: 10px; border: 1px solid #333; margin-bottom: 10px; }
        .search-engine-box h4 { margin: 0 0 10px 0; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;}
        .search-flex-bar { display:flex; gap: 8px; }
        .search-flex-bar input { flex:1; padding: 8px 12px; border-radius: 6px; border:1px solid #444; background: #000; color:#fff; font-size:1rem;}
        .search-flex-bar button { padding: 8px 15px; background:#444; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition: background 0.2s;}
        
        .bus-stop-list { max-height: 280px; overflow-y: auto; background: #0a0a0a; border-radius: 6px; border: 1px solid #222; padding: 5px;}
        .bus-stop-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.95rem; color:#ddd; transition: 0.2s; display:flex; align-items:center; gap:12px; margin:0;}
        .bus-stop-item:hover { background: #1a1a1a; color:#fff;}
        .bus-stop-item input[type="checkbox"] { transform: scale(1.4); cursor: pointer; accent-color: #0071CE;}
        .multi-add-bar { position: sticky; bottom: -15px; background: #111; padding: 15px 10px; border-top: 1px solid #333; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;}
        
        .install-btn { position: fixed; bottom: 20px; right: 20px; background: #0071CE; color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; z-index: 9000; display: none; border: 1px solid #005ea8; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <link rel="manifest" id="manifest-link">

    <div id="loading-overlay">
        <div class="loading-title">🚌 載入全港靜態數據庫</div>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="progress-text">0%</div>
        <div id="progress-detail">正在載入 GitHub Actions 預配對巴士字典...</div>
    </div>

    <button id="install-btn" class="install-btn" onclick="installWebApp()"><span>📲</span> 加至桌面</button>

    <div class="main-content">
        <div class="left-col">
            <div class="panel integrated-weather-panel">
                <div class="top-info-bar">
                    <div class="date-container">
                        <div class="date-display" id="current-date">📅 --年--月--日</div>
                        <div class="holiday-badge" id="holiday-badge" style="display: none;"></div>
                    </div>
                </div>
                <div>
                    <div class="weather-time-main">
                        <div class="time-block">
                            <div class="time-display" id="hk-time">--:--</div>
                            <div class="utc-display" id="utc-time">--:-- UTC</div>
                        </div>
                        <div class="weather-block">
                            <div class="weather-current-stats">
                                <div class="current-temp" id="hk-temp">--°C</div>
                                <div class="current-hum">相對濕度 <span id="hk-hum">--%</span></div>
                            </div>
                            <img class="weather-status-icon" id="weather-icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Weather Icon">
                        </div>
                    </div>
                    <div class="weather-grid-inline">
                        <div class="w-item"><div class="w-label">UV指數</div><div class="w-val" id="hk-uv">--</div></div>
                        <div class="w-item"><div class="w-label">降雨概率</div><div class="w-val" id="hk-psr">--</div></div>
                        <div class="w-item"><div class="w-label">今日最高</div><div class="w-val" id="hk-max">--°C</div></div>
                        <div class="w-item"><div class="w-label">今日最低</div><div class="w-val" id="hk-min">--°C</div></div>
                    </div>
                </div>
                <div id="forecast-container" class="forecast-container"></div>
                <div id="warning-box" class="alert-box alert-none">🟢 現時沒有天氣警告信號</div>
            </div>
        </div>

        <div class="right-col">
            <div class="panel mtr-section">
                <h2>
                    <span>🚇 即時地鐵班次</span>
                    <div class="header-actions"><span class="settings-btn" onclick="openMtrModal()">⚙️</span></div>
                </h2>
                <div class="mtr-grid" id="mtr-dynamic-grid"></div>
            </div>

            <div class="panel bus-section">
                <h2>
                    <span>🚌 自訂巴士追蹤 (上限 30 個)</span>
                    <div class="header-actions">
                        <span class="refresh-indicator" id="refresh-status">🔄 連線中...</span>
                        <span class="settings-btn" onclick="openBusModal()">⚙️</span>
                    </div>
                </h2>
                <div class="bus-grid" id="bus-data"></div>
            </div>
        </div>
    </div>

    <div id="bus-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>設定巴士追蹤</h3>
                <div class="modal-count"><span id="bus-select-count">0</span> / 30</div>
            </div>
            <div class="modal-body">
                <div id="bus-manager-area" class="bus-manager-list"></div>
                <div id="bus-search-interface">
                    <div class="search-engine-box">
                        <h4 style="color:#4da6ff;">🚏 搜尋車站 (秒速列出九巴及城巴)</h4>
                        <div class="search-flex-bar">
                            <input type="text" id="stop-name-input" placeholder="例: 鰂魚涌" autocomplete="off">
                            <button onclick="searchStop()">搜尋車站</button>
                        </div>
                    </div>
                </div>
                <div id="bus-search-results" style="display: none; margin-top: 10px;"></div>
            </div>
            <div class="modal-footer"><button class="modal-btn btn-save" onclick="closeBusModal()">完成設定</button></div>
        </div>
    </div>

    <div id="mtr-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3>選擇地鐵站</h3><div class="modal-count"><span id="mtr-select-count">0</span> / 4</div></div>
            <div id="mtr-modal-body" class="modal-body"></div>
            <div class="modal-footer"><button class="modal-btn btn-save" onclick="saveMtrSelection()">儲存</button></div>
        </div>
    </div>

    <script>
        let myBuses = JSON.parse(localStorage.getItem('my_buses_gh_v1')) || [];
        let myMtrStations = JSON.parse(localStorage.getItem('my_mtr_gh_v1')) || [{ line: 'ISL', sta: 'QUB' }];
        let busDict = {}; 
        let isBusDataReady = false;
        let transportTimestamps = { mtr: [], bus: [] };

        // 1. PWA 安裝引擎
        const manifest = { name: "HK Tracker", short_name: "HK Transit", display: "standalone", background_color: "#000", theme_color: "#000", icons: [{"src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='55' font-size='50' fill='%23fff' text-anchor='middle' dominant-baseline='middle'%3E🚌%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}] };
        document.getElementById('manifest-link').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
        if ('serviceWorker' in navigator) { const sw = `self.addEventListener('fetch', (e) => {});`; navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }))); }
        let deferredPrompt; window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-btn').style.display = 'flex'; });
        function installWebApp() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => deferredPrompt = null); } else { alert("請利用瀏覽器選單點擊「加入主畫面」。"); } }

        // 2. 載入 GitHub Actions 預先產生的數據字典
        async function initStaticDatabase() {
            try {
                document.getElementById('progress-bar').style.width = '50%';
                document.getElementById('progress-text').innerText = '50%';
                
                // 讀取同 repo 下由 GitHub Action 自動生成的字典檔
                let res = await fetch('bus_dict.json');
                busDict = await res.json();
                
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-text').innerText = '100%';
                isBusDataReady = true;
                document.getElementById('refresh-status').innerText = '🟢 已就緒';
                
                setTimeout(() => { document.getElementById('loading-overlay').style.opacity = '0'; setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 300); }, 300);
                fetchRealBusData();
            } catch(e) {
                document.getElementById('progress-detail').innerText = '❌ 找不到 bus_dict.json，請先手動行一次 GitHub Actions 產生數據！';
            }
        }

        // 3. 車站搜尋：0.01 秒本地極速反應，完美合併城巴九巴
        function searchStop() {
            let keyword = document.getElementById('stop-name-input').value.trim();
            if (!keyword) return;

            document.getElementById('bus-search-interface').style.display = 'none';
            let resDiv = document.getElementById('bus-search-results');
            resDiv.style.display = 'block';

            let html = `<button class="btn-back" onclick="resetBusSearchUI()">🔙 返回搜尋</button><div class="bus-stop-list">`;
            let found = 0;

            for (let stopName in busDict) {
                if (stopName.includes(keyword)) {
                    busDict[stopName].forEach(item => {
                        let color = item.co === 'kmb' ? '#ff6b6b' : '#ffd93d';
                        let coName = item.co === 'kmb' ? '九巴' : '城巴';
                        let val = encodeURIComponent(JSON.stringify({ co: item.co, route: item.route, stop: item.stopId, name: stopName, dest: item.dest }));
                        html += `
                            <label class="bus-stop-item">
                                <input type="checkbox" class="stop-cb" value="${val}" onchange="updateSelectedCount()">
                                <div style="display:flex; flex-direction:column; align-items:flex-start;">
                                    <span style="font-weight:bold;">🚏 ${stopName} <span style="color:${color}; font-size:0.8rem;">(${coName} ${item.route})</span></span>
                                    <span style="font-size:0.8rem; color:#aaa;">往 ${item.dest}</span>
                                </div>
                            </label>`;
                        found++;
                    });
                }
            }
            html += `</div><div class="multi-add-bar"><span id="selected-count">已選擇 0 項</span><button class="modal-btn btn-save" onclick="addSelectedItems()">✅ 一次過加入追蹤</button></div>`;
            resDiv.innerHTML = found > 0 ? html : `<button class="btn-back" onclick="resetBusSearchUI()">🔙 返回</button><p style="text-align:center;color:red;padding:20px;">找不到車站</p>`;
        }

        function updateSelectedCount() { let count = document.querySelectorAll('.stop-cb:checked').length; document.getElementById('selected-count').innerText = `已選擇 ${count} 項`; }
        function resetBusSearchUI() { document.getElementById('bus-search-interface').style.display = 'block'; document.getElementById('bus-search-results').style.display = 'none'; }
        
        function addSelectedItems() {
            let checked = document.querySelectorAll('.stop-cb:checked');
            if(checked.length === 0) return;
            if(myBuses.length + checked.length > 30) { alert("最多只能追蹤 30 條路線！"); return; }
            
            checked.forEach(cb => {
                let item = JSON.parse(decodeURIComponent(cb.value));
                if(!myBuses.some(x => x.co === item.co && x.route === item.route && x.stop === item.stop)) {
                    myBuses.push({ id: Date.now() + Math.random().toString(36).substring(2,5), co: item.co, route: item.route, stop: item.stop, name: item.name, dest: item.dest });
                }
            });
            localStorage.setItem('my_buses_gh_v1', JSON.stringify(myBuses));
            renderBusManagerList(); resetBusSearchUI(); fetchRealBusData();
        }

        // 4. 實時倒數渲染 (加上 @車站名稱 顯示)
        function renderUI() {
            let busHtml = '';
            if (transportTimestamps.bus.length === 0) {
                busHtml = myBuses.length === 0 ? `<div class="no-service">📭 尚未設定任何追蹤，請點擊 ⚙️ 加入</div>` : `<div class="no-service">⏳ 正在讀取巴士實時班次...</div>`;
            } else {
                transportTimestamps.bus.forEach(b => {
                    let diff = Math.floor((new Date(b.time) - new Date()) / 1000);
                    let txt = diff <= 0 ? "正在開出" : diff <= 60 ? "即將到達" : `${Math.floor(diff/60)}分${(diff%60).toString().padStart(2,'0')}秒`;
                    busHtml += `
                        <div class="bus-card ${b.co} ${diff <= 60 ? 'arriving-pulse' : ''}">
                            <div>
                                <div class="bus-no">${b.no}</div>
                                <div class="bus-dest">往 ${b.dest}</div>
                                <div style="font-size:0.65rem; color:#777; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">@ ${b.stopName}</div>
                            </div>
                            <div class="bus-eta ${diff <= 60 ? 'arriving-text' : ''}">${txt}</div>
                        </div>`;
                });
            }
            document.getElementById('bus-data').innerHTML = busHtml;

            let mtrHtml = '';
            transportTimestamps.mtr.forEach(s => {
                let lineInfo = MTR_NETWORK[s.line];
                mtrHtml += `<div class="station-card" style="background:${lineInfo.color}15; border:1px solid ${lineInfo.color}80;">
                    <div class="station-name">${lineInfo.stations[s.sta]} <span class="line-badge" style="background:${lineInfo.color};">${s.line}</span></div>
                    <div class="mtr-data-container">`;
                s.data.forEach(t => {
                    let diff = t.time ? Math.floor((new Date(t.time) - new Date()) / 1000) : -1;
                    let txt = diff < 0 ? "服務已終止" : diff <= 60 ? "即將到達" : `${Math.floor(diff/60)}分`;
                    mtrHtml += `<div class="mtr-item"><div class="mtr-dest">往 ${t.dest}</div><div class="mtr-eta">${txt}</div></div>`;
                });
                mtrHtml += `</div></div>`;
            });
            document.getElementById('mtr-dynamic-grid').innerHTML = mtrHtml;
        }

        // 5. 核心即時更新邏輯 (港鐵無服務時依舊留守目的地名)
        async function fetchMTR() {
            let promises = myMtrStations.map(async s => {
                let trains = [];
                try {
                    let res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${s.line}&sta=${s.sta}`);
                    let json = await res.json();
                    let key = `${s.line}-${s.sta}`;
                    if(json?.data?.[key]) {
                        ['UP','DOWN'].forEach(dir => {
                            let d = json.data[key][dir];
                            if(d && d.length > 0) trains.push({ dest: MTR_DEST_MAP[d[0].dest] || d[0].dest, time: d[0].time.replace(' ','T')+'+08:00' });
                        });
                    }
                } catch(e) {}
                if(trains.length === 0 && MTR_NETWORK[s.line]) {
                    trains.push({ dest: MTR_NETWORK[s.line].terminals.UP, time: null });
                    trains.push({ dest: MTR_NETWORK[s.line].terminals.DOWN, time: null });
                }
                return { line: s.line, sta: s.sta, data: trains };
            });
            transportTimestamps.mtr = await Promise.all(promises);
        }

        async function fetchRealBusData() {
            if(!isBusDataReady || myBuses.length === 0) return;
            document.getElementById('refresh-status').innerText = '🔄 更新中...';
            let raw = [];
            let now = new Date();
            
            await Promise.allSettled(myBuses.map(b => {
                let url = b.co === 'kmb' ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${b.stop}/${b.route}/1` : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/${b.stop}/${b.route}`;
                return fetch(url).then(r=>r.json()).then(json => {
                    if(json?.data) {
                        json.data.forEach(d => {
                            if(d.eta && new Date(d.eta) > now && d.route.toUpperCase() === b.route.toUpperCase()) {
                                raw.push({ no: d.route, dest: b.dest, time: d.eta, co: b.co, stopName: b.name, uid: `${b.co}_${b.route}_${d.eta}` });
                            }
                        });
                    }
                });
            }));
            let unique = {}; raw.forEach(x => { if(!unique[x.uid]) unique[x.uid] = x; });
            transportTimestamps.bus = Object.values(unique).sort((a,b)=> new Date(a.time) - new Date(b.time));
            document.getElementById('refresh-status').innerText = '🟢 60s定時更新';
        }

        // 6. 天氣引擎
        async function fetchWeather() {
            try {
                let res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                let data = await res.json();
                if(data?.icon?.[0]) document.getElementById('weather-icon').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${data.icon[0]}.png`;
                let t = data.temperature.data.find(x => x.place === '香港天文台'); if(t) document.getElementById('hk-temp').innerText = `${t.value}°C`;
                let h = data.humidity.data.find(x => x.place === '香港天文台'); if(h) document.getElementById('hk-hum').innerText = `${h.value}%`;

                let fnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc').then(r=>r.json());
                let html = '';
                fnd.weatherForecast.slice(1, 4).forEach(fc => {
                    let dateStr = fc.forecastDate.substring(4,6) + '/' + fc.forecastDate.substring(6,8);
                    html += `<div class="forecast-item"><div class="fc-date">${dateStr}</div><img class="fc-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${fc.ForecastIcon}.png"><div class="fc-temp">${fc.forecastMintemp.value}°-${fc.forecastMaxtemp.value}°</div></div>`;
                });
                document.getElementById('forecast-container').innerHTML = html;
            } catch(e) {}
        }

        // 7. 啟動器
        function openMtrModal() { document.getElementById('mtr-modal').classList.add('active'); }
        function closeBusModal() { document.getElementById('bus-modal').classList.remove('active'); }
        setInterval(updateTick, 1000); setInterval(fetchMTR, 15000); setInterval(fetchRealBusData, 60000); setInterval(fetchWeather, 60000);
        function updateTick() { renderUI(); }
        
        async function boot() {
            const days = ['日','一','二','三','四','五','六']; const now = new Date();
            document.getElementById('current-date').innerText = `📅 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (禮拜${days[now.getDay()]})`;
            fetchWeather(); fetchMTR(); initStaticDatabase();
        }
        boot();
    </script>
</body>
</html>
